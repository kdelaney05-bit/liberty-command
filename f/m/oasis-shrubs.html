<style>

<script>
  var q=new URLSearchParams(location.search), viewId=q.get('v')||null;
  var seconds=0, timer=null;
  function beat(){ if(!viewId) return;
    fetch('https://lzegjjbkfuecrhdvlvay.supabase.co/functions/v1/folder/oasis/beat',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({viewId:viewId,seconds:seconds})}).catch(function(){}); }
  function start(){ if(timer) return; timer=setInterval(function(){ seconds+=15; beat(); },15000); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; beat(); } }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  window.addEventListener('pagehide',stop);
  start();
</script>
