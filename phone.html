<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liberty Command — Phone View</title>
<link rel="icon" href="./icon-1024.png" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="theme-color" content="#0d1f17" />
<!--
  The owner dash exactly as it reads on Kevin's phone, on a desktop screen.

  This page adds NOTHING of its own: it frames ./index.html at phone width,
  and because media queries inside an iframe answer to the IFRAME's viewport
  (not the window's), the console renders its true mobile layout — the single
  480px column — no matter how wide the desktop browser is. Same origin, so
  the Supabase session in localStorage is shared: signed in here is signed in
  everywhere on this site, and vice versa.

  Nothing here needs a BUILD bump: index.html is untouched, and this wrapper
  has no data or logic to go stale. If the phone layout ever looks wrong in
  this frame but right on the real phone, suspect the frame width below, not
  the console.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d1f17;
    color: #e8efe9;
    font: 500 11px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 22px;
  }
  .cap {
    letter-spacing: .22em; text-transform: uppercase; font-size: 10px;
    color: rgba(232, 239, 233, .38); user-select: none;
  }
  .cap a { color: rgba(232, 239, 233, .55); text-decoration: none; }
  .cap a:hover { color: #e8efe9; }
  .frame {
    width: min(430px, 100%);
    height: min(100%, 932px);
    flex: 0 1 932px;
    border-radius: 28px;
    border: 1px solid rgba(232, 239, 233, .10);
    box-shadow: 0 24px 70px rgba(0, 0, 0, .5), 0 0 0 6px rgba(0, 0, 0, .25);
    overflow: hidden;
    background: #0d1f17;
  }
  .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* On an actual phone the bezel is theater — go full-bleed and get out of the way. */
  @media (max-width: 520px) {
    body { padding: 0; gap: 0; }
    .cap { display: none; }
    .frame { width: 100%; height: 100%; flex: 1 1 auto; border-radius: 0; border: 0; box-shadow: none; }
  }
</style>
</head>
<body>
  <div class="cap">Liberty Command · phone view · <a href="./index.html">open full width ↗</a></div>
  <div class="frame"><iframe src="./index.html" title="Liberty Command owner dash, phone layout"></iframe></div>
</body>
</html>
