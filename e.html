<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Estimate</title>
<style>
  html,body{margin:0;min-height:100%;background:#f4f2ec;color:#22281f;
    font:16px/1.5 -apple-system,system-ui,sans-serif}
  header{background:#1c3055;color:#fff;padding:14px 16px;display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.06em}
  a.dl{font-size:13px;color:#ffd58a;text-decoration:none;font-weight:600}
  .wrap{padding:14px;max-width:760px;margin:0 auto}
  .wrap img{width:100%;height:auto;display:block;border-radius:10px;
    box-shadow:0 2px 18px rgba(20,30,50,.25);background:#fff}
  iframe{border:0;width:100%;height:82vh;background:#fff;border-radius:10px}
  .folder{display:block;text-align:center;background:#1e6b3a;color:#fff;text-decoration:none;
    font-weight:700;letter-spacing:.05em;border-radius:12px;padding:15px 16px;margin:16px 0 30px}

  /* ── Approve & Sign (126) ────────────────────────────────────────────── */
  .sign{background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(20,30,50,.14);
    padding:20px 18px 18px;margin:18px 0 30px}
  .sign h2{margin:0 0 4px;font-size:17px;letter-spacing:.04em;color:#1c3055}
  .sign .lead{margin:0 0 16px;font-size:13.5px;color:#5f6672}
  .sign label{display:block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
    color:#5f6672;font-weight:700;margin:0 0 6px}
  .sign input[type=text]{width:100%;box-sizing:border-box;font:16px/1.4 inherit;
    padding:12px 12px;border:1.5px solid #d8d5ca;border-radius:9px;background:#fcfbf7;color:#22281f}
  .sign input[type=text]:focus{outline:0;border-color:#1c3055}
  /* The acknowledgment. No checkbox — the signature IS the acknowledgment, so
     this clause sits directly above the pad where it cannot be missed. */
  /* THE PACKET (319) — the documents under the one signature. Empty until the
     office turns it on; then each is a tap, and the clause names them. */
  .packet{margin:16px 0 4px;padding:12px 12px 6px;background:#f7f5ef;border:1px solid #e3ddd0;border-radius:10px}
  .packet h3{margin:0 0 4px;font-size:13px;letter-spacing:.09em;color:#1c3055}
  .packet .plead{margin:0 0 10px;font-size:13px;color:#5f6672}
  .pdoc{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #e3ddd0;border-radius:10px;padding:10px;margin-bottom:8px}
  .pdoc.on{border-color:#2f8f5b;background:#f2faf5}
  .ptap{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #b8860b;background:#fff;color:transparent;font-size:18px;line-height:1;cursor:pointer}
  .pdoc.on .ptap{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
  .pbody{display:flex;flex-direction:column;gap:2px;font-size:14px;min-width:0}
  .pbody b{color:#1c1a15}
  .pbody a{color:#1c3055;font-weight:700;font-size:13px;text-decoration:underline}
  .pbody .pwhy{font-size:12px;color:#5f6672}
  .pperson{margin:8px 0 4px;font-size:12.5px;color:#3d4450}
  /* THE ITEMIZED ESTIMATE (322) */
  .doc{background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(20,30,50,.14);padding:18px 16px;margin:0 0 14px;font-size:14px;color:#22281f}
  .docwait{margin:0;color:#8a8f85;text-align:center;padding:24px 0}
  .dochead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:2px solid #1c3055;padding-bottom:10px}
  .docttl{font-size:22px;font-weight:800;letter-spacing:.06em;color:#1c3055}
  .docco{font-size:15px;font-weight:700;margin-top:2px}
  .docsm{font-size:12px;color:#5f6672}
  .docmeta{text-align:right;font-size:12px}
  .docmeta div{margin-bottom:3px} .docmeta span{color:#8a8f85;letter-spacing:.06em;font-size:10px;display:block} .docmeta b{font-size:13px}
  .docparties{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #e3ddd0;font-size:13px}
  .docparties>div{flex:1} .docparties span{display:block;font-size:10px;letter-spacing:.08em;color:#8a8f85;margin-bottom:2px} .docparties b{display:block}
  .docamt{text-align:right} .docamt b{font-size:20px;color:#1c3055}
  .doctitle{font-size:15px;font-weight:700;margin:12px 0 4px}
  .doctab{width:100%;border-collapse:collapse;margin-top:8px}
  .doctab th{font-size:10px;letter-spacing:.08em;color:#8a8f85;text-align:left;padding:6px 4px;border-bottom:1px solid #e3ddd0}
  .doctab td{padding:8px 4px;border-bottom:1px solid #eee8dc;vertical-align:top}
  .doctab .num{text-align:right;white-space:nowrap}
  .doctab .dsc{width:64%}
  .scope{font-size:12.5px;color:#3d4450;margin-top:4px;white-space:normal}
  .docdisc{text-align:right;font-size:12px;color:#5f6672;margin-top:6px}
  .doctotal{display:flex;justify-content:flex-end;gap:16px;align-items:baseline;margin-top:10px;font-size:14px}
  .doctotal b{font-size:22px;color:#1c3055}
  .docnote{font-size:13px;color:#3d4450;margin-top:10px;padding-top:8px;border-top:1px solid #e3ddd0}
  .docfoot{font-size:11px;color:#8a8f85;margin-top:12px}
  /* the summary card (Billdu's customer page shape) */
  .dsum{background:#fff;border-radius:12px;box-shadow:0 2px 14px rgba(20,30,50,.14);margin:0 0 14px;overflow:hidden}
  .dbrand{font-size:16px;font-weight:800;padding:14px 16px;border-bottom:4px solid #1c3055}
  .dsumin{padding:14px 16px}
  .dno{font-size:12px;letter-spacing:.06em;color:#5f6672;margin-bottom:4px}
  .damt{font-size:26px;font-weight:800;color:#1c3055;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid}
  .pill.ok{color:#1d6b3a;background:#e9f6ee;border-color:#b7dfc5}
  .pill.open{color:#8a5a00;background:#fff5e0;border-color:#f0d49a}
  .drow{display:block;color:#1c3055;font-weight:600;text-decoration:none;padding:7px 0;font-size:15px}
  .dkv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #eee8dc;font-size:14px}
  .dkv span{color:#5f6672} .dkv b{text-align:right}
  .doc.dhide{display:none}
  @media print{ header,.sign,.folder,.packet,.dsum{display:none!important} .doc,.doc.dhide{display:block;box-shadow:none;border:0} }
  .terms{margin:18px 0 6px;font-size:13.5px;color:#3d4450}
  .legal{margin:0 0 8px;font-size:12px;color:#5f6672;letter-spacing:.02em}
  .terms a{color:#1c3055;font-weight:700;text-decoration:underline}
  .padwrap{position:relative;border:1.5px dashed #c9c5b8;border-radius:10px;background:#fcfbf7;
    height:190px;overflow:hidden;touch-action:none}
  .padwrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .padhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#a9a89c;font-size:14px;pointer-events:none;letter-spacing:.04em}
  .padline{position:absolute;left:18px;right:18px;bottom:44px;border-top:1.5px solid #e0ddd0;
    pointer-events:none}
  .padrow{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 0}
  .padrow .stamp{font-size:12px;color:#8a8f98}
  .clear{background:none;border:0;color:#8a8f98;font-size:13px;font-weight:600;
    text-decoration:underline;padding:4px 2px;cursor:pointer}
  .go{display:block;width:100%;margin:16px 0 0;background:#1e6b3a;color:#fff;border:0;
    border-radius:12px;padding:16px;font:700 16px/1 inherit;letter-spacing:.05em;cursor:pointer}
  .go[disabled]{background:#c3c8bf;cursor:default}
  .err{margin:10px 0 0;font-size:13.5px;color:#a3341f;min-height:1px}
  .done{background:#eef6ef;border:1.5px solid #1e6b3a;border-radius:12px;padding:18px;
    margin:18px 0 30px}
  .done h2{margin:0 0 6px;font-size:17px;color:#1e6b3a;letter-spacing:.04em}
  .done p{margin:0;font-size:14px;color:#3d4450}
  /* ── THE TYPED SHEET + THE ZERO-PAIN BAR (Kevin, 15 Sep; owner-sent links only, pk=1) ── */
  .sheetwrap{margin:0 0 14px;box-shadow:0 2px 18px rgba(20,30,50,.25);border-radius:6px;overflow:hidden;background:#fff}
  body.haspk{padding-bottom:118px}
  .bar{position:fixed;left:12px;right:12px;bottom:12px;z-index:5;max-width:760px;margin:0 auto;background:#14213d;color:#fff;
    border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.28)}
  .bar b{display:block;font-size:14px;letter-spacing:.04em;font-weight:700}
  .bar span{font-size:12px;opacity:.85;line-height:1.3;display:block}
  .bar button{background:#fff;color:#14213d;font:700 14px/1 inherit;letter-spacing:.05em;padding:10px 16px;border-radius:8px;white-space:nowrap;border:0;cursor:pointer}
  @media (max-width:520px){ .bar{grid-template-columns:1fr} .bar button{width:100%} }
  .pinit{flex:none;align-self:center;font:600 20px/1 "Caveat","Segoe Script","Bradley Hand",cursive;color:#1c3055;min-width:34px;text-align:center;opacity:.35}
  .pdoc.on .pinit{opacity:1;color:#2f8f5b}
  .padhint.preset{color:#8a8f98;align-items:flex-start;padding-top:14px;font-size:12.5px}
  body.haspk .padwrap{border-style:solid;border-color:#e0ddd0;height:150px}
  body.haspk .padwrap canvas{pointer-events:none;cursor:default}
  body.haspk .clear{display:none}
  .sheetlinks{display:flex;justify-content:space-between;gap:12px;margin:-4px 2px 14px;font-size:13.5px}
  .sheetlinks a{color:#1c3055;font-weight:700;text-decoration:underline}
  @media print{ .sheetlinks{display:none} }
  @media print{ .bar,.sheetwrap~img,.sheetwrap~iframe,.deposit{display:none!important} body.haspk{padding:0;background:#fff} .sheetwrap{box-shadow:none;border-radius:0} }
  /* THE DEPOSIT STEP (336): after the signature on a custom/aluminum job */
  .deposit{background:#fff;border:2px solid #b8860b;border-radius:12px;padding:18px;margin:0 0 30px;box-shadow:0 2px 14px rgba(20,30,50,.14)}
  .deposit h2{margin:0 0 4px;font-size:16px;letter-spacing:.05em;color:#1c3055}
  .deposit .amt{font-size:30px;font-weight:800;color:#1c3055;margin:6px 0 2px}
  .deposit .sub{font-size:13.5px;color:#5f6672;margin:0 0 14px}
  .deposit .pay{display:block;width:100%;background:#1c3055;color:#fff;border:0;border-radius:12px;padding:16px;font:700 16px/1 inherit;letter-spacing:.06em;cursor:pointer}
  .deposit .pay[disabled]{background:#c3c8bf}
  .deposit .msg{margin:12px 0 0;font-size:14px;color:#22281f;line-height:1.45}
</style>
<header><h1>YOUR ESTIMATE</h1><a class="dl" id="dl" href="#" download>Download</a></header>
<div class="wrap" id="wrap"></div>
<script>
  var FN='https://lzegjjbkfuecrhdvlvay.supabase.co/functions/v1/estimate-view/';
  var q=new URLSearchParams(location.search);
  var t=q.get('t'), m=q.get('m')||'i', f=q.get('f');
  var termsUrl=q.get('tu')||'./terms/liberty.html';   // server picks the brand document
  var signedAt=q.get('sg');                            // present = already signed
  var legalLine=q.get('lg')||'';                       // the entity, dba and license (321)
  var pk=q.get('pk')==='1';                            // the packet gate is open for this link (owner-sent, switch ON)
  var sheetData=null;                                  // the typed sheet's inputs, kept so the signed name can be stamped on it
  var src=FN+t+'/pdf';
  document.getElementById('dl').href=src;
  var w=document.getElementById('wrap');
  if(!t){ w.innerHTML='<p style="text-align:center;color:#8a8f85;padding:40px 10px">This estimate isn’t available. Please contact your rep for a new link.</p>'; }
  else {
    w.innerHTML=(m==='d'?'<div id="doc" class="doc"><p class="docwait">Loading your estimate…</p></div>'
               :m==='p'?'<iframe src="'+src+'" title="Estimate"></iframe>'
                        :'<img src="'+src+'" alt="Your estimate">')
      + signBlock()
      +(f?'<a class="folder" href="https://lzegjjbkfuecrhdvlvay.supabase.co/functions/v1/folder/'+f+'?e='+t+'">BROWSE OUR DESIGN FOLDER →</a>':'');
    if(!signedAt) wireSigning();
    if(m==='d') loadDoc();
    if(pk){ document.body.classList.add('haspk'); if(!signedAt) acceptBar(); loadSheet(); }
  }

  /* THE TYPED SHEET (Kevin, 15 Sep: "I want to see everything printed up nice and fancy").
     For a fence job that went through the calculator, the document is the real Liberty
     Fencing pad with the job typed into it — fenceEstimateHtml() from forms/, the same
     builder the phone prints — instead of the photo. The photo stays as the fallback
     when the server has no takeoff for this customer. Download prints the sheet. */
  function loadSheet(){
    if(!t) return;
    fetch(FN+t+'/sheet').then(function(r){ return r.json(); }).then(function(j){
      if(!j||!j.found||!j.takeoff) return;
      sheetData=j;
      var fonts=document.createElement('link'); fonts.rel='stylesheet';
      fonts.href='https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Caveat:wght@600&display=swap';
      document.head.appendChild(fonts);
      /* a link opened after signing: the stamps come back from the server so the
         customer sees the same stamped contract, not a fresh set of green spots */
      if(j.signed&&j.signed.stamps){ Object.keys(j.signed.stamps).forEach(function(k){ var v=j.signed.stamps[k]; stamps[k]=v&&v.text?v.text:String(v||''); }); }
      if(j.signed&&j.signed.at&&!signedAt){ signedAt=j.signed.at; var sb=document.querySelector('.sign'); if(sb) sb.outerHTML=signBlock(); hideBar(); }
      var s=document.createElement('script'); s.src='./forms/fence-estimate.js';
      s.onload=function(){
        if(!window.fenceEstimateHtml) return;
        var css=document.createElement('style'); css.textContent=window.fenceEstimateCss||''; document.head.appendChild(css);
        var host=document.createElement('div'); host.className='sheetwrap'; host.id='sheet';
        var first=w.firstChild; w.insertBefore(host, first);
        /* the two doors under the contract: the back of the carbon, and their copy */
        var row=document.createElement('div'); row.className='sheetlinks'; row.id='sheetlinks';
        row.innerHTML='<a href="'+esc(termsUrl)+'" target="_blank" rel="noopener">View the terms &amp; conditions</a><a href="#" id="dlcopy">Download my copy</a>';
        host.parentNode.insertBefore(row, host.nextSibling);
        document.getElementById('dlcopy').onclick=function(e){ e.preventDefault(); window.print(); };
        var photo=w.querySelector('img,iframe'); if(photo) photo.style.display='none';
        var dl=document.getElementById('dl'); if(dl){ dl.href='#'; dl.removeAttribute('download'); dl.textContent='Print'; dl.onclick=function(e){ e.preventDefault(); window.print(); }; }
        renderSheet();
      };
      document.head.appendChild(s);
      /* the bar branches (Kevin, 15 Sep): a stock job keeps "no down payment"; a custom or
         aluminum job never says it — its deposit orders the material */
      if(j.takeoff.deposit_required){
        var bb=document.querySelector('#bar b'); if(bb) bb.textContent='ACCEPT & SIGN';
        var bt=document.querySelector('#bar span'); if(bt) bt.textContent='No credit card fees, get your points. Your deposit orders your material.';
      }
      /* already signed but the deposit is still open (they came back to the link) */
      if(signedAt && j.takeoff.deposit_required && !j.takeoff.deposit_paid_at) depositCard();
    }).catch(function(){});
  }

  /* THE DEPOSIT STEP (336 + Kevin, 15 Sep: "no deposit, no order… non-negotiable").
     Custom / aluminum jobs: after the signature, the 50% deposit. There is no card
     processor on this page tonight, so PAY BY CARD either opens the office's QuickBooks
     pay link when one exists, or tells them the office will take the card by phone
     within the hour — and tags the office on the file. Nothing is charged here. */
  function depositCard(){
    if(document.getElementById('deposit')) return;
    var tk=(sheetData&&sheetData.takeoff)||{}; if(!tk.deposit_required||tk.deposit_paid_at) return;
    var amt=tk.deposit_amount!=null?('$'+Math.round(Number(tk.deposit_amount)).toLocaleString('en-US')):'50%';
    var d=document.createElement('div'); d.className='deposit'; d.id='deposit';
    d.innerHTML='<h2>YOUR DEPOSIT ORDERS YOUR MATERIAL</h2>'
      +'<div class="amt">'+esc(amt)+'</div><p class="sub">50% of your total — custom and aluminum orders are made for you, so the material is ordered the moment your deposit is in. No credit card fees.</p>'
      +'<button type="button" class="pay" id="payBtn">PAY BY CARD</button><p class="msg" id="payMsg"></p>';
    var anchor=document.querySelector('.done')||document.querySelector('.sign');
    if(anchor&&anchor.parentNode) anchor.parentNode.insertBefore(d, anchor.nextSibling); else w.appendChild(d);
    var btn=document.getElementById('payBtn'), msg=document.getElementById('payMsg');
    btn.onclick=function(){
      btn.disabled=true; btn.textContent='ONE MOMENT…';
      fetch(FN+t+'/deposit',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})
        .then(function(r){ return r.json(); }).then(function(j){
          if(j&&j.pay_link){ btn.disabled=false; btn.textContent='PAY BY CARD'; window.open(j.pay_link,'_blank','noopener'); msg.textContent='Your secure payment page opened in a new tab. Once it goes through, your material is ordered.'; return; }
          if(j&&j.paid){ btn.textContent='DEPOSIT RECEIVED ✓'; msg.textContent='Thank you — your material is ordered.'; return; }
          btn.textContent='WE’LL CALL FOR YOUR CARD';
          msg.textContent='We’ll take your card by phone within the hour — your material order is on hold until then. Nothing was charged here.';
        }).catch(function(){ btn.disabled=false; btn.textContent='PAY BY CARD'; msg.textContent='That didn’t go through. Please try again or call your rep.'; });
    };
  }
  function sheetArgs(){
    var j=sheetData||{}, c=j.customer||{};
    return { takeoff:j.takeoff, customer:{ name:c.name, street:c.street, city:c.city, state:c.state||'FL', zip:c.zip, phone:c.phone, email:c.email },
             rep:(j.rep&&j.rep.name)||'', repPhone:(j.rep&&j.rep.phone)||'', date:j.date, svg:j.svg||'',
             signedName:j.signedName||'', signedDate:j.signedDate||'' };
  }
  function restampSheet(name){
    var host=document.getElementById('sheet'); if(!host||!sheetData||!window.fenceEstimateHtml) return;
    sheetData.signedName=name; sheetData.signedDate=new Date().toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'});
    renderSheet();
  }

  /* THE CONTRACT, THE WAY THE CARBON WORKS (Kevin, 15 Sep: "line by line… all the
     current signatures, dates and initials… as easy as possible… this IS our
     contract"). The sheet's seven spots — grade, payment, consent, balance,
     revisions, signature, date — are green tap targets until stamped. A tap stamps
     the preset (initials / the typed name / today) and the next spot lights up; the
     bar counts them and finishes when all seven are in. Nothing new is written on
     the sheet: it is the pad's own text, exactly where the carbon has it. */
  var stamps={};
  function spotsList(){ return (window.fenceEstimateSpots||[]).filter(function(s){ return !s.auto; }); }
  function autoSpots(){ return (window.fenceEstimateSpots||[]).filter(function(s){ return s.auto; }); }
  function spotsLeft(){ return spotsList().filter(function(s){ return !stamps[s.key]; }); }
  function stampValue(sp, name){
    var today=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
    return sp.kind==='sig'?name : sp.kind==='date'?today : initialsOf(name);
  }
  function renderSheet(){
    var host=document.getElementById('sheet'); if(!host||!sheetData||!window.fenceEstimateHtml) return;
    var args=sheetArgs(); args.signable=!signedAt; args.stamps=stamps;
    host.innerHTML=window.fenceEstimateHtml(args);
    var left=spotsLeft(), next=left[0];
    host.querySelectorAll('.spot').forEach(function(b){
      b.classList.toggle('next', !!next && b.getAttribute('data-spot')===next.key);
      b.onclick=function(){ stampSpot(b.getAttribute('data-spot')); };
    });
    updateBar();
  }
  function stampSpot(key){
    var sp=spotsList().filter(function(s){ return s.key===key; })[0]; if(!sp||signedAt) return;
    var nm=document.getElementById('nm'); var name=(nm&&nm.value||'').trim();
    if(name.length<2){
      var err=document.getElementById('err'); if(err) err.textContent='Type your full name first — it becomes your signature and initials.';
      if(nm){ nm.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){ nm.focus(); },400); }
      return;
    }
    stamps[key]=stampValue(sp, name);
    renderSheet();
    var nx=document.querySelector('.spot.next'); if(nx) nx.scrollIntoView({behavior:'smooth',block:'center'});
    else { var s=document.querySelector('.sign'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'}); }
  }
  function updateBar(){
    var b=document.querySelector('#bar b'), btn=document.getElementById('barGo'); if(!b||!btn) return;
    if(!sheetData||!spotsList().length){ return; }                 // no sheet: the bar stays as it was
    var total=spotsList().length, done=total-spotsLeft().length;
    b.textContent='ACCEPT & SIGN · '+done+' of '+total;
    btn.innerHTML = done<total ? 'NEXT SPOT ↓' : 'SIGN &amp; FINISH ✓';
  }
  /* the sign button and the bar agree: every spot first, then the signature */
  function spotsGate(){
    if(!sheetData||!spotsList().length||signedAt) return null;
    var left=spotsLeft(); if(!left.length) return null;
    var nx=document.querySelector('.spot.next'); if(nx) nx.scrollIntoView({behavior:'smooth',block:'center'});
    return left.length===1 ? 'One more spot to tap on your contract: '+left[0].label+'.' : left.length+' spots still to tap on your contract — the next one is lit up.';
  }

  /* THE BAR (Kevin's wording, verbatim — never a dollar figure, never credit language;
     financing lives inside the sheet's payment panel). Sticky the whole scroll; the
     button lands on the signature step. Gone once signed. */
  function acceptBar(){
    var b=document.createElement('div'); b.className='bar'; b.id='bar';
    b.innerHTML='<div><b>ACCEPT NOW · zero pain</b><span>No down payment. No credit card fees, get your points. Signing only orders your material and puts you on the schedule.</span></div>'
      +'<button type="button" id="barGo">ACCEPT &amp; SIGN →</button>';
    document.body.appendChild(b);
    document.getElementById('barGo').onclick=function(){
      var nm=document.getElementById('nm');
      /* a contract with spots: no name yet → the name box; spots left → the next spot; all in → finish */
      if(sheetData&&spotsList().length&&!signedAt){
        if(!(nm&&nm.value.trim().length>=2)){ if(nm){ nm.scrollIntoView({behavior:'smooth',block:'center'}); setTimeout(function(){ nm.focus(); },400); } return; }
        var nx=document.querySelector('.spot.next'); if(nx){ nx.scrollIntoView({behavior:'smooth',block:'center'}); return; }
        var go=document.getElementById('go'); if(go){ go.scrollIntoView({behavior:'smooth',block:'center'}); go.click(); } return;
      }
      var s=document.querySelector('.sign'); if(s) s.scrollIntoView({behavior:'smooth',block:'start'});
      if(nm) setTimeout(function(){ nm.focus(); },450);
    };
  }
  function hideBar(){ var b=document.getElementById('bar'); if(b) b.remove(); document.body.classList.remove('haspk'); }

  /* THE ITEMIZED ESTIMATE (322) — Mike's Billdu shape: number, dates, from/for,
     the items with their scope of work, the total. The Download button prints. */
  function money(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function dateOf(s){ var d=new Date(s+'T12:00:00'); return isNaN(d)?esc(s):d.toLocaleDateString('en-US',{month:'numeric',day:'numeric',year:'numeric'}); }
  function loadDoc(){
    var host=document.getElementById('doc'); if(!host||!t) return;
    var dl=document.getElementById('dl'); if(dl){ dl.href='#'; dl.removeAttribute('download'); dl.textContent='Print'; dl.onclick=function(e){ e.preventDefault(); window.print(); }; }
    fetch(FN+t+'/doc').then(function(r){ return r.json(); }).then(function(j){
      if(!j||!j.ok||!j.doc){ host.innerHTML='<p class="docwait">This estimate isn’t available. Please contact your rep.</p>'; return; }
      var d=j.doc, b=d.brand||{}, c=d.customer||{};
      var rows=(d.items||[]).map(function(it){
        var line=Number(it.qty||1)*Number(it.unit_price||0)*(1-Number(it.discount_pct||0)/100);
        return '<tr><td class="dsc"><b>'+esc(it.label||'')+'</b>'+(it.description?'<div class="scope">'+esc(it.description).replace(/\n/g,'<br>')+'</div>':'')+'</td>'
          +'<td class="num">'+esc(String(it.qty||1))+(it.unit?' '+esc(it.unit):'')+'</td><td class="num">'+money(it.unit_price)+'</td><td class="num">'+money(line)+'</td></tr>';
      }).join('');
      host.innerHTML=
        '<div class="dochead"><div><div class="docttl">Estimate</div><div class="docco">'+esc(b.name||'')+'</div>'
        +(b.phone?'<div class="docsm">'+esc(b.phone)+'</div>':'')+(b.web?'<div class="docsm">'+esc(b.web)+'</div>':'')+'</div>'
        +'<div class="docmeta"><div><span>ESTIMATE NO.</span><b>'+esc(String(d.serial))+'</b></div><div><span>ISSUE DATE</span><b>'+dateOf(d.issue_date)+'</b></div><div><span>VALID UNTIL</span><b>'+dateOf(d.valid_until)+'</b></div></div></div>'
        +'<div class="docparties"><div><span>FROM</span><b>'+esc(b.legal||b.name||'')+'</b></div><div><span>FOR</span><b>'+esc(c.name||'')+'</b>'
        +(c.street?'<div>'+esc(c.street)+'</div>':'')+(c.city?'<div>'+esc(c.city)+(c.zip?' FL '+esc(c.zip):'')+'</div>':'')+'</div>'
        +'<div class="docamt"><span>AMOUNT</span><b>'+money(d.total)+'</b></div></div>'
        +(d.title?'<div class="doctitle">'+esc(d.title)+'</div>':'')
        +'<table class="doctab"><thead><tr><th>DESCRIPTION</th><th class="num">QTY</th><th class="num">UNIT PRICE</th><th class="num">AMOUNT</th></tr></thead><tbody>'+rows+'</tbody></table>'
        +(d.discount_pct&&Number(d.discount_pct)>0?'<div class="docdisc">Discount '+esc(String(d.discount_pct))+'%</div>':'')
        +'<div class="doctotal"><span>Total (USD)</span><b>'+money(d.total)+'</b></div>'
        +(d.note?'<div class="docnote">'+esc(d.note).replace(/\n/g,'<br>')+'</div>':'')
        +'<div class="docfoot">'+esc(b.legal||'')+(d.rep&&d.rep.name?' · Prepared by '+esc(d.rep.name):'')+'</div>';
      if(d.status==='accepted'&&!signedAt){ signedAt=d.accepted_at||new Date().toISOString(); var host2=document.querySelector('.sign'); if(host2) host2.outerHTML=signBlock(); }
      /* Billdu's customer page, in order: the summary card (number, the amount, the status,
         download, client + dates), the accept action right under it, the document behind
         "Show more". Same order here, so Mike's customers see what they always see. */
      var accepted=!!signedAt;
      var sum=document.createElement('div'); sum.className='dsum';
      sum.innerHTML='<div class="dbrand">'+esc(b.name||'')+'</div>'
        +'<div class="dsumin"><div class="dno">ESTIMATE #'+esc(String(d.serial))+'</div>'
        +'<div class="damt">'+money(d.total)+' <span class="pill '+(accepted?'ok':'open')+'">'+(accepted?'Accepted':'Awaiting your approval')+'</span></div>'
        +'<a class="drow" href="#" id="dprint">&#8681;&nbsp; Download estimate PDF</a>'
        +'<a class="drow" href="#" id="dmore">&#9776;&nbsp; View estimate</a>'
        +'<div class="dkv"><span>Client</span><b>'+esc(c.name||'')+'</b></div>'
        +'<div class="dkv"><span>Issue date</span><b>'+dateOf(d.issue_date)+'</b></div>'
        +'<div class="dkv"><span>Valid until</span><b>'+dateOf(d.valid_until)+'</b></div></div>';
      host.parentNode.insertBefore(sum, host);
      var signEl=document.querySelector('.sign'); if(signEl) host.parentNode.insertBefore(signEl, host);
      host.classList.add('dhide');
      sum.querySelector('#dprint').onclick=function(e){ e.preventDefault(); host.classList.remove('dhide'); window.print(); };
      sum.querySelector('#dmore').onclick=function(e){ e.preventDefault(); var open=host.classList.toggle('dhide'); this.innerHTML=(open?'&#9776;&nbsp; View estimate':'&#9776;&nbsp; Hide estimate'); if(!open) host.scrollIntoView({behavior:'smooth',block:'start'}); };
      var go=document.getElementById('go'); if(go) go.textContent='ACCEPT ESTIMATE';
      var h2=document.querySelector('.sign h2'); if(h2) h2.textContent='ACCEPT & SIGN';
      var lead=document.querySelector('.sign .lead'); if(lead) lead.textContent='Happy with this estimate? Accept it right here — type your name and tap Accept. Signing in the box is optional.';
      docMode=true;
    }).catch(function(){ host.innerHTML='<p class="docwait">Couldn’t load the estimate. Please check your connection and try again.</p>'; });
  }
  var docMode=false;

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* A link that has already been signed shows the receipt, never a second
     empty pad — re-opening the estimate must not read as "sign again". */
  function signBlock(){
    if(signedAt){
      var when=new Date(signedAt);
      var pretty=isNaN(when)?'':when.toLocaleString([], {dateStyle:'long', timeStyle:'short'});
      return '<div class="done"><h2>✓ SIGNED</h2>'
        +'<p>Thank you — this estimate was approved and signed'
        +(pretty?' on '+esc(pretty):'')+'. You are locked in: your material goes on order as soon as the paperwork is official. '
        +'Your rep and our office will reach out right away to set a quick visit for the rest of the paperwork and the survey. '
        +'You agreed to our <a href="'+esc(termsUrl)+'" target="_blank" rel="noopener">Terms &amp; Conditions</a>.</p></div>';
    }
    return '<div class="sign">'
      +'<h2>'+(pk?'ACCEPT &amp; SIGN':'APPROVE &amp; SIGN')+'</h2>'
      +'<p class="lead">'+(pk?'Type your name. That is your signature, and it goes on your contract above. Nothing is charged today.':'Happy with this estimate? Approve it right here — no printing, no scanning.')+'</p>'
      +'<label for="nm">Your full name</label>'
      +'<input type="text" id="nm" autocomplete="name" autocapitalize="words" '
      +'spellcheck="false" placeholder="Type your full name">'
      /* THE PACKET (319) — the disclosures and county forms for this address,
         filled in by /packet after the page renders. One signature covers
         them; each one is its own tap. Empty until the office turns it on. */
      +'<div id="packet"></div>'
      /* THE CLAUSE — one line, directly above the pad. */
      +'<p class="terms">By signing, you agree to the '
      +'<a href="'+esc(termsUrl)+'" target="_blank" rel="noopener">Terms &amp; Conditions</a>'
      +'<span id="packetclause"></span>.</p>'
      /* WHO WE ARE (321) — the legal entity, the dba and the license, from the server. */
      +(legalLine?'<p class="legal">Contractor: '+esc(legalLine)+'</p>':'')
      +'<div class="padwrap"><canvas id="pad"></canvas><div class="padline"></div>'
      +'<div class="padhint" id="hint">'+(pk?'Your signature appears here as you type':'Sign here with your finger')+'</div></div>'
      +'<div class="padrow"><span class="stamp" id="stamp"></span>'
      +'<button type="button" class="clear" id="clr">Clear</button></div>'
      +'<button type="button" class="go" id="go">'+(pk?'ACCEPT &amp; SIGN →':'APPROVE &amp; SIGN')+'</button>'
      +'<p class="err" id="err"></p>'
      +'</div>';
  }

  /* THE PACKET (319). Ask the server which documents this address needs. The
     list only appears when the office has turned the packet on; until then the
     page is the same page it has been since August. Each document is a tap;
     the one signature below covers every tapped document. In-person forms are
     named, not tapped. */
  var packetDocs=[], agreed={};
  function loadPacket(){
    var host=document.getElementById('packet'); if(!host||!t) return;
    fetch(FN+t+'/packet').then(function(r){ return r.json(); }).then(function(j){
      if(!j||!j.on||!j.documents||!j.documents.length) return;
      packetDocs=j.documents;
      var taps=packetDocs.filter(function(d){ return !d.in_person; });
      var inPerson=packetDocs.filter(function(d){ return d.in_person; });
      var h='<div class="packet"><h3>YOUR PAPERWORK</h3>'
        +'<p class="plead">These go with your estimate. Read each one, then tap to agree. Your signature below covers all of them.</p>';
      taps.forEach(function(d){
        h+='<div class="pdoc" data-key="'+esc(d.key)+'">'
          +'<button type="button" class="ptap" aria-pressed="false">✓</button>'
          +'<div class="pbody"><b>'+esc(d.title)+'</b>'
          +(d.file_url?'<a href="'+esc(d.file_url)+'" target="_blank" rel="noopener">Read it</a>':'')
          +'<span class="pwhy">'+esc(d.why||'')+'</span></div>'
          /* preset initials (pk): the typed name's initials in script, lit when tapped */
          +(pk?'<span class="pinit" aria-hidden="true"></span>':'')+'</div>';
      });
      if(inPerson.length){
        h+='<p class="pperson"><b>In person with your rep:</b> '
          +inPerson.map(function(d){ return esc(d.title)+(d.signing==='esign_notary'?' (notarized)':d.signing==='wet_ink'?' (ink)':''); }).join(' · ')
          +'. Nothing to do here — your rep brings these.</p>';
      }
      h+='</div>';
      host.innerHTML=h;
      if(pk) setInitials();
      var clause=document.getElementById('packetclause');
      if(clause&&taps.length) clause.textContent=' and to each document you tapped above';
      host.querySelectorAll('.pdoc').forEach(function(el){
        var key=el.getAttribute('data-key'), btn=el.querySelector('.ptap');
        btn.addEventListener('click',function(){
          if(agreed[key]){ delete agreed[key]; el.classList.remove('on'); btn.setAttribute('aria-pressed','false'); }
          else { agreed[key]=new Date().toISOString(); el.classList.add('on'); btn.setAttribute('aria-pressed','true'); }
        });
      });
    }).catch(function(){});
  }
  function packetReady(){
    var missing=packetDocs.filter(function(d){ return !d.in_person && !d.optional && !agreed[d.key]; });
    return missing.length?missing[0].title:null;
  }
  function packetPayload(){
    return Object.keys(agreed).map(function(k){ return {key:k, agreedAt:agreed[k]}; });
  }
  function initialsOf(name){
    return String(name||'').trim().split(/\s+/).filter(Boolean).map(function(p){ return p[0].toUpperCase(); }).slice(0,3).join('');
  }
  function setInitials(){
    var nm=document.getElementById('nm'); var ini=initialsOf(nm&&nm.value);
    document.querySelectorAll('.pinit').forEach(function(el){ el.textContent=ini||'—'; });
  }

  function wireSigning(){
    loadPacket();
    var shownAt=new Date().toISOString();      // when the clause was put in front of them
    var pad=document.getElementById('pad'), hint=document.getElementById('hint');
    var stamp=document.getElementById('stamp'), err=document.getElementById('err');
    var go=document.getElementById('go'), nm=document.getElementById('nm');
    var ctx=pad.getContext('2d'), ink=false, drawing=false, last=null;
    var presetInk=false;                       // the typed name drawn in script as the default signature (pk)

    stamp.textContent=new Date().toLocaleString([], {dateStyle:'medium', timeStyle:'short'});

    /* PRESET SIGNATURE (Kevin, 15 Sep): as the customer types their name it appears
       in the box in a script face — that IS their signature unless they tap the box
       and draw one. Drawing clears the preset first, so the two never overlap. */
    function drawPreset(){
      if(ink) return;                          // a hand-drawn signature is never overwritten
      var name=(nm.value||'').trim();
      ctx.clearRect(0,0,pad.width,pad.height);
      presetInk=false; hint.style.display=''; hint.textContent=pk?'Your signature appears here as you type':'Sign here with your finger'; hint.className='padhint';
      if(name.length<2) return;
      var r=window.devicePixelRatio||1, h=pad.height/r, wdt=pad.width/r;
      ctx.save(); ctx.setTransform(1,0,0,1,0,0);
      ctx.fillStyle='#1c3055';
      /* start big, shrink until the whole name fits between the box's margins — a long
         name on a narrow phone must never run off the right edge */
      var size=40, fontFor=function(s){ return '600 '+Math.round(s*r)+'px "Caveat","Segoe Script","Bradley Hand",cursive'; };
      ctx.font=fontFor(size);
      while(size>16 && ctx.measureText(name).width > (wdt-44)*r){ size-=1; ctx.font=fontFor(size); }
      ctx.textBaseline='alphabetic'; ctx.fillText(name, 22*r, Math.round((h-50)*r));
      ctx.restore();
      presetInk=true; hint.style.display=pk?'none':''; hint.textContent='Tap to sign by hand instead'; hint.className='padhint preset';
    }
    if(pk){ nm.addEventListener('input', function(){ drawPreset(); setInitials(); }); }

    /* Backing store at device resolution, or the signature is a blurry mess on
       a phone — which is exactly the device every one of these is signed on. */
    function size(){
      var r=pad.getBoundingClientRect(), d=window.devicePixelRatio||1;
      var keep=ink?pad.toDataURL('image/png'):null;
      pad.width=Math.round(r.width*d); pad.height=Math.round(r.height*d);
      ctx.setTransform(d,0,0,d,0,0);
      ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#16233d';
      if(keep){ var im=new Image(); im.onload=function(){ ctx.drawImage(im,0,0,r.width,r.height); }; im.src=keep; }
      else if(presetInk){ presetInk=false; drawPreset(); }   // a rotate re-draws the typed name, not a blank box
    }
    size();
    window.addEventListener('resize', size);
    window.addEventListener('orientationchange', size);

    function pt(e){
      var r=pad.getBoundingClientRect();
      var s=e.touches&&e.touches[0]?e.touches[0]:e;
      return {x:s.clientX-r.left, y:s.clientY-r.top};
    }
    function down(e){ e.preventDefault(); drawing=true; last=pt(e);
      if(presetInk){ ctx.clearRect(0,0,pad.width,pad.height); presetInk=false; }   // hand beats preset
      if(!ink){ ink=true; hint.style.display='none'; } }
    function move(e){
      if(!drawing) return;
      e.preventDefault();                       // otherwise the page scrolls under the finger
      var p=pt(e);
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
      last=p;
    }
    function up(){ drawing=false; last=null; }

    pad.addEventListener('touchstart',down,{passive:false});
    pad.addEventListener('touchmove',move,{passive:false});
    pad.addEventListener('touchend',up);
    pad.addEventListener('touchcancel',up);
    pad.addEventListener('mousedown',down);
    pad.addEventListener('mousemove',move);
    window.addEventListener('mouseup',up);

    document.getElementById('clr').addEventListener('click',function(){
      ctx.clearRect(0,0,pad.width,pad.height); ink=false; presetInk=false; hint.style.display='';
      hint.textContent='Sign here with your finger'; hint.className='padhint';
      err.textContent='';
      if(pk) drawPreset();                     // back to the typed-name default, not an empty box
    });

    go.addEventListener('click',function(){
      var name=(nm.value||'').trim();
      if(name.length<2){ err.textContent='Please type your full name.'; nm.focus(); return; }
      /* 322: on an itemized estimate the tap IS the acceptance (Billdu's shape). With no
         drawn signature we adopt the typed name as the signature, in a script face, so the
         record still carries a signature image the office can see. */
      if(!ink&&presetInk){ ink=true; hint.style.display='none'; }   // the preset script name is the signature
      if(!ink&&docMode){
        ctx.clearRect(0,0,pad.width,pad.height);
        var r=window.devicePixelRatio||1;
        ctx.fillStyle='#1c3055'; ctx.font='italic '+Math.round(34*r)+'px "Segoe Script","Brush Script MT","Snell Roundhand",cursive';
        ctx.textBaseline='middle'; ctx.fillText(name, 18*r, pad.height/2);
        ink=true; hint.style.display='none';
      }
      if(!ink){ err.textContent='Please sign in the box above.'; return; }
      var needSpot=spotsGate();
      if(needSpot){ err.textContent=needSpot; return; }
      var needTap=packetReady();
      if(needTap){ err.textContent='Please tap to agree to "'+needTap+'" above.'; return; }
      err.textContent=''; go.disabled=true; go.textContent='SENDING…';

      fetch(FN+t+'/sign',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({name:name, signature:pad.toDataURL('image/png'), termsShownAt:shownAt, documents:packetPayload(), stamps:stamps})})
        .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
        .then(function(j){
          if(j && j.ok){ signedAt=j.signedAt||new Date().toISOString(); render(); if(pk){ hideBar(); restampSheet(name); depositCard(); } }
          else { throw new Error((j&&j.error)||'failed'); }
        })
        .catch(function(){
          go.disabled=false; go.textContent=pk?'ACCEPT & SIGN →':'APPROVE & SIGN';
          err.textContent='That didn’t go through. Please check your connection and try again.';
        });
    });

    /* Swap the form for the receipt in place — no reload, so a flaky signal
       cannot lose the confirmation they just earned. */
    function render(){
      var host=document.querySelector('.sign');
      if(host) host.outerHTML=signBlock();
      var p=document.querySelector('.dsum .pill'); if(p){ p.className='pill ok'; p.textContent='Accepted'; }
    }
  }
</script>
<script>
  var viewId=q.get('v')||null, seconds=0, timer=null;
  function beat(){ if(!viewId||!t) return;
    fetch(FN+t+'/beat',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({viewId:viewId,seconds:seconds})}).catch(function(){}); }
  function start(){ if(timer) return; timer=setInterval(function(){ seconds+=15; beat(); },15000); }
  function stop(){ if(timer){ clearInterval(timer); timer=null; beat(); } }
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });
  window.addEventListener('pagehide',stop);
  start();
</script>
</html>
