<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Kevin's model says maximum-scale=1, user-scalable=no. Pinch-zoom is left ON
     here deliberately: this is a numbers instrument and being unable to zoom a
     chart on a phone is a real loss. Say the word and it goes back. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>TruReview Autopilot — Owner Console</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0d1f17"/>
<meta name="color-scheme" content="dark"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="icon-1024.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TruReview"/>
<meta name="format-detection" content="telephone=no"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=JetBrains+Mono:wght@400;500;600&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Kevin's Liberty Command Console model, wired live.
   Everything down to the ── EXTENSIONS ── rule is his CSS verbatim.
   ═══════════════════════════════════════════════════════════════════════════ */
  :root {
    --bg-deep: #0d1f17; --bg-card: #15291f; --bg-card-hi: #1c3528;
    --line: rgba(255,255,255,0.06); --text: #e8efe9; --text-dim: #8aa094;
    --accent: #f0834a; --accent-soft: #f4a37a; --green: #6cc28b; --green-soft: #8fd5a8;
    --red: #d96a5e; --gold: #d4b15a; --blue: #6ba8c9; --violet: #a98fd5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* html carries the base colour too. body's gradient is background-attachment:
     fixed, so on a long desktop page the area outside the painted gradient fell
     through to the canvas — which is white. That is the band across the top of
     Kevin's monitor. */
  html { background: var(--bg-deep); }
  html, body { width: 100%; overflow-x: hidden; }
  body { font-family: 'Inter Tight', sans-serif; background: radial-gradient(ellipse at top, #1a3326 0%, #0d1f17 60%); background-attachment: fixed; color: var(--text); min-height: 100vh; padding: 16px; -webkit-font-smoothing: antialiased; }
  .shell { width: 100%; max-width: 480px; margin: 0 auto; }
  .hdr { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .hdr h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 28px; letter-spacing: -0.02em; line-height: 1.05; margin-bottom: 18px; }
  .hdr h1 em { font-style: italic; color: var(--accent-soft); font-weight: 300; }
  .nw-block { display: flex; justify-content: space-between; align-items: flex-end; }
  .nw-block .nw-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .nw-block .nw { font-family: 'Fraunces', serif; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; }
  .nw-block .nw-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); margin-top: 5px; letter-spacing: 0.04em; }
  .nw-block .nw-delta { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--green); text-align: right; line-height: 1.5; }
  .nw-block .nw-delta b { color: var(--green-soft); font-weight: 600; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }

  /* ── MINOR CARDS: folded, not hidden ───────────────────────────────────────
     Kevin has this page open all day. Fifteen cards all fully expanded reads as
     an alarm panel — everything shouts at once, so nothing does. The cards he
     acts on stay open. The rest fold to a single row that still carries their
     headline figure, and open on a click.

     Folded is not the same as hidden, and the difference is the whole point: the
     number stays on the row, so nothing disappears from the page. What the click
     opens is the working behind it — which rows, from which source. That is the
     receipts doctrine applied to the layout itself rather than only to the
     figures inside it.

     His choice is remembered, so the page he arranges is the page he comes back
     to. Phones default to open: there the page is a scroll, not a wall, and
     folding would only add taps to reach something already reachable. ─────── */
  /* the union, declared on the headline itself */
  .hero-incl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
               margin-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .hero-incl b { color: var(--text); font-weight: 600; }
  .hero-incl.warn { color: var(--accent-soft); line-height: 1.5; display: block; }
  .bb.pending { opacity: .75; font-style: italic; }

  .card.mnr { padding: 0; }
  .mnr-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
  .mnr-head .card-title { margin: 0; min-width: 0; }
  .mnr-sum { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px;
             color: var(--text-dim); text-align: right; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .mnr-chev { color: var(--text-dim); font-size: 15px; line-height: 1; flex-shrink: 0; }
  .card.mnr.open .mnr-chev { transform: rotate(90deg); }
  /* an open card states its own case better than a one-line digest of it */
  .card.mnr.open .mnr-sum { display: none; }
  .mnr-body { display: none; padding: 0 16px 16px; }
  .card.mnr.open .mnr-body { display: block; }
  @media (hover: hover) { .mnr-head:hover .mnr-chev, .mnr-head:hover .card-title { color: var(--text); } }
  .card-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .card-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .feed-tag { display: inline-block; margin-left: 6px; font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--green); border: 1px solid rgba(108,194,139,0.3); border-radius: 100px; padding: 1px 6px; vertical-align: middle; }
  .feed-tag.cc { color: var(--blue); border-color: rgba(107,168,201,0.3); }
  .feed-tag.qb { color: var(--gold); border-color: rgba(212,177,90,0.3); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-tile { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .stat-tile .lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .stat-tile .val { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; line-height: 1; }
  .stat-tile .sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: 6px; }
  .stat-tile .val.orange { color: var(--accent-soft); } .stat-tile .val.gold { color: var(--gold); } .stat-tile .val.blue { color: var(--blue); } .stat-tile .val.green { color: var(--green-soft); } .stat-tile .val.red { color: var(--red); }
  .stat-tile .delta { font-family: 'JetBrains Mono', monospace; font-size: 9px; margin-top: 6px; letter-spacing: 0.02em; }
  .stat-tile .delta.up { color: var(--green-soft); } .stat-tile .delta.down { color: #d8997f; } .stat-tile .delta.flat { color: var(--text-dim); }
  .wow-hero { display: flex; align-items: stretch; gap: 8px; margin: 10px 0 12px; }
  .wow-col { flex: 1; background: var(--bg-card-hi); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .wow-col .k { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .wow-col .v { font-family: 'Fraunces', serif; font-size: 21px; font-weight: 500; margin-top: 4px; line-height: 1; }
  .wow-col.now { border-color: rgba(108,194,139,0.4); } .wow-col.now .v { color: var(--green-soft); }
  .wow-arrow { display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; }
  .wow-arrow .d { font-size: 13px; color: var(--green-soft); font-weight: 600; }
  .wow-arrow .c { font-size: 8px; color: var(--text-dim); margin-top: 2px; }
  .wow-row { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
  .wow-row:last-child { border-bottom: none; }
  .wow-row .nm { flex: 1; color: var(--text); }
  .wow-row .nums { color: var(--text-dim); width: 118px; text-align: right; }
  .wow-row .chg { width: 56px; text-align: right; font-weight: 600; }
  .wow-row .chg.up { color: var(--green-soft); } .wow-row .chg.down { color: #d8997f; }
  .pace-proj { position: absolute; left: 0; top: 0; height: 100%; border-radius: 100px; opacity: 0.32; }
  .pace-solid { position: absolute; left: 0; top: 0; height: 100%; border-radius: 100px; }
  .tgt-cap { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); margin-top: 5px; letter-spacing: 0.04em; }
  .tgt-cap b { color: var(--text); font-weight: 600; }
  .tgt-cap .hit { color: var(--green-soft); } .tgt-cap .miss { color: #d4b15a; }
  .chart-card { padding: 16px 12px 12px; }
  .chart-card .card-title, .chart-card .card-sub { padding: 0 4px; }
  .chart-wrap { height: 190px; margin-top: 8px; } .chart-wrap.tall { height: 200px; }
  .alloc-chart { width: 140px; height: 140px; margin: 4px auto 14px; position: relative; }
  .alloc-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  .alloc-center .big { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; }
  .alloc-center .lbl { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.15em; color: var(--text-dim); text-transform: uppercase; }
  .alloc-legend { display: flex; flex-direction: column; gap: 9px; }
  .alloc-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
  .alloc-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .alloc-row .name { flex: 1; } .alloc-row .val { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); }
  .alloc-spark { flex-shrink: 0; line-height: 0; }
  /* ── TRACE WIDTH IS CAPPED, AND THE CAP IS THE POINT ──────────────────────
     A trace with a fixed number of days and no width limit is a different chart
     at every viewport. The same fourteen points that read as a heartbeat at
     390px stretch across 1,300px on a desktop and flatten into a horizon: same
     data, same y-range, and a slope four times shallower purely because the
     window is wider. A reader who learns the shape on their phone then cannot
     recognise it on their laptop, which makes the shape useless as a signal.

     So every full-width trace stops at 560px and stays left-aligned in its row.
     The CARD keeps its full width — only the drawing is capped, because the
     prose and the numbers beside it genuinely do want the room. Above roughly a
     600px viewport every trace is then pixel-identical: same width, same
     spacing per point, same slope. Below it the trace is as wide as the phone
     allows, which is the widest it can honestly be.

     Fixed-width sparks (.ekg-mini on the brand rows, 64px) never had this
     problem and are left alone. */
  :root { --trace-max: 560px; }
  /* ── EKG trace ── the heartbeat, not a bar chart. Reference line drawn first
     and stays a line, actual trace on top, glowing dot on today. Zero-baselined
     by ekgSpark()'s own math — nothing here truncates the axis. */
  .ekg-wrap { margin: 8px 0 4px; }
  .ekg { display: block; width: 100%; max-width: var(--trace-max); height: 48px; overflow: visible; }
  .ekg-mini { width: 64px; height: 22px; overflow: visible; }
  .ekg-typ { stroke: var(--gold); stroke-opacity: 0.5; stroke-width: 1.2; stroke-dasharray: 3,3; }
  .ekg-line { stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .ekg-mini .ekg-line { stroke-width: 1.5; }
  .ekg-dot-glow { opacity: 0.55; transform-box: fill-box; transform-origin: center; animation: ekg-pulse 1.8s ease-in-out infinite; }
  @keyframes ekg-pulse { 0%, 100% { opacity: .35; transform: scale(0.85); } 50% { opacity: .8; transform: scale(1.2); } }
  @media (prefers-reduced-motion: reduce) { .ekg-dot-glow { animation: none; opacity: .5; } }
  .ekg-cap { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-top: 3px; }
  .ekg-cap-ref { margin-left: 10px; color: var(--gold); opacity: 0.85; letter-spacing: normal; text-transform: none; }
  /* ── RHYTHM BARS ──────────────────────────────────────────────────────────
     Today / Week / YTD comparison shapes. The dashed reference is gold and the
     same weight as the EKG's "typical" line, so a reader who has learned one
     card has learned this one. */
  /* Capped on the same 560px as every other trace on the page (see --trace-max
     above). The rhythm bars were the one trace surface still growing with the
     viewport, which made them a different chart at every width — flagged in #42
     and closed here. The fixed-width mini on a brand row is 64px and untouched
     by a max the desktop never reaches. */
  .rbars { display: block; width: 100%; max-width: var(--trace-max); height: auto; overflow: visible; }
  .alloc-spark .rbars { width: 64px; }
  .rb-base { stroke: rgba(255,255,255,0.14); stroke-width: 1; }
  .rb-ref { stroke: var(--gold); stroke-opacity: 0.75; stroke-width: 1.3;
    stroke-dasharray: 3,3; vector-effect: non-scaling-stroke; }
  .rb-num { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 600;
    fill: #e8efe9; text-anchor: middle; }
  .rb-lab { font-family: 'JetBrains Mono', monospace; font-size: 7px; fill: var(--text-dim);
    text-anchor: middle; letter-spacing: 0.04em; }
  .alloc-spark .rb-num, .alloc-spark .rb-lab { display: none; }
  .rb-note { font-size: 10.5px; line-height: 1.55; color: var(--text-dim);
    background: rgba(212,177,90,0.05); border: 1px solid rgba(212,177,90,0.20);
    border-radius: 7px; padding: 6px 8px; margin: 2px 0 8px; }
  /* SECONDARY CONTEXT, AND IT MUST LOOK LIKE IT. No box, no border, no tint —
     .rb-note's gold frame is the page's "read this" marker and last year has not
     earned one since it stopped being the reference. Dimmer and smaller than the
     caption above it, and it carries no tone class, so nothing in here can ever
     turn red or green. Its <b> is only the figures, at the same dim colour. */
  .rb-aside { font-size: 10px; line-height: 1.5; color: var(--text-dim);
    opacity: 0.72; margin: 0 0 8px; max-width: var(--trace-max); }
  .rb-aside b { font-weight: 600; color: inherit; }
  /* ── THE DRILL ROWS ────────────────────────────────────────────────────────
     The sub-vital, brand and aging rows that sit inside an expanded vital on
     the hero. They outlived the pulse CARD they were written for: the card was
     replaced by the compressed hero above, and these rows carried across whole
     rather than being summarised, because the working behind a colour is the
     whole reason the colour can be trusted. */
  .pd-why { font-size: 12px; line-height: 1.6; color: var(--text-dim);
    background: rgba(212,177,90,0.05); border: 1px solid rgba(212,177,90,0.22);
    border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .pd-h { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); margin: 10px 0 5px; }
  .pd-sub { margin-bottom: 8px; }
  .pd-sub-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .pd-sub-n { font-size: 12px; font-weight: 500; }
  .pd-sub-z { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; }
  .pd-sub-v, .pd-brand-v { font-size: 11px; color: var(--text-dim); }
  .pd-sub-note { font-size: 11px; line-height: 1.6; color: var(--text-dim); margin-top: 3px; }
  .pd-sub-note code, .pd-why code { font-family: 'JetBrains Mono', monospace; font-size: 10px;
    background: rgba(255,255,255,0.05); padding: 1px 4px; border-radius: 3px; }
  .pd-wire { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.14em; color: var(--gold); opacity: 0.8; }
  .pd-brand { display: flex; align-items: baseline; gap: 8px; padding: 3px 0; }
  .pd-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .pd-brand-n { font-size: 12px; min-width: 88px; }
  .pd-brand-z { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; min-width: 52px; }
  @media (max-width: 700px) { .pd-brand { flex-wrap: wrap; } }
  /* ── THE VITALS HERO ───────────────────────────────────────────────────────
     The first screen on login, and the whole of it has to fit one 390px phone
     with nothing scrolled. That constraint is the design, not a limit on it.

     ONE LARGE ELEMENT, AND ONLY ONE. The card this replaced gave five rails
     nearly the same visual weight as the composite above them, so the eye had
     six things to rank and ranked none of them. Here the master heartbeat is
     the only big shape on the screen; the four micro vitals underneath are a
     quarter of its weight each and carry no words at all at rest — a tag, a
     trace, and a colour. Reading them is a glance down a 2×2, not a read.

     NO NUMBERS AT REST ON THE MICROS. A figure invites arithmetic, and the
     question these four answer is "is anything wrong", which is a colour and a
     shape. The figures are one tap away, in full, where the reader has already
     asked for them. */
  .vit-card { margin-bottom: 14px; }
  /* CAPPED ON THE SAME 560px AS EVERY OTHER TRACE (see --trace-max). The tiles
     ARE the drawing here, not a frame around one: a 2×2 stretched to a 1,300px
     monitor puts a 64px spark alone at the far right of a nearly empty bar, and
     the shape a reader learned on their phone stops being recognisable. The
     prose above and below keeps the full card width, as it does everywhere
     else — only the instrument is capped, and it is left-aligned like the
     rest. */
  .vit-master { margin-top: 10px; padding: 12px 12px 10px; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(255,255,255,0.02);
    max-width: var(--trace-max); margin-right: auto; }
  .vit-m-btn { display: block; width: 100%; padding: 0; border: 0; background: none;
    text-align: left; color: inherit; font: inherit; cursor: pointer; }
  .vit-m-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .vit-m-name { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em;
    color: var(--text-dim); white-space: nowrap; }
  .vit-m-read { font-family: 'Inter Tight', sans-serif; font-size: 12px; font-weight: 600;
    text-align: right; line-height: 1.25; }
  .vit-m-num { font-family: 'Fraunces', serif; font-size: 46px; font-weight: 500;
    line-height: 1; letter-spacing: -0.02em; margin: 4px 0 2px; }
  .vit-m-num small { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 400;
    letter-spacing: 0.1em; color: var(--text-dim); margin-left: 8px; }
  /* The master's own trace is the one full-width shape on the screen. Same EKG
     language as every other trace on this page — actual on top, the trailing
     median riding under it as the gold dashed reference. */
  .vit-master .ekg { height: 54px; }
  /* ── THE 2×2 ──
     MARKETING | SALES over PRODUCTION | MONEY, in that order, because that is
     the order the money moves through the business. One compact row each. */
  .vit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px;
    max-width: var(--trace-max); margin-right: auto; }
  .vit-micro { display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 8px 10px; min-height: 46px; border-radius: 10px; cursor: pointer;
    font: inherit; color: var(--text); text-align: left;
    border: 1px solid rgba(138,160,148,0.18); background: rgba(138,160,148,0.05);
    transition: border-color .15s, background .15s; }
  .vit-tag { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.14em;
    font-weight: 600; flex: none; }
  .vit-trace { flex: 1; display: flex; justify-content: flex-end; line-height: 0; }
  .vit-trace .rbars { width: 64px; }
  /* A mini rhythm bar keeps its bars and loses its numbers — the same rule the
     brand-row sparks use. Nothing on a micro vital may print a figure. */
  .vit-trace .rb-num, .vit-trace .rb-lab { display: none; }
  /* THE HEAT MAP. Trace colour, border and a soft inner glow all move together
     off one state, so the four read as one instrument. The rgb triplets are
     inlined by the renderer (see VIT_RGB) because a CSS custom property cannot
     be given an alpha without colour-mix. */
  /* OPEN IS AN OUTLINE, not a border or a shadow: both of those carry the heat
     colour inline, and an inline style wins — the open marker would have been
     invisible on exactly the tiles worth opening. */
  .vit-micro.on { outline: 1px solid rgba(255,255,255,0.26); outline-offset: -1px;
    border-radius: 10px; }
  /* The master needs no open marker of its own: an outline around a button that
     wraps a 46px numeral and a full-width trace cuts straight through both, and
     the drawer opening underneath it is already the loudest possible signal. */
  @media (hover: hover) { .vit-micro:hover { background: rgba(255,255,255,0.05); } }
  /* A dead feed draws no line at all — a flat hairline and the words for why.
     Never a calm green standing in for a feed nobody has wired. */
  .vit-dark { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); border: 1px solid rgba(138,160,148,0.3);
    border-radius: 100px; padding: 1px 6px; white-space: nowrap; }
  .vit-flat { width: 64px; height: 22px; display: block; overflow: visible; }

  /* ── THE HERO ROW ─────────────────────────────────────────────────────────
     The 560px cap above is right and stays: a trace that changes slope with
     the viewport is not an instrument. But capping both the master and the 2×2
     and then STACKING them left-aligned inside a band that runs the full width
     of the page left the whole right half of the card empty — on a 1480px desk
     the instrument occupied under 40% of its own card and read as something
     that had failed to load. Kevin, on the desktop view: "it's literally in
     less than half of the entire thing."

     The fix is layout, not scale. Nothing is stretched — the master keeps its
     560px trace and the 2×2 keeps its 560px cap, both exactly the shapes a
     phone draws. They simply sit BESIDE each other once there is room for two,
     which is the one arrangement that fills the band without touching a single
     drawn width. 560 + 26 + 560 = 1146 against the 1144px of card interior at
     the 1180px shell: the pair fills the row.

     The micro panels ride in the right column under the 2×2 they belong to, so
     opening one still never reflows the master beside it. Below the breakpoint
     the row is a plain block and the order is byte-for-byte what it was:
     master, grid, panels, foot. Mobile is untouched.

     THE BREAKPOINT IS 1040px, NOT 900px, AND THAT NUMBER IS THE TRACE CAP DOING
     ITS JOB. Splitting at 900 would have handed each column ~390px of a 808px
     card interior — which shrinks the master's trace to 390 and puts a slope on
     this page that no other trace on the page has, the exact failure the cap
     exists to prevent, only now WITHIN one screen instead of across two. So the
     master's track is a hard 560px and the row only forms once there is room
     for it plus a 2×2 wide enough to still read as tiles. The 2×2's own track
     takes what is left, up to the same 560: it holds no trace, only four fixed
     64px sparks, so it is the one of the pair that can flex. */
  @media (min-width: 1040px) {
    .vit-hero { display: grid; align-items: start; gap: 26px; margin-top: 10px;
      grid-template-columns: var(--trace-max) minmax(320px, var(--trace-max));
      justify-content: start; }
    /* The tracks now carry the cap, so the caps on the blocks inside them only
       restate it; they stay declared for the stacked case below 1040px.
       `margin-right: auto` has to be unset with them: on a block it resolves to
       zero and merely stops the box centring, but on a GRID ITEM an auto margin
       eats the free space in its track — which shrink-wrapped the master to the
       305px its header text happened to measure and left a hole beside it.
       `margin-top` goes for the same reason: grid items do not margin-collapse,
       so each block's 10px stacked lead-in has to move up onto the row itself
       or the 2×2 hangs 10px below the master it is meant to be level with. */
    .vit-hero .vit-master, .vit-hero .vit-grid {
      max-width: none; margin-right: 0; margin-top: 0; }
  }
  @media (max-width: 700px) {

    .vit-m-num { font-size: 42px; }
    .vit-master .ekg { height: 48px; }
    .vit-micro { padding: 7px 8px; min-height: 44px; gap: 6px; }
    .vit-keys { gap: 6px; }
    .vit-key .v { font-size: 15px; }
  }

  /* Attention board layout. The three type rules that used to sit here —
     `.attn .stat-tile` .lbl/.val/.sub, holding the board's tiles at 8/15/9px —
     are gone. They were left over from the version of this board that carried
     stat tiles, and the board has not carried one since it became the headline:

  .attn .stat-grid { gap: 6px; }

  /* ── The folded intel row (Kevin, 11 Aug: "shorten nuggets… small teaser

     whole point: 5px of padding and a single clamped line puts a row at

  .attn .ia { border-left: 2px solid var(--gold); background: rgba(212,177,90,.07);

  /* ── ATTENTION AS THE HEADLINE ──────────────────────────────────────────────
     The board used to flag and let the cards below explain, so it was set at
     flag size. It is now the first instrument on the page — the headline, not
     the footnote — and a headline has to be readable at a glance from across a
     desk. Nothing about the board changes but its type scale: same severity
     colours, same rows, same tap-for-the-working.

     That first pass did not go far enough. It moved the rows to 14px, 15px on a

     the 22px the money tiles in the band directly below are set at, so the
     headline went on reading smaller than its own footnotes. A reader coming to
     this page at 6am found the biggest thing on the screen was a revenue number
     he could look up any time, and the one line telling him what had gone wrong

     22px tiles beneath them, so the first instrument on the page is also the

     desktop — comfortably above the 11.5px flag scale it came from, clearly

  @media (min-width: 900px) { .attn.lead .ia-row { font-size: 17px; }

    .attn.lead .ia .acc-chev { font-size: 16px; }
    .attn.lead .ia-body { font-size: 14px; }
    .attn.lead .nofires { font-size: 17px; } }
  /* ── THE EFFORT ROOM ────────────────────────────────────────────────────────
     The room holds the working instruments rather than the reading ones, and
     it still folds — but it no longer HIDES. A bare drawer header was a name
     with nothing behind it: to know the room was worth opening you had to
     already know what was in it, which is the one thing a console cannot
     assume. So the fold now opens onto a PREVIEW SHELF that is always drawn —
     one tile per instrument, each tile a miniature of that instrument drawn
     from the same feed the full card reads.

     Two ways in, and they are mutually exclusive by construction (see
     ROOM_VIEW): a tile opens its own instrument alone, the shelf control opens
     every instrument in order. The body is built from exactly one of those
     branches, so opening one and then expanding all cannot render anything
     twice. Each card inside is exactly the card its own function builds — same
     numbers, same source badges, same notes — it loses only its box, because a
     stack of bordered cards inside a bordered card reads as clutter. */
  .room { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; }
  .shelf-head { display: flex; align-items: flex-end; gap: 14px; padding: 16px 16px 0; }
  .shelf-titles { min-width: 0; flex: 1 1 auto; }

  @media (hover: hover) { .shelf-all:hover { border-color: var(--accent); color: var(--accent-soft); } }

  .shelf-grid { display: grid; gap: 10px; padding: 14px 16px 16px;

  .ptile { display: flex; flex-direction: column; width: 100%; min-height: 108px;

  .pt-h { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.13em;

  .ptile.on .pt-h { color: var(--accent-soft); }

  .pt-b { padding-top: 9px; }
  .pt-num { font-family: 'Fraunces', serif; font-size: 26px; line-height: 1; letter-spacing: -0.01em; }
  .pt-num.green { color: var(--green-soft); } .pt-num.gold { color: var(--gold); }
  .pt-num.red { color: var(--red); } .pt-num.blue { color: var(--blue); }
  .pt-num.accent { color: var(--accent-soft); }
  .pt-cap { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
    margin-top: 6px; line-height: 1.45; }
  /* An instrument with nothing behind it says so in words. It must never draw
     a flat bar or a zeroed shape: a shape with no data in it reads as a
     working instrument reporting nothing, which is a different claim and a

  /* ── THE MARKETING DRAWER ───────────────────────────────────────────────────
     Replaces "Leads by source", which the owner rejected: a source with a dollar
     amount beside it and no cost beside that is revenue wearing a marketing
     label. Two boards, both behind the Effort Room's preview-shelf pattern —
     the .room / .shelf-* / .ptile / .pt-* classes above are reused wholesale so
     the two rooms are the same object, not two things that look alike.

     BOARD 1 · the source row. Seven columns, mono figures, right-aligned money.
     Scrolls inside its own box on a narrow screen rather than squeezing the
     figures — a marketing number that has to be guessed at is not a number. */
  .mk-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px; }
  /* The spend column is wider than the rest on purpose: it holds a text input
     whose placeholder is the word "not entered", and a placeholder clipped to
     "not enter" is exactly the kind of half-read absence this board exists to
     avoid. */
  /* Ten columns since the consolidation: the cost-per-lead, cost-per-unit and
     month-over-month reads merged INTO this ledger (they used to be a second
     table on the deep board, printing the same leads and units twice). Wider
     min-width, same scroller — a marketing number that has to be guessed at
     is not a number. */
  .mk-row, .mk-head { display: grid; gap: 10px; align-items: baseline; min-width: 1000px;
    grid-template-columns: minmax(128px, 1.5fr) minmax(100px, 1.15fr) repeat(7, minmax(60px, 1fr)) minmax(84px, 1.1fr); }
  .mk-head { padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .mk-head div { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim); text-align: right; }
  .mk-head div:first-child { text-align: left; }
  /* DENSITY. Single-line rows at the mobile-preview pitch, so the whole
     ACTIVE ledger — the only rows this list now shows at a glance — fits one
     screen instead of running past the fold behind two separators and a tail
     of sources that neither cost nor earned anything this month. */
  .mk-row { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .mk-row:last-child { border-bottom: none; }
  /* `display: grid` outranks the [hidden] attribute's own display:none, so a
     folded row would lay itself out anyway. Both the folded rows and the
     earned row's collapsed input need this said explicitly. */
  .mk-row[hidden], .mk-spend[hidden], .mk-earn[hidden] { display: none; }
  /* The free sources sit below the paid ones behind a labelled rule: their
     volume is the point, their ROI does not exist. */
  .mk-row.free { opacity: 0.92; }
  .mk-sep { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); padding: 14px 0 6px; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 4px; }
  .mk-row .nm { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 500; min-width: 0; }
  .mk-row .nm .cat { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--text-dim); border: 1px solid var(--line); border-radius: 100px; padding: 1px 6px; }
  .mk-row .col { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; text-align: right; color: var(--text); }
  .mk-row .col.dim { color: var(--text-dim); }
  .mk-row .col.money { color: var(--green-soft); }
  /* "Not entered" and "—" are different claims and never share a colour with a
     figure: an absence must not read as a small number. */
  .mk-row .col.absent { color: var(--text-dim); font-size: 9px; letter-spacing: .04em; line-height: 1.35; }
  .mk-roi { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; text-align: right; letter-spacing: -0.01em; }
  .mk-roi.hit { color: var(--green-soft); } .mk-roi.miss { color: var(--red); }
  .mk-roi.near { color: var(--text); } .mk-roi.none { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); font-weight: 400; }
  /* Spend entry. A typed source is an input; Google is a plain figure with an
     automation badge, and the two must never look alike or the office will try
     to type into the one the database refuses. */
  .mk-spend { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .mk-spend input { width: 100%; max-width: 98px; min-width: 0; background: var(--bg-deep);
    border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; padding: 5px 7px;
    text-align: right; -moz-appearance: textfield; }
  .mk-spend input::placeholder { color: var(--text-dim); opacity: 1; }
  .mk-spend input::-webkit-outer-spin-button, .mk-spend input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .mk-spend input:focus { outline: none; border-color: var(--accent); }
  .mk-spend input.saving { border-color: var(--gold); }
  .mk-spend input.saved { border-color: var(--green); }
  .mk-spend input.failed { border-color: var(--red); }
  .mk-auto { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--blue); display: block; margin-top: 3px; }
  .mk-auto.stale { color: var(--gold); }
  /* THE EARNED BADGE. A source that has never carried a cost in the book is
     not a source somebody forgot to type — those are different claims and the
     board has always insisted on keeping them apart. "$0 · EARNED" in gold
     says the first; "not entered" is now reserved for the second, which is to
     say for PAID sources whose month has not been keyed. Tapping the badge
     opens the input, so a channel that starts costing money can still be
     priced from here the moment it does. */
  .mk-earn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 0;
    padding: 0; margin: 0; cursor: pointer; font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold);
    white-space: nowrap; }
  .mk-earn:hover { color: #e8ca6e; }
  .mk-roi.earned { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 400;
    color: var(--gold); letter-spacing: .04em; }
  /* THE FOLD. Everything that neither cost nor earned a dollar this month goes
     behind one row. It is a summary line, never a deletion — the count is
     stated, the sources are named the moment it is opened, and their lead
     volume travels with them. */
  .mk-fold { width: 100%; min-width: 1000px; display: flex; align-items: center; gap: 8px;
    padding: 9px 0 8px; background: none; border: 0;
    border-top: 1px solid rgba(255,255,255,0.08); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: .11em;
    text-transform: uppercase; color: var(--text-dim); text-align: left; margin-top: 4px; }
  .mk-fold:hover { color: var(--text); }
  .mk-fold .chev { display: inline-block; transition: transform .15s; font-size: 10px; }
  .mk-fold.open .chev { transform: rotate(90deg); color: var(--accent); }
  .mk-fold .why { margin-left: auto; text-transform: none; letter-spacing: .02em; opacity: .8; }
  .mk-monthbar { display: flex; align-items: center; gap: 10px; margin: 2px 0 14px; }
  .mk-monthbar .mn-cur { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent-soft); min-width: 108px; text-align: center; }

  /* BOARD 2 · the rep × source grid. Reps down, sources across. Wide by nature,
     so it scrolls horizontally — ONE rendering at every width. The phone used
     to transpose into one block per rep, which at a full roster was a
     four-screen vertical scroll; now the phone gets the same heat map,
     compressed: cells tighten (see the 700px block) and columns narrow to the
     sources active in the browsed month — the same ACTIVE law the source
     ledger folds on. Hidden columns are named under the grid, never lost. */
  .mkg-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 4px; }
  /* WIDTH: max-content, NOT min-width:100%. THAT WAS THE CLIPPING BUG.
     A table laid out `auto` inside a narrower box does not overflow — it
     SQUEEZES, because its min-content width (the longest single word in a
     header) sits far below its preferred width. So with thirteen source
     columns at 1050px the browser compressed every column to fit, wrapping
     "Referral- Self Generated" and "Previous Customer" into unreadable
     stacks, and the scroller .mkg-wrap already offered never appeared:
     nothing was ever wider than the box to scroll.
     `width: max-content` makes the table take its PREFERRED width, which
     overflows the wrapper and hands the horizontal scroll to .mkg-wrap where
     it always belonged. min-width:100% stays so a two-column month still
     fills the card rather than hugging the left edge. */
  .mkg { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  .mkg th, .mkg td { padding: 0; }
  .mkg thead th { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: .09em;
    text-transform: uppercase; color: var(--text-dim); font-weight: 400; text-align: center;
    padding: 0 4px 8px; vertical-align: bottom; width: 78px; min-width: 78px; line-height: 1.35; }
  .mkg tbody td { min-width: 78px; }
  /* The pinned name column. It needs a hard edge as well as a fill: scrolled
     under, a sticky cell carrying only a background reads as a rendering
     fault rather than as a column deliberately standing still. */
  .mkg thead th.rep-h { text-align: left; width: 118px; min-width: 118px; position: sticky; left: 0;
    background: var(--bg-card); z-index: 3; padding-left: 0; box-shadow: 1px 0 0 var(--line); }
  .mkg tbody th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--text);
    padding: 0 10px 0 0; position: sticky; left: 0; background: var(--bg-card); z-index: 2;
    white-space: nowrap; min-width: 118px; box-shadow: 1px 0 0 var(--line); }
  /* A seller who has left the roster still holds the book they closed, and
     every surface that names them says so — otherwise a departed rep's row
     reads as a live desk to route the next appointment to. */
  .mkg tbody th .gone, .rep-head .nm .gone, .m2-rp-nm .gone {
    font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--gold); margin-left: 6px; font-weight: 400; }
  .mkg tbody tr td { border-top: 1px solid var(--line); }
  .mkg tbody tr th { border-top: 1px solid var(--line); }
  .mkc { margin: 4px 3px; border-radius: 8px; padding: 7px 4px 6px; text-align: center;
    background: rgba(255,255,255,0.025); }
  .mkc .p { font-family: 'Fraunces', serif; font-size: 15.5px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
  .mkc .n { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); margin-top: 3px; }
  /* The RAN half of every cell. It is wired to nothing on purpose — see
     mkRanCell(). It renders in words, never as a figure or a dash that could be
     mistaken for zero. */
  .mkc .ran { font-family: 'JetBrains Mono', monospace; font-size: 7px; letter-spacing: .04em;
    color: var(--text-dim); margin-top: 5px; padding-top: 5px; border-top: 1px solid var(--line);
    line-height: 1.3; opacity: .85; }
  .mkc.strong { background: rgba(108,194,139,0.13); } .mkc.strong .p { color: var(--green-soft); }
  .mkc.weak { background: rgba(217,106,94,0.12); } .mkc.weak .p { color: var(--red); }
  .mkc.mid .p { color: var(--text); }
  /* Too few jobs behind it to be either. Grey, and it says the count rather
     than a percentage — a rate off four leads is not a rate. */
  .mkc.thin { background: rgba(255,255,255,0.02); }
  .mkc.thin .p { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); font-weight: 400; }
  .mkc.none { background: none; }
  .mkc.none .p { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.14); font-weight: 400; }
  .mk-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); align-items: center; }
  .mk-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  /* The fold under the eighth rep. Same disclosure grammar as .mk-fold on the
     source ledger: a counted row that opens on tap, folded never dropped. It
     lives in the sticky name column so it cannot scroll out of reach sideways. */
  .mkg-more { display: flex; align-items: center; gap: 7px; width: 100%; background: none; border: 0;
    padding: 10px 10px 10px 0; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); white-space: nowrap; }
  .mkg-more .chev { display: inline-block; transition: transform .15s; }
  .mkg-more.open .chev { transform: rotate(90deg); color: var(--accent); }
  @media (max-width: 700px) {
    .mk-row, .mk-head, .mk-fold { min-width: 860px; }
    .mk-monthbar .mn-cur { min-width: 88px; font-size: 10px; }
    /* The phone heat map: the SAME grid, tightened. Columns narrow to the
       month's active sources (.off-p hides the rest — counted in the note),
       cells drop to thumb width, and the per-cell ran line yields to the
       card's own withheld block, which states the same fact once in full. */
    .mkg .off-p { display: none; }
    .mkg thead th { width: 54px; min-width: 54px; font-size: 6.5px; padding: 0 2px 6px; }
    .mkg tbody td { min-width: 54px; }
    .mkg thead th.rep-h, .mkg tbody th { width: 92px; min-width: 92px; }
    .mkg tbody th { font-size: 11px; }
    .mkc { margin: 3px 2px; padding: 6px 2px 5px; border-radius: 6px; }
    .mkc .p { font-size: 13px; }
    .mkc .ran { display: none; }
  }
  .flag-row { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .flag-row:last-child { border-bottom: none; }
  .flag-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
  .flag-row .ft { font-size: 12px; line-height: 1.5; color: var(--text-dim); }
  .flag-row .ft b { color: var(--text); font-weight: 500; }
  .foot { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; line-height: 1.7; }

/* ═══════════════════ EXTENSIONS ═══════════════════════════════════════════
   Everything below is added to carry the model into live data, desktop, and
   the sections beyond his ten cards. Nothing above this line was changed.
   ═════════════════════════════════════════════════════════════════════════ */

  body { padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }

  /* window toggle — his mono pill idiom, thumb-sized */
  /* ── SNAPSHOT strip. Four windows, each one a door into itself. ── */
  .snapgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .hero1 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .bs-flex { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bigsnap .alloc-chart { width: 200px; height: 200px; margin: 12px auto 16px; }
  .bigsnap .alloc-center .big { font-size: 26px; }
  .bigsnap .alloc-center .lbl { font-size: 9px; }
  .bigsnap .alloc-legend { margin: 4px 0 10px; text-align: left; }
  .alloc-chart.mm { width: 112px; height: 112px; margin: 8px auto 10px; }
  .mm .alloc-center .big { font-size: 14px; }
  .mm .alloc-center .lbl { font-size: 7px; }
  .alloc-legend.mml { gap: 5px; text-align: left; margin: 0 0 8px; }
  .mml .alloc-row { font-size: 11px; gap: 7px; }
  .mml .alloc-row .val { font-size: 9px; }
  .bs-mix { width: 98px; height: 98px; flex-shrink: 0; position: relative; }
  .bs-legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); }
  .bs-legend b { color: var(--text); font-weight: 600; }
  .bs-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
  .herotrend { margin-top: 9px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 8px; background: var(--bg-card); text-align: left; }
  .ht-cap { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .ht-row { padding: 5px 0; }
  .ht-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; gap: 8px; }
  .ht-v { font-family: 'Fraunces', serif; font-size: 14px; }
  .ht-sub { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); margin-top: 2px; }
  .hero1 .snap.bigsnap { grid-column: 1 / -1; }
  @media (min-width: 700px) { .snapgrid { grid-template-columns: repeat(4, 1fr); } }
  .snap { text-align: left; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 13px; padding: 13px 13px 12px; cursor: pointer; min-height: 96px;
    color: var(--text); font-family: inherit; transition: border-color .15s, background .15s;
    display: flex; flex-direction: column; gap: 2px; }
  .snap:active { background: var(--bg-card-hi); transform: scale(.985); }
  .snap:hover { border-color: rgba(240,131,74,0.55); background: var(--bg-card-hi); }
  /* the affordance rides on the tile, pinned to its bottom edge so all four
     line up however tall the figures above them run */
  .snap-go { margin-top: auto; padding-top: 7px; text-align: right;
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 600; color: var(--accent); }
  .snap-go .go-chev { display: inline-block; font-size: 11px; line-height: 1;
    vertical-align: -1px; margin-left: 1px; transition: transform .15s; }
  .snap:hover .snap-go { color: var(--accent-soft); }
  .snap:hover .snap-go .go-chev { transform: translateX(2px); }
  .snap-k { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim); }
  .snap-v { font-family: 'Fraunces', serif; font-size: 27px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1.05; margin-top: 3px; }
  @media (min-width: 700px) { .snap-v { font-size: 30px; } }
  .snap-s { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); margin-top: 3px; }
  /* the rung line under the Signed hero: the bell layer said out loud, beside
     the actual, never blended into it */
  .snap-bell { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
    margin-top: 6px; line-height: 1.5; }
  .snap-bell b { color: var(--gold); font-weight: 600; }
  .snap-d { font-family: 'JetBrains Mono', monospace; font-size: 9px; margin-top: 5px; letter-spacing: 0.02em; }
  .snap-d.up { color: var(--green-soft); } .snap-d.down { color: #d8997f; } .snap-d.flat { color: var(--text-dim); }
  .snaphint { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim); text-align: center; margin-top: 12px; }

  /* actual money, on the hero. The four tiles above are SIGNED work — new
     sales. These three cells are what actually happened to money this month:
     jobs built, dollars invoiced, dollars still owed. On a phone this used to
     live six screens down; it belongs on screen one, next to the sales it
     pays for. Same honesty rules: badged sources, withheld is said out loud. */
  .moneystrip { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; margin-top: 9px; }
  .moneystrip .ms { display: flex; flex-direction: column; text-align: left; font: inherit; color: inherit;
    background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px 12px; cursor: pointer; }
  .moneystrip .ms-k { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); }
  .moneystrip .ms-v { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; margin-top: 4px; }
  @media (min-width: 700px) { .moneystrip .ms-v { font-size: 27px; } }
  .moneystrip .ms-v.gold { color: var(--gold); } .moneystrip .ms-v.orange { color: var(--accent-soft); }
  .moneystrip .ms-v.dim { color: var(--text-dim); font-size: 16px; }
  .moneystrip .ms-s { font-family: 'JetBrains Mono', monospace; font-size: 8px; color: var(--text-dim); margin-top: 4px; line-height: 1.4; }
  .moneystrip .ms-go { margin-top: auto; padding-top: 6px; text-align: right;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim); }
  .moneystrip .ms:hover .ms-go { color: var(--accent-soft); }

  /* the seam: what the one total is made of, shown under it rather than as a
     second number that appears to contradict it */
  .seam { display: flex; flex-direction: column; gap: 5px; margin-top: 12px;
    padding-top: 11px; border-top: 1px solid var(--line);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); line-height: 1.5; }
  .seam b { color: var(--text); font-weight: 600; }
  .seam .muted { color: var(--text-dim); opacity: .75; }

  /* ── appointments: the card he opens this for ── */
  .appt { border-color: rgba(240,131,74,0.22); }
  /* a calendar reset explaining itself, so an empty early week is never read as
     missing data */
  .weeknote { display: flex; flex-direction: column; gap: 4px; margin: 10px 0 2px;
    padding: 10px 12px; border-radius: 10px; background: rgba(107,168,201,0.06);
    border-left: 3px solid var(--blue); }
  .wn-k { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em;
    text-transform: uppercase; color: var(--blue); }
  .wn-t { font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }
  .wn-t b { color: var(--text); font-weight: 600; }

  /* ── the month time machine ── a pager on the MTD view, and a banner that
     makes "you are looking at July" impossible to miss — a shifted page that
     looks like the live page is the misread this exists to prevent */
  .mnav { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
  .mnav .mn-btn { font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;
    padding: 5px 12px; border-radius: 8px; border: 1px solid var(--line2);
    background: transparent; color: var(--text); cursor: pointer; }
  .mnav .mn-btn:disabled { opacity: .3; cursor: default; }
  .mnav .mn-cur { font-family: 'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .mnav .mn-cur.back { color: var(--gold); }
  .mnav .mn-now { font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px;
    border-radius: 8px; border: 1px solid rgba(212,177,90,0.45);
    background: rgba(212,177,90,0.08); color: var(--gold); cursor: pointer; }
  .mbanner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin: 0 0 14px; padding: 10px 14px; border-radius: 10px;
    background: rgba(212,177,90,0.08); border-left: 3px solid var(--gold);
    font-size: 12.5px; line-height: 1.55; color: var(--text-dim); }
  .mbanner b { color: var(--text); font-weight: 600; }
  .mbanner button { font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 4px 10px;
    border-radius: 8px; border: 1px solid rgba(212,177,90,0.45);
    background: transparent; color: var(--gold); cursor: pointer; margin-left: auto; }

  /* ── NOTICE → DO ── every signal states what is off and what to do about it */
  .acts.hasfire { border-color: rgba(217,106,94,0.35); }
  .acts.haswatch { border-color: rgba(212,177,90,0.3); }
  .acts.clear { border-color: rgba(108,194,139,0.28); }
  .sig { border-left: 3px solid var(--line2); padding: 10px 0 10px 12px; margin-top: 12px; }
  .sig.fire { border-left-color: var(--red); }
  .sig.watch { border-left-color: var(--gold); }
  .sig.note { border-left-color: var(--text-dim); }
  .sig-h { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .sig-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .sig-k { font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim); }
  .sig-n { font-size: 13.5px; line-height: 1.5; color: var(--text); }
  .sig-d { font-size: 13px; line-height: 1.55; color: var(--accent-soft); margin-top: 6px;
    display: flex; gap: 7px; align-items: baseline; }
  .sig-arrow { font-family: 'JetBrains Mono', monospace; font-size: 12px; flex-shrink: 0; opacity: .8; }
  .sig-sep { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); margin-top: 18px; padding-top: 12px;
    border-top: 1px solid var(--line); }
  .nofires { font-size: 13.5px; line-height: 1.6; color: var(--green-soft);
    border-left: 3px solid var(--green); padding: 10px 0 10px 12px; margin-top: 10px; }

  /* ── THE ASK BAR ─────────────────────────────────────────────────────────
     Lifted from the blessed mock: deep-green field, mono placeholder, orange
     focus glow, the pin-check glyph as the submit. */
  .askwrap { margin-bottom: 16px; }
  .askbar { display: flex; align-items: center; gap: 12px; background: #102419;
    border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 8px 8px 8px 18px;
    transition: border-color .15s, box-shadow .15s; }
  .askbar:focus-within { border-color: rgba(240,131,74,0.55);
    box-shadow: 0 0 0 3px rgba(240,131,74,0.10), 0 0 22px -4px rgba(240,131,74,0.32); }
  .askin { flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    letter-spacing: .04em; padding: 10px 0; min-height: 36px; }
  .askin::placeholder { color: #6f877b; }
  .askin:disabled { opacity: .6; }
  /* iOS Safari force-zooms the page when a focused input is under 16px, and this
     console deliberately leaves pinch-zoom on, so the viewport tag cannot be the
     cure. 16px on a phone costs a little of the mock's mono delicacy and saves
     Kevin a jarring zoom every time he taps the bar. */
  @media (max-width: 700px) { .askin { font-size: 16px; letter-spacing: .02em; } }
  .ask-send { width: 36px; height: 36px; border-radius: 10px; background: var(--accent);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0; }
  .ask-send:active { transform: scale(.94); }
  .ask-send:disabled { opacity: .55; cursor: default; }
  .ask-send svg { width: 17px; height: 17px; display: block; }
  .ask-spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(23,17,12,0.35);
    border-top-color: #17110c; animation: askspin .7s linear infinite; }
  @keyframes askspin { to { transform: rotate(360deg); } }
  .askhint { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--text-dim); margin-top: 8px; padding-left: 4px; }

  .ask-asked { display: flex; align-items: flex-start; gap: 10px; margin: 14px 0 10px; padding-left: 2px; }
  .ask-asked .badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--accent); flex-shrink: 0; padding-top: 3px; }
  .ask-asked .q { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; line-height: 1.6; color: var(--text-dim); }
  .ask-card { border-color: rgba(240,131,74,0.22); }
  .ask-card.ask-no { border-color: rgba(255,255,255,0.09); }
  .ask-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .ask-fresh { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .08em;
    color: var(--text-dim); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .ask-fresh .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); }
  .ask-fresh.stale .dot { background: var(--gold); }
  .ask-stale { font-size: 11.5px; line-height: 1.5; color: var(--gold); margin-bottom: 10px;
    padding: 8px 10px; background: rgba(212,177,90,0.06); border-left: 2px solid rgba(212,177,90,0.5); border-radius: 0 6px 6px 0; }
  .ask-head { font-family: 'Fraunces', serif; font-weight: 400; font-size: 25px; line-height: 1.22;
    letter-spacing: -.015em; color: var(--text); margin-bottom: 4px; }
  .ask-scope { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
    letter-spacing: .04em; margin-bottom: 14px; }
  .ask-working { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
    letter-spacing: .08em; text-transform: uppercase; padding: 6px 0; }
  .ask-nomsg { font-size: 14.5px; line-height: 1.6; color: var(--text); margin-bottom: 8px; }
  .ask-nosub { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); }
  .ask-nosub b { color: var(--accent-soft); font-weight: 600; }
  .arec-h { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-dim);
    padding-bottom: 8px; border-bottom: 1px solid var(--line); margin-top: 6px; }
  .arec { display: flex; align-items: center; gap: 12px; padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.035); font-size: 13px; }
  .arec:last-of-type { border-bottom: none; }
  .arec-k { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
    min-width: 84px; flex-shrink: 0; }
  .arec-bar { flex: 1; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; }
  .arec-bar i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }
  .arec-v { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; min-width: 34px; text-align: right; }
  .arec.wide { gap: 10px; }
  .arec.wide .arec-c { flex: 1; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text); }
  .arec-none { font-size: 13px; line-height: 1.6; color: var(--text-dim); padding: 10px 0; }
  .ask-caveat { font-size: 11.5px; line-height: 1.6; color: var(--text-dim); margin-top: 10px;
    padding: 9px 11px; background: rgba(255,255,255,0.02); border-left: 2px solid rgba(212,177,90,0.4); border-radius: 0 6px 6px 0; }
  .ask-sql { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.55;
    color: var(--text-dim); white-space: pre-wrap; word-break: break-word; margin-top: 10px;
    padding: 11px; background: rgba(0,0,0,0.22); border-radius: 8px; overflow-x: auto; }
  .ask-ai { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .08em;
    color: #6f877b; margin-top: 12px; }

  /* ── Gmail shape: a digest card, then one-line inbox rows ───────────────── */
  .digest { font-size: 14px; line-height: 1.55; color: var(--text); margin: 2px 0 14px;
    padding: 12px 13px; border-radius: 10px; background: rgba(255,255,255,0.035);
    border-left: 3px solid var(--accent); }
  .sigrow { border-bottom: 1px solid var(--line); cursor: pointer; }
  .sigrow:last-of-type { border-bottom: none; }
  .sr-line { display: flex; align-items: center; gap: 9px; padding: 11px 0; min-width: 0; }
  .sr-subj { flex: 1; min-width: 0; font-size: 13.5px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sr-chev { flex-shrink: 0; color: var(--text-dim); font-size: 13px; }
  .sigrow.open .sr-chev { transform: rotate(90deg); color: var(--accent); }
  .sigrow.fire .sr-subj { color: #e8968c; }
  .sr-open { display: none; padding: 0 0 13px 15px; border-left: 2px solid var(--line); margin-left: 2px; }
  .sigrow.open .sr-open { display: block; }
  .sr-open .sig-k { margin-bottom: 6px; }
  @media (hover: hover) { .sigrow:hover .sr-subj { color: #fff; } }

  /* ── recommendations: notice, do, and here is exactly how ────────────────── */
  .recs { margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
  .recs-h { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--green); font-weight: 700; margin-bottom: 8px; }
  .rec-line { display: flex; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.55;
    color: var(--text); margin-bottom: 7px; }
  .rec-bullet { color: var(--green); font-family: 'JetBrains Mono', monospace; font-size: 11px; flex-shrink: 0; }
  .draftbox { margin-top: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--line);
    border-radius: 10px; padding: 11px 12px; }
  .draft-t { font-size: 12.5px; line-height: 1.6; color: var(--text-dim); font-style: italic; }
  .copybtn { margin-top: 9px; background: rgba(108,194,139,0.1); border: 1px solid rgba(108,194,139,0.4);
    color: var(--green-soft); border-radius: 8px; padding: 6px 12px; cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; }
  .copybtn:hover { background: rgba(108,194,139,0.18); }
  .copybtn.ok { background: rgba(108,194,139,0.25); color: #fff; }

  /* ── the checklist: tick it off, and the rest behind one quiet row ───────── */
  .sigcheck { margin-left: auto; width: 27px; height: 27px; border-radius: 8px; flex-shrink: 0;
    border: 1px solid var(--line); background: rgba(255,255,255,0.03); color: var(--text-dim);
    font-size: 13px; line-height: 1; cursor: pointer; font-family: inherit;
    transition: border-color .12s, color .12s, background .12s; }
  .sigcheck:hover { border-color: var(--green); color: var(--green-soft); background: rgba(108,194,139,0.1); }
  .sigcheck:active { transform: scale(.9); }
  /* terse rows: one line, the rest one tap away */
  .clearedrow { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 11px;
    border-top: 1px solid var(--line); font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; letter-spacing: 0.06em; color: var(--text-dim); }
  .cl-tick { color: var(--green); font-size: 11px; }
  .undo { margin-left: auto; background: none; border: none; color: var(--accent); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em;
    text-transform: uppercase; padding: 0; text-decoration: underline; }

  /* ── drawers: what came off the surface but not out of the console ───────── */
  .chartbox { cursor: pointer; }
  .cb-row { display: flex; align-items: center; gap: 8px; padding-top: 12px;
    border-top: 1px solid var(--line); font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .cb-row .cb-sum { margin-left: auto; color: var(--text); font-weight: 600; letter-spacing: 0.04em; }
  .cb-body { display: none; }
  .chartbox.open .cb-body { display: block; }
  .chartbox.open > .cb-row .acc-chev { transform: rotate(90deg); color: var(--accent); }
  @media (hover: hover) { .chartbox:hover .cb-row { color: var(--text); } }

  /* the money shot — biggest number on the page */
  .hero-booked { background: var(--bg-card-hi); border: 1px solid var(--line);
    border-left: 3px solid var(--text-dim); border-radius: 12px; padding: 15px 16px; margin: 12px 0 0; }
  .hero-booked .k { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim); }
  .hero-booked .v { font-family: 'Fraunces', serif; font-size: 60px; font-weight: 500;
    letter-spacing: -0.03em; line-height: 1; margin: 6px 0 4px; }
  @media (min-width: 700px) { .hero-booked .v { font-size: 72px; } }
  .hero-booked .s { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); }
  .hero-booked.good { border-left-color: var(--green); } .hero-booked.good .v { color: var(--green-soft); }
  .hero-booked.warn { border-left-color: var(--gold); }  .hero-booked.warn .v { color: var(--gold); }
  .hero-booked.bad  { border-left-color: var(--red); }   .hero-booked.bad .v  { color: #e8968c; }
  .hero-booked.flat .v { color: var(--text); }
  .bookedbrands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .bb { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03);
    border: 1px solid var(--line); border-radius: 100px; padding: 5px 11px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); }
  .bb b { color: var(--text); font-weight: 600; }
  .bbdot { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }

  /* the two-tile head: SET vs HAPPENING, in plain words so the two "today"
     numbers can never be read as one contradictory figure again */
  .appt-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 2px 0 10px; max-width: 600px; }
  .appt-tile { background: var(--bg-card-hi); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .at-eye { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.13em; text-transform: uppercase; font-weight: 700; }
  .at-eye.set { color: var(--green); } .at-eye.hap { color: var(--blue); }
  .at-desc { font-size: 11px; color: var(--text-dim); margin-top: 4px; line-height: 1.3; }
  .at-desc b { color: var(--text); font-weight: 600; }
  .at-v { font-family: 'Fraunces', serif; font-size: 38px; font-weight: 500; line-height: 1; margin-top: 10px; letter-spacing: -0.02em; }
  .at-s { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim); margin-top: 8px; }
  .at-s b.up, .apptmini .up { color: var(--green-soft); } .at-s b.dn, .apptmini .dn { color: #d8997f; }
  /* a labelled header over each chart, its square keyed to the bar colour */
  .chart-head { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.03em; color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 7px; margin-bottom: 7px; }
  .chart-head b { font-weight: 700; }
  .chart-head .ch-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
  .chart-head .ch-note { margin-left: auto; font-weight: 400; font-size: 9px; color: var(--text-dim); letter-spacing: 0.02em; }
  .apptmini { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
  .apptmini b { color: var(--text); font-weight: 600; }

  .apptrow { display: grid; grid-template-columns: 1fr 1.35fr; gap: 10px; margin: 12px 0 4px; }
  .apptbig { background: var(--bg-card-hi); border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; }
  .apptbig .k { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); line-height: 1.4; }
  .apptbig .v { font-family: 'Fraunces', serif; font-size: 34px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1; margin-top: 5px; }
  .apptbig .s { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim); margin-top: 5px; }
  .apptbig.ahead.good { border-color: rgba(108,194,139,0.45); } .apptbig.ahead.good .v { color: var(--green-soft); }
  .apptbig.ahead.warn { border-color: rgba(212,177,90,0.45); }  .apptbig.ahead.warn .v { color: var(--gold); }
  .apptbig.ahead.bad  { border-color: rgba(217,106,94,0.5); }   .apptbig.ahead.bad .v  { color: var(--red); }
  .apptbig.ahead.flat .v { color: var(--text); }
  .verdict { font-size: 13.5px; line-height: 1.55; margin-top: 12px; padding: 11px 13px;
    border-radius: 10px; border-left: 3px solid var(--text-dim); background: rgba(255,255,255,0.02); }
  .verdict.good { border-left-color: var(--green); color: var(--green-soft); }
  .verdict.warn { border-left-color: var(--gold); color: var(--gold); }
  .verdict.bad  { border-left-color: var(--red); color: #e8968c; }
  .verdict.flat { color: var(--text-dim); }

  /* inline seam marker on a brand row whose figure includes Billdu money */
  .tick { font-family: 'JetBrains Mono', monospace; font-size: 7.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent-soft); border: 1px solid rgba(240,131,74,0.4);
    border-radius: 100px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
  /* bell tick: rung dollars riding NEXT TO a brand's signed figure, never in it */
  .tick.bell { color: var(--gold); border-color: rgba(212,177,90,0.45); text-transform: none; }

  /* ── per-window deep dive ── */
  .backbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .backbtn { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px;
    color: var(--accent-soft); font-family: 'JetBrains Mono', monospace; font-size: 10px;
    letter-spacing: 0.14em; text-transform: uppercase; padding: 12px 15px; min-height: 44px; cursor: pointer; }
  .backbtn:active { background: var(--bg-card-hi); }
  .dive-h { font-family: 'Fraunces', serif; font-weight: 400; font-size: 26px;
    letter-spacing: -0.02em; line-height: 1.05; }
  .dive-h em { font-style: italic; color: var(--accent-soft); font-weight: 300; }
  .dive-hero { display: flex; align-items: flex-end; justify-content: space-between;
    gap: 14px; margin-bottom: 4px; }
  .dive-hero .big { font-family: 'Fraunces', serif; font-size: 40px; font-weight: 500;
    letter-spacing: -0.02em; line-height: 1; }
  .dive-hero .side { font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-dim); text-align: right; line-height: 1.6; }
  .dive-hero .side b { color: var(--green-soft); font-weight: 600; }

  /* scoreboard window toggle — scoped to the effort card, not the whole page */
  .seg { display: flex; gap: 4px; background: rgba(0,0,0,0.22); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px; margin: 2px 0 14px; }
  .seg button { flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 600; color: var(--text-dim); background: none; border: none;
    border-radius: 8px; padding: 11px 4px; min-height: 44px; cursor: pointer; transition: background .15s, color .15s; }
  .seg button.on { background: var(--accent); color: #17110c; }
  .seg button:active { transform: scale(.97); }

  /* rank chip on a scoreboard row */
  .rk { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
    margin-right: 7px; font-weight: 600; }
  .rk.top { color: var(--accent); }
  /* trade heading inside the lead card */
  .tradehead { display: flex; align-items: center; gap: 8px; font-family: 'Fraunces', serif;
    font-size: 16px; font-weight: 500; margin: 2px 0 12px; flex-wrap: wrap; }
  .tdot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .tmeta { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-left: auto; }

  .lead-id { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; }
  .lead-id .unnamed { font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-dim); margin-left: 6px; }

  /* SEED badge — a typed number must never wear the same badge as a measured one */
  .feed-tag.seed { color: var(--violet); border-color: rgba(169,143,213,0.35); }
  /* Billdu is a third feed alongside CC and QB and gets its own colour, so a
     Billdu figure can never be mistaken for a Contractors Cloud one. */
  .feed-tag.billdu { color: var(--accent-soft); border-color: rgba(240,131,74,0.45);
    background: rgba(240,131,74,0.08); }
  .feed-tag.none { color: var(--text-dim); border-color: rgba(255,255,255,0.12); }
  .feed-tag.bell { color: var(--gold); border-color: rgba(212,177,90,0.45); }
