   The consequence, stated plainly because it is the whole point: from here on
   "not entered" appears ONLY against a source the book has proven costs money
   and whose month nobody has keyed. That is a list worth chasing. */
function mkEverPaid(src){
  if (!MKT || !Array.isArray(MKT.spend)) return false;
  const key = src === 'Google' ? 'Google Ads' : src;
  return MKT.spend.some(s => s.source_name === key && Number(s.amount) > 0
    && !String(s.note || '').includes('⚑3'));
}

/* The same read, brand-aware: how one source's month sits in the book. null
   means no row; otherwise { total, split, byBrand } where split says the month
   was typed per brand ('all' and brand rows cannot coexist — 167's trigger). */
function mkSpendSplit(src, monthKey){
  if (!MKT || !Array.isArray(MKT.spend)) return null;
  const rows = MKT.spend.filter(s => s.source_name === src && String(s.month).slice(0, 10) === monthKey);
  if (!rows.length) return null;
  const byBrand = Object.create(null);
  let split = false;
  for (const r of rows) {
    if (r.brand && r.brand !== 'all') { split = true; byBrand[r.brand] = (byBrand[r.brand] || 0) + Number(r.amount); }
  }
  return { total: rows.reduce((n, r) => n + Number(r.amount), 0), split, byBrand };
}

/* The whole typed book for one month, folded per brand: what each company's
   typed spend adds to, plus the dollars that were typed as unsplit totals and
   therefore belong to no brand. GOOGLE IS HERE since the ruling (170/171) —
   its card statements are keyed by brand like every other vendor. ⚑3 rows are
   here too: these are the LEDGER's own totals, not a per-source pricing read,
   and the approved board's brand columns ($34,555 / $19,819 / $14,861) carry
   the unattributable tooling in exactly the same way.
   SUPERSEDED BY MIGRATION 175 (17 Aug 2026): six tooling vendors left the book
   as fixed opex, so July's live columns now read $34,048 / $19,819 / $14,805
   against a $68,672 total. The $34,555 figures above are the APPROVED BOARD's,
   a dated artifact — they are cited here, not asserted as the current read.
   See docs/marketing-spend-ledger.md. */
function mkBrandSpend(monthKey){
  if (!MKT || !Array.isArray(MKT.spend)) return null;
  const byBrand = Object.create(null);
  let unsplit = 0, any = false;
  for (const r of MKT.spend) {
    if (String(r.month).slice(0, 10) !== monthKey) continue;
    any = true;
    if (r.brand && r.brand !== 'all') byBrand[r.brand] = (byBrand[r.brand] || 0) + Number(r.amount);
    else unsplit += Number(r.amount);
  }
  return any ? { byBrand, unsplit } : null;
}

/* ═══ THE RULING (KD, 16 Aug 2026 · migration 170) ═══════════════════════════
   GOOGLE'S PRICE IS THE CARD. Google Ads spend truth is the credit-card
   statements — Chase Ink 1552/1571 + Amex Gold, keyed monthly by brand into
   marketing_spend as 'Google Ads' rows (171). Windsor's google_ads_daily
   UNDERCOUNTS (July 2026: Windsor $25,175 vs card $47,994) and is demoted to
   a freshness / pacing signal only — it must never feed an ROI, cost-per-lead,
   cost-per-unit or $-per-$1 computation again, anywhere on this console.
   Per flag ✓2 the ROI line prices Google ALL-IN: card ad spend plus Liam /
   Gate Digital management ($1,000 × 3 brands) — the approved board's own
   arithmetic ($47,994 + $3,000 = $50,994 → $11.54 back per $1). In the
   LEDGER the two stay separate rows; only the pricing folds them. */
function mkGoogleCard(monthKey){
  const ads = mkSpendSplit('Google Ads', monthKey);
  if (!ads) return null;   // no card row keyed — "not entered", never zero
  const mgmt = mkSpendSplit('Liam / Gate Digital', monthKey);
  const byBrand = Object.create(null);
  for (const part of [ads, mgmt]) if (part)
    for (const [b, v] of Object.entries(part.byBrand)) byBrand[b] = (byBrand[b] || 0) + v;
  return { ads: ads.total, mgmt: mgmt ? mgmt.total : 0,
           total: ads.total + (mgmt ? mgmt.total : 0), byBrand };
}

/* Windsor, demoted: the pacing chip's only feed. Three states still, because
   a feed that has stopped delivering is NOT the same fact as a month nobody
   entered: collapsing them would hide a dead integration behind a data-entry
   prompt, which is exactly how the "3-week export lag" survived for weeks
   while the real cause was our own sync dropping a column. Verified against
   live 16 Aug: 584 rows spanning 22 May → 20 Jul 2026, last synced 21 Jul. */
function mkWindsorPacing(monthKey){
  const ads = MKT && MKT.ads;
  if (!Array.isArray(ads) || !ads.length) return { state:'nofeed' };
  const pre = monthKey.slice(0, 7);
  const inM = ads.filter(a => String(a.date).slice(0, 7) === pre);
  const last = ads.reduce((m, a) => String(a.date) > m ? String(a.date) : m, '');
  if (!inM.length) return { state:'stale', last };
  return { state:'live', amount: inM.reduce((n, a) => n + Number(a.spend || 0), 0), last };
}

/* ── THE PACING CHIP · WHERE THE FORK IS SHOWN, NOT SETTLED QUIETLY ──────────
   GOOGLE SPEND LAW, stated once so it can be checked: the ONLY spend feeding
   any ROI, CPL, CPU or $-per-$1 anywhere on this console is a typed
   marketing_spend row — the card. google_ads_daily (Windsor) feeds this chip
   and nothing else. Audited at this build: mkSpendOf, mkSpendSplit,
   mkBrandSpend, mkGoogleCard and mkBookTotal — every spend read on either
   board — take their rows from MKT.spend, and MKT.ads is referenced by
   mkWindsorPacing alone, which is called by this chip and by the footer's
   freshness line. There is no third path.
   WHEN THE TWO DISAGREE, BOTH FIGURES GO ON THE CHIP. Typed wins — that is
   the ruling and it is not re-litigated month by month — but a disagreement
   is a fact about a feed, and hiding the loser turns a broken integration
   into an invisible one. July is the case that made the law: Windsor $25,175
   against $47,994 on the card, a little over half, and it read as
   authoritative for weeks. A 5% band keeps rounding and the odd late-posting
   day from crying wolf; anything wider is named as the lag it is. */
const MK_PACE_TOL = 0.05;
function mkPaceChip(pace, card){
  if (pace.state === 'nofeed') return `<span class="m2-tag none"
    title="google_ads_daily has never delivered a row. Nothing on this board was priced from it either way.">windsor never delivered</span>`;
  if (pace.state === 'stale') return `<span class="m2-tag none"
    title="google_ads_daily (Windsor) delivered nothing in this month — pacing signal only, never in ROI math.">windsor silent · last ${esc(pace.last)}</span>`;
  const mtd = MKTOFF === 0 ? ' MTD' : '';
  /* No card row to disagree with: the chip is a bare pacing reading, and the
     board still says "not entered" for the price — a Windsor figure is not
     promoted to a cost just because it is the only number in the room. */
  if (!card || !(card.ads > 0)) return `<span class="m2-tag"
    title="google_ads_daily (Windsor) — freshness / pacing signal only since the ruling (170). Never in ROI math, and it does not stand in for a card month nobody has keyed.">windsor pacing ${short(pace.amount)}${mtd}</span>`;
  const gap = (card.ads - pace.amount) / card.ads;
  if (Math.abs(gap) <= MK_PACE_TOL) return `<span class="m2-tag"
    title="Windsor ${money(pace.amount)} against ${money(card.ads)} on the card — inside the ${Math.round(MK_PACE_TOL * 100)}% band, so the feed is pacing true this month. The card still prices the board; this is agreement, not authority.">windsor ${short(pace.amount)}${mtd} · tracks card</span>`;
  const lags = gap > 0;
  return `<span class="m2-tag ${lags ? 'manual' : 'none'}"
    title="Windsor ${money(pace.amount)} against ${money(card.ads)} keyed from the card statements for ${esc(mkMonthLabel(MKTOFF))} — ${Math.abs(Math.round(gap * 100))}% ${lags ? 'under' : 'over'}. TYPED WINS: every ROI, CPL, CPU and $-per-$1 on this board is priced from the card (the ruling, 170/171). Both figures are shown because a feed that disagrees with the statement is a fact about the feed.">windsor ${short(pace.amount)}${mtd} · card ${short(card.ads)} · ${lags ? 'windsor lags cards' : 'windsor over cards'}</span>`;
}

/* The whole book for one month — every typed row: brand rows, unsplit totals,
   ⚑3 vendors, referral bonuses, the card's Google. This is the headline's
   denominator: the approved board's $69,235 is the full ledger, not just the
   sources the revenue RPC can name. null means an empty month, never zero. */
function mkBookTotal(monthKey){
  if (!MKT || !Array.isArray(MKT.spend)) return null;
  const rows = MKT.spend.filter(s => String(s.month).slice(0, 10) === monthKey);
  return rows.length ? rows.reduce((n, r) => n + Number(r.amount), 0) : null;
}

/* project → rolled-up source, off the slim projection built in buildData. */
function mkSrcByProject(){
  const rollup = D.mktRollup || {}, out = Object.create(null);
  for (const j of (D.mktJobs || [])) { const s = rollup[j.l]; if (s) out[j.p] = s; }
  return out;
}

/* Appointments SET (booked) per source in the month — the setters' output off
   each channel. Booked, not run: the console keeps those two facts apart
   everywhere, and outcomes are not logged anyway (see mkRanCell). */
function mkApptsBySource(monthKey){
  const src = mkSrcByProject(), pre = monthKey.slice(0, 7), out = Object.create(null);
  for (const a of (D.mktAppts || [])) {
    if (mkET(a.c).slice(0, 7) !== pre) continue;
    const s = src[a.p]; if (!s) continue;
    out[s] = (out[s] || 0) + 1;
  }
  return out;
}

/* ── THE SOURCE LEDGER — the board's one per-source surface ─────────────────
   Since the consolidation this table is the ONLY place a per-source number
   renders: spend, leads, appointments set, closed jobs, closed dollars, ROI
   against the ten-times line, cost per lead, cost per unit and the
   month-over-month move all live on one row per source, computed from one
   enrichment (mkSourceRows). The thermometer card, the standalone CPL/CPU
   table and the signed-by-source chart that used to redraw parts of this are
   gone — they were retellings, and two tellings of one number is how a board
   learns to disagree with itself. */
function cardSourceRow(){
  const monthKey = mkISO(mkMonthStart(MKTOFF));

  if (!MKT || (!MKT.roi && !MKT.roiErr)) return `<div class="card full">
    <div class="card-title">Return by source<span class="feed-tag cc">live · cc</span></div>
    <div class="card-sub" style="margin:0">Reading…</div></div>`;

  if (MKT.roiErr) return `<div class="card full">
    <div class="card-title">Return by source<span class="feed-tag none">no feed</span></div>
    <div class="withheld"><div class="wt">Withheld</div><div class="wx">
      <b>rpt_report_marketing_roi</b> did not answer (${esc(String(MKT.roiErr))}). That RPC is migration 160 as
      corrected by 165; if it is missing here the board says so rather than
      drawing the half of the picture it can still reach.</div></div></div>`;

  const spendBook = Array.isArray(MKT.spend);
  /* ── ACTIVE AT A GLANCE, THE REST BEHIND ONE ROW ────────────────────────
     The RPC returns every source that carried a lead in the month — 25 of
     them in July — and this list rendered all 25 under two separators.
     Sixteen of those rows said nothing: no cost, no revenue, only a
     backfill-dated lead count the board already refuses to print. The
     month's actual spend decisions were spread across three screens with
     Porch and Premier Magazine sitting between them.
     ACTIVE = a cost in the book this month OR a signed dollar this month.
     That is exactly the set a spend decision can be made about, and it is
     what the list shows first. Everything else folds into one counted row
     that opens on tap — folded, never dropped: the count is on the face of
     it, the sources are named the moment it opens, and their lead volume
     comes with them. Nothing on this board disappears to make it shorter. */
  const all = mkSourceRows(monthKey);
  const backfilled = all.some(r => r.backfilled);
  const isActive = r => r.spend != null || r.dollars > 0;
  const live = all.filter(isActive);
  const idle = all.filter(r => !isActive(r)).sort((a, b) => Number(b.leads || 0) - Number(a.leads || 0));
  /* Within the visible list: priced sources first, biggest return first —
     they are the ones a dollar decision hangs on. Earned money below them,
     biggest first. */
  const paid = live.filter(r => r.spend != null).sort((a, b) => (b.roi || 0) - (a.roi || 0));
  const rest = live.filter(r => r.spend == null).sort((a, b) => b.dollars - a.dollars);
  const idleLeads = idle.reduce((n, r) => n + Number(r.leads || 0), 0);

  /* ── COST PER LEAD, COST PER UNIT, AND THE MoM MOVE — merged in ──────────
     These three columns came off the deep board's own table, which printed the
     same leads and units this ledger already carries — the duplicate the
     consolidation exists to kill. PRICING follows the approved board: Google
     is the card all-in, and Referral is priced at its bonus row ('Referral
     bonuses', ~) — the one earned source that carries a real dollar. The MoM
     column compares each source's cost-per-unit against last month, priced
     the same way on both ends — spend from the book, units from the month
     walk (MKTWALK). An arrow needs both ends: a month with no typed spend or
     no answered window reads an em-dash, never a guess. */
  const bonus = mkSpendOf('Referral bonuses', monthKey);
  const priceOf = r => r.src === 'Referral' ? (bonus > 0 ? bonus : null) : r.spend;
  const prevKey = mkISO(mkMonthStart(MKTOFF + 1));
  const prevWin = (MKTWALK && !MKTWALK.err) ? MKTWALK.series.find(m => !m.err && m.key === prevKey.slice(0, 7)) : null;
  /* An arrow needs BOTH ends, and there are two different ways to be missing
     one: the window can fail to answer, or it can answer perfectly against a
     month nobody ever typed a spend book for. The note below says which. */
  const prevBookTyped = !!mkBrandSpend(prevKey);
  const prevCpuOf = src => {
    if (!prevWin) return null;
    const sp = src === 'Google' ? (mkGoogleCard(prevKey) || {}).total
      : src === 'Referral' ? mkSpendOf('Referral bonuses', prevKey)
      : MK_FREE.has(src) ? null : mkSpendOf(src, prevKey);
    const units = ((prevWin.bySrc || {})[src] || {}).jobs || 0;
    return (sp > 0 && units) ? sp / units : null;
  };
  const momCell = (src, cpu) => {
    if (cpu == null) return '<div class="col absent">—</div>';
    const prev = prevCpuOf(src);
    if (prev == null) return `<div class="col absent" title="no priced ${esc(mkMonthLabel(MKTOFF + 1))} to compare against — an arrow needs both ends">—</div>`;
    const d = 100 * (cpu - prev) / prev;
    if (Math.abs(d) < 1) return '<div class="col">≈ flat</div>';
    return d < 0 ? `<div class="col" style="color:var(--green-soft)">▼ ${Math.abs(d).toFixed(0)}% cheaper</div>`
                 : `<div class="col" style="color:var(--red)">▲ ${d.toFixed(0)}% pricier</div>`;
  };

  const spendCell = r => {
    if (r.earned) return `<div class="col"><button type="button" class="mk-earn" onclick="mkTypeCost(this)"
      title="No cost has ever been keyed for ${esc(r.src)} in any month, so this is a channel that earns rather than a month somebody forgot — &quot;not entered&quot; is reserved for sources the book has proven cost money. Tap to type a cost anyway if that has changed."
      aria-label="Earned — no cost ever entered for ${esc(r.src)}. Tap to enter one.">$0 · earned</button>
      <div class="mk-spend" hidden><input type="number" min="0" step="1" inputmode="decimal" value=""
        placeholder="cost" aria-label="Spend for ${esc(r.src)}, ${esc(mkMonthLabel(MKTOFF))}"
        onchange="saveSpend(${JSON.stringify(r.src).replace(/"/g, '&quot;')}, '${monthKey}', this)"></div></div>`;
    if (r.isG) {
      if (r.g) return `<div class="col money" title="${esc(BRAND_ORDER.map(b => r.g.byBrand[b] != null ? `${BRANDS[b].s} ${money(r.g.byBrand[b])}` : null).filter(Boolean).join(' · '))} — card statements keyed by brand (170/171)${r.g.mgmt ? `, incl. ${money(r.g.mgmt)} Liam / Gate Digital mgmt per flag ✓2` : ''}">${money(r.spend)}<span class="mk-auto">card · by brand</span></div>`;
      if (!spendBook) return `<div class="col absent">not entered<span class="mk-auto stale">spend book not applied</span></div>`;
      return `<div class="col absent">not entered<span class="mk-auto stale">card month not keyed</span></div>`;
    }
    if (!spendBook) return `<div class="col absent">not entered<span class="mk-auto stale">spend book not applied</span></div>`;
    /* A month typed per brand (167) shows its sum read-only: the database
       refuses a total over brand rows, so an input here would only error.
       The per-brand figures themselves read on the deep board. */
    const sp = mkSpendSplit(r.src, monthKey);
    if (sp && sp.split) return `<div class="col money" title="${esc(BRAND_ORDER.map(b => sp.byBrand[b] != null ? `${BRANDS[b].s} ${money(sp.byBrand[b])}` : null).filter(Boolean).join(' · '))} — edit the brand rows, not a total">${money(sp.total)}<span class="mk-auto">split · by brand</span></div>`;
    const v = sp ? sp.total : null;
    return `<div class="col"><div class="mk-spend">
      <input type="number" min="0" step="1" inputmode="decimal" value="${v == null ? '' : v}"
        placeholder="not entered" aria-label="Spend for ${esc(r.src)}, ${esc(mkMonthLabel(MKTOFF))}"
        onchange="saveSpend(${JSON.stringify(r.src).replace(/"/g, '&quot;')}, '${monthKey}', this)"></div></div>`;
  };

  /* Contaminated months show the refusal, not the figure — see MK_LEADS_FROM. */
  const leadsBlind = monthKey.slice(0, 7) < MK_LEADS_FROM;
  const leadsCell = r => leadsBlind
    ? `<div class="col absent" title="rpt_report_marketing_roi windows leads on jobs.created_at, which is our row-insert time. The warehouse was backfilled in one shot on 20 Jul 2026, so this month's count is the backfill, not the month.">backfill-dated</div>`
    : `<div class="col">${Number(r.leads || 0).toLocaleString()}</div>`;

  /* The ROI cell states WHICH kind of no-answer this is, and they are three
     different facts: `earned` (nothing was ever spent, so there is no ratio
     to want), `no spend` (a typed zero — dividing by it is refused, never
     printed as infinity), `not entered` (a source the book proves costs
     money whose month nobody has keyed — the only one that is a chase). */
  const roiCell = r => r.roi != null
    ? `<div class="mk-roi ${mkRoiClass(r.roi)}">${Math.round(r.roi)}x</div>`
    : r.earned ? `<div class="mk-roi earned" title="no cost has ever been keyed for this source — there is no ratio to compute, and that is the finding, not a gap">earned</div>`
    : r.spend === 0 ? `<div class="mk-roi none">no spend</div>`
    : `<div class="mk-roi none">not entered</div>`;

  /* The CPL/CPU absent word states WHICH absence: free (a ruling), no spend
     (a typed zero, division refused), not entered (a chase). Referral is the
     exception — priced at its bonus row for these two columns only, the
     approved board's own arithmetic, and the ROI column still reads earned. */
  const cplCell = r => {
    if (leadsBlind) return `<div class="col absent" title="backfill-dated — see below">backfill</div>`;
    const sp = priceOf(r);
    const cpl = (sp && sp > 0 && Number(r.leads || 0)) ? sp / Number(r.leads) : null;
    return cpl != null ? `<div class="col${cpl < 100 ? ' money' : ''}">${money(cpl)}</div>`
      : `<div class="col absent">${r.free && r.src !== 'Referral' ? 'free' : sp === 0 ? 'no spend' : sp == null ? (r.earned ? 'free' : 'not entered') : '—'}</div>`;
  };
  const cpuOf = r => { const sp = priceOf(r);
    return (sp && sp > 0 && r.jobs) ? sp / r.jobs : null; };
  const cpuCell = r => {
    const cpu = cpuOf(r);
    if (cpu != null) return `<div class="col" style="color:${cpu > 1000 ? 'var(--red)' : cpu < 100 ? 'var(--green-soft)' : 'var(--text)'}"${r.src === 'Referral' ? ` title="priced at the typed 'Referral bonuses' row (~${bonus ? money(bonus) : ''}) — the one earned source carrying a real dollar"` : ''}>${money(cpu)}</div>`;
    return `<div class="col absent">${r.free && r.src !== 'Referral' ? 'free' : priceOf(r) === 0 ? 'no spend' : r.earned ? 'free' : 'not entered'}</div>`;
  };

  const line = r => `<div class="mk-row${r.earned ? ' free' : ''}"${r.idle ? ' data-idle="1" hidden' : ''}>
    <div class="nm">${esc(r.src)}${r.category && r.category !== '—' ? `<span class="cat">${esc(r.category)}</span>` : ''}</div>
    ${spendCell(r)}
    ${leadsCell(r)}
    <div class="col${r.appts ? '' : ' dim'}">${r.appts ? r.appts.toLocaleString() : '0'}</div>
    <div class="col${r.jobs ? '' : ' dim'}">${r.jobs ? Number(r.jobs).toLocaleString() : '0'}</div>
    <div class="col money">${r.dollars ? short(r.dollars) : '<span class="dim">—</span>'}</div>
    ${roiCell(r)}
    ${cplCell(r)}
    ${cpuCell(r)}
    ${momCell(r.src, cpuOf(r))}
  </div>`;

  const head = `<div class="mk-head">
    <div>Source</div><div>Spend</div><div>Leads</div><div>Appts set</div>
    <div>Closed</div><div>Closed $</div><div>ROI</div><div>CPL</div><div>$ / unit</div><div>MoM $/unit</div></div>`;

  /* The blended footer — totals a reader can cross-foot the headline against.
     ⚑3 vendor rows price no source, so the blended $/unit divides only the
     spend that CAN be attributed (per-source book + referral bonuses); the
     whole-book figure is the headline's job. */
  const totUnits = live.reduce((n, r) => n + r.jobs, 0);
  const totDollars = live.reduce((n, r) => n + r.dollars, 0);
  const blendSpend = live.reduce((n, r) => n + (priceOf(r) || 0), 0);
  const blended = `<div class="mk-row" style="border-top:1px solid rgba(255,255,255,0.18);font-weight:600">
    <div class="nm">BLENDED</div>
    <div class="col">${blendSpend > 0 ? money(blendSpend) : '<span class="dim">no priced spend</span>'}</div>
    <div class="col">${leadsBlind ? '—' : all.reduce((n, r) => n + Number(r.leads || 0), 0).toLocaleString()}</div>
    <div class="col dim">—</div>
    <div class="col">${totUnits.toLocaleString()}</div>
    <div class="col money">${totDollars ? short(totDollars) : '—'}</div>
    <div class="col dim">—</div>
    <div class="col dim">${leadsBlind ? 'backfill' : '—'}</div>
    <div class="col">${blendSpend > 0 && totUnits ? money(blendSpend / totUnits) : '—'}</div>
    <div class="col dim">—</div>
  </div>`;

  /* The paid-vs-earned split the approved board draws. Paid = sources carrying
     real ad spend (never the referral bonus, which is a thank-you, not a buy).
     Earned = everything that signed money without an ad dollar. */
  const paidRows = live.filter(r => r.spend > 0);
  const earnedRows = live.filter(r => !(r.spend > 0) && r.dollars > 0);
  const paidSpend = paidRows.reduce((n, r) => n + r.spend, 0);
  const paidUnits = paidRows.reduce((n, r) => n + r.jobs, 0);
  const paidLeads = leadsBlind ? null : paidRows.reduce((n, r) => n + Number(r.leads || 0), 0);
  const earnUnits = earnedRows.reduce((n, r) => n + r.jobs, 0);
  const earnLeads = leadsBlind ? null : earnedRows.reduce((n, r) => n + Number(r.leads || 0), 0);
  const split = `<div class="m2-cpu-split">
      <div class="m2-cs"><div class="k">Paid only</div>
        <div class="v">${paidSpend > 0 && paidUnits ? money(paidSpend / paidUnits) : '—'}</div>
        <div class="u2">per unit${paidSpend > 0 && paidLeads ? ` · ${money(paidSpend / paidLeads)}/lead` : ''}<br/>${paidLeads != null ? paidLeads.toLocaleString() + ' leads · ' : ''}${paidUnits.toLocaleString()} units on ${money(paidSpend)}</div></div>
      <div class="m2-cs earn"><div class="k">Earned</div>
        <div class="v">${earnUnits.toLocaleString()} units</div>
        <div class="u2">${totUnits ? Math.round(100 * earnUnits / totUnits) : 0}% of ${esc(mkMonthLabel(MKTOFF))} units${earnLeads != null && (earnLeads + (paidLeads || 0)) > 0 ? `<br/>${Math.round(100 * earnLeads / (earnLeads + paidLeads))}% of all leads` : ''} · ~$0${bonus > 0 ? ` beyond ${money(bonus)} referral bonuses` : ''}</div></div>
    </div>`;

  /* Windsor's whole remaining job on this board: the pacing chip on the title
     row. Never a number in the math below — the ruling (170) demoted it after
     the card showed it undercounting July by half. */
  const paceTag = mkPaceChip(mkWindsorPacing(monthKey), mkGoogleCard(monthKey));

  return `<div class="card full">
    <div class="card-title">Return by source<span class="feed-tag cc">live · cc</span>${paceTag}</div>
    <div class="card-sub">What each source cost and what it gave back, for one month at a time. <b>Ten is the line</b> — at or above it the source earns its money, below it does not. Spend is typed at month close; Google's is the card statements, keyed by brand (the ruling, 170), priced all-in with Liam / Gate Digital management (flag ✓2). Only sources that <b>cost or earned something in ${esc(mkMonthLabel(MKTOFF))}</b> are listed; the rest fold below.</div>
    <div class="mk-scroll">
      ${head}
      ${paid.map(line).join('')}
      ${rest.map(line).join('')}
      ${blended}
      ${idle.length ? `<button type="button" class="mk-fold" onclick="mkFold(this)" aria-expanded="false"><span class="chev">›</span>${idle.length} inactive source${idle.length === 1 ? '' : 's'}<span class="why">no spend and no signed dollar in ${esc(mkMonthLabel(MKTOFF))}${idleLeads && !leadsBlind ? ` · ${idleLeads.toLocaleString()} leads` : ''}</span></button>
      ${idle.map(r => line({ ...r, idle: true })).join('')}` : ''}
    </div>
    ${split}
    ${!all.length ? `<div class="card-sub" style="margin:12px 0 0">No lead carried a source in ${esc(mkMonthLabel(MKTOFF))}.</div>` : ''}
    ${backfilled ? `<div class="withheld"><div class="wt">This month reads from the backfill, and says so</div><div class="wx">
      <b>rpt_report_marketing_roi</b> cannot group months before ${esc(MK_SRC_RPC_FROM)} by source (its leads CTE keys on <b>jobs.created_at</b>, one-shot-backfilled on 20 Jul 2026), so these rows come from <b>rpt_marketing_revenue_by_source_month</b> (migration <b>172</b>) — pulled straight from <code>jobs.contract_signed_at</code> / <code>cc_lead_source_id</code> and validated against a live Contractors Cloud pull. The month matrix below reads the same table for the same months (its <b>†</b> mark), so the two can no longer answer this month differently. Cancelled contracts excluded; see <a href="docs/roi-board/handoff-source-backfill.md">the backfill handoff</a>.</div></div>` : ''}
    ${!spendBook ? `<div class="withheld"><div class="wt">The spend book is not on live yet</div><div class="wx">
      Every typed source reads <b>not entered</b> because <b>marketing_spend</b> (migration <b>166</b>) has not been applied — the table the office types into does not exist yet, so no ROI on this board can be computed. This is the honest state, not a zero: a source with no cost recorded is not a free source. Apply 166 and the inputs go live with no further deploy.</div></div>` : ''}
    ${leadsBlind ? `<div class="withheld"><div class="wt">The leads and CPL columns are withheld for ${esc(mkMonthLabel(MKTOFF))}</div><div class="wx">
      <b>rpt_report_marketing_roi</b> dates a lead by <b>jobs.created_at</b> — when OUR row was written, not when the lead came in. The warehouse was loaded in one shot on <b>20 Jul 2026</b> (11,119 of 11,558 rows), so a July window returns the entire backfill: Google reads <b>4,282</b> against a true <b>253</b>. Months before July return zero, which is not the same as none. From <b>August 2026</b> both columns are real — measured 112 true against 113 reported — so they render there and are refused here. Closed jobs, closed dollars, <b>ROI and cost per unit are unaffected</b>: they are dated by <b>rpt_signings.signed_on</b>, which is correct in every window.</div></div>` : ''}
    <div class="note">Closed jobs, closed dollars and the source list come from <b>rpt_report_marketing_roi</b> (160, corrected by <b>165</b>), grouped on <b>lead_sources.rollup_name</b> — migration 163's canonical rollup, never the raw CC name, which splits Angi three ways and Google five${backfilled ? ' — except this backfilled month, which reads migration 172’s table as stated above' : ''}. Appointments set are counted client-side by when the appointment was <b>booked</b>, off the same project→source join. ROI is closed dollars ÷ spend for the month shown, rounded to a whole multiple; within ±${MK_NEAR} of ${MK_LINE}x it reads neutral because one deal moves a small source across the line. <b>CPL and $/unit</b> price exactly as ROI does — Google all-in from the card (170/171) — with one exception the approved board itself drew: <b>Referral</b> is priced at its typed bonus row (~) for those two columns while its ROI stays earned. Leads and units are deliberately different cohorts: CPL measures the faucet, $/unit measures what came out. <b>⚑3 vendor rows price no source anywhere on this row set</b>, blended included — unattributable spend is carried where totals belong, the ledger and the headline. The MoM arrow compares $/unit against ${esc(mkMonthLabel(MKTOFF + 1))}, priced the same way on both ends, and lights only when both months carry a priced spend and signed units${!prevWin ? ` — ${MKTWALK ? esc(mkMonthLabel(MKTOFF + 1)) + '’s window has not answered' : 'the month walk loads with this board'}, so it reads an em-dash for now` : !prevBookTyped ? ` — <b>${esc(mkMonthLabel(MKTOFF + 1))} has no spend book</b>: the window answered and its units are known, but nobody has typed a cost against them, so every arrow reads an em-dash. Key that month into <b>marketing_spend</b> and the column lights with no further deploy` : ''}. Leads exclude the 12 reporting_excluded batch-entry anomalies, matching the RPC${leadsBlind ? ', and are withheld this month — see above' : ''}. <b>$0 · earned</b> means no cost has ever been keyed for that source in any month, so there is nothing to type; <b>not entered</b> is reserved for sources the book proves cost money and whose month has not been keyed, which makes that phrase a list worth chasing instead of wallpaper.${idle.length ? ` The <b>${idle.length}</b> folded source${idle.length === 1 ? '' : 's'} neither cost nor earned a dollar this month — folded, not dropped, and ${idle.length === 1 ? 'it opens' : 'they open'} on tap.` : ''}</div>
  </div>`;
}

/* The fold, and the earned row's hidden input. Both are pure DOM: re-rendering
   the drawer to open a disclosure would throw away the month the reader has
   stepped to and their scroll position with it. */
function mkFold(btn){
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.classList.toggle('open', open);
  let el = btn.nextElementSibling;
  while (el && el.hasAttribute && el.hasAttribute('data-idle')) { el.hidden = !open; el = el.nextElementSibling; }
}
function mkTypeCost(btn){
  const box = btn.nextElementSibling;
  btn.hidden = true; box.hidden = false;
  const input = box.querySelector('input'); if (input) input.focus();
}

/* ── BOARD 2 · THE REP × SOURCE GRID ──────────────────────────────────────── */
/* CELLS ALL-TIME, ROSTER BY PERIOD. The cells stay all-time, deliberately, and
   not windowed like board 1: a month-sliced rep × source cell is n=2 — a wall
   of noise wearing percentage signs — and the board exists to move real
   appointments to real people. Same reasoning as the cohort rule: a verdict
   needs a denominator on both sides.
   The ROSTER is a different question, and it has now been wrong in both
   directions. `active && sells` asked who works here TODAY and deleted Jared's
   July book. The correction — every seller ever carried — swung past the
   target: Gerardo Costas, Nick Campana, Mike Teixeira, Daniel Chase, desks
   cold for months, rendered as rows on a board that decides who gets the NEXT
   lead. The law both misses share: a rep is on this grid IFF they signed at
   least one job in the BROWSED month. Not "active user", not "exists in
   history" — zero signings in the window is no row, departed or not, and one
   signing seats a departed rep beside the live ones, tagged. Signings date on
   contract_signed_at (j.d), the same clock as every unit and dollar on the
   rep board, and the roster follows the board's month selector. */
function mkGridData(monthKey){
  const rollup = D.mktRollup || {};
  const signed = new Set(((MKT && MKT.signed) || []).map(s => String(s.cc_project_id)));
  const cells = Object.create(null);
  for (const j of (D.mktJobs || [])) {
    if (!j.r) continue;
    const s = rollup[j.l]; if (!s) continue;
    const byRep = cells[j.r] || (cells[j.r] = Object.create(null));
    const c = byRep[s] || (byRep[s] = { leads: 0, signed: 0 });
    c.leads++; if (signed.has(j.p)) c.signed++;
  }
  const pre = monthKey.slice(0, 7);
  const inPeriod = Object.create(null);
  for (const j of (D.mktJobs || [])) {
    if (!j.r || !j.d || mkET(j.d).slice(0, 7) !== pre) continue;
    const e = inPeriod[j.r] || (inPeriod[j.r] = { jobs: 0, rev: 0 });
    e.jobs++; e.rev += Number(j.v || 0);
  }
  /* Ranked by what they signed in the month — the order the fold cuts at. */
  const sellers = (D.mktSellers || []).filter(r => inPeriod[r.id] && cells[r.id])
    .map(r => ({ ...r, mJobs: inPeriod[r.id].jobs, mRev: inPeriod[r.id].rev }))
    .sort((a, b) => b.mRev - a.mRev);
  /* Column set: a source earns a column when at least one seller has enough
     volume on it to be read. Sources below that are NOT silently dropped — the
     count and their combined leads are stated under the grid. */
  const tot = Object.create(null), qual = Object.create(null);
  for (const r of sellers) for (const [s, c] of Object.entries(cells[r.id])) {
    tot[s] = (tot[s] || 0) + c.leads;
    if (c.leads >= MK_THIN) qual[s] = (qual[s] || 0) + 1;
  }
  const cols = Object.keys(qual).sort((a, b) => tot[b] - tot[a]);
  const dropped = Object.keys(tot).filter(s => !qual[s]);
  const droppedLeads = dropped.reduce((n, s) => n + tot[s], 0);
  /* Median over the cells that CAN be read. Letting thin cells vote would move
     the reference line with noise and then colour every other cell against it. */
  const pcts = [];
  for (const r of sellers) for (const s of cols) {
    const c = cells[r.id][s]; if (c && c.leads >= MK_THIN) pcts.push(100 * c.signed / c.leads);
  }
  pcts.sort((a, b) => a - b);
  const median = pcts.length ? (pcts.length % 2 ? pcts[(pcts.length - 1) / 2]
    : (pcts[pcts.length / 2 - 1] + pcts[pcts.length / 2]) / 2) : null;
  return { cells, sellers, cols, median, dropped, droppedLeads, readable: pcts.length,
           total: sellers.reduce((n, r) => n + Object.keys(cells[r.id]).length, 0) };
}

/* THE APPOINTMENTS-RAN HALF OF EVERY CELL — WIRED TO NOTHING, ON PURPOSE.
   ⚠️ DO NOT WIRE THIS TO cc_appointments.cc_result_id. That column exists and
   looks exactly like an outcome log, which is the trap: it is populated on 83
   of 9,627 appointments — 0.86% — across three distinct values, and it trails
   off after Jul 2026. Verified against live 16 Aug 2026. A denominator that
   thin would produce confident, wrong closing rates on a board whose whole job
   is deciding who gets the next appointment.
   ⚠️ DO NOT SUBSTITUTE APPOINTMENTS SET. Set and ran are different
   denominators; a rep who books ten and runs six is not the same rep as one who
   books ten and runs ten, and that difference is the entire reason this column
   was asked for.
   ⚠️ DO NOT DERIVE IT. There is no ran field in the CC payload.
   An empty column that says why is the deliverable. A plausible number is not.
   When CC starts logging outcomes, this is the one function to change. */
const mkRanCell = () => `<div class="ran">no outcome logged</div>`;

/* The month's ACTIVE sources — the source ledger's own law (see cardSourceRow:
   a cost in the book this month OR a signed dollar this month), re-asked here
   so the phone heat map can narrow to the columns a decision can be made
   about. null when the ROI feed has not answered — then nothing is hidden,
   because a hiding rule with no evidence is just hiding. */
function mkPeriodSrc(monthKey){
  const rows = ((MKT && MKT.roi && MKT.roi.sections) || {}).by_source || [];
  if (!rows.length) return null;
  const set = new Set();
  for (const r of rows) {
    const src = r.source_name, isG = src === 'Google';
    const g = isG ? mkGoogleCard(monthKey) : null;
    const spend = MK_FREE.has(src) ? null : isG ? (g ? g.total : null) : mkSpendOf(src, monthKey);
    if (spend != null || Number(r.signed_dollars || 0) > 0) set.add(src);
  }
  return set;
}

/* How many reps the grid shows before the fold. Top 8 by signed $ in the
   browsed month; the rest open on one counted tap, never dropped. */
const MK_GRID_TOP = 8;

function cardRepGrid(){
  if (!MKT || !MKT.signed) return `<div class="card full">
    <div class="card-title">Who closes what<span class="feed-tag cc">live · cc</span></div>
    <div class="card-sub" style="margin:0">Reading…</div></div>`;

  const monthKey = mkISO(mkMonthStart(MKTOFF));
  const G = mkGridData(monthKey);
  if (!G.sellers.length) return `<div class="card full">
    <div class="card-title">Who closes what<span class="feed-tag cc">live · cc</span></div>
    <div class="withheld"><div class="wt">No seller signed a job in ${esc(mkMonthLabel(MKTOFF))}</div><div class="wx">
      A row on this grid is earned by signing at least one job in the browsed month — not by being on
      today's payroll, and not by having ever sold here. ${esc(mkMonthLabel(MKTOFF))} has no signer yet,
      so the grid has no rows, and nothing is inferred in their place.</div></div></div>`;
  if (!G.cols.length) return `<div class="card full">
    <div class="card-title">Who closes what<span class="feed-tag cc">live · cc</span></div>
    <div class="withheld"><div class="wt">Nothing to rank yet</div><div class="wx">
      No seller carries ${MK_THIN} leads on any single source, so no cell on this grid can be read.</div></div></div>`;

  const cellOf = (rep, src) => {
    const c = (G.cells[rep.id] || {})[src];
    if (!c || !c.leads) return `<div class="mkc none"><div class="p">·</div></div>`;
    if (c.leads < MK_THIN) return `<div class="mkc thin" title="${c.signed} of ${c.leads} — too few to read">
      <div class="p">${c.signed}/${c.leads}</div><div class="n">thin</div>${mkRanCell()}</div>`;
    const p = 100 * c.signed / c.leads;
    const k = G.median == null ? 'mid' : p >= G.median + MK_BAND ? 'strong' : p <= G.median - MK_BAND ? 'weak' : 'mid';
    return `<div class="mkc ${k}"><div class="p">${Math.round(p)}%</div>
      <div class="n">${c.signed}/${c.leads}</div>${mkRanCell()}</div>`;
  };

  /* The phone narrows to the month's active columns (.off-p hides below
     700px). If the ROI feed has not answered, or the active rule would blank
     every column, nothing is hidden — a phone with no columns is not compact,
     it is blind. */
  const act = mkPeriodSrc(monthKey);
  const offSet = new Set(act ? G.cols.filter(s => !act.has(s)) : []);
  if (offSet.size === G.cols.length) offSet.clear();
  const colCls = s => offSet.has(s) ? ' class="off-p"' : '';

  const row = (r, fold) => `<tr${fold ? ' data-foldrep hidden' : ''}><th>${esc(r.name)}${r.gone ? '<span class="gone">departed</span>' : ''}</th>
      ${G.cols.map(s => `<td${colCls(s)}>${cellOf(r, s)}</td>`).join('')}</tr>`;
  const shown = G.sellers.slice(0, MK_GRID_TOP), folded = G.sellers.slice(MK_GRID_TOP);
  const table = `<div class="mkg-wrap"><table class="mkg">
    <thead><tr><th class="rep-h">Rep</th>${G.cols.map(s => `<th${colCls(s)}>${esc(s)}</th>`).join('')}</tr></thead>
    <tbody>${shown.map(r => row(r, false)).join('')}
    ${folded.length ? `<tr><th><button type="button" class="mkg-more" onclick="mkGridMore(this)" aria-expanded="false"
        title="Reps ranked ${MK_GRID_TOP + 1}+ by signed $ in ${esc(mkMonthLabel(MKTOFF))} — folded, not dropped"><span class="chev">›</span>${folded.length} more rep${folded.length === 1 ? '' : 's'}</button></th>
      <td colspan="${G.cols.length}"></td></tr>
    ${folded.map(r => row(r, true)).join('')}` : ''}</tbody>
  </table></div>`;

  return `<div class="card full">
    <div class="card-title">Who closes what<span class="feed-tag cc">live · cc</span></div>
    <div class="card-sub">Every seller who <b>signed a job in ${esc(mkMonthLabel(MKTOFF))}</b>, ranked by what they signed, against every source they carry real volume on — so an appointment can go to the person who closes that kind of lead. The cells stay all-time evidence; the month picks who is in the room. Each cell shows two denominators: signed against <b>leads assigned</b>, and signed against <b>appointments ran</b>.</div>
    ${table}
    <div class="mk-legend">
      <span><i style="background:rgba(108,194,139,0.4)"></i>${MK_BAND}+ pts above the grid median</span>
      <span><i style="background:rgba(217,106,94,0.4)"></i>${MK_BAND}+ pts below</span>
      <span><i style="background:rgba(255,255,255,0.06)"></i>fewer than ${MK_THIN} leads · thin, not good or bad</span>
      <span>median ${G.median == null ? 'n/a' : Math.round(G.median) + '%'} of ${G.readable} readable cells</span>
    </div>
    <div class="withheld"><div class="wt">Appointments ran is empty, and that is the finding</div><div class="wx">
      The second denominator has <b>no feed anywhere</b>. Contractors Cloud does not log appointment outcomes — there is no ran field in the payload — so every cell says so in words rather than showing a number. <b>cc_appointments.cc_result_id</b> exists and looks like an outcome log; it is populated on <b>83 of 9,627</b> appointments and trails off after July, so it is not a denominator and this board deliberately does not read it. Appointments <i>set</i> is not substituted either: a rep who books ten and runs six is not the rep who books ten and runs ten, and that gap is the reason the column was asked for.</div></div>
    <div class="note">Signed is <b>rpt_signings</b> where confirmed, matched to the job by <b>cc_project_id</b> — the same basis board 1 reads, so the two boards cannot disagree about who closed what. It is counted <b>distinct by project</b>: migration 150 splits an amended invoice into a signing row per late bell, which is right for money and would push a closing rate past 100%. Not <b>jobs.contract_signed_at</b>, which would understate Oasis — 227 of Google's confirmed signings arrive through Billdu and 32 of those sit on jobs with no contract date at all. Cells are all-time, not monthly: a month-sliced cell is n=2 and reads as noise. The <b>rows</b> are monthly: a seller is here iff they signed at least one job in ${esc(mkMonthLabel(MKTOFF))} — not "active user", not "ever sold here". Zero signings in the window is no row, departed or not; the roster asked of today's payroll deleted Jared's July book, and the swing past it — every seller in company history — seated desks cold for months on a board that routes the next lead. Sellers only (098), and a departed rep's book is still some of the strongest evidence here about which desk closes which lead.${G.sellers.some(r => r.gone) ? ` <b>${G.sellers.filter(r => r.gone).map(r => esc(r.name)).join(', ')}</b> ${G.sellers.filter(r => r.gone).length === 1 ? 'has' : 'have'} left; ${G.sellers.filter(r => r.gone).length === 1 ? 'that row is' : 'those rows are'} tagged <b>departed</b> and ${G.sellers.filter(r => r.gone).length === 1 ? 'is' : 'are'} here for what the book proves, not as a desk to route to.` : ''} ${G.dropped.length ? `<b>${G.dropped.length}</b> source${G.dropped.length === 1 ? '' : 's'} ${G.dropped.length === 1 ? 'is' : 'are'} not a column here — no seller carries ${MK_THIN} leads on ${G.dropped.length === 1 ? 'it' : 'any of them'} (${G.droppedLeads.toLocaleString()} leads between them): ${esc(G.dropped.join(', '))}.` : ''}${folded.length ? ` The grid shows the top <b>${MK_GRID_TOP}</b> by signed $ in ${esc(mkMonthLabel(MKTOFF))}; <b>${folded.length}</b> more open${folded.length === 1 ? 's' : ''} on the fold — folded, never dropped.` : ''}${offSet.size ? ` On a phone the columns narrow to sources that cost or earned money in ${esc(mkMonthLabel(MKTOFF))} — the source ledger's own active rule — and <b>${offSet.size}</b> read${offSet.size === 1 ? 's' : ''} at desk width only: ${esc([...offSet].join(', '))}.` : ''}</div>
  </div>`;
}

/* The fold under the eighth rep — pure DOM, like mkFold: re-rendering the
   drawer to open a disclosure would throw away the month the reader stepped
   to and their scroll position with it. */
function mkGridMore(btn){
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.classList.toggle('open', open);
  const tb = btn.closest('tbody');
  if (tb) for (const tr of tb.querySelectorAll('tr[data-foldrep]')) tr.hidden = !open;
}

/* ── SPEND ENTRY ──────────────────────────────────────────────────────────── */
/* Upsert on (source_name, month, brand) — the table's primary key since 167 —
   so re-typing a month corrects it rather than stacking a second row. The
   board's input types an UNSPLIT total (brand 'all'); a month that has been
   split per brand shows its sum read-only instead of an input, because typing
   a total over brand rows is refused at the database (167's one-grain
   trigger) and offering the input would be offering an error. Google is
   typeable since the ruling lifted 166's CHECK (170), but not from HERE:
   its card rows are keyed by brand (171 and successors), so the board
   shows them read-only like any other brand-split month — an unsplit 'all'
   total typed over them would be refused by the one-grain trigger anyway. */
async function saveSpend(src, monthKey, el){
  const raw = String(el.value).trim();
  el.className = 'saving';
  const s = sess.get();
  try {
    if (!s) throw new Error('not signed in');
    if (raw === '') { el.className = ''; return; }   // cleared, not zero — leave the row alone
    const amount = Number(raw);
    if (!isFinite(amount) || amount < 0) throw new Error('bad amount');
    const r = await fetch(`${SB_URL}/rest/v1/marketing_spend?on_conflict=source_name,month,brand`, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token,
                 'Content-Type': 'application/json',
                 Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ source_name: src, month: monthKey, amount, brand: 'all' }),
    });
    if (!r.ok) throw new Error(`${r.status}`);
    el.className = 'saved';
    /* Re-read rather than patching the local array: the ROI beside it must come
       from what the database actually holds, not from what was typed at it. */
    MKT.spend = await q('marketing_spend?select=source_name,month,amount,note,brand').catch(() => MKT.spend);
    mktRedraw();
  } catch (e) {
    el.className = 'failed';
    el.title = `Not saved (${e.message}). If this reads 404, migration 166 is not applied yet.`;
  }
}

/* ── THE ROOM ─────────────────────────────────────────────────────────────── */
/* Same one-value state machine as the Effort Room: nothing open, one board
   open, or both. The body is built from exactly one branch, so opening a tile
   and then expanding all cannot render a board twice. */
const MKT_STORE = 'lcc.mkt';
let MKT_VIEW = (() => {
  try {
    /* ONE STORE FOR ONE BOARD. 'lcc.mkt2' belonged to the deep ROI room this
       board absorbed; a device that had that room open reopens the whole
       board once, and the stale key is removed so a second copy of the board
       can never hold its own state again. Reading it is wrapped separately so
       a corrupt legacy value can never blank the live one. */
    let legacyOpen = false;
    try {
      legacyOpen = (JSON.parse(localStorage.getItem('lcc.mkt2') || 'null') || {}).mode === 'open';
      localStorage.removeItem('lcc.mkt2');
    } catch (e) { try { localStorage.removeItem('lcc.mkt2'); } catch (e2) {} }
    const j = JSON.parse(localStorage.getItem(MKT_STORE) || 'null');
    if (j && j.mode === 'all') return { mode:'all' };
    /* 'grid' was the two-board drawer's key for the rep grid; the rep level
       owns it now. A stale key that maps to nothing falls through to the
       shelf rather than erroring — migrated or ignored, never thrown. */
    if (j && j.mode === 'solo' && j.key)
      return { mode:'solo', key: j.key === 'grid' ? 'rep' : j.key };
    if (legacyOpen) return { mode:'all' };
  } catch (e) {}
  return { mode:'none' };
})();
function mktSave(){ try { localStorage.setItem(MKT_STORE, JSON.stringify(MKT_VIEW)); } catch (e) {} }
function mktRedraw(){
  const el = document.getElementById('marketing-room');
  if (!el) { render(); return; }
  const y = window.scrollY;
  /* Same rule as roomRedraw: the railed body class picks the form, so a month
     step or a saved spend redraws the board the reader is actually in. */
  el.outerHTML = marketingRoom(document.body.classList.contains('railed'));
  window.scrollTo({ top: y });
}
function mktSolo(key){
  MKT_VIEW = (MKT_VIEW.mode === 'solo' && MKT_VIEW.key === key) ? { mode:'none' } : { mode:'solo', key };
  mktSave(); mktRedraw();
}
function mktAll(){ MKT_VIEW = MKT_VIEW.mode === 'all' ? { mode:'none' } : { mode:'all' }; mktSave(); mktRedraw(); }
function mktClose(){ MKT_VIEW = { mode:'none' }; mktSave(); mktRedraw(); }

/* The board's own month pager. It used to live on the source table; the whole
   board follows MKTOFF, so it rides at the top of the body where every level
   inherits it — one month, one pager, every section. */
function mkMonthBar(){
  return `<div class="mk-monthbar" style="margin-top:14px">
    <button class="mn-btn" ${MKTOFF >= 12 ? 'disabled' : ''} onclick="setMktOff(MKTOFF+1)" aria-label="Previous month">‹</button>
    <span class="mn-cur">${esc(mkMonthLabel(MKTOFF))}</span>
    <button class="mn-btn" ${MKTOFF <= 0 ? 'disabled' : ''} onclick="setMktOff(MKTOFF-1)" aria-label="Next month">›</button>
    ${MKTOFF !== 1 ? `<button class="linkbtn" onclick="setMktOff(1)">last full month</button>` : ''}
  </div>`;
}

/* The tiles. Same three states the effort shelf keeps: reading, nothing behind
   it (said in words), or the shape. Every figure here is the CARD's own
   formula off the shared enrichment — a tile that computed its number a second
   way is exactly how this board's old shelf learned to disagree with the
   headline it previewed. */
function ptMktMonth(){
  if (!MKT || (!MKT.roi && !MKT.roiErr)) return ptEmptyBox('Reading…');
  if (MKT.roiErr) return ptEmptyBox('The ROI feed did not answer');
  const monthKey = mkISO(mkMonthStart(MKTOFF));
  const rev = mkSourceRows(monthKey).reduce((n, r) => n + r.dollars, 0);
  /* The headline's own arithmetic: signed ÷ the WHOLE spend book — card
     Google, ⚑3 vendors, bonuses, unsplit totals. Never a per-source sum. */
  const book = mkBookTotal(monthKey);
  if (!(book > 0)) return ptEmptyBox(`No spend book for ${mkMonthLabel(MKTOFF)}${rev ? ` — ${money(rev)} signed against no typed cost` : ''}`);
  const net = rev / book;
  return ptNum('$' + net.toFixed(2), net >= MK_LINE ? 'green' : 'red') +
    ptCap(`back per $1 · whole book · ${esc(mkMonthLabel(MKTOFF))}<br/>${money(rev)} on ${money(book)}`);
}

function ptMktSources(){
  if (!MKT || (!MKT.roi && !MKT.roiErr)) return ptEmptyBox('Reading…');
  if (MKT.roiErr) return ptEmptyBox('The ROI feed did not answer');
  const rows = mkSourceRows(mkISO(mkMonthStart(MKTOFF)));
  if (!rows.length) return ptEmptyBox(`No sourced lead in ${mkMonthLabel(MKTOFF)}`);
  const priced = rows.map(r => r.roi).filter(v => v != null);
  /* No spend anywhere is the headline when it is true — the board's whole
     premise is cost, so an empty spend book is the fact, not a zero. */
  if (!priced.length) return ptEmptyBox(`No spend entered for ${mkMonthLabel(MKTOFF)} — no ROI to read`);
  const hit = priced.filter(v => v >= MK_LINE).length;
  return ptNum(`${hit}/${priced.length}`, hit === priced.length ? 'green' : hit ? 'gold' : 'red') +
    ptCap(`priced sources at or above ${MK_LINE}x<br/>${esc(mkMonthLabel(MKTOFF))}`);
}

function ptMktReps(){
  if (!MKT || !MKT.signed) return ptEmptyBox('Reading…');
  const G = mkGridData(mkISO(mkMonthStart(MKTOFF)));
  if (!G.sellers.length) return ptEmptyBox(`No seller signed a job in ${mkMonthLabel(MKTOFF)} yet`);
  if (!G.readable) return ptEmptyBox(`No seller carries ${MK_THIN} leads on one source yet`);
  let strong = 0, weak = 0;
  for (const r of G.sellers) for (const s of G.cols) {
    const c = (G.cells[r.id] || {})[s]; if (!c || c.leads < MK_THIN) continue;
    const p = 100 * c.signed / c.leads;
    if (p >= G.median + MK_BAND) strong++; else if (p <= G.median - MK_BAND) weak++;
  }
  return ptNum(Math.round(G.median) + '%', 'accent') +
    `<div class="pt-seg">
      ${strong ? `<i style="width:${100 * strong / G.readable}%;background:var(--green)"></i>` : ''}
      ${weak ? `<i style="width:${100 * weak / G.readable}%;background:var(--red)"></i>` : ''}
      <i style="width:${100 * (G.readable - strong - weak) / G.readable}%;background:rgba(255,255,255,0.10)"></i>
    </div>` +
    ptCap(`grid median · ${strong} strong · ${weak} weak<br/>of ${G.readable} readable cells`);
}

const MKT_KIT = [

/* The board-level gate. Every section reads rpt_report_marketing_roi one way

function mktGate(){

  return '';
}

/* ═══ THE MARKETING ROOM · ONE BOARD ═════════════════════════════════════════
   The one place marketing renders. It absorbed three surfaces that could show
   disagreeing numbers on one screen — the two-board drawer, and the deep ROI
   board that lived in its own band beneath it — into one room with one month
   pager, one enrichment per source (mkSourceRows), one spend book total
   (mkBookTotal), and a drill-in that reads brand → source → rep. Same
   one-value state machine as the Effort Room: nothing open, one level open,
   or all three — the body is built from exactly one branch, so opening a
   tile and then expanding all cannot render a section twice. */
function marketingRoom(direct){
  /* THE SECTION FORM — same reasoning as effortRoom(direct): on the railed
     desktop this room IS the Marketing section, so the whole board renders
     open in its reading order, brand → source → rep. The month pager, the
     nag, the gate, the flags and the footer ride exactly as they do when the
     shelf opens the board. The phone keeps the shelf and lcc.mkt below. */
  if (direct) {
    loadMktWalk();   // the source level is on screen, so the walk is owed now
    const gate = mktGate();
    const inner = gate || MKT_KIT.map(i => i.panel()).join('');
    const tail = gate ? '' : `<div class="m2-stack" style="margin-top:12px">${mkHeldAsk()}${cardMktFlags()}</div>` + mkFoot();
    return `<div class="room" id="marketing-room">
      <div class="shelf-head">
        <div class="shelf-titles">
          <div class="card-title">Marketing · what it cost and what it gave back</div>
          <div class="card-sub">One board, three levels, reading brand → source → rep — the month against the whole spend book by brand, every source against the ten-times line, and which rep closes which kind of lead. Sections with no honest feed say so where they sit.</div>
        </div>
      </div>
      <div class="room-body">${mkMonthBar()}${gate ? '' : mkNag()}${inner}${tail}</div>
    </div>`;
  }
  const all = MKT_VIEW.mode === 'all';
  const solo = MKT_VIEW.mode === 'solo' ? MKT_KIT.find(i => i.key === MKT_VIEW.key) : null;
  const open = all || !!solo;
  /* The six-month walk feeds the MoM column, Went quiet and the matrix — all
     source-level — so it is paid for when that level is opened. loadMktWalk
     self-guards, so calling it from every render costs nothing after the
     first. */
  if (open && (all || solo.key === 'src')) loadMktWalk();
  const tiles = MKT_KIT.map(i => {
    const on = !!solo && solo.key === i.key;
    return `<button type="button" class="ptile${on ? ' on' : ''}" onclick="mktSolo('${i.key}')"
      aria-expanded="${on ? 'true' : 'false'}">
      <div class="pt-h">${esc(i.name)}</div>
      <div class="pt-b">${i.tile()}</div>
    </button>`;
  }).join('');

  let body = '';
  if (open) {
    const gate = mktGate();
    const inner = gate || (all ? MKT_KIT.map(i => i.panel()).join('') : solo.panel());
    /* The flags and the footer are board-wide — typed annotations and the
       provenance — so they close the body whichever level is open, once. */
    const tail = gate ? '' : `<div class="m2-stack" style="margin-top:12px">${mkHeldAsk()}${cardMktFlags()}</div>` + mkFoot();
    body = `<div class="room-body">
      <div class="room-open-head"><div class="ttl">${all ? 'The whole board · brand → source → rep' : esc(solo.name)}</div>
        <button type="button" class="shelf-all" onclick="mktClose()">Close</button></div>
      ${mkMonthBar()}${gate ? '' : mkNag()}${inner}${tail}
    </div>`;
  }

  return `<div class="room" id="marketing-room">
    <div class="shelf-head">
      <div class="shelf-titles">
        <div class="card-title">Marketing · what it cost and what it gave back</div>
        <div class="card-sub">One board, three levels — the month against the whole spend book by brand, every source against the ten-times line, and which rep closes which kind of lead. Tap a level to open it alone, or open the whole board; it reads brand → source → rep, org-wide by default. Sections with no honest feed say so where they sit.</div>
      </div>
      <button type="button" class="shelf-all" onclick="mktAll()">${all ? 'Close the board' : 'Open the board'}</button>
    </div>
    <div class="shelf-grid">${tiles}</div>
    ${body}
  </div>`;
}

     · The headline          — signed ÷ the whole spend book, computed.
     · Source × company      — signed DOLLARS per source per brand, windowed
                               to the browsed month (was all-time job counts).
     · Rep board (month)     — leads → units → dollars per seller, leads dated
                               on cc_raw->>project_created_at (the honest lead
                               clock) rather than the backfilled RPC column.
                               Carries the inherited-lead flag: a rep holding
                               a departed colleague's unsigned appointments
                               reads a raw AND an adjusted close rate, never
                               the adjusted one alone. See mkInherited().
     · Backfilled months     — per-source dollars for months the RPC cannot
                               group read from rpt_marketing_revenue_by_source_month
                               (172) on the ledger and headline too, not only
                               on the matrix, so browsing June no longer shows
                               a blank ledger over a populated matrix.

   STILL REFUSED, AND WHY:
     · Cost-per-unit trend   — needs a leads series over May–Jul, and leads
                               before Aug 2026 are backfill-dated (MK_LEADS_FROM).
     · Unit economics        — cost per lead blocked by the same backfill;
                               average ticket blocked by signed_jobs counting
                               amended-invoice rows (150). The brand ÷ it was
                               waiting on lives on the brand tiles now.
     · Speed to close        — no lead-to-signed median exists on this console.
                               The Pulse's DAYS OUT is lead-to-APPOINTMENT,
                               a different interval; substituting it would be
                               the same class of error as swapping appointments
                               set for appointments ran.
     · The Stall             — no open-lead-age feed anywhere.
     · Ask anything          — its FACTS array is a frozen snapshot of the
                               sections above. It cannot be honest until
                               they are.
   (The old "Who closes Google" signpost card is retired outright — the grid
   it pointed at now sits on this same board, its note carrying the
   month-sliced-cell-is-n=2 reasoning.)

   Nothing on this board is estimated, and nothing reads zero for want of a
   feed. ══════════════════════════════════════════════════════════════════ */

/* The board's own withheld skin — the console's .withheld panel wearing the
   board's card. Same three-part shape every honest state on this page uses:
   what it is, that it is absent, why. */
function mkWithheld(title, tag, head, why){
  return `<div class="m2-card">
    <div class="m2-card-title">${title}<span class="m2-tag none">${esc(tag)}</span></div>
    <div class="withheld"><div class="wt">${head}</div><div class="wx">${why}</div></div>
  </div>`;
}

/* Which instrument answers the month's per-source rows: the RPC for every
   month it can group, migration 172's backfill table for the rest — the same
   substitution the month matrix has always made, now made once for the whole
   board so no two sections can answer one month differently. */
function mkBySource(){
  const rows = ((MKT.roi && MKT.roi.sections) || {}).by_source || [];
  if (rows.length) return { rows, backfilled: false };
  const bf = MKT.srcBackfill && MKT.srcBackfill.month === MKT.month ? MKT.srcBackfill.rows : null;
  return bf ? { rows: bf, backfilled: true } : { rows, backfilled: false };
}

/* ── THE ONE ENRICHMENT ──────────────────────────────────────────────────────
   Every per-source number on this board — the ledger, the headline, the
   earned strip, the shelf tiles — reads THIS list, so no two surfaces can
   resolve one source two ways. Free sources are null-spend by ruling; Google
   comes from the CARD rows all-in with management (the ruling, 170 — never
   Windsor); everything else is the typed book with ⚑3 rows held out.
   EARNED: no cost this month and none ever, so there is nothing to type and
   nothing to nag about. Google is never earned — its card is typed like any
   other vendor since the ruling, so an unkeyed month is an unkeyed month. */
function mkSourceRows(monthKey){
  const src = mkBySource();
  const appts = mkApptsBySource(monthKey);
  return src.rows.map(r => {
    const name = r.source_name, free = MK_FREE.has(name), isG = name === 'Google';
    const g = isG ? mkGoogleCard(monthKey) : null;
    const spend = free ? null : isG ? (g ? g.total : null) : mkSpendOf(name, monthKey);
    const dollars = Number(r.signed_dollars || 0);
    const jobs = Number(r.signed_jobs || 0);
    return { src: name, free, isG, g, spend, dollars, jobs,
             leads: Number(r.leads || 0), category: r.category || null,
             appts: appts[name] || 0,
             earned: !isG && (free || !mkEverPaid(name)),
             roi: (spend && spend > 0) ? dollars / spend : null,
             backfilled: src.backfilled };
  });
}

/* ── HEADER · the net ─────────────────────────────────────────────────────── */
function mkHeadline(){
  const monthKey = mkISO(mkMonthStart(MKTOFF));
  const all = mkSourceRows(monthKey);
  const rev = all.reduce((n, r) => n + r.dollars, 0);
  /* The headline divides the month's signed dollars by the WHOLE spend book —
     card Google, ⚑3 vendors, referral bonuses, unsplit totals, all of it.
     That is the approved board's own arithmetic ($1,248,081 on $69,235 →
     $18.03 back per $1, marketing 5.6% of signed). COMPUTED, NEVER KEYED:
     revenue here is rpt_report_marketing_roi, so the figure moves with the
     database, and any gap against the approved snapshot is two instruments
     disagreeing out loud, not a typo. */
  const spend = mkBookTotal(monthKey);
  const net = spend > 0 ? rev / spend : null;
  const pct = rev > 0 && spend > 0 ? 100 * spend / rev : null;
  return `<div class="m2-hdr">
    <div class="m2-eyebrow">Liberty Command · Marketing Board · ROI Edition</div>
    <h1>The spend, the juice,<br/><em>and the squeeze.</em></h1>
    <div class="m2-nw-block">
      <div>
        <div class="m2-nw-label">${esc(mkMonthLabel(MKTOFF))} signed ÷ ${esc(mkMonthLabel(MKTOFF))} spend book</div>
        <div class="m2-nw">${net != null ? '$' + net.toFixed(2) : '<span style="font-size:19px;color:var(--text-dim);font-family:\'JetBrains Mono\',monospace">no spend entered</span>'}</div>
        <div class="m2-nw-sub">${net != null
          ? `back per $1 · ${money(rev)} on ${money(spend)}`
          : `${money(rev)} signed · the book holds no row for this month`}</div>
      </div>
      <div class="m2-nw-delta">
        ${pct != null ? `<b>${pct.toFixed(1)}%</b><br/>marketing as % of<br/>${esc(mkMonthLabel(MKTOFF))} signed revenue`
                      : `<span style="color:var(--text-dim)">% of revenue<br/>needs a spend figure</span>`}
      </div>
    </div>
  </div>`;
}

/* ── EARNED REVENUE · the strip ──────────────────────────────────────────────
   The old attacker LIST is gone: every earned source's dollars already sit on
   the source ledger's own rows, tagged $0 · earned / not entered, and a second
   ranked copy of them was the two-tellings failure this consolidation kills.
   What survives is what only this section measured: the earned SHARE of the
   month, and Referral priced out loud against its typed bonus row.
   ⚠️ FORMULA, FLAGGED IN THE CONSOLIDATION PR: "earned" here is the card's
   own definition — free-by-ruling PLUS sources with no cost in the book this
   month (never-priced or un-keyed). The old shelf tile counted the ruling set
   alone and quietly disagreed with this card; the tile's variant is gone. */
function mkEarnedStrip(){
  const monthKey = mkISO(mkMonthStart(MKTOFF));
  const all = mkSourceRows(monthKey);
  const total = all.reduce((n, r) => n + r.dollars, 0);
  const free = all.filter(r => r.free && r.dollars > 0);
  /* Never Google: since the ruling its cost is the card, and a month whose
     card is not keyed reads "not entered" on the ledger — it does not
     migrate here. A typed zero is priced too, at zero. */
  const unpriced = all.filter(r => !r.free && !r.isG && r.spend == null && r.dollars > 0);
  const list = [...free, ...unpriced];
  if (!list.length || !total) return '';
  const earned = list.reduce((n, r) => n + r.dollars, 0);
  const bonus = mkSpendOf('Referral bonuses', monthKey);
  const ref = free.find(r => r.src === 'Referral');
  const unkeyed = unpriced.filter(r => mkEverPaid(r.src));
  return `<div class="m2-card">
    <div class="m2-card-title">Earned revenue · no ad dollar attached<span class="m2-tag cc">live · cc</span></div>
    <div class="m2-card-sub"><b>${(100 * earned / total).toFixed(1)}%</b> of ${esc(mkMonthLabel(MKTOFF))} signed — ${money(earned)} across ${list.length} source${list.length === 1 ? '' : 's'} — came in near-free. The sources themselves are rows on the ledger above, tagged for which kind of costless they are; this strip carries only what the ledger's columns cannot.</div>
    ${ref && bonus > 0 ? `<div class="m2-free-row">
      <span class="nm">Referral, priced at its bonuses<small>${money(bonus)} typed (~5, occasional not programmatic)</small></span>
      <span class="amt">${money(ref.dollars / bonus)} per $1</span></div>` : ''}
    <div class="m2-note"><b>$0 · earned</b> means the book has never carried a cost for that source in <i>any</i> month — a channel that earns, not a month somebody forgot.${unkeyed.length ? ` <b>not entered this month</b> is the other claim, and it applies to <b>${esc(unkeyed.map(r => r.src).join(', '))}</b>: the book has priced ${unkeyed.length === 1 ? 'it' : 'them'} before, so a missing month here is a data-entry state and worth chasing — and ${unkeyed.length === 1 ? 'its' : 'their'} dollars are counted in the earned share above, because no ad dollar stands against them this month.` : ''} Same test as the ledger (<b>mkEverPaid</b>), one enrichment (<b>mkSourceRows</b>), so the two surfaces cannot describe one source two ways.</div>
  </div>`;
}

function mkBrandRows(){

/* FULL SINCE 171. One book holds it all now: lead sources (Saving Safari,

function cardSpendLedger(){

    'The spend book is not on live yet',

  const monthRows = MKT.spend.filter(s => String(s.month).slice(0, 10) === monthKey);
  if (!monthRows.length) return mkWithheld('Spend ledger · monthly', 'nothing typed',

    `The book is live but holds nothing for this month. A ledger of zeros would be an estimate; the empty month is the fact — and if it is last month, the nag at the top of the board is already asking for it.`);
  const info = [...new Set(monthRows.map(s => s.source_name))].map(src => {
    const sp = mkSpendSplit(src, monthKey);

    return { src, sp, mark };
  }).sort((a, b) => b.sp.total - a.sp.total);
  const cells = Object.create(null);
  /* The total cell reads mkBookTotal — the same helper the headline divides
     by — rather than a private accumulation, so the ledger's TOTAL and the
     headline's denominator are one computation, not two that happen to agree. */
  const tot = mkBookTotal(monthKey) || 0;
  const rows = info.map(({ src, sp, mark }) => {
    return `<tr><td>${esc(src + mark)}</td>${BRAND_ORDER.map(b => {
      const v = sp.split ? (sp.byBrand[b] || 0) : null;
      if (v) cells[b] = (cells[b] || 0) + v;
      return sp.split
        ? `<td class="${v ? '' : 'z'}">${v ? v.toLocaleString() : '—'}</td>`
        : `<td class="z" title="entered as one unsplit total">·</td>`;
    }).join('')}<td>${sp.total.toLocaleString()}</td></tr>`;
  }).join('');
  return `<div class="m2-card">
    <div class="m2-card-title">Spend ledger · ${esc(mkMonthLabel(MKTOFF))}<span class="m2-tag manual">typed · kd</span><span class="m2-tag chase" title="Google Ads rows are the card statements — Chase Ink 1552/1571 + Amex Gold, keyed by brand (170/171)">card</span></div>
    <div class="m2-card-sub">The whole book by company — vendors as rows, one grain per month (167/170/171). Google Ads is the card statements, keyed by brand; Windsor prices nothing here. Heymarket ($866) reclassified to company ops — with EagleView, Pictometry.</div>
    <div class="m2-scroll"><table class="m2-co">
      <tr><th>Vendor</th>${BRAND_ORDER.map(b => `<th>${esc(BRANDS[b].s)}</th>`).join('')}<th>Total</th></tr>
      ${rows}
      <tr><td style="font-weight:600">TOTAL / MO</td>${BRAND_ORDER.map(b =>
        `<td style="font-weight:600" class="${cells[b] ? '' : 'z'}">${cells[b] ? cells[b].toLocaleString() : '—'}</td>`).join('')}
      <td style="font-weight:600">${Math.round(tot).toLocaleString()}</td></tr>
    </table></div>
    <div class="m2-note">Flags ride in from each row's own note in <b>marketing_spend</b>: <b>⚑3</b> = unattributable — no CC source tag, held in these totals, excluded from every per-source ROI, CPL and CPU above; <b>~</b> = estimate (referral bonuses — occasional, not programmatic); the Oasis Saving Safari $2,000 is imputed barter (⚑6) and will not reconcile against QB. This table IS the month's spend truth — the headline and the brand tiles divide against these same totals, so the three surfaces cannot disagree.</div>

}

/* ── REP BOARD ────────────────────────────────────────────────────────────── */
/* ── INHERITED WORK · A BOOK THAT CHANGED HANDS ──────────────────────────────
   Travis Janke's July close rate read 11% off 38 leads. Twenty-nine of those
   leads were Jared Heideman's: files Jared had already run the appointment on
   in July, still unsigned when he left, dumped into Travis's queue on the way
   out. Travis never sat in those living rooms. The denominator was counting
   them anyway, so the board was reporting a routing event as a closing
   failure — and that is the number a rep gets managed on.
   THE RULE, not the special case. A lead is INHERITED for the rep who holds
   it if, in the month being read: the file is still unsigned, an appointment
   on it was run by a DIFFERENT rep, and that rep has since left the roster.
   All three clauses earn their place — a signed file has no denominator
   complaint left to make, a colleague who is still here has not handed
   anything over, and an appointment somebody else ran is the whole evidence
   that the work was not this rep's. Nobody is named in this function; it
   found Travis because Travis is who it happened to, and it will find the
   next one without an edit.
   THE RAW FIGURE IS NEVER REPLACED, only accompanied. An adjusted close rate
   that quietly overwrote the real one would be a rep-friendly number nobody
   could audit — and the adjustment is drawn from an unsigned pile, which is
   exactly the pile a generous rule could be built out of. Both readings, both
   denominators, and the count of what came out. */
function mkInherited(monthKey){
  const pre = monthKey.slice(0, 7), roster = D.roster || {};
  const jobBy = Object.create(null);
  for (const j of (D.mktJobs || [])) jobBy[j.p] = j;
  const out = Object.create(null);
  for (const a of (D.mktAppts || [])) {
    if (!a.s || !a.r || mkET(a.s).slice(0, 7) !== pre) continue;
    const j = jobBy[a.p];
    if (!j || !j.r || j.r === a.r) continue;      // still with whoever ran it
    if (j.d) continue;                            // it closed — no complaint left
    const donor = roster[a.r];
    if (!donor || donor.active !== false) continue;  // only a departure hands work over
    const e = out[j.r] || (out[j.r] = { pids: new Set(), donors: new Set() });
    e.pids.add(j.p); e.donors.add(donor.name || 'a departed rep');
  }
  return out;
}

/* ── REP BOARD · LIVE ────────────────────────────────────────────────────────
   WHY THIS IS NO LONGER WITHHELD. The old refusal here pointed at Who closes
   what and said a month-sliced answer would be noisier than the all-time one.
   That reasoning was about rep × SOURCE cells, where a month really does
   leave n=2 in most of the grid — and it still holds, which is why the
   Google-conversion section below stays refused. It was never true of rep
   TOTALS: July gives Eric 110 leads, Mike 88, Travis 38. Those are
   denominators, and the section the approved board actually asked for.
   THE LEADS COLUMN DATES ON cc_raw->>project_created_at, not on the RPC's
   leads (jobs.created_at, the 20 Jul backfill — see MK_LEADS_FROM). That is
   the same clock the rest of this console calls the only honest lead date in
   the database, and it is what makes a monthly rep board possible while the
   RPC's own column is still refused two sections up. Cross-checked against
   the approved board's probe walk: Travis 38 leads on both instruments.
   UNITS AND DOLLARS date on contract_signed_at, correct in every window. */
function mkRepBoardData(monthKey){
  const pre = monthKey.slice(0, 7);
  const byRep = Object.create(null);
  const touch = id => byRep[id] || (byRep[id] = { leads: 0, leadPids: new Set(), units: 0, rev: 0 });
  for (const j of (D.mktJobs || [])) {
    if (!j.r) continue;
    if (j.t && mkET(j.t).slice(0, 7) === pre) { const e = touch(j.r); e.leads++; e.leadPids.add(j.p); }
    if (j.d && mkET(j.d).slice(0, 7) === pre) { const e = touch(j.r); e.units++; e.rev += Number(j.v || 0); }
  }
  const inh = mkInherited(monthKey);
  /* PRESENT IN THE PERIOD'S DATA, not present on today's payroll. This is the
     same law mktSellers now carries, and it is the reason Jared has a row. */
  const rows = (D.mktSellers || []).filter(r => byRep[r.id]).map(r => {
    const e = byRep[r.id], i = inh[r.id];
    /* Only inherited files that are actually IN this month's denominator may
       come out of it. Travis holds 41 inherited PIDs; 29 carry a July lead
       date and 12 are older files that were never in the July cohort to
       begin with. Subtracting all 41 would flatter him with a denominator
       the board never charged him for. */
    const inCohort = i ? [...i.pids].filter(p => e.leadPids.has(p)).length : 0;
    const adjLeads = e.leads - inCohort;
    return { ...r, leads: e.leads, units: e.units, rev: e.rev,
             close: e.leads ? 100 * e.units / e.leads : null,
             held: i ? i.pids.size : 0, inCohort, adjLeads,
             donors: i ? [...i.donors] : [],
             adjClose: (inCohort > 0 && adjLeads > 0) ? 100 * e.units / adjLeads : null };
  }).sort((a, b) => b.rev - a.rev);
  /* Production on desks that are not seller rows — office-booked Oasis work,
     a manager who signed one. Stated rather than rendered, so no dollar goes
     missing between this board and the money row above it. */
  const seller = new Set(rows.map(r => r.id));
  let otherUnits = 0, otherRev = 0;
  for (const [id, e] of Object.entries(byRep)) if (!seller.has(id)) { otherUnits += e.units; otherRev += e.rev; }
  const tl = rows.reduce((n, r) => n + r.leads, 0), tu = rows.reduce((n, r) => n + r.units, 0);
  return { rows, otherUnits, otherRev, blended: tl ? 100 * tu / tl : null };
}
