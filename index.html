    border-radius: 10px; padding: 12px; margin-top: 10px; }
  .withheld .wt { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
  .withheld .wx { font-size: 12px; line-height: 1.6; color: var(--text-dim); }
  .note { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
    line-height: 1.7; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .note b { color: var(--text); font-weight: 600; }

  /* ── the touch suite (5 Aug — "touch data no different than sales data") ── */
  /* The branded band above the effort cards. This page gets filmed for the
     owner film, so the effort section carries the product lockup — gold
     treatment borrowed from .mbanner so it reads native, not as an ad. */
  .prodband { border: 1px solid rgba(212,177,90,0.35); border-radius: 14px;
    padding: 16px; margin-bottom: 4px; break-inside: avoid;
    background: linear-gradient(135deg, rgba(212,177,90,0.08), rgba(240,131,74,0.05)); }
  .prodband .pb-e { font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
  .prodband .pb-t { font-family: 'Fraunces', serif; font-size: 21px; margin-top: 5px; }
  .prodband .pb-t em { font-style: italic; color: var(--accent-soft); }
  .prodband .pb-s { font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }
  /* 4-Touch Light traffic bar: green/yellow/red segments with 2px gaps, and
     the counts always ride in text beside it — never color alone. */
  .lightbar { display: flex; height: 12px; border-radius: 4px; overflow: hidden;
    gap: 2px; margin: 7px 0 4px; background: rgba(255,255,255,0.04); }
  .lightbar i { display: block; height: 100%; }
  /* Effort × Results quadrant — positioned initials dots over median axes. */
  .quad { position: relative; height: 260px; background: var(--bg-card-hi);
    border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .quad .qx, .quad .qy { position: absolute; background: rgba(255,255,255,0.10); }
  .quad .qx { left: 4%; right: 4%; height: 1px; }
  .quad .qy { top: 6%; bottom: 6%; width: 1px; }
  .quad .qtag { position: absolute; font-family: 'JetBrains Mono', monospace;
    font-size: 8px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-dim); }
  .quad .qdot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700;
    color: #0d1f17; box-shadow: 0 0 0 2px var(--bg-card-hi); cursor: pointer; }
  .quad-cap { display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim); margin-top: 6px; }

  /* ── login. The only thing a logged-out visitor ever sees. Carries no
        business data of any kind — no names, no numbers, no brands. ── */
  .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(20px + env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)); }
  .gatebox { width: 100%; max-width: 380px; }
  .gatebox h1 { font-family: 'Fraunces', serif; font-weight: 400; font-size: 30px;
    letter-spacing: -0.02em; line-height: 1.05; margin: 6px 0 22px; }
  .gatebox h1 em { font-style: italic; color: var(--accent-soft); font-weight: 300; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 9px;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }
  .field input { width: 100%; background: var(--bg-card); border: 1px solid var(--line);
    border-radius: 11px; padding: 14px; color: var(--text); font-family: 'Inter Tight', sans-serif;
    font-size: 16px; min-height: 50px; }
  .field input:focus { outline: none; border-color: rgba(240,131,74,0.5); }
  /* Show/hide password. The eye sits inside the field; input gets right padding
     so long passwords never run under it. */
  .pwwrap { position: relative; }
  .pwwrap input { padding-right: 66px; }
  .pweye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--text-dim); cursor: pointer;
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em;
    text-transform: uppercase; font-weight: 700; padding: 10px 10px; min-height: 40px; }
  .pweye:active { color: var(--accent); }
  .gobtn { width: 100%; min-height: 50px; margin-top: 6px; border: none; border-radius: 11px;
    background: var(--accent); color: #17110c; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 700; cursor: pointer; }
  .gobtn:disabled { opacity: 0.55; cursor: default; }
  .gateerr { font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.6;
    color: var(--red); margin-top: 12px; }
  .gateerr.ok { color: var(--green-soft); }
  .linkbtn { display: block; width: 100%; margin-top: 14px; background: none; border: none;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--text-dim); cursor: pointer; min-height: 44px; }
  .linkbtn:hover { color: var(--accent-soft); }
  .gatefoot { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--text-dim);
    letter-spacing: 0.08em; line-height: 1.7; margin-top: 20px; padding-top: 14px;
    border-top: 1px solid var(--line); }
  .loading { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-dim);
    letter-spacing: 0.14em; text-transform: uppercase; text-align: center; padding: 60px 20px; line-height: 2; }
  .signout { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; background: transparent; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; min-height: 40px; }

  /* chart fallback — a chart that fails must SAY so, never leave a silent gap */
  .chartfail { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold);
    line-height: 1.6; padding: 22px 6px; text-align: center; }

  /* ── DESKTOP: the same cards, flowing wider. Not a squished phone. ── */
  /* ── DESKTOP ───────────────────────────────────────────────────────────────
     Kevin, on his monitor: "so many gaps in space, can we make this better
     formed. sloppy."

     He was right, and it was structural rather than cosmetic. The old desktop
     rule was a rigid 3-column grid, but eight of the nineteen cards spanned all
     three columns. Every one of those breaks the grid into a fresh row, so any
     leftover single card sat alone with two empty columns beside it. Measured:
     3,531px of dead space in four such rows.

     Masonry removes the failure mode instead of tuning around it. Cards flow
     into the shortest column and cannot leave a hole, whatever mix of heights
     the data produces on a given day — which matters, because the card set is
     not fixed: signals appear and vanish, withheld blocks come and go.

     Only two cards still break the flow to span the full width — the actions
     card and the appointments instrument — because those two are what he opens
     this for and should not be hunted for in a column. Everything else masonry-
     fills beneath them.

     Mobile is untouched: .stack stays a plain flex column below 900px.
     ─────────────────────────────────────────────────────────────────────── */
  @media (min-width: 900px) {
    body { padding: 26px 26px 44px; }
    .shell { max-width: 1180px; }
    .hdr h1 { font-size: 36px; }
    .nw-block .nw { font-size: 38px; }

    .stack { display: block; columns: 2; column-gap: 26px; }
    /* a card must never be sliced down the middle by a column break */
    .stack > * { break-inside: avoid; page-break-inside: avoid; -webkit-column-break-inside: avoid;
                 display: block; width: 100%; margin: 0 0 26px; }
    /* .full loses its meaning here — in masonry every card already fills its own
       column. Reset it FIRST: it and the .acts/.appt rule below have equal
       specificity, so source order decides, and most spanning cards also carry
       .full. Putting this after silently cancelled the span. */
    .stack > .full { column-span: none; }
    /* the two that earn the full width */
    .stack > .acts, .stack > .appt, .stack > .apco-band, .stack > .intel-band { column-span: all; margin-bottom: 26px; }
    /* The bands of the rebuilt console each read across the page, not down a
       column: the rep board, the marketing pair, the quadrant and the drawer
       are the page's structure, and a structure packed into columns stops
       being one. The room spans for a second reason — opening it must not
       reflow the two columns beside it. */
    .stack > .room { column-span: all; margin-bottom: 26px; }
    /* …and the console itself is bands, not masonry. Six statements read in
       order down the page, each one full width; a band packed into a column
       stops being a band. Drill-ins keep the two- and three-column fill, because
       a drill-in is a set of cards rather than a sequence of statements. */
    .stack.bands { columns: 1; }

    /* Folded rows run the full width as a strip beneath the grid, rather than
       being packed into the columns with everything else. Two reasons, both
       measured. A 45px row mixed among 400px cards wrecks the balance — the
       third column was ending 686px above the other two, which is the same
       "gaps in space" he called sloppy the first time. And a row that is only a
       title and a figure wants to be read across, not stacked into a narrow
       column. The result is three tiers: what needs him, appointments, then the
       instruments, then a quiet strip he can open when he wants it. */
    .stack > .mnr { column-span: all; margin-bottom: 10px; }
    /* ...but only where folds arrive as a group. A drill-in has exactly one, and
       spanning it there forces a column break in the middle of the flow for no
       gain: measured at 167px of interior holes, worst gap 68px. One row does not
       make a strip, so in a drill-in it stays in its column, next to the Oasis
       figure it is the receipts for. */
    .stack.dive > .mnr { column-span: none; margin-bottom: 26px; }
    /* The strip is full width because a folded row reads across. What it opens
       should not be: a seven-bar weekday chart stretched to 1526px, and note
       text set in one 1500px line, are both harder to read than the same thing
       at a sane measure. The row stays wide, its contents do not. */
    .card.mnr.open .mnr-body { max-width: 860px; }
  }
  @media (min-width: 1300px) {
    .shell { max-width: 1480px; }
    .stack { columns: 3; }
    /* "the hero pair sit side by side once there is room for both" was wrong, and
       measurement is what showed it: .appt spans every column, so it always forces
       a break, and dropping .acts back into a single column left the other two
       empty beside it — 630px of nothing, twice over. The two heroes are stacked
       full-width bands instead. Nothing sits beside them, so nothing is missing
       beside them either. */
  }
  /* Three columns is the ceiling, on any monitor. A fourth column was measured
     doing real damage: at 1700px six of the nine chart canvases were drawn wider
     than the card holding them, because a column that narrow leaves Chart.js no
     room to lay an axis out. It also read as an alarm panel — fifteen cards in
     four columns puts everything in the first screenful with no hierarchy left.
     Past this width the page stops adding columns and just breathes. */
  @media (min-width: 1700px) {
    .shell { max-width: 1560px; }
  }

  /* ── THE SECTION RAIL ──────────────────────────────────────────────────────
     On a desktop the console is no longer one continuous column: a persistent
     left rail selects ONE section, and only that section is in the DOM. The
     page becomes the room — the same solo-and-close reading the Effort Room
     taught, promoted to the whole console.

     MOUNTED, NEVER HIDDEN. The unselected sections are not display:none'd —
     they are not rendered at all. Six sections alive behind five hidden ones
     would keep every chart and every after-paint fetch running for surfaces
     nobody is reading, which defeats the point of sectioning.

     DESKTOP ONLY, AND 900px IS THE LINE — the same line the masonry, the
     minor-card folds and minorOpen() already break on, so "has a rail" and
     "reads as a desktop" can never disagree. Below it the single-column
     scroll is byte-for-byte what it was, which also keeps phone.html and
     preview.html honest: both frame this page at phone width, and an iframe
     answers media queries with its own viewport. */
  .rail { display: none; }
  @media (min-width: 900px) {
    body.railed { padding-left: 214px; }
    .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 188px; z-index: 50;
      display: flex; flex-direction: column; gap: 4px; padding: 26px 12px;
      background: rgba(13,31,23,0.92); border-right: 1px solid var(--line); }
    .rail-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent);
      padding: 0 12px 14px; }
    .rail-btn { display: flex; align-items: center; gap: 8px; width: 100%;
      background: none; border: 1px solid transparent; border-radius: 10px;
      padding: 10px 12px; cursor: pointer; text-align: left; color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.12em; text-transform: uppercase;
      transition: color .12s, background .12s, border-color .12s; }
    .rail-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
    .rail-btn.on { color: var(--accent-soft); border-color: rgba(240,131,74,0.4);
      background: rgba(240,131,74,0.07); }
    /* The one badge the rail carries: how many rows the Attention board holds
       right now. No other section gets a count — a rail of six numbers is an
       alarm panel, and the whole board is one click away. */
    .rail-badge { margin-left: auto; font-family: 'JetBrains Mono', monospace;
      font-size: 9px; font-weight: 700; color: var(--gold);
      border: 1px solid rgba(212,177,90,0.45); border-radius: 100px; padding: 1px 7px; }
  }

  .m2-tag.cc { color: var(--blue); border-color: rgba(107,168,201,0.3); }

<body>
<!-- The gate. Static markup, no business data — this is the whole of what an

<div class="shell" id="app" style="display:none"></div>

<script>
/* ── formatting ───────────────────────────────────────────────────────────── */
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const short = n => { const a = Math.abs(n);
  return a >= 1e6 ? '$' + (n/1e6).toFixed(2) + 'M' : a >= 1e3 ? '$' + Math.round(n/1e3) + 'K' : '$' + Math.round(n); };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ══ THE VITALS · EVERY THRESHOLD, IN ONE PLACE ═══════════════════════════════
   KD: this block is the whole tuning surface for the login hero. Change a
   number here and the tile colour, the glow and the blended master all move
   with it — no threshold is written down anywhere else, so there is nothing to
   hunt for and nothing that can drift out of step.

   HOW A COLOUR IS DECIDED. Every vital reduces to one number called BADNESS,
   always on the same scale of meaning: 0 is healthy, and it climbs as the
   vital gets worse. Each vital's badness is measured in the units that suit
   it — a shortfall fraction, percentage points, days — and each carries its
   own `watch` and `problem` line on that scale:

     badness <  watch    → GREEN   healthy
     badness <  problem  → YELLOW  watch it
     badness >= problem  → RED     problem

   Badness is one-sided ON PURPOSE, which is the break from the pulse card's
   old |z| bands. A week of signings 40% ABOVE the median is not a problem and
   must not light up beside a week 40% below it; a heat map is a goodness
   scale, not an unusualness scale. Anything better than normal scores 0.

   THE MASTER IS THE SAME ARITHMETIC, BLENDED. Each vital's badness is divided
   by its own `problem` line and clipped to 0–1, which makes the four unit-free
   and comparable; the master is 100 minus their mean, so 100 means every
   blended vital is sitting at or better than healthy and 0 means every one of
   them is at or past its problem line. Distances ADD rather than cancel — the
   one thing a mean of signed deviations could never do, and the reason the old
   composite could read "in rhythm" in green with red rails underneath it. */
const VIT = {
  /* How many trailing periods make the reference median. Eight weeks is two
     months of business — long enough that one big job cannot move it, short
     enough to still be this season. */
  weeks: 8,
  /* THE MASTER, on a 0–100 health scale. These two numbers are not arbitrary:
     75 is the point where the blended vitals average a quarter of the way to
     their problem lines, and 50 is halfway. */
  master: { watch: 75, problem: 50 },

  /* MARKETING · blended dollars back per $1, last CLOSED month, against the
     median of the closed months before it AND against KD's floor.
     Badness = the larger of the two shortfalls, as a fraction:
       0.15 = 15% under the reference · 0.35 = 35% under it.
     THE FLOOR IS IN HERE FOR THE SAME REASON DAYS-OUT HAS ONE: a business that
     has spent a year at $6 back per $1 has a median of $6, and scoring against
     that median alone would report a chronic problem as perfectly healthy. */
  marketing: { floor: 10, watch: 0.15, problem: 0.35 },

  /* SALES · signed dollars in the last 7 days against the trailing-8-week
     median of the same. Badness = the shortfall fraction below that median. */
  sales: { watch: 0.15, problem: 0.35 },

  /* PRODUCTION · the share of the open backlog that has gone stale, against
     the trailing-8-week median of that same share.
     Badness is in PERCENTAGE POINTS off the median, not a percentage of it,
     because the level itself is meaningless here: 188 open jobs are over a
     year old and hold the share permanently high, so a relative band would be
     numb to a real move. Points off its own median stay readable at any level.
       stallDays / deepDays are the two age lines the drill reports. */
  production: { stallDays: 14, deepDays: 30, watch: 3, problem: 8 },

  /* MONEY · the dollar-weighted mean age of every open balance, in days.
     A FIXED BAND, NOT A MEDIAN, and that is deliberate: receivables age in one
     direction only, so a book that has always sat at 70 days would score its
     own worst habit as normal. Badness = days past `good`. */
  money: { good: 30, watch: 45, problem: 60 },

  /* A median wants samples behind it. Under this many typed months, MARKETING
     reads against the floor alone and says so rather than claiming a normal. */
  minMonths: 3,
};
/* The four state colours, and the same four as rgb triplets for the glows. Kept
   adjacent so the two can never drift apart — the same pairing the pulse
   traces use. `dark` is a feed that is not wired: grey, never green. */
const VIT_C   = { green:'var(--green)', yellow:'var(--gold)', red:'var(--red)', dark:'var(--text-dim)' };
const VIT_RGB = { green:'108,194,139', yellow:'212,177,90', red:'217,106,94', dark:'138,160,148' };

/* Brand colours per Kevin's model: Fencing green, Oasis blue, Pro-Tec gold. */
/* Contractors Cloud carries Pro-Tec (1563) and Liberty Roofing (1537) as two
   companies. They are one business — Liberty Roofing is the DBA — so they roll
   up to a single displayed brand everywhere. The raw ids stay in the data and
   stay queryable; only the display is merged. */
const ROLLUP = { '1537': '1563' };
const rollup = id => ROLLUP[String(id)] || String(id);

const BRANDS = {
  '1461': { n:'Liberty Fencing',   s:'Fencing', c:'#6cc28b' },
  '1560': { n:'Oasis Landscapes',  s:'Oasis',   c:'#6ba8c9' },
  '1563': { n:'Pro-Tec Roofing',   s:'Pro-Tec', c:'#d4b15a', rolls:['1563','1537'] },
};
/* Display order, and the guarantee that every brand appears. A brand missing
   from a mix reads as "the console is broken" rather than "they signed nothing",
   so every one of these is rendered even at zero. */
const BRAND_ORDER = ['1461','1560','1563'];
const brandOf = id => BRANDS[rollup(id)] || { n:'Unmapped '+id, s:'?'+id, c:'#8aa094', unmapped:true };

/* Fill a brand list so every known brand is present, zeros included, in a
   stable order with any unmapped ids kept on the end rather than dropped. */
function allBrands(rows){
  const by = Object.fromEntries((rows||[]).map(r => [String(r.id), r]));
  const known = BRAND_ORDER.map(id => by[id] || { id, jobs:0, rev:0, zero:true });
  const extra = (rows||[]).filter(r => !BRANDS[String(r.id)]);
  return [...known, ...extra];
}

let D = null;
/* ── THE MONTH TIME MACHINE ─────────────────────────────────────────────────
   Kevin (1 Aug): "we don't have anything that shows previous months data. Like
   I can't see last month at all." He asked on the exact morning the problem is
   worst — August 1, when MTD resets and all of July vanishes from the page.

   MONTHOFF is how many months back the MONTH window is anchored: 0 = the live
   month, 1 = last month, … capped at 12 (appointments are only fetched 13
   months back, so beyond that the appointment tiles would silently read low —
   the cap keeps every shifted surface honest rather than mostly-honest).

   The shift is applied where the month window is BUILT (WINS in buildData), so
   every month-scoped card inherits it at once — hero, month so far, sales by
   rep, quota fleet, appointments by company, lead sources, the month dive.
   That is Kevin's own ruling applied again: "we click week, months and
   everything just shifts — super useful, should be used anytime we can."
   Day / week / YTD stay anchored to now — a banner states the split. */
let MONTHOFF = 0;
let RAW = null;   // the fetched rows, kept so a month shift can rebuild D without refetching
const MNAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function setMonthOff(n){
  MONTHOFF = Math.max(0, Math.min(12, n));
  if (!RAW) return;
  keepScroll(() => { D = buildData(RAW); });
}
/* The banner riding above any shifted page. Projections and "pace" language
   disappear while it is up (a closed month has no pace); this is the one
   loud thing that explains why. */
function monthBanner(){
  if (!MONTHOFF) return '';
  const nowName = MNAMES[new Date().getMonth()];
  return `<div class="mbanner"><span>Viewing <b>${esc(D.windows.month.label)}</b> — every month-scoped card on this page is showing ${esc(D.windows.month.label)}. Today, week and YTD figures stay live as always.</span>
    <button onclick="setMonthOff(0)">back to ${esc(nowName)}</button></div>`;
}
// Card-scoped windows. The page as a whole stays MTD per the model; only the
// scoreboard and the lead-source table carry their own range.
/* LEADWIN / LEADTRADE retired 16 Aug 2026 with cardLeads() — they were that
   card's window and trade toggles and nothing else read them. The marketing
   drawer keeps its own month in MKTOFF. */
let EFFWIN = 'month';
/* Defaults to month: it is where Kevin's question started ("month-to-date
   doesn't break down per company") and the most stable of the three — a single
   day of bookings is noisy and half-filled, a month-to-date is not. */
let APPTCOWIN = 'month';
let QUOTAWIN = 'month';
// null = the snapshot home; 'day'|'week'|'month'|'ytd' = that window, full screen
let DIVE = null;
// null = no rep open; a rep id = that person's one-pager, full screen
let RDIVE = null, REPWIN = 'month';
/* v1 follows the model's own windows: the month card set is monthly, the
   week-over-week card is weekly. No window toggle — that is a later iteration.
   build-console.mjs nests window totals under .company while `prev` arrives
   already flattened, so flatten here and both sides of every comparison read
   the same way. */
const flat = k => ({ ...D.windows[k], ...D.windows[k].company });
/* Is the Billdu side missing rather than empty? A silent fall back to CC-only
   is the worst of the three states: an Oasis-inclusive figure and a CC-only
   figure look identical, and Kevin has no way to tell which one he is reading.
   Withheld, not zero — say it on the face of the number. */
const billduDown = () => !D.oasisLag;
const w  = () => flat('month');
const wk = () => flat('week');
/* The month window's span label, time-machine-aware: "this month" only while
   the page is on the live month — a shifted page saying "this month" over
   July's numbers is the misread the banner exists to kill. */
const mSpan = () => MONTHOFF ? D.windows.month.label : 'this month';
const qbOK = () => D.qb && !D.qb.unavailable;
const qbw = () => qbOK() ? D.qb.windows.month : null;
const qbWinOf = k => qbOK() ? D.qb.windows[k] : null;
const charts = [];

/* ── header ───────────────────────────────────────────────────────────────── */
/* ── THE CALENDAR RESET, EXPLAINED ──────────────────────────────────────────
   Kevin, Monday morning: "Tim and Matt show no sales for the week however we
   know oasis had sales yesterday."

   Nothing was broken. The week had rolled over a few hours earlier, so every
   week-scoped board was showing a few hours of trading and reading as a hole.
   That is the instrument asking him to do calendar arithmetic before he can
   trust it, which is the same failure as a pace figure quoted on day one.

   So any week surface that is too young to mean anything says so, and carries
   what last week actually closed at. Two gates, because Monday 8am and Tuesday
   8am both look empty for the same innocent reason:

     · the week began today, or
     · it is barely underway and holds a small fraction of what last week did.

   A genuinely bad week still shows the line, and that is fine — it says "last
   week closed at X" and lets him draw his own conclusion, rather than hiding an
   empty board behind an excuse. ─────────────────────────────────────────────── */
function weekReset(){
  const W = flat('week');
  const daysIn = W.prevSpanDays || 1;
  const full = W.prevFull || W.prev || { rev:0, jobs:0, reps:[] };
  if (daysIn > 2) return null;
  const thin = full.rev > 0 && W.rev < full.rev * 0.35;
  if (daysIn > 1 && !thin) return null;
  return { daysIn, full,
           began: daysIn <= 1 ? 'Week began today' : `Week is ${daysIn} days old`,
           // unattributed pseudo-rows never rank as a person (who-signed-it ruling)
           topReps: (full.reps || []).filter(r => r.rev > 0 && !r.office).slice(0, 3) };
}

function weekResetNote(){
  const r = weekReset(); if (!r) return '';
  const reps = r.topReps.length
    ? ` — ${r.topReps.map(x => `${x.id && D.roster && D.roster[String(x.id)] ? `<span class="tapname" onclick="event.stopPropagation();openRep('${esc(String(x.id))}')">${esc(x.name)}</span>` : esc(x.name)} ${short(x.rev)}`).join(', ')}`
    : '';
  return `<div class="weeknote">
    <span class="wn-k">${esc(r.began)}</span>
    <span class="wn-t">Last week closed at <b>${short(r.full.rev)}</b> across ${r.full.jobs} contract${r.full.jobs===1?'':'s'}${reps}.
    A quiet board this early is the calendar resetting, not missing data.</span>
  </div>`;
}

/* Full span of each window, for projecting a pace. */
function spanOf(k){
  const n = new Date();
  if (k === 'day')  return 1;
  if (k === 'week') return 7;
  // the VIEWED month's own length — with the time machine on, "the month" may
  // be February, and pace math against the live month's 31 days would lie
  if (k === 'month') return new Date(n.getFullYear(), n.getMonth() - MONTHOFF + 1, 0).getDate();
  const eoy = new Date(n.getFullYear(), 11, 31);
  return Math.round((eoy - new Date(n.getFullYear(),0,1)) / 86400000) + 1;
}
function paceOf(k){
  const W = flat(k), full = spanOf(k), el = W.prevSpanDays || 1;
  return el >= full ? W.rev : W.rev / el * full;
}

/* ── SNAPSHOT: four windows at a glance, each one a door. ── */
let HEROWIN = 'day';
function setHeroWin(k){ keepScroll(() => { HEROWIN = k; }); }
/* ── THE HERO, CONSOLIDATED. Kevin (28 Jul): "we click week, months and
   everything just shifts — super useful, should be used anytime we can. Seems
   like we could squeeze everything into one page easier." Four signed tiles
   and a three-cell money strip became ONE toggled block: pick the window,
   signed and built both re-scope. A/R has no window and says so.
   Signed stays CC + Billdu union; built stays QuickBooks invoiced; the two
   are never added — same laws as the tiles this replaces. */
/* Trending-to-finish, compressed into the hero — Kevin (29 Jul): "consolidate
   trending to finish with the beginning totals boxes." Month window only:
   a projection needs a month to project. Same shape-aware math as the full
   card, which stays intact behind the fold. */
function heroTrend(){
  if (MONTHOFF) return '';   // a closed month has no "trending to finish" — it finished
  const W = flat('month'), SH = D.monthShape || {};
  const elapsed = SH.elapsedDOM || W.prevSpanDays;
  const days = SH.dim || new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const rows = allBrands(W.brands).sort((a,b) => b.rev - a.rev);
  if (!rows.length) return '';
  return `<div class="herotrend">
    <div class="ht-cap">Trending to finish · day ${elapsed} of ${days} · projected from each brand's own fill shape</div>
    ${rows.map(b => {
      const m = brandOf(b.id);
      const linear = elapsed ? b.rev / elapsed * days : b.rev;
      const sh = SH[b.id];
      const shaped = (sh && sh.frac > 0 && sh.n >= 3) ? Math.round(b.rev / sh.frac) : null;
      const proj = shaped != null ? shaped : linear;
      const tgt = D.targets.monthly[b.id] || 0;
      const hit = tgt && proj >= tgt;
      const mx = Math.max(proj, tgt, 1);
      return `<div class="ht-row">
        <div class="ht-top"><span>${esc(m.s)}</span>
          <span class="ht-v" style="color:${tgt?(hit?'var(--green-soft)':'var(--gold)'):'var(--text)'}">${short(proj)}</span></div>
        <div class="meter"><div class="meter-fill" style="width:${Math.round(b.rev/mx*100)}%;background:${m.c}"></div></div>
        <div class="ht-sub">${short(b.rev)} so far${tgt?` · ${hit?`clears goal ${short(tgt)}`:`short of goal ${short(tgt)}`}`:''} · ${shaped!=null?`shape from ${sh.n} mo`:'flat rate'}</div>
      </div>`;}).join('')}
  </div>`;
}

function hdrTitle(){
  return `<div style="margin-bottom:14px">
    <div class="eyebrow">TruReview · three companies</div>
    <h1>TruReview <em>Autopilot</em></h1>
  </div>`;
}
function hdr(){
  const mBtn = MONTHOFF ? MNAMES[new Date(new Date().getFullYear(), new Date().getMonth() - MONTHOFF, 1).getMonth()].slice(0,3) : 'MTD';
  const k = HEROWIN, label = { day:'Today', week:'This week', month: MONTHOFF ? D.windows.month.label : 'MTD', ytd:'YTD' }[k];
  const W = flat(k), pv = W.prev;
  const d = pv.rev ? Math.round((W.rev - pv.rev)/pv.rev*100) : null;
  const wr = k === 'week' ? weekReset() : null;
  const seam = [[W.ccRev,'CC'],[W.billdu,'Billdu'],[W.rungRev,'🔔 rung']]
    .filter(([v]) => v).map(([v,l]) => `${short(v)} ${l}`).join(' + ');
  const sub = wr
    ? `${wr.daysIn <= 1 ? 'began today' : wr.daysIn + ' days in'} · last wk ${short(wr.full.rev)}`
    : (W.billdu || W.rungRev)
      ? seam
      : (W.prevSpanDays >= spanOf(k) ? `${W.jobs} signed` : `pace ${short(paceOf(k))}`);
  const q = qbWinOf(k);
  return `<div class="hdr">
    ${monthBanner()}
    <div class="seg" style="margin:0 0 10px">
      ${[['day','Today'],['week','Week'],['month',mBtn],['ytd','YTD']].map(([kk,l])=>`<button class="${kk===k?'on':''}" onclick="setHeroWin('${kk}')">${l}</button>`).join('')}
    </div>
    ${k === 'month' ? `<div class="mnav">
      <button class="mn-btn" ${MONTHOFF>=12?'disabled':''} onclick="setMonthOff(MONTHOFF+1)" aria-label="Previous month">‹</button>
      <span class="mn-cur${MONTHOFF?' back':''}">${MONTHOFF ? esc(D.windows.month.label) : 'This month'}</span>
      <button class="mn-btn" ${MONTHOFF?'':'disabled'} onclick="setMonthOff(MONTHOFF-1)" aria-label="Next month">›</button>
      ${MONTHOFF?`<button class="mn-now" onclick="setMonthOff(0)">back to now</button>`:''}
    </div>` : ''}
    <div class="hero1">
      <button class="snap bigsnap" onclick="openWindow('${k}')" aria-label="Signed ${esc(label)} — open details">
        <div class="snap-k" style="color:var(--green)">Signed · ${esc(label)}</div>
        <div class="alloc-chart"><canvas id="cHeroMix"></canvas>
          <div class="alloc-center"><div class="big">${short(W.rev)}</div><div class="lbl">signed</div></div></div>
        <div class="alloc-legend">${allBrands(W.brands).map(b => { const m = brandOf(b.id);
          const rg = W.rung && W.rung.byBrand[String(b.id)];
          return `<div class="alloc-row" ${(b.rev||rg)?'':'style="opacity:.55"'}>
            <div class="alloc-dot" style="background:${m.c}"></div>
            <div class="name">${esc(m.n)}${b.billdu?'<span class="tick">billdu</span>':''}${rg?`<span class="tick bell">🔔 ${short(rg.value)} rung</span>`:''}</div>
            <div class="val">${b.rev?`${short(b.rev)} · ${pct(b.rev, W.rev)}%`:'$0'}</div></div>`; }).join('')}</div>
        ${W.rung && W.rung.value ? `<div class="snap-bell">incl. 🔔 <b>${short(W.rung.value)}</b> rung · ${W.rung.count} deal${W.rung.count===1?'':'s'} awaiting the book — comes off in 5 business days if never turned in<span class="feed-tag bell">bell</span></div>` : ''}
        <div class="snap-s">${sub}</div>
        <div class="snap-d ${d===null?'flat':d>=0?'up':'down'}">${d===null?'—':(d>=0?'▲':'▼')+' '+Math.abs(d)+'% vs '+esc(W.prevLabel)}</div>
        <div class="snap-go">details <span class="go-chev">›</span></div>
      </button>
      ${heroAppts(k)}
      <button class="snap" onclick="openWindow('${k}')" aria-label="Built ${esc(label)} — open details">
        <div class="snap-k" style="color:var(--gold)">Built · ${esc(label)}</div>
        ${q && q.invoiced ? `<div class="alloc-chart mm"><canvas id="cHeroBuilt"></canvas>
          <div class="alloc-center"><div class="big">${short(q.invoiced)}</div><div class="lbl">built</div></div></div>
        <div class="alloc-legend mml">${BRAND_ORDER.map(id => { const v = (q.byBrand && q.byBrand[id]) ? q.byBrand[id].invoiced : 0; const m = brandOf(id);
          return `<div class="alloc-row" ${v?'':'style="opacity:.55"'}><div class="alloc-dot" style="background:${m.c}"></div><div class="name">${esc(m.s)}</div><div class="val">${v?`${short(v)} · ${pct(v,q.invoiced)}%`:'—'}</div></div>`; }).join('')}</div>
        <div class="snap-s">${q.count} invoice${q.count===1?'':'s'} · billed when built · qb</div>`
            : q ? `<div class="snap-v" style="color:var(--gold)">$0</div><div class="snap-s">no invoices ${esc(label==='Today'?'today':'in this window')} · qb</div>`
            : `<div class="snap-v" style="color:var(--text-dim)">withheld</div><div class="snap-s">qb not readable</div>`}
        <div class="snap-go">details ›</div>
      </button>
      <button class="snap" onclick="openWindow('month')" aria-label="Open accounts receivable — open details">
        <div class="snap-k" style="color:var(--accent-soft)">Open A/R</div>
        ${qbOK() && D.qb.arTotal ? `<div class="alloc-chart mm"><canvas id="cHeroAR"></canvas>
          <div class="alloc-center"><div class="big">${short(D.qb.arTotal)}</div><div class="lbl">open</div></div></div>
        <div class="alloc-legend mml">${BRAND_ORDER.map(id => { const a = (D.qb.ar||[]).find(x=>String(x.id)===id); const v = a?a.ar:0; const m = brandOf(id);
          return `<div class="alloc-row" ${v?'':'style="opacity:.55"'}><div class="alloc-dot" style="background:${m.c}"></div><div class="name">${esc(m.s)}</div><div class="val">${v?`${short(v)} · ${pct(v,D.qb.arTotal)}%`:'—'}</div></div>`; }).join('')}</div>
        <div class="snap-s">billed, not yet paid · qb · all time, not window-sliced</div>`
             : qbOK() ? `<div class="snap-v" style="color:var(--accent-soft)">$0</div><div class="snap-s">nothing outstanding · qb</div>`
             : `<div class="snap-v" style="color:var(--text-dim)">withheld</div><div class="snap-s">qb not readable</div>`}
        <div class="snap-go">details ›</div>
      </button>
    </div>
    ${k === 'month' ? heroTrend() : ''}
    <div class="snaphint">Signed = every sale on the board — CC contracts + Oasis via Billdu + 🔔 rung bells awaiting the book, each part labeled, same union as the rep board below (Kevin's 10 Aug ruling: "that needs to match"). A bell counts the moment it rings, hands off to the feed the moment CC or Billdu books it, and comes off after 5 business days if never turned in — the managers get a notification when one does. Built = invoiced in QuickBooks; Signed and Built are never added together.</div>
  </div>`;
}

/* ── APPOINTMENTS · the headline row's second tile ───────────────────────────
      Kevin: "Like daily weekly monthly appt are soooo important to me… It's so
      crucial to my stress. Appts good life good. Appts bad pay attention need
      more." So the number he worries about sits IN the money row — Signed,
      Appointments, Built, Open A/R — rather than in a card below it. It takes
      the full-width slot the team-touch tile held: effort moved into the Effort
      Room in the same rebuild, and its numbers ride the room's own summary line
      so the fold still carries them.

      Reads D.appointments.byCompany — the same feed, windows and measured
      typical the by-company band in the marketing band reads, so the tile and
      the band can never disagree. ─────────────────────────────────────────── */
/* ── EKG sparkline — the trace, not the axis ─────────────────────────────────
   A day-bucketed count drawn as a continuous line instead of bars, with a
   faint dashed twin underneath for the typical pace, so ahead/behind reads as
   the GAP BETWEEN TWO LINES rather than a number in a footnote. Zero-
   baselined — 0 is always the floor of the y-axis, never the series' own
   minimum, so the shape can never be made to look steeper than it is. The
   reference line is drawn first and stays a line, never a second bar. `id`
   just needs to be unique per instance on the page — this card only ever
   draws four (one hero trace, three brand minis). */
function ekgSpark(days, { id, w = 280, h = 48, mini = false, color = 'var(--green)', glow = 'var(--accent)' } = {}) {
  if (!days || days.length < 2) return '';
  const pad = mini ? 1.5 : 3;
  /* THE REFERENCE IS OPTIONAL, AND A MISSING ONE DRAWS NOTHING. Every caller
     that has a typical passes one on every point; the vitals hero has traces
     whose reference median cannot be claimed yet (too few samples behind it),
     and a "typical" line quietly pinned to zero — or to the actual — would be
     a reference invented by the drawing code. No point, no line. */
  const refs = days.filter(x => x.t != null);
  const vMax = Math.max(1, ...days.map(x=>x.v), ...refs.map(x=>x.t)) * 1.18;
  const n = days.length, stepX = (w - pad*2) / (n - 1);
  const X = i => pad + i * stepX;
  const Y = v => h - pad - (Math.max(0,v) / vMax) * (h - pad*2);
  const actual  = days.map((x,i)=>`${X(i).toFixed(1)},${Y(x.v).toFixed(1)}`).join(' ');
  const typical = days.map((x,i)=> x.t == null ? null : `${X(i).toFixed(1)},${Y(x.t).toFixed(1)}`)
    .filter(Boolean).join(' ');
  const lastX = X(n-1), lastY = Y(days[n-1].v);
  return `<svg class="ekg${mini?' ekg-mini':''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-hidden="true">
    <defs><filter id="${id}-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="${mini?1.4:2.6}"/>
    </filter></defs>
    <polyline points="${typical}" class="ekg-typ" fill="none" vector-effect="non-scaling-stroke"/>
    <polyline points="${actual}" class="ekg-line" fill="none" vector-effect="non-scaling-stroke"
      style="stroke:${color};filter:drop-shadow(0 0 ${mini?2:3}px ${color})"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="${mini?3.4:6}" class="ekg-dot-glow" style="fill:${glow}" filter="url(#${id}-glow)"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="${mini?1.6:2.8}" style="fill:${glow}"/>
  </svg>`;
}
/* ── RHYTHM BARS ────────────────────────────────────────────────────────────
   The comparison shape for Today, Week and YTD. Bars, because an appointment
   count is an AMOUNT — adding two of them means something — which is the test
   THE TOPS OF MOUNTAINS sets for whether a number may be a bar at all. The
   normal rides as a dashed reference LINE, never a second bar, so "how many"
   and "was that normal" stay two different questions with two different marks.

   ZERO BASELINE, ALWAYS. Bars are read by height off a shared floor; lifting
   that floor lies with the exact mechanism that makes them readable.

   The number lives ON the bar, per Kevin: "the chart pic doesn't show it… I have
   to guess based on the graph." */
function rhythmBars(items, { w = 280, h = 62, mini = false, refDash = true, color = 'var(--blue)' } = {}){
  if (!items || !items.length) return '';
  /* The padding buys room for the number above each bar and the label below it.
     The mini spark on a brand row hides both (see .alloc-spark in the CSS), and
     at h=22 the full padding is 25px — taller than the chart, which drove every
     bar height negative and clamped it to zero. The brand rows rendered as a
     dashed line floating over nothing. Mini keeps a hairline of breathing room
     and gives the rest to the bars. */
  const padT = mini ? 2 : 13, padB = mini ? 2 : 12, padX = 2;
  const vals = items.flatMap(i => [i.v, i.ref]).filter(v => v != null);
  if (!vals.length) return '';
  const vmax = Math.max(1, ...vals) * 1.18;
  const n = items.length, bw = (w - padX*2) / n;
  const Y = v => h - padB - (Math.max(0, v) / vmax) * (h - padT - padB);
  const cx = i => padX + i*bw + bw/2;
  const bars = items.map((it, i) => {
    if (it.v == null) return '';
    const y = Y(it.v), bh = (h - padB) - y;
    const fill = it.hot ? 'var(--accent)' : it.dim ? 'rgba(138,160,148,0.30)' : color;
    return `<rect x="${(padX + i*bw + bw*0.16).toFixed(1)}" y="${y.toFixed(1)}"
      width="${(bw*0.68).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" rx="2" fill="${fill}"/>`;
  }).join('');
  /* `num` restates what is PRINTED on a bar, never what is drawn: the height is
     always it.v. A bar of open dollars is read as "$132K", not as the six digits
     behind it — but the label and the bar must not be allowed to disagree, so a
     caller may reformat the figure and cannot substitute a different one. */
  const nums = items.map((it, i) => it.v == null ? '' :
    `<text x="${cx(i).toFixed(1)}" y="${(Y(it.v)-3.5).toFixed(1)}" class="rb-num"
      ${it.hot ? 'style="fill:var(--accent)"' : it.dim ? 'style="fill:rgba(138,160,148,0.6)"' : ''}>${esc(it.num != null ? it.num : it.v)}</text>`).join('');
  const labs = items.map((it, i) =>
    `<text x="${cx(i).toFixed(1)}" y="${h-2.5}" class="rb-lab"
      ${it.hot ? 'style="fill:var(--accent)"' : ''}>${esc(it.label)}</text>`).join('');
  // the reference: a per-slot shape when the slots differ, a flat line when one
  // normal governs the whole set
  let refMark = '';
  const refs = items.map(i => i.ref);
  if (refDash && refs.some(r => r != null)){
    const pts = refs.map((r, i) => r == null ? null : `${cx(i).toFixed(1)},${Y(r).toFixed(1)}`);
    const segs = []; let cur = [];
    pts.forEach(p => { if (p == null){ if (cur.length) segs.push(cur); cur = []; } else cur.push(p); });
    if (cur.length) segs.push(cur);
    refMark = segs.map(s => s.length === 1
      ? `<line x1="${s[0].split(',')[0] - bw*0.4}" y1="${s[0].split(',')[1]}" x2="${+s[0].split(',')[0] + bw*0.4}" y2="${s[0].split(',')[1]}" class="rb-ref"/>`
      : `<polyline points="${s.join(' ')}" class="rb-ref" fill="none"/>`).join('');
  }
  /* Uniform scaling, NOT preserveAspectRatio="none". Stretching the viewBox to
     the card width would stretch the numbers on the bars with it — and the
     numbers are the point of drawing them there. The svg scales as a whole and
     the type stays the shape it was drawn. */
  return `<svg class="rbars" viewBox="0 0 ${w} ${h}" role="img" aria-hidden="true">
    <line x1="0" y1="${h-padB}" x2="${w}" y2="${h-padB}" class="rb-base"/>
    ${bars}${refMark}${nums}${labs}
  </svg>`;
}

/* The gap read, in words. Never a naked index: "+3 above your Monday normal"
   says the size, the direction and what it is measured against in one line. A
   percentage of a median of two is arithmetic nobody can act on. */
function rhythmGap(cur, norm, what){
  if (norm == null) return { tone:'flat', txt:`no ${what} to compare against yet` };
  const d = cur - norm;
  if (d === 0) return { tone:'flat', txt:`level with ${what}` };
  return { tone: d > 0 ? 'up' : 'down',
           txt: `${d > 0 ? '+' : '−'}${Math.abs(d)} ${d > 0 ? 'above' : 'below'} ${what}` };
}
/* "your last 8 Mondays" — the COUNT is always spoken, because a normal built from
   five samples and one built from eight are not the same claim and the reader is
   owed the difference. Returns the stem so the caller appends the plural noun;
   at one sample there is no plural to append and the caller is told so, since
   "your last 1 Mondays" reads like a bug and undermines every other number on
   the card. */
const rhySamples = (n, noun) => n === 1 ? `your last ${noun}` : `your last ${n} ${noun}s`;
/* "June 2025" — the same shape APPT_SINCE_LABEL takes, so a reader who has seen
   one feed-floor date on this page recognises the next one. */
const monthYear = d => new Date(d).toLocaleDateString('en-US', { month:'long', year:'numeric' });

function heroAppts(k){
  const A = D.appointments;
  if (!A || !A.byCompany || !A.byCompany[k]) return '';
  const W = A.byCompany[k];
  const label = { day:'Today', week:'This week', month: MONTHOFF ? D.windows.month.label : 'MTD', ytd:'YTD' }[k] || '';
  const rows = BRAND_ORDER.map(b => ({ b, m: brandOf(b), n: W.counts[b] || 0, typ: (W.typ[b] || {}).mean || 0 }));
  const unknown = W.counts.unknown || 0;
  const branded = rows.reduce((n, r) => n + r.n, 0);
  const tot = branded + unknown;
  const typ = rows.reduce((n, r) => n + r.typ, 0);
  /* The baseline is brand-attributed, so the comparison is too: an appointment
     the sync has not resolved to a project has no typical to sit against. It
     still counts in the headline figure and is named on its own line — counted,
     never quietly dropped, and never measured against a baseline built without
     it. */
  const d = typ ? Math.round((branded - typ) / typ * 100) : null;
  /* MTD keeps its EKG exactly as it was — it is the one grain this page has
     always kept day by day and Kevin reads it as-is. The other three tabs used
     to fall through to a bare number; they now draw their own rhythm at their
     own grain. See A.rhythm. */
  const mtdDays = (k === 'month' && !MONTHOFF) ? A.bookedSeriesMTD : null;
  const headline = mtdDays && mtdDays.length > 1
    ? ekgSpark(mtdDays.map(x => ({ v: x.n, t: x.typ })), { id:'hero-appts', w:280, h:48 })
    : '';
  const R = A.rhythm && (k === 'day' || k === 'week' || k === 'ytd') ? A.rhythm[k] : null;
  const RA = R ? R.all : null;
  /* One normal per window, never two. The old byCompany typ (a MEAN of the prior
     4 weeks) and the rhythm normal (a MEDIAN of the last 8) would otherwise both
     print the word "typical" on one tile with two different numbers — the exact
     confusion this card already warns about for the daily alarm. Where a rhythm
     exists it owns the comparison outright; MTD keeps the original. */
  let rTop = '', rCap = '', rGap = null, rTypical = null;
  if (RA && k === 'day'){
    const items = RA.samples.map(s => ({ label:s.label, v:s.byHour, ref:RA.norm, dim:true }))
      .concat([{ label:'today', v:RA.soFar, ref:RA.norm, hot:true }]);
    rTop = rhythmBars(items);
    /* No samples yet means rmed() returned null and NO dashed line was drawn, so
       the caption must not name a reference the chart does not carry. */
    rCap = `booked by ${hourLabel(RA.hour)}, so far today${RA.n
      ? `<span class="ekg-cap-ref">╌╌ ${RA.n === 1 ? '' : 'median of '}${esc(rhySamples(RA.n, RA.dowName))}</span>` : ''}`;
    rGap = RA.n ? rhythmGap(RA.soFar, RA.norm, `your ${RA.dowName} normal by ${hourLabel(RA.hour)}`) : null;
    rTypical = RA.n ? RA.norm : null;
  } else if (RA && k === 'week'){
    const items = RA.days.map((x, i) => ({ label:x.label, v:x.v, ref:RA.ref[i],
      hot:x.today, dim:x.weekend && !x.today }));
    rTop = rhythmBars(items);
    rCap = `booked per day this week${RA.n
      ? `<span class="ekg-cap-ref">╌╌ ${RA.n === 1 ? 'the shape of ' : 'median shape of '}${rhySamples(RA.n, 'week')}</span>` : ''}`;
    rGap = RA.n ? rhythmGap(RA.cur, RA.norm,
      `your ${RA.n === 1 ? 'prior week' : `${RA.n}-week normal`} for the same ${RA.elapsed} day${RA.elapsed===1?'':'s'}`) : null;
    rTypical = RA.n ? RA.norm : null;
  } else if (RA && k === 'ytd'){
    const items = RA.months.map(m => ({ label:m.label, v:m.n, ref:m.ref, hot:m.current }));
    rTop = rhythmBars(items);
    /* The current month's bar is SHORT because the month is short, not because
       bookings fell off a cliff, and eleven full bars beside one part-bar reads
       as a collapse every single month. The mark under that bar is already the
       same part-span of the trailing months — the arithmetic was never wrong —
       but the bar could not say so, so the caption does.

       NO SAMPLE, NO CLAUSE. rmed answered null and rhythmBars drew no dashed
       line, so the caption must not name a reference the chart does not carry —
       the same guard the rhythm captions above keep, singular included. */
    rCap = `booked per month${RA.elapsed ? ` · ${esc(RA.curLabel)} is ${RA.elapsed} day${RA.elapsed===1?'':'s'} so far` : ''}${RA.n
      ? `<span class="ekg-cap-ref">╌╌ ${RA.n === 1 ? '' : 'median of '}${rhySamples(RA.n, 'month')}</span>` : ''}`;
    /* curNow, never cur: the reference is a MONTHLY median, so the only figure
       it may be set against is the month in progress — the hot bar, against the
       mark drawn under it. A year total judged by a monthly median would be a
       comparison in name only, so the headline drops its "of N normal" chip for
       this tab outright rather than printing one. */
    rGap = RA.n ? rhythmGap(RA.curNow, RA.norm,
      `${RA.n === 1 ? 'your prior month' : `your ${RA.n}-month median`} for the same ${RA.elapsed} day${RA.elapsed===1?'':'s'}`) : null;
    rTypical = null;
  }
  return `<button class="snap bigsnap" onclick="openWindow('${k}')" aria-label="Appointments ${esc(label)} — open details">
    <div class="snap-k" style="color:var(--blue)">Appointments · ${esc(label)}</div>
    ${/* TODAY shows what has been booked BY NOW, because that is the number the
          comparison beneath it is made against. The window total and the
          by-this-hour total are the same figure in production — nothing can be
          stamped an hour that has not happened — but printing the window total
          beside an hourly normal would let one clock-skewed row put a headline
          and its own gap read in contradiction. One basis, stated. */''}
    <div class="snap-v" style="color:var(--blue)">${RA && k === 'day' ? RA.soFar : tot}${
      rTypical != null ? ` <span style="font-size:16px;color:var(--text-dim)">of ${Math.round(rTypical)} normal</span>`
      : typ ? ` <span style="font-size:16px;color:var(--text-dim)">of ${Math.round(typ)} typical</span>` : ''}</div>
    ${headline ? `<div class="ekg-wrap">${headline}<div class="ekg-cap">booked per day, month to date<span class="ekg-cap-ref">╌╌ typical for that weekday</span></div></div>` : ''}
    ${rTop ? `<div class="ekg-wrap">${rTop}<div class="ekg-cap">${rCap}</div></div>` : ''}
    ${/* LAST YEAR, DEMOTED TO CONTEXT. It is still worth seeing — Kevin knows what
          last summer felt like — but it is one sample from the noisiest month in
          the year, so it does not draw the line, does not set the gap and does
          not colour anything. Dim, small, and it carries this year's total over
          the SAME months beside it: a last-year figure left alone next to a
          full-year headline would be silently compared against a span it does
          not cover, which is the fake reference this rebuild exists to remove.
          No alarm language here — this is a rep-facing surface. */''}
    ${RA && k === 'ytd' ? `<div class="rb-aside">${RA.priorSpan.length
      ? `Last year, ${RA.priorSpan.length === RA.months.length ? 'the same months' : `the ${RA.priorSpan.length} month${RA.priorSpan.length===1?'':'s'} the feed reaches`} (${esc(RA.priorSpan.length === 1 ? RA.priorSpan[0] : `${RA.priorSpan[0]}–${RA.priorSpan[RA.priorSpan.length-1]}`)}): <b>${RA.prior}</b>, against <b>${RA.priorCur}</b> over those months this year. Context only — the reference above is your own trailing months.`
      : `The appointment feed reaches back to ${esc(monthYear(RA.feedFrom))}, so last year sits outside it. Nothing above depends on it — the reference is your own trailing months.`}</div>` : ''}
    <div class="alloc-legend mml" style="margin:10px 0 8px">${rows.map(r => {
      const rb = R ? R.brands[r.b] : null;
      const trace = mtdDays && mtdDays.length > 1
        ? ekgSpark(mtdDays.map(x => ({ v: x.byBrand[r.b] || 0, t: x.typByBrand[r.b] || 0 })),
            { id:`hero-appts-${r.b}`, w:64, h:22, mini:true, color:r.m.c, glow:r.m.c })
        /* Per-brand rhythm, from that brand's OWN history — a brand that books
           one a week must not be judged against the house shape. */
        : rb && k === 'week'
          ? rhythmBars(rb.days.map((x,i) => ({ label:'', v:x.v, ref:rb.ref[i], dim:x.weekend && !x.today, hot:x.today })),
              { w:64, h:22, mini:true, color:r.m.c })
        : rb && k === 'ytd'
          ? rhythmBars(rb.months.map(m => ({ label:'', v:m.n, ref:m.ref, hot:m.current })),
              { w:64, h:22, mini:true, color:r.m.c })
        : rb && k === 'day'
          ? rhythmBars(rb.samples.map(s => ({ label:'', v:s.byHour, ref:rb.norm, dim:true }))
              .concat([{ label:'', v:rb.soFar, ref:rb.norm, hot:true }]), { w:64, h:22, mini:true, color:r.m.c })
        : '';
      /* The brand's own normal, at this window's grain, from that brand's OWN
         trailing history. rmed already answers null where the brand has no
         history at all, so a young brand shows its count and no baseline rather
         than a baseline of zero.

         YTD is the one grain where the row's value and its normal are different
         UNITS — the value is the brand's whole year, the normal is a typical
         MONTH for it — so that row alone prints the unit, "norm 118/mo", rather
         than letting two unlike numbers sit side by side unmarked. */
      const bn = !rb ? null : k === 'ytd' ? rb.normFull : rb.norm;
      const bv = !rb ? r.n : k === 'day' ? rb.soFar : rb.cur;
      return `
      <div class="alloc-row" ${(rb ? bv : r.n) ? '' : 'style="opacity:.55"'}>
        <div class="alloc-dot" style="background:${r.m.c}"></div>
        <div class="name">${esc(r.m.s)}</div>
        ${trace ? `<div class="alloc-spark">${trace}</div>` : ''}
        ${/* A YTD normal of a true zero is not a normal anybody can be under.
              A brand that booked nothing through the trailing months and 963 this
              year would print "963 · norm 0/mo", which reads as a comparison and
              is not one. Say what the sample actually holds — the typical month
              in it booked none — and stop there, rather than inferring the brand
              is new, which an appointment feed cannot know.

              Only YTD. On Today and Week a normal of zero is an ordinary fact
              about a quiet weekday, and "norm 0" states it correctly: the brand
              is not new, it just does not usually book on a Sunday. */''}
        <div class="val">${rb
          ? (k === 'ytd' && bn === 0 && bv > 0 ? `${bv} · none in a typical month`
             : bv || bn ? `${bv}${bn != null ? ` · norm ${Math.round(bn)}${k === 'ytd' ? '/mo' : ''}` : ''}` : '—')
          : (r.n ? `${r.n}${r.typ ? ` · typ ${Math.round(r.typ)}` : ''}` : '—')}</div>
      </div>`; }).join('')}${unknown ? `
      <div class="alloc-row" title="Appointments booked against projects the sync has not delivered yet">
        <div class="alloc-dot" style="background:#8aa094"></div>
        <div class="name">counting…</div>
        <div class="val">${unknown} awaiting project sync</div>
      </div>` : ''}</div>
    <div class="snap-s">new appointments booked${
      rGap ? ' · your rhythm against your normal rhythm'
      : typ ? ` · measured against ${esc(W.typLabel)}` : ''}</div>
    ${rGap
      ? `<div class="snap-d ${rGap.tone}">${rGap.txt}</div>`
      : RA
      ? `<div class="snap-d flat">not enough history yet to set a normal</div>`
      : d === null
      ? `<div class="snap-d flat">${esc(W.typLabel)}</div>`
      : `<div class="snap-d ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d)}% vs typical${unknown ? ' · on the brand-attributed count' : ''}</div>`}
    <div class="snap-go">details <span class="go-chev">›</span></div>
  </button>`;
}

/* ── APPOINTMENTS · the thing he actually worries about ─────────────────────
   Kevin: "Like daily weekly monthly appt are soooo important to me… It's so
   crucial to my stress. Appts good life good. Appts bad pay attention need
   more." So this sits directly under the hero, and it leads with what is ON THE
   BOOKS rather than what already ran — the forward number is the one that
   carries the worry. ─────────────────────────────────────────────────────── */
/* The setting-day verdict. Deliberately does NOT scold before the day has had a
   chance to happen — a low count at 9am is a morning, not a problem. */
/* Every line names the weekday, because "23/day" was never a real thing — it was
   Mondays and Thursdays averaged into a number that fits neither. */
function bookedVerdict(A){
  const n = A.bookedToday, norm = A.bookedNormHour, d = A.bookedVsNorm;
  const day = A.todayDowName || 'weekday';
  const by = `by ${hourLabel(A.nowHour)}`;
  if (A.isWeekend) return { tone:'flat', line: n
    ? `${n} booked on a weekend — setting normally runs Monday to Friday.`
    : 'Weekend. Setting normally runs Monday to Friday.' };
  if (!norm) return { tone:'flat', line:`${n} booked today. Not enough ${day} history yet for a norm.` };
  const early = (A.nowHour ?? new Date().getHours()) < 12;
  if (d >= 25)  return { tone:'good', line:`Setters booked ${n} today — well ahead of the ${norm} a ${day} normally has ${by}.` };
  if (d >= 10)  return { tone:'good', line:`Setters booked ${n} today — ahead of the ${norm} typical for a ${day} ${by}.` };
  if (d > -15)  return { tone:'flat', line:`${n} booked today against ${norm} typical for a ${day} ${by}. Normal ${day}.` };
  if (early)    return { tone:'warn', line:`${n} booked so far against ${norm} typical for a ${day} ${by} — still early, but worth a look.` };
  if (d <= -40) return { tone:'bad',  line:`Only ${n} booked today against ${norm} typical for a ${day} ${by} — slow ${day}, check the girls.` };
  return { tone:'warn', line:`${n} booked today against ${norm} typical for a ${day} ${by} — setting is behind.` };
}
const hourLabel = h => { const x = ((h ?? 0) % 24); const ap = x < 12 ? 'am' : 'pm';
  const t = x % 12 === 0 ? 12 : x % 12; return `${t}${ap}`; };

function apptVerdict(A){
  const d = A.vsPrior;
  const stale = A.staleHours != null && A.staleHours >= 6;
  if (!A.priorAvg) return { tone:'flat', line:'Not enough booking history yet to judge the week ahead.' };

  if (d <= -35) return { tone:'bad',  line:`Booking pipeline thin heading into next week — ${A.next7} on the books against ${A.priorAvg} typical for a ${DAYNAME[new Date().getDay()]}. Worth pushing.` };
  if (d <= -15) return { tone:'warn', line:`Week ahead is light — ${A.next7} booked against ${A.priorAvg} typical. Not alarming yet, but it wants attention.` };
  if (d >= 25)  return { tone:'good', line:`Strongest week ahead in a month — ${A.next7} already on the books against ${A.priorAvg} typical.` };
  if (d >= 10)  return { tone:'good', line:`Week ahead is running ahead of normal — ${A.next7} booked against ${A.priorAvg} typical.` };
  return { tone:'flat', line:`Week ahead is about normal — ${A.next7} booked against ${A.priorAvg} typical for a ${DAYNAME[new Date().getDay()]}.` };
}

/* ═══ FOLDING A CARD ════════════════════════════════════════════════════════
   minor() takes a card exactly as its own function already built it and folds
   it, rather than every card function learning about folding. That keeps one
   rule in one place, and it means a card function stays readable as the single
   thing it draws.

   The regex splits a card into its class list, its title row and everything
   after. Every card on this page has that shape, and no card-title holds a
   nested <div> — only spans — so the lazy match stops at the title's own close.
   If a future card ever breaks the shape, the match fails and the card is
   returned untouched and fully open. A layout tweak must never be able to
   swallow a number.
   ═══════════════════════════════════════════════════════════════════════════ */
const MINOR_STORE = 'lcc.folds';
let MINOR_OPEN = (() => { try { return JSON.parse(localStorage.getItem(MINOR_STORE)) || {}; } catch (e) { return {}; } })();

/* Default open on a phone, folded on a monitor. The complaint that started this
   was about a wide screen; the phone layout is a single column he already
   scrolls, and folding there would only add taps. */
function minorOpen(k){ return (k in MINOR_OPEN) ? MINOR_OPEN[k] : window.innerWidth < 900; }

function minor(key, summary, html){
  const m = /^\s*<div class="([^"]*)">\s*<div class="card-title">([\s\S]*?)<\/div>([\s\S]*)<\/div>\s*$/.exec(html);
  if (!m) return html;
  const [, cls, title, body] = m;
  return `<div class="${cls} mnr${minorOpen(key) ? ' open' : ''}" data-mk="${esc(key)}">
    <div class="mnr-head" onclick="toggleMinor('${esc(key)}')">
      <div class="card-title">${title}</div>
      <div class="mnr-sum">${summary}</div>
      <span class="mnr-chev">›</span>
    </div>
    <div class="mnr-body">${body}</div>
  </div>`;
}

function toggleMinor(k){
  const el = document.querySelector(`[data-mk="${k}"]`);
  if (!el) return;
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  MINOR_OPEN[k] = open;
  try { localStorage.setItem(MINOR_STORE, JSON.stringify(MINOR_OPEN)); } catch (e) {}
  /* A canvas that was measured while its card was folded has no size to work
     with, so Chart.js drew it into nothing. Redraw once it can be measured.
     drawCharts destroys before it builds, so calling it again is safe — and any
     chart still inside a folded card is simply rebuilt into nothing again and
     redrawn when that card is opened in its turn. */
  if (open && el.querySelector('canvas')) drawCharts();
}

/* ── QUOTA FLEET BOARD ───────────────────────────────────────────────────────
   The owner's view of the rep-facing $100K quota: every carrier against the same
   prorated employment floor, ranked, colour-weighted. Firm language throughout —
   this is pace to keep the seat, never softened to a "goal". */
function cardQuota(){
  const Q = D.quotaBoard; if (!Q || !Q.carriers.length) return '';
  const K = QUOTAWIN, W = Q.wins[K];
  const label = { week:'this week', month:mSpan(), ytd:'year to date' }[K];
  /* A seller at zero stays — showing who is under the floor is the point.
     A non-seller (owner, non-selling manager) appears only in windows where
     they actually signed; their $0 weeks are not a floor miss, they are a
     different job. A DEPARTED rep is the same shape: they appear only in
     windows holding their signings (period-roster law) — an empty week of
     theirs is not a floor miss either, it is an empty seat. */
  const rows = Q.carriers.filter(r => (r.sells && !r.gone) || (W.sig[r.id] || 0) > 0).map(r => {
    const signed = W.sig[r.id] || 0;
    const delta = signed - W.pace;
    const pct = W.pace ? Math.round(signed / W.pace * 100) : 0;
    const band = pct >= 100 ? 'ok' : pct >= 75 ? 'warn' : 'bad';
    return { ...r, signed, delta, pct, band };
  }).sort((a,b) => b.pct - a.pct || b.signed - a.signed);
  const making = rows.filter(r => r.pct >= 100).length;
  const under = rows.filter(r => r.pct < 75).length;
  const mx = Math.max(W.pace, ...rows.map(r => r.signed), 1);
  const bandC = b => b==='ok' ? '#6cc28b' : b==='warn' ? '#d4b15a' : '#d96a5e';
  return `<div class="card full">
    <div class="card-title">Quota fleet<span class="feed-tag cc">live · cc</span><span class="feed-tag billdu">+ billdu</span></div>
    <div class="card-sub">The <b>employment floor</b>: ${short(Q.annual)}/yr signed — ${short(Q.monthly)}/mo — earns $${(Q.incomeAt/1000)}K at ${Q.rate}%. Every rep against it, prorated to ${label} (day ${W.elapsed}). This is the pace to keep the seat, not a goal. <b>Tap a name for their one-pager.</b></div>

    <div class="seg">
      ${[['week','Week'],['month','Month'],['ytd','YTD']].map(([k,l])=>`<button class="${k===K?'on':''}" onclick="setQuota('${k}')">${l}</button>`).join('')}
    </div>

    <div class="stat-grid" style="margin:12px 0 14px">
      <div class="stat-tile"><div class="lbl">Floor pace</div>
        <div class="val gold">${short(W.pace)}</div><div class="sub">per rep by day ${W.elapsed}</div></div>
      <div class="stat-tile"><div class="lbl">Making the floor</div>
        <div class="val ${making?'green':''}">${making}<span style="font-size:14px;color:var(--text-dim)"> / ${rows.length}</span></div><div class="sub">at or above pace</div></div>
      <div class="stat-tile"><div class="lbl">Below the floor</div>
        <div class="val" style="color:${under?'#e8968c':'var(--text)'}">${under}</div><div class="sub">under 75% of pace</div></div>
    </div>

    ${rows.map((r,i) => `<div class="rep-row acc" onclick="openRep('${esc(String(r.id))}')">
      <div class="rep-head">
        <div class="nm"><span class="rk ${i===0?'top':''}">${i+1}</span>${esc(r.name)}${r.gone?'<span class="gone">departed</span>':''}${r.role!=='sales'?`<span class="brand">${esc(r.role)}</span>`:''}</div>

}

/* ── The close-rate honesty kit (Kevin, 10 Aug) ────────────────────────────
   Three rulings, applied on every close-rate surface:
   · "Run" was a lie: CC logs no appointment outcomes, only schedules. The
     denominator is scheduled-and-time-passed, so it is called APPTS ELAPSED,
     with the definition one tap/hover away and in the fine print (tooltips
     do not exist on a phone).
   · Never one blended close: median days-to-close differs several-fold by
     brand, so a single company rate moves with brand mix, not with closing.
     Close renders per brand; where a combined figure survives it is labeled
     mix-dependent.
   · An MTD close is immature by construction: the newest appointments have
     not had time to close. The window is NOT lagged (that empties the
     denominator early in the month) — instead the like-for-like delta vs the
     same elapsed days of last month is the headline, the raw % is secondary,
     and a measured maturation note says how much of the tail is still open. */
const ELAPSED_TIP = 'Scheduled appointments whose time has passed. Outcomes are not logged in CC — no-shows are included.';
const closeBrandStr = W => (W.closeByBrand || []).filter(r => r.appts || r.signed)
  .map(r => `${esc(brandOf(r.id).s || brandOf(r.id).n)} ${r.close===null?'—':r.close+'%'}`).join(' · ');

function closeMtdByBrand(W, pv){
  const rows = W.closeByBrand || [];
  if (!rows.length) return '';
  const lag = (D.closeLag && D.closeLag.byBrand) || {};
  return `<div class="card-title" style="margin:16px 0 6px">Close rate MTD · by brand<span class="feed-tag cc">live · cc</span><span class="feed-tag billdu">live · billdu</span></div>
    <div class="card-sub">The headline is the like-for-like move: this month's elapsed days against the same days of ${esc(W.prevLabel)}. The raw MTD rate sits under it — partial by construction, because the newest appointments have not had time to close.</div>
    <div class="stat-grid" style="margin-top:8px">
    ${rows.map(r => {
      const m = brandOf(r.id);
      const p = ((pv && pv.closeByBrand) || []).find(x => x.id === r.id);
      const d = (r.close !== null && p && p.close !== null) ? r.close - p.close : null;
      const L = lag[r.id];
      return `<div class="stat-tile" title="${ELAPSED_TIP}">
        <div class="lbl">${esc(m.s || m.n)}</div>
        <div class="val ${d===null?'':d>=0?'green':'red'}">${d===null?'—':(d>=0?'▲ +':'▼ −')+Math.abs(d)+' pts'}</div>
        <div class="sub">${d===null?'no like-for-like baseline':'vs same days of '+esc(W.prevLabel)}</div>
        <div class="sub">${r.appts?`${r.close}% closed · ${r.signed} of ${r.appts} appts elapsed`:r.signed?`${r.signed} signed · no appts elapsed`:'no appts elapsed'}</div>
        ${L?`<div class="sub" style="color:var(--text-dim)">partial — appts in the last ~${L.median} day${L.median===1?'':'s'} have not had time to close</div>`:''}
      </div>`; }).join('')}
    </div>
    <div class="note"><b>Appts elapsed</b> = scheduled appointments whose time has passed. Outcomes are not logged in CC — no-shows are included. One rate per brand because median days-to-close differs several-fold across brands, so a blended rate moves with brand mix, not with closing. Signings count from every feed (CC contracts, Billdu for Oasis, rung sales pending CC) over that brand's own elapsed appointments.${W.apptsUnknownBrand?` <b>${W.apptsUnknownBrand}</b> elapsed appointment${W.apptsUnknownBrand===1?' is':'s are'} against projects the sync has not delivered, so ${W.apptsUnknownBrand===1?'it sits':'they sit'} in no brand's rate.`:''}${Object.keys(lag).length?` Maturation is measured, not seeded: each brand's median gap from a project's last preceding appointment to its signing, over the past ${D.closeLag.sinceDays} days.`:''}</div>`;
}
