  /* ── THE COMPOSITE ─────────────────────────────────────────────────────────
     The whole business as one line. Held since 16 Aug on the grounds that a
     composite over two live vitals answers "how is the business" with two fifths
     of the business; four of the five now carry a feed, and Kevin has given the
     go, so it draws.

     A MEAN OF Z, NOT A MEAN OF THE NUMBERS. Dollars, leads, completions and
     invoices cannot be added — the sum would be dollars with some counts stirred
     in. Each vital's z is already unit-free and already scaled to its OWN
     spread, which is exactly the property that makes them addable: a 1 on
     signings and a 1 on leads both mean "one MAD out for this metric".

     ALL FOUR OR NOTHING, PER DAY. A day where one contributor has no score is
     null rather than a mean of the three that do — otherwise the line silently
     changes what it is a mean of partway along, and a step in the trace would
     read as a change in the business when it was a change in the roster. That
     rule is why the tails are index-aligned above.

     PAYABLES IS NOT IN IT and the card says so in words underneath. Averaging in
     a vital with no feed as if it were a calm zero would be the one lie this
     card exists to refuse. */
  const comp = (() => {
    const parts = [marketing, sales, production, collections]
      .filter(v => v.live && v.spark && v.spark.length === PULSE_TRACE);
    if (parts.length < 2) return null;
    const spark = [];
    for (let i = 0; i < PULSE_TRACE; i++){
      const zs = parts.map(v => v.spark[i].z).filter(z => z !== null);
      spark.push({ k: parts[0].spark[i].k,
                   z: zs.length === parts.length ? zs.reduce((a,b) => a+b, 0) / zs.length : null });
    }
    let last = null;
    for (let i = spark.length - 1; i >= 0; i--) if (spark[i].z !== null){ last = spark[i].z; break; }
    if (last === null) return null;
    /* A MEAN CANCELS, and the card has to know when it has. Signings far down
       and backlog far up average to something that looks perfectly calm: the
       first render of this composite read "in rhythm" in green with four red
       rails directly beneath it. The arithmetic was right and the sentence was a
       lie. Counting the contributors that are out of their own band costs
       nothing and lets the read say "steady on average — rails disagree", which
       is what a mean of opposing excursions actually means. */
    return { z: last, band: pBand(last), spark, n: parts.length,
             dissent: parts.filter(v => v.band !== 'green').length,
             names: parts.map(v => v.name.toLowerCase()) };
  })();

  return { end, vitals, comp, live: vitals.filter(v => v.live).length, total: vitals.length,
           poolN: S ? S.pool : 0 };
}

/* ── THE VITALS · THE MEASUREMENTS ───────────────────────────────────────────
   Everything the login hero draws, measured once here off the same two feeds
   the pulse reads — Contractors Cloud jobs and QuickBooks invoices. The
   thresholds that turn these into colours live in VIT at the top of the file
   and are applied at render time; nothing in this function knows what green
   means, which is what keeps the tuning surface a single block.

   NINE WEEKLY SLOTS, NOT NINETY DAYS. The hero's whole comparison language is
   "against your trailing 8 weeks", so the grid is eight complete prior weeks
   plus the week just finished. Non-overlapping, because the median has to be a
   median of independent weeks — a rolling 7-day sum sampled daily would put 56
   heavily-correlated numbers behind a "median of 8 weeks" and quietly narrow
   it. Every week ends on a complete day: the last slot ends yesterday, for the
   same reason every pulse window does — a window holding a partial today reads
   low for no reason but the clock.

   WHAT IS NOT HERE, AND WHY. Two of the four vitals have no week-by-week
   history and cannot be given one honestly:

     MARKETING needs spend, and spend is typed at month CLOSE (marketing_spend,
     one grain per month). A weekly denominator would have to be invented by
     spreading a monthly total across days, and the month in progress has no
     total to spread. So marketing is measured on CLOSED MONTHS and says so.

     MONEY needs the open balance as it stood in past weeks, and QuickBooks
     gives a balance with no date attached — an invoice paid last Tuesday is
     simply gone from the snapshot. Reconstructing prior weeks from the
     invoices still open today would omit everything that got paid, which
     biases the past toward the slow payers and makes creep read LOW. That is a
     false all-clear, so it is not drawn. Money is a snapshot, aged, and the
     card says which clock it used. */
function buildVitals(jobs, qbInv, unionWeek){
  const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const end = new Date(pDayAdd(+sod(new Date()), -1));      // yesterday
  const N = VIT.weeks;                                      // 8 prior + 1 current

  /* Slot i ends N-i weeks before `end`; slot N is the week just finished. */
  const weeks = [];
  for (let i = 0; i <= N; i++){
    const e = pDayAdd(+end, -(N - i) * 7);
    weeks.push({ s: pDayAdd(e, -6), e,
      label: new Date(pDayAdd(e, -6)).toLocaleDateString('en-US', { month:'short', day:'numeric' }) });
  }
  const inWeek = (t, w) => t >= w.s && t <= w.e;

  /* ── SALES · signed dollars per week ──────────────────────────────────────
     The same union every money tile counts — signedUnion, passed in from
     buildData — bucketed into the nine slots. This trace used to walk `jobs`
     alone: CC only (so no Billdu, and Oasis at its drifted CC amounts), which
     put a different weekly truth on the first screen than the tiles under it.
     The CC-only walk remains as the fallback for the fixture path that calls
     buildVitals without a union. */
  const signed = jobs.filter(j => j.contract_signed_at)
    .map(j => ({ t: +sod(new Date(j.contract_signed_at)), v: Number(j.fin_sold_amount || 0),
                 done: j.completed_at ? +sod(new Date(j.completed_at)) : null }))
    .filter(j => !isNaN(j.t));
  const salesSeries = weeks.map(w => unionWeek
    ? unionWeek(new Date(w.s), new Date(pDayAdd(w.e, 1)))
    : signed.reduce((n, j) => inWeek(j.t, w) ? n + j.v : n, 0));

  /* ── PRODUCTION · the stalled share of the open backlog ───────────────────
     Exactly reconstructable at any past date, and it is the one of the four
     that is: a job's signed date and completed date are both stamped, so the
     open set on any Tuesday in June is a fact rather than an inference.

     THE YEAR-OLD RECORDS STAY IN. 188 open jobs are over a year old and are
     almost certainly never-closed records rather than live work. Dropping them
     would make the share prettier and less true; leaving them in only lifts
     the LEVEL, and this vital is scored on points off its own trailing median,
     which the level cannot reach. They are named in the drill. */
  const openAt = t => {
    let n = 0, stalled = 0, deep = 0;
    for (const j of signed){
      if (j.t > t || (j.done !== null && j.done <= t)) continue;
      n++;
      const age = pDayDiff(t, j.t);
      if (age >= VIT.production.stallDays) stalled++;
      if (age >= VIT.production.deepDays) deep++;
    }
    return { n, stalled, deep };
  };
  const prodAt = weeks.map(w => openAt(w.e));
  const prodSeries = prodAt.map(o => o.n ? 100 * o.stalled / o.n : null);

  /* ── MONEY · the open book, aged from the invoice date ────────────────────
     due_date is not among the columns this console fetches, so the age is from
     the invoice date and the card says so rather than implying a due clock it
     never read. */
  const open = (qbInv || []).filter(r => !r.reporting_excluded && Number(r.balance || 0) > 0)
    .map(r => ({ v: Number(r.balance || 0), age: pDayDiff(+end, +sod(new Date(r.txn_date))) }))
    .filter(r => isFinite(r.age));
  const openTotal = open.reduce((n, r) => n + r.v, 0);
  const meanAge = openTotal > 0
    ? open.reduce((n, r) => n + r.v * Math.max(0, r.age), 0) / openTotal : null;
  const AGE_B = [[0,30,'0–30 days'],[30,60,'30–60'],[60,90,'60–90'],[90,1e9,'over 90']];
  const aging = AGE_B.map(([lo, hi, label]) => {
    const mine = open.filter(r => r.age >= lo && r.age < hi);
    return { label, n: mine.length, v: mine.reduce((a, r) => a + r.v, 0) };
  });

  /* ── MARKETING · signed dollars per CLOSED month ──────────────────────────
     The revenue half only. The spend half is the typed book (MKT.spend), which
     arrives after first paint, so the ratio itself is formed at render time.

     WHICH REVENUE INSTRUMENT: this console's own walk of `jobs`, the same
     figure every money tile on the page counts. The ROI board computes its
     revenue from rpt_report_marketing_roi and the two still differ on July;
     the hero reads the console's instrument so the first screen and the tiles
     under it cannot disagree, and the drill names the other one. */
  const nowM = new Date();
  const months = [];
  for (let i = N + 1; i >= 1; i--){
    const d = new Date(nowM.getFullYear(), nowM.getMonth() - i, 1);
    months.push({ key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,
                  label: `${MNAMES[d.getMonth()].slice(0,3)} ${String(d.getFullYear()).slice(2)}`,
                  y: d.getFullYear(), m: d.getMonth(), signed: 0 });
  }
  for (const j of signed){
    const d = new Date(j.t);
    const hit = months.find(x => x.y === d.getFullYear() && x.m === d.getMonth());
    if (hit) hit.signed += j.v;
  }

  return { end, weeks, months,
           sales: { series: salesSeries },
           production: { series: prodSeries, at: prodAt, now: prodAt[N] },
           money: { aging, meanAge, openTotal, n: open.length } };
}

function buildData(raw){
  const { jobs: allJobs, appts, reps: allReps, touches, repTargets, playComponents, leadNames, qbInv, qbError, billdu, claims, bank } = raw;

  /* PHANTOM REPS OUT FIRST. Migration 011 tagged the roster the same way 009
     tagged jobs: a rep linked to a real Contractors Cloud user is source='cc';
     the app's invented demo team is source='app_sample'. The jobs query has
     filtered source=eq.cc since v1, but the roster never did — so four people
     who do not exist stood on the quota fleet at $0 and padded every "of N
     reps" denominator. Dropped before anything is counted, and what was
     dropped is stated on the Flags card, by name, because the names are
     fictional and saying them is what proves nothing real was removed. */
  const reps = allReps.filter(r => r.source === 'cc');
  const sampleReps = allReps.filter(r => r.source !== 'cc').map(r => r.name);

  /* EXCLUSIONS. Twelve jobs carry reporting_excluded — a batch-entry anomaly
     Liberty's own reports already leave out (migration 012). Counting them made
     this console disagree with the numbers Kevin already trusts, which is the
     fastest way for a dashboard to be written off as broken. They are dropped
     from every figure here and the amount dropped is stated on the page. */
  const excluded = allJobs.filter(j => j.reporting_excluded);
  const jobs = allJobs.filter(j => !j.reporting_excluded);
  const exclusions = {
    jobs: excluded.length,
    signed: excluded.filter(j => j.contract_signed_at).length,
    value: excluded.filter(j => j.contract_signed_at)
                   .reduce((n,j) => n + Number(j.fin_sold_amount||0), 0),
    reasons: [...new Set(excluded.map(j => j.reporting_exclusion_reason).filter(Boolean))],
    brands: [...new Set(excluded.map(j => rollup(j.cc_company_id)))],
  };
  const D_ = 86400000, NOW = new Date();
  const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const sow = d => { const x = sod(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); return x; };
  const som = d => new Date(d.getFullYear(), d.getMonth(), 1);
  const soy = d => new Date(d.getFullYear(), 0, 1);
  const addD = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const addM = (d,n) => { const x = new Date(d); x.setMonth(x.getMonth()+n); return x; };
  const inR = (iso,a,b) => { if(!iso) return false; const t = new Date(iso).getTime();
    return t >= a.getTime() && t < b.getTime(); };
  const inRDate = (s,a,b) => { if(!s) return false;
    const [y,m,d] = s.slice(0,10).split('-').map(Number);
    const t = new Date(y, m-1, d).getTime(); return t >= a.getTime() && t < b.getTime(); };

  /* The month window honours MONTHOFF (the time machine). A shifted month is
     labelled by NAME, never "This month" — the label is the data's honesty
     badge, and it flows to every card and dive that renders W.label. The year
     is appended only when it differs from the current one. */
  const mFrom = addM(som(NOW), -MONTHOFF);
  const mName = d => MNAMES[d.getMonth()] + (d.getFullYear() === NOW.getFullYear() ? '' : ' ' + d.getFullYear());
  const WINS = {
    day:  { label:'Today',        from:sod(NOW), to:addD(sod(NOW),1), pFrom:addD(sod(NOW),-1), pTo:sod(NOW), pLabel:'yesterday' },
    week: { label:'This week',    from:sow(NOW), to:addD(sow(NOW),7), pFrom:addD(sow(NOW),-7), pTo:sow(NOW), pLabel:'last week' },
    month:{ label: MONTHOFF ? mName(mFrom) : 'This month', from:mFrom, to:addM(mFrom,1),
            pFrom:addM(mFrom,-1), pTo:mFrom, pLabel: MONTHOFF ? mName(addM(mFrom,-1)) : 'last month' },
    ytd:  { label:'Year to date', from:soy(NOW), to:addD(sod(NOW),1), pFrom:soy(addM(soy(NOW),-1)), pTo:addM(sod(NOW),-12), pLabel:'same point last year' },
  };
  const elapsedDays = w => Math.max(1, Math.ceil((Math.min(NOW.getTime(), w.to.getTime()) - w.from.getTime()) / D_));
  const prevRange = w => [w.pFrom, new Date(Math.min(w.pFrom.getTime() + elapsedDays(w)*D_, w.pTo.getTime()))];
  const repById = Object.fromEntries(reps.map(r => [r.id, r]));

  /* ── THE UNION, APPLIED AT THE SOURCE ───────────────────────────────────
     Kevin: "it's not in the actual daily/monthy/yearly tab when I click it.
     Oasis empty there. Not populating over."

     He was right, and the reason was structural: the union was bolted onto the
     headline while every brand aggregate underneath still counted CC only. So
     the fix belongs in slice(), where brands are built — one place, and every
     surface that reads a brand or a window total inherits it: the snapshot, the
     drill-ins, brand mix, week-over-week, trending, the trend charts.

     An acceptance is additive only where Contractors Cloud has NOT recorded a
     signing for it — matched to a CC project is not the same as signed. ───── */
  const ccSignedMap = (billdu && billdu.ccSigned) || null;
  const bFeed = (billdu && billdu.feed) || null;
  const OASIS = '1560';
  const ymdOf = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  /* Billdu author → rep, taken from the backend's own rep_id rather than from
     the author NAME. The distinction matters: Oasis's office account sends
     estimates on a seller's behalf, so the document's author is not the person
     who sold the work, and that account is not a rep at all. Fuzzy name matching
     would have credited those deals to a similarly-named manager who had nothing
     to do with them. Where rep_id is null the deal is shown as office-sent and
     unattributed, which is the honest answer rather than a plausible one. */
  const bRepOf = Object.fromEntries(
    ((billdu && billdu.docs) || []).map(d => [String(d.billdu_id), d.rep_id || null]));
  const OFFICE = '__office';

  /* ── ONE SELLER RULE FOR EVERY SURFACE ────────────────────────────────────
     Kevin: "unattributed stays unattributed everywhere." The console had two
     ways to name who sold a Billdu deal, and they disagreed:

       · billdu_documents.rep_id (bRepOf) — the backend's mapping. Where it is
         null the deal was office-sent and stays UNATTRIBUTED.
       · console_oasis_signings_feed.rep — the view's own column, which still
         applies the old office-default convention: it credited the Oasis manager
         for two office-account deals and one that was another rep's — about $14K
         that is not his.

     The rep leaderboard already uses bRepOf and is correct. The chase card and
     the leak-row labels were still reading the feed column, so a single deal
     could name a seller there while counting as unattributed on the board. This
     resolves every surface through bRepOf, once. Two Oasis reps share the Billdu
     login, so authorship is not sellership — where the mapping is unsure the deal
     stays unowned rather than guessed onto a manager. */
  const sellerOf = billduId => {
    const rid = bRepOf[String(billduId)];
    return rid ? (repById[rid]?.name || null) : null;
  };

  /* The customer name sits inside the CC job title as "Lastname, Firstname —
     jobnumber". The number is not part of the identity, so it is dropped; if a
     title is blank the receipt says so rather than inventing one. */
  const custName = t => { if (!t) return null; const s = String(t).split(' — ')[0].trim(); return s || null; };

  /* ── OASIS MONEY = BILLDU INVOICES (migration 096, Kevin 2026-07-30) ──────
     His Billdu export IS "the actual amount of sales that we have sold this
     month", and the old CC-jobs + accepted-estimates union ran ~$95K over it:
     CC carries amounts drifted from the invoice (a $40,717 CC entry vs a $6,400
     invoice), duplicate CC projects with no invoice at all, and four deals
     counted in BOTH feeds. So Oasis is no longer CC-with-a-Billdu-additive —
     the whole Oasis figure reads from invoices, dated by issue_date, and the
     Oasis CC entries are EXCLUDED from money (slice() below). Attribution
     is CC-evidence-first (linked job → same customer), then the Oasis
     office-default (Mike) — the SAME rule the app board uses. This page first
     shipped holding office_default rows out as unattributed (the old
     "unattributed stays unattributed" convention), which put Mike ~$106K
     under the board and under Kevin's own Billdu export; Kevin flagged it
     within the hour (2026-07-30, "it is one seventy"). One rule everywhere:
     the attributed rep_id is taken as given, and only basis='unattributed'
     (no rule matched at all) stays unowned. */
  const bInvoices = (billdu && billdu.invoices) || null;
  /* WHICH DAY AN OASIS INVOICE COUNTS ON (migration 148, Kevin 13 Aug on Dena
     Kent — "Mike Leroy said this customer is not in his numbers… Sold Aug 5").
     issue_date is an OFFICE ADMIN date: it says when somebody typed the invoice,
     not when the rep sold the work, and on that deal the two ran eight days
     apart. So the deal counted on 8/5 as an open 🔔 ring and then jumped to 8/13
     the moment the office invoiced it — out of one week and into the next. 148
     gives the view a sold_on: the signed_on of the bell that invoice silences,
     else the issue date. The handoff from ring to invoice is date-preserving
     and this page reads the same date the phone does.
     The `?? issue_date` fallback is not decoration — the console deploys on
     push and the migration lands whenever Kevin pastes it, so this must be
     right in both states. Same reason the fetch below asks for `*`: naming
     sold_on in the select list would 400 the whole Billdu feed until 148 is
     applied, and Oasis money would read as missing rather than as itself. */
  const soldDay = r => String(r.sold_on || r.issue_date || '').slice(0,10);
  const billduAdd = (a, b) => {
    if (!bInvoices) return null;
    const A = ymdOf(a), B = ymdOf(b);
    const rows = bInvoices
      .filter(r => { const d = soldDay(r); return d >= A && d < B; })
      .map(r => ({ billdu_id: r.billdu_id, client_name: r.client_name,
                   accepted_value: Number(r.total_price||0),
                   at: soldDay(r),
                   repId: r.rep_id || null }));
    // per-rep split of the money, so leaderboards can inherit it
    const byRep = {};
    for (const r of rows) {
      const rid = r.repId || OFFICE;
      (byRep[rid] ??= { value:0, count:0 });
      byRep[rid].value += r.accepted_value;
      byRep[rid].count++;
    }
    return { value: rows.reduce((n,r)=>n+r.accepted_value,0),
             count: rows.length,
             byRep, rows };
  };

  /* Brand of an appointment = brand of its project's job, via cc_project_id.
     Built once for the per-brand close split below; the appointments card
     builds its own equivalent map inside its own scope. */
  const apptBrand = {};
  for (const j of jobs) if (j.cc_project_id) apptBrand[String(j.cc_project_id)] = rollup(j.cc_company_id);

  /* How long a signed deal typically took, per brand — the maturation note
     under the MTD close rate reads its N from here. MEASURED, never seeded:
     every signing in the last 180 days is matched to the latest appointment
     on its own project at or before the signing (a day of slack, because
     signing timestamps and appointment times straddle midnight in different
     zones), and the brand's median of those gaps is the number. Fewer than
     five matched pairs is not a median, so the brand shows no note rather
     than a guessed one. Caveat, stated here because it is measurable nowhere
     else: Oasis signs in Billdu and CC imports the signing late, so Oasis's
     measured lag reads from CC's own late record and can only run LONG —
     the note under Oasis is conservative, never flattering. */
  const closeLag = (() => {
    const byProj = {};
    for (const x of appts) if (x.cc_project_id && x.starts_at)
      (byProj[String(x.cc_project_id)] ??= []).push(new Date(x.starts_at).getTime());
    const cut = addD(sod(NOW), -180).getTime();
    const acc = {};
    for (const j of jobs) {
      if (!j.contract_signed_at || !j.cc_project_id) continue;
      const t = new Date(j.contract_signed_at).getTime();
      if (t < cut || t > NOW.getTime()) continue;
      const list = byProj[String(j.cc_project_id)]; if (!list) continue;
      let best = null;
      for (const at of list) if (at <= t + 86400000 && (best === null || at > best)) best = at;
      if (best === null) continue;
      (acc[rollup(j.cc_company_id)] ??= []).push(Math.max(0, Math.round((t - best) / 86400000)));
    }
    const byBrand = {};
    for (const [bid, arr] of Object.entries(acc)) {
      if (arr.length < 5) continue;
      arr.sort((x,y) => x - y);
      byBrand[bid] = { median: arr[Math.floor(arr.length / 2)], n: arr.length };
    }
    return { byBrand, sinceDays: 180 };
  })();

  /* ── THE BELL↔CC MATCH, REP-BLIND (17 Aug: one deal, one dollar, one name) ─
     The database confirmer (cc_counts_claim behind rep_sale_claim_status)
     matches a bell to the CC book BY REP — so a contract the office keys with
     NO rep on it can never silence the bell that rang it. August caught three:
     Pestik $49,467, Bailey $16,000, Wilrowski $1,800. Each sat in the money
     TWICE (an unowned CC contract + Eric's open bell) while sales-by-rep held
     only the bell — which is exactly how the hero and the rep board learned to
     disagree by $67,267.

     This match is rep-blind: a pending bell is spent when a NON-Oasis CC
     contract agrees with it on customer name (token-set — "PESTIK, RAYMOND"
     is "Raymond Pestik") within MATCH.days, and on either the exact dollars
     or a contract that carries no rep at all (the class the confirmer is
     structurally blind to). Oasis CC rows are never matched against: they are
     out of the money (Billdu owns Oasis), so spending a bell against one
     would drop the dollars entirely.

     And the match runs both ways: a CC contract with no rep INHERITS the
     matched bell's rep. The deal lands once, under the person who rang it,
     instead of splitting into an "unowned" line and a bell. The day may shift
     when CC books late (a ring on the 10th booked on the 14th counts on the
     14th) — same date-preserving trade the Billdu handoff (148) already
     made, and the window totals never double while it happens. */
  const MATCH = { days: 14 };   // how far a booking may trail its bell
  const nameKey = s => String(s || '').toLowerCase().replace(/[^a-z]+/g, ' ')
    .split(' ').filter(Boolean).sort().join(' ');
  const bellMatch = (() => {
    const spent = new Set(), repFix = new Map();
    const byName = new Map();
    for (const j of jobs) {
      if (!j.contract_signed_at || String(j.cc_company_id) === OASIS) continue;
      const k = nameKey(custName(j.title)); if (!k) continue;
      let arr = byName.get(k); if (!arr) byName.set(k, arr = []);
      arr.push(j);
    }
    const dayGap = (iso, ymd) =>
      Math.abs((new Date(String(iso).slice(0,10)) - new Date(String(ymd).slice(0,10))) / 86400000);
    for (const c of (claims || [])) {
      if (c.status !== 'pending' || c.cc_already_counted || c.cc_state === 'job_linked') continue;
      const k = nameKey(c.customer_name); if (!k) continue;
      const amt = Math.round(Number(c.claimed_amount || 0));
      const hits = (byName.get(k) || []).filter(j =>
        dayGap(j.contract_signed_at, c.signed_on) <= MATCH.days &&
        (Math.round(Number(j.fin_sold_amount || 0)) === amt || !j.rep_id));
      if (!hits.length) continue;
      spent.add(c);
      if (c.rep_id && repById[c.rep_id])
        for (const j of hits) if (!j.rep_id && !repFix.has(j)) repFix.set(j, c.rep_id);
    }
    return { spent, repFix };
  })();

  /* ── THE RUNG LAYER, WINDOW-SLICED (Kevin's 10 Aug ruling) ────────────────
     "I want my board to show all sales for today, whether it's been fully
      verified or not. That's an internal thing that we can work on later.
      I want that thing the same as the daily sales below it. That needs to
      match."
     One fold rule, one place — the same rule the rep rows have always used:
     open bells only (status pending), confirmer-suppressed
     (cc_already_counted / job_linked are already in the CC or Billdu money and
     counting them again is the $42K-vs-$29,052 class), match-suppressed
     (bellMatch above — a booking with no rep on it still spends its bell),
     dated by signed_on. No clock since 145 (Kevin, 12 Aug: "no verification
     process") — a bell stays in this fold at any age until CC or Billdu books
     it. */
  const rungAdd = (a, b) => {
    const A = ymdOf(a), B = ymdOf(b);
    const out = { value:0, count:0, byBrand:{}, byRep:{}, list:[] };
    for (const c of (claims || [])) {
      if (c.status !== 'pending') continue;
      if (c.cc_already_counted || c.cc_state === 'job_linked') continue;
      if (bellMatch.spent.has(c)) continue;
      const d = String(c.signed_on || '').slice(0,10);
      if (d < A || d >= B) continue;
      const rid = c.rep_id; if (!rid || !repById[rid]) continue;
      const amt = Number(c.claimed_amount || 0);
      const rb = rollup(c.cc_company_id || 'unknown');
      out.value += amt; out.count++;
      (out.byBrand[rb] ??= { value:0, count:0 });
      out.byBrand[rb].value += amt; out.byBrand[rb].count++;
      (out.byRep[rid] ??= { value:0, count:0 });
      out.byRep[rid].value += amt; out.byRep[rid].count++;
      out.list.push({ cust: c.customer_name || null, brand: rb,
        resolved: !!c.cc_company_id, amount: amt, src:'bell', at: d,
        rep: repById[rid]?.name || 'Unknown', repId: rid });
    }
    return out;
  };

  /* ── THE ONE SIGNED RULE ──────────────────────────────────────────────────
     Every surface that prints signed dollars for a window reads ONE union:
     CC contracts (non-Oasis, bell-deduped, rep from the record or from the
     bell that rang the deal) + Billdu invoices (all of Oasis) + open rung
     bells (confirmer- and match-suppressed). slice() is the full instrument;
     signedUnion() is the same arithmetic reduced to money and counts, for the
     series that only need totals. The trend charts used to keep their own
     walk and it drifted — Oasis counted from BOTH books, ~$183K a month of
     chart that contradicted the headline. If a surface needs signed dollars
     and reads neither slice() nor signedUnion(), it is wrong by construction. */
  const signedUnion = (a, b) => {
    const cc = jobs.filter(j => String(j.cc_company_id) !== OASIS && inR(j.contract_signed_at, a, b));
    const bd = billduAdd(a, b), rg = rungAdd(a, b);
    return { rev: cc.reduce((n, j) => n + Number(j.fin_sold_amount || 0), 0) + (bd ? bd.value : 0) + rg.value,
             jobs: cc.length + (bd ? bd.count : 0) + rg.count, cc, bd, rg };
  };

  function slice(a,b){
    /* Oasis CC entries are OUT of the money side — their amounts drift from the
       invoice truth and the invoice feed (billduAdd) now carries all of Oasis.
       They stay in `done` below: production/built is CC's own event. */
    const jsAll = jobs.filter(j => inR(j.contract_signed_at,a,b));
    const js = jsAll.filter(j => String(j.cc_company_id) !== OASIS);
    const ccOasisSuperseded = jsAll.filter(j => String(j.cc_company_id) === OASIS)
                                   .reduce((n,j)=>n+Number(j.fin_sold_amount||0),0);
    /* The close-rate denominator is appointments that have RUN, so the
       appointment side is capped at NOW. A live window (MTD / this week /
       today) spans its whole calendar period, and filtering on the raw bound
       swept in appointments booked for the REST of the period — signed-so-far
       divided by run-plus-still-to-come, a close rate that read low all month
       and only "caught up" at month end. Signings can only exist up to now,
       so capping the appointments makes both sides cover the same elapsed
       days; a finished window sits entirely behind NOW and is untouched. */
    const runBy = new Date(Math.min(b.getTime(), NOW.getTime()));
    const as = appts.filter(x => inR(x.starts_at,a,runBy));
    const done = jobs.filter(j => inR(j.completed_at,a,b));
    const rev = js.reduce((n,j)=>n+Number(j.fin_sold_amount||0),0);
    /* brands and byRep each carry a `list` of their own job rows, so a rep row
       or a brand row can expand in place to the jobs behind it — Kevin: "under
       the sales guys name and his daily sales and units I can click on the box
       if I want to." Each row keeps its OWN brand, so a cross-brand rep like Eric
       reads as several chips, never one blurred line. */
    /* unowned = signed deals with no salesperson on the record. Kevin: "pull the
       uncategorized out and make those obvious." A CC contract with no rep_id is
       a genuine data gap — the Jim Brown $23K class — and must stare at him, not
       nest quietly under a brand. Office-sent Billdu deals belong here too: the
       seller is not on the record either, though for a known reason. */
    const brands = {}, byRep = {}, unowned = [], allRows = [];
    for (const j of js) {
      const bid = rollup(j.cc_company_id || 'unknown');
      /* Rep from the record, else from the bell that rang this deal
         (bellMatch.repFix) — a contract the office keyed with no rep lands
         under its seller once, instead of splitting into an unowned line
         plus that seller's open bell. */
      const rid = j.rep_id || bellMatch.repFix.get(j) || null;
      const row = { cust: custName(j.title), brand: bid, resolved: !!BRANDS[bid],
                    amount: Number(j.fin_sold_amount||0), src:'cc',
                    // CC stamps contract_signed_at at ET-midnight (04:00Z), so the
                    // first ten chars ARE the ET day — same trick soldDay uses.
                    at: String(j.contract_signed_at||'').slice(0,10) || null,
                    viaBell: !j.rep_id && !!rid,
                    rep: rid ? (repById[rid]?.name || 'Unknown') : null,
                    repId: rid && repById[rid] ? rid : null };
      allRows.push(row);
      (brands[bid] ??= { jobs:0, rev:0, list:[] });
      brands[bid].jobs++; brands[bid].rev += row.amount; brands[bid].list.push(row);
      if (rid) { (byRep[rid] ??= { jobs:0, rev:0, appts:0, list:[] });
        byRep[rid].jobs++; byRep[rid].rev += row.amount; byRep[rid].list.push(row); }
      else { unowned.push({ ...row, reason:'no-rep' }); }
    }
    for (const x of as) if (x.rep_id) { (byRep[x.rep_id] ??= { jobs:0, rev:0, appts:0, list:[] }); byRep[x.rep_id].appts++; }

    /* Never one blended close (Kevin, 10 Aug): median days-to-close runs ~3
       days for Pro-Tec to ~12 for Oasis with tails past 100, so a single
       company-wide rate moves with brand MIX, not with closing. Elapsed
       appointments are counted per brand here so every close-rate surface can
       render per brand; an appointment whose project the sync has not
       delivered has no brand and sits in no brand's rate (counted, said out
       loud, never guessed). */
    const apptsByBrand = {};
    for (const x of as) { const ab = apptBrand[String(x.cc_project_id)] || 'unknown';
      apptsByBrand[ab] = (apptsByBrand[ab] || 0) + 1; }

    // Fold Billdu into Oasis here, so no downstream card has to remember to.
    const bd = billduAdd(a,b);
    if (bd && (bd.value || bd.count)) {
      (brands[OASIS] ??= { jobs:0, rev:0, list:[] });
      brands[OASIS].rev += bd.value;
      brands[OASIS].jobs += bd.count;
      brands[OASIS].billdu = bd.value;
      brands[OASIS].billduCount = bd.count;
      // individual invoices feed the per-rep and per-brand lists…
      for (const r of bd.rows) {
        const rid = r.repId || OFFICE;
        const row = { cust: r.client_name || null, brand: OASIS, resolved: true,
                      amount: Number(r.accepted_value||0), src:'billdu',
                      office: rid === OFFICE,
                      rep: rid === OFFICE ? null : (repById[rid]?.name || 'Unknown'),
                      repId: rid !== OFFICE && repById[rid] ? rid : null };
        allRows.push(row);
        brands[OASIS].list.push(row);
        (byRep[rid] ??= { jobs:0, rev:0, appts:0, list:[] }).list.push(row);
        if (rid === OFFICE) unowned.push({ ...row, reason:'office' });
      }
      // …and the aggregates keep the rep totals right, or a seller reads $0 on a
      // day they sold.
      for (const [rid, v] of Object.entries(bd.byRep)) {
        (byRep[rid] ??= { jobs:0, rev:0, appts:0, list:[] });
        byRep[rid].rev += v.value;
        byRep[rid].jobs += v.count;
        byRep[rid].billdu = (byRep[rid].billdu || 0) + v.value;
        byRep[rid].billduCount = (byRep[rid].billduCount || 0) + v.count;
      }
    }

    /* BELL CLAIMS — the board's open layer, folded into BOTH the rep rows and
       the company money since Kevin's 10 Aug ruling: "I want my board to show
       all sales for today, whether it's been fully verified or not… I want
       that thing the same as the daily sales below it. That needs to match."
       This deliberately supersedes the earlier board-credit-only display for
       this page — the ruling is verbatim in ROADMAP.md (10 Aug, the rung
       ruling). The fold rule itself is unchanged and it is the whole safety:
       open bells only, confirmer-suppressed (a bell CC or Billdu has booked is
       already in the money above — counting it again is the $42K-vs-$29,052
       class), and the 5-business-day clock (136) pulls a never-turned-in bell
       out of every figure here at once, notifying the managers (137). Every
       rung dollar stays LABELED — bell ticks on the brand rows, the incl. line
       on the hero — so what is verified and what is rung is always readable.
       ⚠️ sale_fact and team_scoreboard_* stay CC-only: this fold is this
       page's OWN layer (count-once-per-surface), and the supervisor app and
       kpi feeds still read booked money only. */
    const rung = rungAdd(a, b);
    for (const row of rung.list) {
      allRows.push(row);
      (brands[row.brand] ??= { jobs:0, rev:0, list:[] });
      brands[row.brand].jobs++; brands[row.brand].rev += row.amount;
      brands[row.brand].rung = (brands[row.brand].rung || 0) + row.amount;
      brands[row.brand].rungCount = (brands[row.brand].rungCount || 0) + 1;
      brands[row.brand].list.push(row);
      (byRep[row.repId] ??= { jobs:0, rev:0, appts:0, list:[] });
      byRep[row.repId].rev += row.amount; byRep[row.repId].jobs++;
      byRep[row.repId].rung = (byRep[row.repId].rung || 0) + row.amount;
      byRep[row.repId].rungCount = (byRep[row.repId].rungCount || 0) + 1;
      byRep[row.repId].list.push(row);
    }
    const unionRev = rev + (bd ? bd.value : 0) + rung.value;

    /* Each rep and each brand carries its own job list, capped and sorted by
       value so the accordion under it stays bounded on a long window; the count
       and the remaining value are kept so it can say what it did not list. The
       flat all-jobs card this used to feed is gone — Kevin found it too busy —
       so the jobs now live only under the rep and brand rows that expand to
       them, quiet until asked. */
    /* Kevin: "I didn't want less, just less on the FIRST screen… Each item needs
       to show everything in the world. I want to see the Millennium Falcon on
       mine." So the caps behind a tap are generous, not tidy: a rep or brand
       opens to its hundred largest, and the whole window keeps a flat ledger of
       its two hundred largest for the all-jobs drawer. The tap is the door, not
       the trash. */
    const RCAP = 100, FLATCAP = 200;
    const capped = (v) => { const { list, ...rest } = v;
      const sorted = [...(list||[])].sort((a,b)=>b.amount-a.amount);
      return { ...rest, jobList: sorted.slice(0,RCAP), jobCount: sorted.length,
               jobRest: sorted.slice(RCAP).reduce((n,r)=>n+r.amount,0) }; };

    const uSorted = [...unowned].sort((a,b)=>b.amount-a.amount);
    // the flat ledger the all-jobs drawer reopens — every job in the window,
    // both systems, largest first
    const flat = [...allRows].sort((a,b)=>b.amount-a.amount);

    return {
      rung,
      signedList: flat.slice(0,FLATCAP),
      signedCount: flat.length,
      signedRestValue: flat.slice(FLATCAP).reduce((n,r)=>n+r.amount,0),
      unowned: uSorted.slice(0,RCAP),
      unownedCount: uSorted.length,
      unownedTotal: uSorted.reduce((n,r)=>n+r.amount,0),
      unownedRest: uSorted.slice(RCAP).reduce((n,r)=>n+r.amount,0),
      unownedNoRep: unowned.filter(r=>r.reason==='no-rep').length,
      unownedOffice: unowned.filter(r=>r.reason==='office').length,
      // rev is the COMPANY figure — both systems. ccRev keeps the seam readable.
      company:{ jobs:js.length, rev: unionRev, ccRev: rev,
                billdu: bd ? bd.value : 0, billduCount: bd ? bd.count : 0,
                rungRev: rung.value, rungCount: rung.count,
                suppressed: ccOasisSuperseded,
                deals: js.length + (bd ? bd.count : 0) + rung.count,
                appts:as.length, completed:done.length,
                /* Built = CC project_completed_at landed in this window. The
                   value is those jobs' contract value — what the built work was
                   sold for, not what has been billed or banked for it. QB owns
                   billing; this is production. */
                builtRev: done.reduce((n,j)=>n+Number(j.fin_sold_amount||0),0),
                // close rate stays CC-over-CC: Billdu deals carry no CC appointment,
                // and mixing them would inflate it.
                close: as.length ? Math.round(js.length/as.length*100) : null,
                avgJob: js.length ? Math.round(rev/js.length) : 0 },
      /* One close rate PER BRAND — same numerator rule as the momentum chips
         (Kevin, 30 Jul): all signings — CC contracts, Billdu acceptances for
         Oasis, open rung claims — over that brand's own appts elapsed. Since
         the 10 Aug that-needs-to-match fold, brands[].jobs already carries
         all three feeds (rung included, confirmer-suppressed), so it IS the
         numerator — adding claims again here would be the count-once-per-
         surface double-count. Every known brand renders even at zero (a
         missing brand reads as broken, not as quiet); unmapped ids ride
         along at the end. */
      closeByBrand: [...BRAND_ORDER,
        ...[...new Set([...Object.keys(brands), ...Object.keys(apptsByBrand)])]
          .filter(bid => bid !== 'unknown' && !BRAND_ORDER.includes(bid))]
        .map(bid => { const signed = brands[bid]?.jobs || 0;
                      const ap = apptsByBrand[bid] || 0;
                      return { id: bid, signed, appts: ap,
                               close: ap ? Math.round(signed / ap * 100) : null }; }),
      apptsUnknownBrand: apptsByBrand.unknown || 0,
      brands: Object.entries(brands).map(([id,v])=>({id, ...capped(v)})),
      /* The rep list must CROSS-FOOT with the company figure — every dollar in
         rev sits under exactly one row here. Deals with no seller anywhere on
         the record (CC rep null AND no bell matched them) ride as one visible
         pseudo-row, same treatment as the Oasis office line: dimmed, not
         clickable, named as the data gap it is. Before this row existed the
         sales-by-rep total ran under the hero by exactly the unowned dollars
         and the two read as different truths. */
      reps: [...Object.entries(byRep).map(([id,v])=>({
        id,
        name: id === OFFICE ? 'Oasis · unattributed'
                            : (repById[id]?.name ?? 'Unknown'),
        role: id === OFFICE ? 'office-sent' : (repById[id]?.role ?? 'sales'),
        office: id === OFFICE,
        ...capped(v),
        // Close = ALL signings over CC appointments — one rule with the trend
        // chips (Kevin, 30 Jul): CC contracts + Billdu acceptances + open bell
        // rings. The union guards upstream keep a deal in exactly one feed, and
        // a ring that CC never confirms leaves numerator and board together.
        close: v.appts ? Math.round(v.jobs/v.appts*100) : null,
      })), ...(() => { const noRep = unowned.filter(r => r.reason === 'no-rep');
        if (!noRep.length) return [];
        return [{ id:'__norep', name:'No rep on record', role:'data gap',
                  office:true, norep:true,
                  ...capped({ jobs:noRep.length, rev:noRep.reduce((n,r)=>n+r.amount,0),
                              appts:0, list:noRep }), close:null }];
      })()].filter(r=>r.rev>0||r.appts>0).sort((x,y)=>y.rev-x.rev),
    };
  }

  // Brands that exist at all, for seeding targets. The per-brand collected/open
  // balances this used to compute are not rendered anywhere since the builds and
  // markets cards went, so their columns are no longer fetched — that is ~1MB of
  // phone payload saved rather than downloaded and discarded.
  const brandIds = [...new Set(jobs.map(j => rollup(j.cc_company_id || 'unknown')))];

  /* The stacked trend, the daily strip and the monthly bars all read
     signedUnion() now. Each used to keep its own walk of `jobs` — and each
     walk forgot the Oasis-CC exclusion that slice() has had since 096, so
     every chart counted Oasis from BOTH books (~$183K a month in August)
     while the headline above it did not. Same union, one function, or the
     chart contradicts the headline — the 10 Aug that-needs-to-match ruling,
     finally applied to the drawing code too. */
  const weeks = [];
  for (let i=2;i>=0;i--){
    const a = addD(sow(NOW), -7*i), b = addD(a,7);
    const u = signedUnion(a,b);
    const br = {};
    for (const j of u.cc){ const k = rollup(j.cc_company_id||'unknown');
      (br[k] ??= {rev:0,jobs:0}); br[k].rev += Number(j.fin_sold_amount||0); br[k].jobs++; }
    if (u.bd && u.bd.value) { (br[OASIS] ??= {rev:0,jobs:0});
      br[OASIS].rev += u.bd.value; br[OASIS].jobs += u.bd.count; }
    for (const [bid,v] of Object.entries(u.rg.byBrand)) { (br[bid] ??= {rev:0,jobs:0});
      br[bid].rev += v.value; br[bid].jobs += v.count; }
    weeks.push({ label:`${a.getMonth()+1}/${a.getDate()}`, current:i===0, jobs:u.cc.length,
      rev: u.rev,
      brands: Object.entries(br).map(([id,v])=>({id,...v})) });
  }
  /* Trend series for the per-window drill-ins. Each window gets a shape that
     actually says something at its own resolution: a day reads against the last
     two weeks of days, a year against its months. */
  const daily = [];
  for (let i = 13; i >= 0; i--) {
    const a = addD(sod(NOW), -i), b = addD(a, 1);
    const u = signedUnion(a, b);
    daily.push({ label: `${a.getMonth()+1}/${a.getDate()}`, current: i === 0,
      jobs: u.jobs, rev: u.rev });
  }
  const monthly = [];
  for (let i = 12; i >= 0; i--) {
    const a = addM(som(NOW), -i), b = addM(a, 1);
    const u = signedUnion(a, b);
    monthly.push({ label: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][a.getMonth()],
      current: i === 0, jobs: u.jobs, rev: u.rev });
  }

  const cadence = (() => {
    const a = sow(NOW), names = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    return names.map((label,n) => { const d0 = addD(a,n), d1 = addD(d0,1);
      return { label, appts: appts.filter(x=>inR(x.starts_at,d0,d1)).length,
               signed: jobs.filter(j=>inR(j.contract_signed_at,d0,d1)).length,
               future: d0.getTime() > NOW.getTime() }; });
  })();
  /* ═══ APPOINTMENTS ══════════════════════════════════════════════════════
     Kevin: "Appts good life good. Appts bad pay attention need more."

     The number that carries the anxiety is not how many ran — it is how many are
     ON THE BOOKS ahead. Two things had to be checked before this could say
     anything useful:

     · Booking lead time is a median of 3 days, p90 of 7. So Liberty does book
       ahead, and a thin week ahead is a real signal rather than just how the
       business runs.
     · A raw "next 7 days" count compared against how full past weeks ENDED is
       apples to oranges — most of a week gets booked during that week. The
       comparison is therefore reconstructed as-of: what was on the books on the
       same weekday in earlier weeks, counting only what had been booked by then.

     And the appointment sync is not continuous, so the card prints how stale it
     is. Telling him bookings are thin using half-day-old data would be alarming
     him about bookings that may already exist. ─────────────────────────────── */
  const appointments = (() => {
    const live = appts.filter(a => a.starts_at && !a.is_internal);
    const projBrand = {};
    for (const j of jobs) if (j.cc_project_id) projBrand[String(j.cc_project_id)] = rollup(j.cc_company_id);
    const at = a => new Date(a.starts_at);
    const inD = (a, x, y) => { const t = at(a); return t >= x && t < y; };
    const count = (x, y) => live.filter(a => inD(a, x, y)).length;

    /* Contractors Cloud stores these as Eastern local time but LABELS them UTC.
       Checked rather than assumed: both starts_at and cc_created_at cluster
       07:00–17:00 "UTC" with nothing between 19:00 and 06:00. Real UTC would put
       Eastern business hours at 12:00–22:00. So parsing them as UTC and letting
       the browser convert shifts every timestamp four hours earlier.

       It happens not to break day buckets — business hours minus four hours is
       still the same calendar day — but relying on that is luck, not design. Day
       comparisons therefore use the DATE PORTION OF THE STRING, which is the
       business date CC intended, whatever the offset claims. */
    const dstr = ts => String(ts || '').slice(0, 10);
    const ymdL = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    // as-of: only what had been created by `asOf`
    const bookedAsOf = (asOf, days) => live.filter(a => {
      const t = at(a);
      if (!(t >= asOf && t < addD(asOf, days))) return false;
      if (a.cc_created_at && new Date(a.cc_created_at) > asOf) return false;
      return true;
    }).length;

    const T = sod(NOW);

    /* ── BOOKED TODAY · the setters' output ────────────────────────────────
       Kevin: "Liked booked today is my key indicator. I check my marketing
       girls… That's the money shot. Daily new appts."

       This counts appointments CREATED today, which is a different question
       from how full the calendar is: it measures what the setting team produced
       today, not what the crews are driving to. Both bases are kept and both
       are labelled, because confusing them would make a busy calendar look like
       a productive morning. ─────────────────────────────────────────────── */
    /* Indexed once. Everything below asks "what was created on this date"
       hundreds of times — per weekday, per brand, per bar — and a linear scan of
       nine thousand appointments each time is how a phone gets slow. */
    const createdIdx = {};
    for (const a of appts) if (a.cc_created_at) (createdIdx[dstr(a.cc_created_at)] ??= []).push(a);
    const createdOn = day => createdIdx[day] || [];
    /* Contractors Cloud labels Eastern local time as UTC, so the hour inside the
       string IS the Eastern hour the booking was taken. That makes an honest
       as-of-this-hour comparison possible without any timezone maths. */
    const hourOf = a => Number(String(a.cc_created_at).slice(11,13));
    const createdOnBy = (day, h) => createdOn(day).filter(a => hourOf(a) <= h);
    const todayStr = ymdL(T), yestStr = ymdL(addD(T,-1));
    const bookedTodayRows = createdOn(todayStr);
    const bookedToday = bookedTodayRows.length;
    const bookedYesterday = createdOn(yestStr).length;

    // Weekday norm: weekends are structurally zero here and would drag a plain
    // average down until every weekday looked like a win.
    const normDays = [];
    for (let i = 1; i <= 28; i++) {
      const d = addD(T, -i);
      if (d.getDay() === 0 || d.getDay() === 6) continue;
      normDays.push(createdOn(ymdL(d)).length);
    }
    const sortedNorm = [...normDays].sort((x,y)=>x-y);
    const bookedNormFlat = sortedNorm.length ? sortedNorm[Math.floor(sortedNorm.length/2)] : 0;
    const isWeekend = T.getDay() === 0 || T.getDay() === 6;

    /* ── WEEKDAY SHAPE ────────────────────────────────────────────────────────
       Kevin: "appts don't come evenly all week. Monday is top-heavy etc. Can you
       calculate the actual daily call average for that stat."

       He is right and the distortion is large. Measured over the last nine
       weeks, the median booked per day runs Mon 32 · Tue 22 · Wed 23 · Thu 19 ·
       Fri 23. A single flat norm of 23 therefore makes an ordinary Monday read
       nearly 40% ahead and an ordinary Thursday read behind, purely from which
       day it is. Every daily comparison on this page now comes from the same
       weekday, not from a blended week.

       Two baselines per weekday, because a day in progress is not a finished
       one: `full` is what that weekday finishes at, `byHour` is what it has
       normally reached by the hour it is now. Bookings land through the whole
       day — half by 11am, ~88% by 2pm — so comparing a part-day against a
       finished-day norm is the same mistake in a different axis. */
    const med = a => { const v = [...a].sort((x,y)=>x-y);
                       return v.length ? v[Math.floor(v.length/2)] : 0; };
    const NOWH = NOW.getHours();
    const LOOKBACK = 63;                   // nine samples per weekday
    const dowFull = {}, dowByHour = {}, brandDowFull = {}, brandDowByHour = {};
    for (const b of BRAND_ORDER) { brandDowFull[b] = {}; brandDowByHour[b] = {}; }
    for (let i = 1; i <= LOOKBACK; i++) {
      const d = addD(T, -i), w = d.getDay(), key = ymdL(d);
      const all = createdOn(key), upto = createdOnBy(key, NOWH);
      (dowFull[w] ??= []).push(all.length);
      (dowByHour[w] ??= []).push(upto.length);
      for (const b of BRAND_ORDER) {
        const hit = a => (projBrand[String(a.cc_project_id)] || 'unknown') === b;
        (brandDowFull[b][w] ??= []).push(all.filter(hit).length);
        (brandDowByHour[b][w] ??= []).push(upto.filter(hit).length);
      }
    }
    const DOWN = [0,1,2,3,4,5,6];
    const dowNorm     = Object.fromEntries(DOWN.map(w => [w, med(dowFull[w] || [])]));
    const dowNormHour = Object.fromEntries(DOWN.map(w => [w, med(dowByHour[w] || [])]));
    const brandDowNorm     = Object.fromEntries(BRAND_ORDER.map(b =>
      [b, Object.fromEntries(DOWN.map(w => [w, med(brandDowFull[b][w] || [])]))]));
    const brandDowNormHour = Object.fromEntries(BRAND_ORDER.map(b =>
      [b, Object.fromEntries(DOWN.map(w => [w, med(brandDowByHour[b][w] || [])]))]));
    const TDOW = T.getDay();
    // what today should be measured against: this weekday, by this hour
    const bookedNorm     = dowNorm[TDOW] || 0;        // a finished one of today's weekday
    const bookedNormHour = dowNormHour[TDOW] || 0;    // where it normally stands by now
    const DOWFULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

    const bookedByBrand = {};
    for (const a of bookedTodayRows) {
      const b = projBrand[String(a.cc_project_id)] || 'unknown';
      bookedByBrand[b] = (bookedByBrand[b] || 0) + 1;
    }

    /* Per-brand weekday norms. Needed before any "this brand is quiet" alert can
       be trusted: measured over the last 56 days, Fencing books a median of 14 a
       weekday and Oasis 6, but Pro-Tec books 1. A brand whose normal IS
       near-zero cannot support a daily alarm — "below 40% of a median of 1" only
       ever means "zero", which happens on a tenth of normal days. So the norm is
       carried per brand and the alert gates on having enough baseline to mean
       something. */
    /* Per brand, same discipline: today's weekday, by this hour. `median` stays
       the name every consumer already reads, but it is no longer a blended-week
       figure — it is what this brand normally has on the board by now on a day
       like today. `full` is the finished-day figure, kept for labels and for the
       gate that decides whether a brand books enough to signal on daily at all. */
    const brandNorm = Object.fromEntries(BRAND_ORDER.map(b => [b, {
      median: brandDowNormHour[b][TDOW] || 0,
      full:   brandDowNorm[b][TDOW] || 0,
      days:   (brandDowFull[b][TDOW] || []).length,
    }]));

    /* ── APPOINTMENTS BY COMPANY · today / week / month, each like-for-like ────
       Kevin, from the office laptop: "month-to-date doesn't break down
       appointments per company… I need to separate them… Oasis is down when we
       think it is, but I don't really know. I need to know these things."

       Booking basis (cc_created_at) — the setters' output, the number he watches.
       Every window is compared against the SAME ELAPSED SPAN of prior periods,
       never a partial window against a finished one: this week's Monday-through-
       today against the same Monday-through-same-weekday of the prior four weeks,
       this month's first-N-days against the first-N-days of the prior three
       months. That is the week-reset discipline, applied per company. "Typical"
       is measured from real prior periods — never a target set by hand, never an
       invented threshold. The card shows direction and size against it and lets
       Kevin read the verdict himself.

       Bookings whose project the sync has not delivered resolve to no company.
       They are counted and surfaced as "N awaiting project sync", never dropped
       and never guessed into a brand — the same defect that made the setter
       alarm cry wolf earlier this week. */
    const bookedByBrandInRange = (x, y) => {
      const by = { unknown: 0 };
      for (const b of BRAND_ORDER) by[b] = 0;
      for (let d = new Date(x); d < y; d = addD(d, 1))
        for (const r of createdOn(ymdL(d))) {
          const b = projBrand[String(r.cc_project_id)] || 'unknown';
          by[b] = (by[b] || 0) + 1;
        }
      return by;
    };
    /* mean count for one brand across a set of prior periods, each [start, +len days).
       Samples are kept so the receipt can show which periods the typical came
       from — a typical nobody can interrogate is exactly what this page refuses
       to print. */
    const priorMean = (b, starts, lenDays) => {
      const vals = starts.map(s => {
        let n = 0;
        for (let i = 0; i < lenDays; i++)
          n += createdOn(ymdL(addD(s, i)))
                 .filter(r => (projBrand[String(r.cc_project_id)]||'unknown') === b).length;
        return n;
      });
      return { vals, mean: vals.length ? vals.reduce((a,c)=>a+c,0)/vals.length : 0 };
    };
    const elapsedWk = ((T.getDay()+6)%7) + 1;   // days Mon..today inclusive
    const elapsedMo = T.getDate();              // days 1..today inclusive
    const winEnd = addD(T, 1);
    const byCompany = {
      day: {
        typLabel: `a typical ${DOWFULL[TDOW]} by this hour`,
        sampleLabel: `median ${DOWFULL[TDOW].slice(0,3)} · last 9`,
        partial: true,
        counts: bookedByBrandInRange(T, winEnd),
        /* the same weekday-and-hour baseline the daily alarm now trusts, so the
           page never shows two different "typical today" numbers for one brand */
        typ: Object.fromEntries(BRAND_ORDER.map(b => [b, { mean: brandNorm[b].median, vals: null }])),
      },
      week: (() => {
        const starts = [1,2,3,4].map(w => addD(sow(T), -7*w));
        return {
          typLabel: `the same ${elapsedWk} day${elapsedWk===1?'':'s'} of the prior 4 weeks`,
          sampleLabel: 'prior 4 weeks', partial: elapsedWk < 7,
          counts: bookedByBrandInRange(sow(T), winEnd),
          typ: Object.fromEntries(BRAND_ORDER.map(b => [b, priorMean(b, starts, elapsedWk)])),
        };
      })(),
      month: (() => {
        /* The month tab rides the time machine. Live month: first-N-days
           against the same first-N-days of the prior 3 months — the week-reset
           discipline. A shifted month is CLOSED: the whole month against the
           prior 3 whole months, each measured at its own full length, because
           "first 5 days of July" is nobody's question once July is over. */
        if (MONTHOFF) {
          const mFrom = addM(som(T), -MONTHOFF), mTo = addM(mFrom, 1);
          const starts = [1,2,3].map(m => addM(mFrom, -m));
          const typ = Object.fromEntries(BRAND_ORDER.map(b => {
            const vals = starts.map(s => { let n = 0;
              for (let d = new Date(s), e = addM(s,1); d < e; d = addD(d,1))
                n += createdOn(ymdL(d))
                       .filter(r => (projBrand[String(r.cc_project_id)]||'unknown') === b).length;
              return n; });
            return [b, { vals, mean: vals.length ? vals.reduce((a,c)=>a+c,0)/vals.length : 0 }];
          }));
          return {
            typLabel: 'the prior 3 full months — a closed month reads whole against whole',
            sampleLabel: 'prior 3 months', partial: false,
            counts: bookedByBrandInRange(mFrom, mTo), typ,
          };
        }
        const starts = [1,2,3].map(m => new Date(T.getFullYear(), T.getMonth()-m, 1));
        return {
          typLabel: `the same ${elapsedMo} day${elapsedMo===1?'':'s'} of the prior 3 months`,
          sampleLabel: 'prior 3 months', partial: true,
          counts: bookedByBrandInRange(som(T), winEnd),
          typ: Object.fromEntries(BRAND_ORDER.map(b => [b, priorMean(b, starts, elapsedMo)])),
        };
      })(),
      /* This mean-of-prior-periods baseline is still declined for YTD, and always
         will be: there is no "prior 3 YTDs" to average. The tile draws a real
         month-by-month shape instead, each month against the median of the
         trailing 8 complete ones — see rhythm.ytd. This entry stays zero so the
         two never print a baseline each. */
      /* These two labels feed the by-company band ONLY, and that band has no YTD
         baseline whatsoever — every typ below is zero, so its tiles print "no
         baseline" and draw no tick. So they must describe THAT, not the hero
         tile's median. A sample label naming a reference the tiles do not draw
         is the fake-reference failure wearing a label. */
      ytd: {
        typLabel: 'no year-scale baseline',
        sampleLabel: 'counts only · no baseline at this grain', partial: true,
        counts: bookedByBrandInRange(soy(T), winEnd),
        typ: Object.fromEntries(BRAND_ORDER.map(b => [b, { mean: 0, vals: null }])),
      },
    };

    // creation-basis series, alongside the calendar-load series
    // two-letter weekday, so a bar can be read as "that was a Monday" at a glance
    const DOW2 = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    const bookedSeries = [];
    for (let i = 13; i >= 0; i--) { const d = addD(T,-i);
      bookedSeries.push({ label:`${d.getMonth()+1}/${d.getDate()}`, dow:DOW2[d.getDay()], dowN:d.getDay(),
                          n:createdOn(ymdL(d)).length,
                          today:i===0, weekend:d.getDay()===0||d.getDay()===6 }); }
    /* ── MTD, day by day, per brand ──────────────────────────────────────────
       For the EKG trace on the Appointments hero tile. No new feed: same
       createdOn/projBrand walk bookedByBrandInRange already does day-by-day,
       just keeping each day instead of collapsing it into one range total.
       Reference value per day is that weekday's own measured median
       (dowNorm/brandDowNorm, computed above) — the same "typical" the rest of
       this card already trusts, not a second definition of the word. */
    const bookedSeriesMTD = [];
    for (let d = new Date(som(T)); d <= T; d = addD(d, 1)) {
      const key = ymdL(d), dow = d.getDay();
      const byBrand = {}; for (const b of BRAND_ORDER) byBrand[b] = 0;
      let unknown = 0;
      for (const r of createdOn(key)) {
        const b = projBrand[String(r.cc_project_id)];
        if (b) byBrand[b] = (byBrand[b] || 0) + 1; else unknown++;
      }
      bookedSeriesMTD.push({
        date: key, day: d.getDate(), dow,
        n: Object.values(byBrand).reduce((a,c)=>a+c,0) + unknown, byBrand, unknown,
        typ: dowNorm[dow] || 0,
        typByBrand: Object.fromEntries(BRAND_ORDER.map(b => [b, brandDowNorm[b][dow] || 0])),
        today: key === todayStr, weekend: dow === 0 || dow === 6,
      });
    }
    /* ── RHYTHM COMPARISONS ──────────────────────────────────────────────────
       Kevin: "my rhythm vs my normal rhythm." Today, Week and YTD used to show a
       number with no shape beside it — only the live MTD window drew a trace, so
       three of the four tabs asked him to judge a count against nothing.

       Every window here compares against its OWN TRAILING NORMAL at its OWN
       GRAIN: today against the last 8 of today's weekday, this week's seven days
       against the last 8 weeks, each month against the same month a year back.
       No new feed — the same createdOn / projBrand walk the totals already do.

       MEDIAN, NOT MEAN, everywhere. One monster Monday must not raise the bar
       every other Monday is judged against; this is the same rule THE PULSE
       settled on for the same reason.

       PARTIAL PERIODS ARE COMPARED PARTIAL. A day in progress against eight
       finished ones is the same lie as a truncated axis, so today reads by the
       hour it actually is (CC stamps Eastern local, so hourOf is honest without
       timezone maths), the week reads only its elapsed days against the same
       elapsed days of the prior eight, and the current month reads against the
       same day-count of the prior year's month. Each label says which. */
    const RHY_N = 8;
    const cntOn   = (key, b) => b
      ? createdOn(key).filter(r => (projBrand[String(r.cc_project_id)]||'unknown') === b).length
      : createdOn(key).length;
    const cntOnBy = (key, h, b) => b
      ? createdOnBy(key, h).filter(r => (projBrand[String(r.cc_project_id)]||'unknown') === b).length
      : createdOnBy(key, h).length;
    /* The feed floor. Reading a date the fetch never covered returns zero, and a
       zero that means "not fetched" is the one number this page must never print
       as if it meant "none booked". Anything earlier is declined, not guessed.

       TWO FLOORS, AND THE LATER ONE WINS. APPT_SINCE is how far back we ASKED;
       the earliest row we actually hold is how far back the business has any
       record. They are not the same — Contractors Cloud's own history starts in
       April 2024 — so asking for January 2024 would return an honest-looking
       zero for months that simply predate the company's data. Taking the later
       of the two makes "no reference" mean it, and keeps the YTD card's
       missing-months note truthful instead of decorative. */
    const firstCreatedKey = Object.keys(createdIdx).sort()[0];
    const FEED0 = new Date(Math.max(
      +new Date(APPT_SINCE + 'T00:00:00'),
      firstCreatedKey ? +new Date(firstCreatedKey + 'T00:00:00') : 0));
    /* med() above answers 0 for an empty set, which is right where it is used —
       a weekday with no samples in the lookback genuinely booked nothing. Here it
       is wrong, and dangerously so: a brand with no history at all would get a
       normal of 0 and the card would draw a dashed reference line along the floor
       as if that were a measured baseline. No samples means NO REFERENCE, and the
       card says so in words. */
    const rmed = a => a.length ? med(a) : null;

    const rhyDay = b => {
      const samples = [];
      for (let i = 7; samples.length < RHY_N && i <= RHY_N * 7; i += 7) {
        const d = addD(T, -i); if (d < FEED0) break;
        const key = ymdL(d);
        samples.push({ label:`${d.getMonth()+1}/${d.getDate()}`,
                       full: cntOn(key, b), byHour: cntOnBy(key, NOWH, b) });
      }
      samples.reverse();
      return { dow: TDOW, dowName: DOWFULL[TDOW], hour: NOWH,
        soFar: cntOnBy(todayStr, NOWH, b), full: cntOn(todayStr, b),
        norm: rmed(samples.map(s => s.byHour)), normFull: rmed(samples.map(s => s.full)),
        n: samples.length, samples };
    };

    const rhyWeek = b => {
      const w0 = sow(T), days = [];
      for (let i = 0; i < 7; i++) {
        const d = addD(w0, i), future = d > T;
        days.push({ label: DOW2[d.getDay()], dow: d.getDay(),
                    v: future ? null : cntOn(ymdL(d), b), today: ymdL(d) === todayStr,
                    future, weekend: d.getDay() === 0 || d.getDay() === 6 });
      }
      const starts = [];
      for (let k2 = 1; k2 <= RHY_N; k2++) { const s = addD(w0, -7*k2); if (s < FEED0) break; starts.push(s); }
      /* One reference per weekday slot — the shape of a normal week, not a flat
         line. TODAY'S SLOT IS THE EXCEPTION: its bar holds a day still in
         progress, so measuring it against a finished weekday would draw every
         Thursday afternoon as a collapse. That slot alone is referenced against
         where the weekday normally stands BY THIS HOUR, so the bar and the mark
         above it are the same kind of number. */
      const ref = [];
      for (let i = 0; i < 7; i++) {
        const isToday = ymdL(addD(w0, i)) === todayStr;
        ref.push(rmed(starts.map(s => isToday
          ? cntOnBy(ymdL(addD(s, i)), NOWH, b)
          : cntOn(ymdL(addD(s, i)), b))));
      }
      const cur = days.slice(0, elapsedWk).reduce((n, d) => n + (d.v || 0), 0);
      const priorElapsed = starts.map(s => { let n = 0;
        for (let i = 0; i < elapsedWk; i++) n += cntOn(ymdL(addD(s, i)), b); return n; });
      return { days, ref, cur, norm: rmed(priorElapsed), n: starts.length, elapsed: elapsedWk };
    };

    const MON3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    /* ── THE MONTHLY REFERENCE IS THE TRAILING MEDIAN, NOT LAST YEAR ──────────
       Year over year is the wrong primary comparison for this business. A home
       services month is moved by weather, by one storm, by a single crew being
       out — so the same month a year ago is a sample of ONE, drawn from the
       noisiest possible distribution, and it decides the colour of the tile. The
       intel board settled this already ("against the 1-4 month rhythm, never
       against last year"); this brings the appointments card into line.

       The reference is therefore the MEDIAN OF THE TRAILING 8 COMPLETE MONTHS —
       the same trailing-8 median at the month grain that Today already uses over
       the last 8 of that weekday and Week uses over the last 8 weeks. One rule,
       three grains, so a reader who has learned one tab has learned all three.

       COMPLETE months only. The month in progress is not a sample of anything
       yet, and a month whose start predates the feed is a partial the feed
       cannot vouch for — both are declined rather than averaged in.

       Last year is still computed and still shown, quietly, as context. It never
       draws the reference line, never sets the gap and never colours anything.
       See the aside under the chart in heroAppts. */
    const RHY_MON = 8;
    const rhyYtd = b => {
      const yr = T.getFullYear(), months = [];
      for (let m = 0; m <= T.getMonth(); m++) {
        const s = new Date(yr, m, 1), e = addM(s, 1), current = m === T.getMonth();
        let n = 0;
        for (let d = new Date(s); d < e && d <= T; d = addD(d, 1)) n += cntOn(ymdL(d), b);
        /* Prior-year same month, secondary context only. The current month is
           still only ever set beside the same DAY COUNT of last year's month —
           half of August against all of last August would read as a collapse
           every month, on the first, even in a line that is only context. */
        const ps = new Date(yr - 1, m, 1), pe = current ? addD(ps, elapsedMo) : addM(ps, 1);
        const covered = ps >= FEED0;
        let p = 0;
        if (covered) for (let d = new Date(ps); d < pe; d = addD(d, 1)) p += cntOn(ymdL(d), b);
        months.push({ label: MON3[m], n, prior: covered ? p : null, current });
      }
      /* The trailing sample. Walked back from the month in progress, newest
         first, and stopped the moment a month start falls before the feed floor
         — after that every count would be a zero that means "not fetched", which
         is the one number this page must never print as if it meant "none
         booked". Fewer than 8 is fine and is SAID: the caption names N. */
      const sample = [];
      for (let i = 1; i <= RHY_MON; i++) {
        const s = addM(som(T), -i); if (s < FEED0) break;
        const e = addM(s, 1), cut = addD(s, elapsedMo);
        let full = 0, upto = 0;
        for (let d = new Date(s); d < e; d = addD(d, 1)) {
          const n = cntOn(ymdL(d), b);
          full += n;
          if (d < cut) upto += n;   // the same elapsed day-count, for the partial month
        }
        sample.push({ label: MON3[s.getMonth()], full, upto });
      }
      sample.reverse();
      /* TWO MEDIANS OFF ONE SAMPLE, and each is used only where it is like for
         like. `normFull` judges a finished month. `norm` judges the month in
         progress, and is built from those same 8 months truncated to today's
         day-of-month — the partial-against-partial discipline the day and week
         grains already keep. rmed answers null on an empty sample, so no history
         draws NO line rather than a line along the floor. */
      const normFull = rmed(sample.map(s => s.full));
      const norm     = rmed(sample.map(s => s.upto));
      // per-slot reference: the finished months against a finished normal, the
      // month in progress against the same span of those months
      for (const m of months) m.ref = m.current ? norm : normFull;
      const withPrior = months.filter(x => x.prior !== null);
      const cur = months.find(x => x.current);
      return { months,
        /* `cur` is the year — what the headline counts. `curNow` is the month in
           progress, which is the only figure the gap may use, because the
           reference is a monthly median and a year total is not a month. */
        cur: months.reduce((a, x) => a + x.n, 0),
        curNow: cur ? cur.n : 0,
        // so the caption can say which bar is the part-month, and how short it is
        curLabel: MON3[T.getMonth()], elapsed: elapsedMo,
        norm, normFull, n: sample.length,
        sampleSpan: sample.map(s => s.label),
        /* The floor the feed ACTUALLY reaches, not the one we asked for. Naming
           APPT_SINCE here would tell a reader the feed holds a year it does not
           — the two-floor trap FEED0 exists to close. */
        feedFrom: FEED0,
        /* ── secondary context, never a reference ── */
        prior: withPrior.length ? withPrior.reduce((a, x) => a + x.prior, 0) : null,
        priorCur: withPrior.length ? withPrior.reduce((a, x) => a + x.n, 0) : null,
        priorSpan: withPrior.map(x => x.label) };
    };

    const perBrand = fn => Object.fromEntries(BRAND_ORDER.map(b => [b, fn(b)]));
    const rhythm = {
      day:  { all: rhyDay(null),  brands: perBrand(rhyDay) },
      week: { all: rhyWeek(null), brands: perBrand(rhyWeek) },
      ytd:  { all: rhyYtd(null),  brands: perBrand(rhyYtd) },
    };

    // forward calendar: today + the next 7 days, the "is the diary filling" read
    const aheadSeries = [];
    for (let i = 0; i <= 7; i++) { const d = addD(T,i);
      aheadSeries.push({ label:`${d.getMonth()+1}/${d.getDate()}`, dow:DOW2[d.getDay()],
                         n:count(d, addD(d,1)), today:i===0, weekend:d.getDay()===0||d.getDay()===6 }); }
    const bookedWeekly = [];
    for (let i = 7; i >= 0; i--) {
      const a0 = addD(sow(NOW), -7*i); let n = 0;
      for (let k = 0; k < 7; k++) n += createdOn(ymdL(addD(a0,k))).length;
      bookedWeekly.push({ label:`${a0.getMonth()+1}/${a0.getDate()}`, n, current:i===0 }); }
    const bookedMonthly = [];
    for (let i = 11; i >= 0; i--) {
      const a0 = addM(som(NOW), -i), b0 = addM(a0,1); let n = 0;
      for (let d = new Date(a0); d < b0; d = addD(d,1)) n += createdOn(ymdL(d)).length;
      bookedMonthly.push({ label:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][a0.getMonth()],
                           n, current:i===0 }); }

    const next7 = bookedAsOf(T, 7);
    // same weekday, three weeks back, measured the same way
    const priorSameDay = [1,2,3].map(w => {
      const d = addD(T, -7*w);
      return { label: `${d.getMonth()+1}/${d.getDate()}`, n: bookedAsOf(d, 7) };
    });
    const priorAvg = priorSameDay.length
      ? Math.round(priorSameDay.reduce((n,p)=>n+p.n,0)/priorSameDay.length) : 0;

    // 14 days behind + 7 ahead, so the cliff is visible in one shape
    const series = [];
    for (let i = 13; i >= 1; i--) { const d = addD(T,-i);
      series.push({ label:`${d.getMonth()+1}/${d.getDate()}`, n:count(d,addD(d,1)), when:'past' }); }
    series.push({ label:`${T.getMonth()+1}/${T.getDate()}`, n:count(T,addD(T,1)), when:'today' });
    for (let i = 1; i <= 7; i++) { const d = addD(T,i);
      series.push({ label:`${d.getMonth()+1}/${d.getDate()}`, n:count(d,addD(d,1)), when:'ahead' }); }

    const weekly = [];
    for (let i = 7; i >= 0; i--) { const a = addD(sow(NOW), -7*i), b = addD(a,7);
      weekly.push({ label:`${a.getMonth()+1}/${a.getDate()}`, n:count(a,b), current:i===0 }); }
    const monthlyA = [];
    for (let i = 11; i >= 0; i--) { const a = addM(som(NOW), -i), b = addM(a,1);
      monthlyA.push({ label:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][a.getMonth()],
        n:count(a,b), current:i===0 }); }

    const byBrandWin = (x,y) => { const o = {};
      for (const a of live) { if (!inD(a,x,y)) continue;
        const b = projBrand[String(a.cc_project_id)] || 'unknown';
        o[b] = (o[b]||0)+1; }
      return o; };

    const synced = live.map(a=>a.synced_at).filter(Boolean).sort();
    const newest = synced[synced.length-1] || null;
    const staleHours = newest ? (Date.now() - new Date(newest).getTime())/3600000 : null;

    return {
      // creation basis — what the setters produced
      bookedToday, bookedYesterday, bookedNorm, isWeekend,
      // a Sunday zero is structural, not a bad day — say which it is
      yesterdayWasWeekend: [0,6].includes(addD(T,-1).getDay()),
      /* vs THIS weekday, by THIS hour — the only comparison that is not
         flattered or punished by which day of the week it happens to be. The
         old flat-week figure is kept alongside so the page can show how far off
         the blended number was. */
      bookedNormHour, bookedNormFlat,
      bookedVsNorm: bookedNormHour ? Math.round((bookedToday - bookedNormHour)/bookedNormHour*100) : null,
      dowNorm, dowNormHour, todayDow: TDOW, todayDowName: DOWFULL[TDOW],
      nowHour: NOWH,
      bookedByBrand, bookedSeries, bookedSeriesMTD, aheadSeries, bookedWeekly, bookedMonthly, brandNorm,
      lastCreatedAt: bookedTodayRows.map(a=>a.cc_created_at).sort().pop() || null,
      // calendar basis — what the crews are driving to
      today: count(T, addD(T,1)),
      yesterday: count(addD(T,-1), T),
      next7, priorSameDay, priorAvg,
      vsPrior: priorAvg ? Math.round((next7 - priorAvg)/priorAvg*100) : null,
      series, weekly, monthly: monthlyA,
      brandsAhead: byBrandWin(T, addD(T,7)),
      brandsMonth: byBrandWin(som(NOW), addD(T,1)),
      byCompany,
      windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => [k, count(wv.from, wv.to)])),

      /* Per-window appointment detail for the drill-ins. Kevin: "When I click on
         the daily report on owner dash no apt data at all." Both bases are
         carried per window — what was SET in it, and what SAT on the calendar in
         it — plus the same figures a window back so each can be compared. */
      perWindow: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => {
        const bookedIn = (x,y) => { let n = 0, by = {};
          for (let d = new Date(x); d < y; d = addD(d,1)) {
            for (const r of createdOn(ymdL(d))) { n++;
              const b = projBrand[String(r.cc_project_id)] || 'unknown';
              by[b] = (by[b]||0)+1; } }
          return { n, by }; };
        const heldBy = byBrandWin(wv.from, wv.to);
        const [pa,pb] = prevRange(wv);
        const b = bookedIn(wv.from, wv.to), pbk = bookedIn(pa, pb);
        return [k, {
          booked: b.n, bookedByBrand: b.by, bookedPrev: pbk.n,
          held: count(wv.from, wv.to), heldByBrand: heldBy,
          heldPrev: count(pa, pb),
        }];
      })),
      leadMedianDays: 3,
      rhythm,
      coverage: { total: appts.length, dated: live.length,
                  withProject: live.filter(a=>projBrand[String(a.cc_project_id)]).length },
      syncedAt: newest, staleHours,
    };
  })();

  const targets = (() => {
    const monthly = {};
    for (const b2 of brandIds) {
      let sum = 0;
      for (let i=3;i>=1;i--){ const a = addM(som(NOW),-i), z = addM(a,1);
        sum += jobs.filter(j=>rollup(j.cc_company_id)===b2 && inR(j.contract_signed_at,a,z))
                   .reduce((n,j)=>n+Number(j.fin_sold_amount||0),0); }
      monthly[b2] = Math.round(sum/3);
    }
    /* The word on the surface is "goal" per Kevin's ruling; the substance is
       unchanged and still stated — an auto-set baseline, not a committed quota. */
    return { source:'auto-set', basis:'trailing 3 full months, per brand',
      note:'Nothing in Contractors Cloud or QuickBooks carries a real quota yet, so each brand’s goal here is its own recent average — a baseline to beat, not a number anybody committed to. Set real quotas and these give way to them.',
      monthly };
  })();

  /* ── MONTH SHAPE ──────────────────────────────────────────────────────────
