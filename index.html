    ${W.billdu ? `<div class="hero-incl">incl. <b>${short(W.billdu)}</b> <span class="feed-tag billdu">live · billdu</span> — Oasis reads from Billdu invoices, counted on the day the rep sold it</div>` : ''}
    ${W.rung && W.rung.value ? `<div class="hero-incl">incl. <b>${short(W.rung.value)}</b> <span class="feed-tag bell">bell</span> — ${W.rung.count} deal${W.rung.count===1?'':'s'} rung and awaiting the book. In the figure per Kevin's 10 Aug ruling ("show all sales, whether it's been fully verified or not"); hands off to CC / Billdu when the feed books it, comes off after 5 business days if never turned in.</div>` : ''}
    ${billduDown() ? `<div class="hero-incl warn">Contractors Cloud only — the Billdu feed is unreadable, so Oasis sales (which read from Billdu invoices) are <b>missing from this figure</b>, not absent from the day.</div>` : ''}
    ${W.billdu || W.rungRev ? `<div class="seam">
      <span><b>${short(W.ccRev)}</b> signed in Contractors Cloud · ${W.jobs - (W.billduCount||0)} contract${(W.jobs - (W.billduCount||0))===1?'':'s'}</span>
      ${W.billdu?`<span><b>${short(W.billdu)}</b> invoiced in Billdu · ${W.billduCount} Oasis deal${W.billduCount===1?'':'s'} — the whole Oasis figure, per Kevin's go-off-of-Billdu ruling</span>`:''}
      ${W.rungRev?`<span><b>${short(W.rungRev)}</b> 🔔 rung · ${W.rungCount} bell${W.rungCount===1?'':'s'} awaiting the book — counts now, hands off when the feed books it</span>`:''}

        <span class="no-warn">⚠</span>
        <div class="no-headtext">
          <div class="no-title">Needs an owner</div>
          <div class="no-stat"><b>${W.unownedCount}</b> job${W.unownedCount===1?'':'s'} · <b>${short(W.unownedTotal)}</b> · no seller recorded</div>
        </div>
      </div>
      <div class="card-sub">Signed work with nobody credited — pulled out so it does not hide.${(()=>{
        const nr = u.filter(r=>r.reason==='no-rep'), of = u.filter(r=>r.reason==='office');
        const $nr = nr.reduce((n,r)=>n+r.amount,0), $of = of.reduce((n,r)=>n+r.amount,0);
        return (W.unownedNoRep?` <b>${W.unownedNoRep}</b> ${W.unownedNoRep===1?'is a Contractors Cloud contract':'are Contractors Cloud contracts'} worth <b>${short($nr)}</b> with no rep on ${W.unownedNoRep===1?'it':'them'} — a gap to fix at the source.`:'')
             + (W.unownedOffice?` <b>${W.unownedOffice}</b> worth <b>${short($of)}</b> ${W.unownedOffice===1?'was':'were'} sent from Oasis's office account, where the seller is not on the Billdu record.`:'');
      })()}</div>
      ${/* the ten biggest stay loud on the face of the card; the tail opens on a

      ${u.slice(0,10).map(r=>`<div class="joblrow sub">

      ${rest>0?`<div class="wfoot" style="margin-top:8px">+ ${rest} more${W.unownedRest?` totaling ${short(W.unownedRest)}`:''} beyond the ${u.length} largest.</div>`:''}
    </div>`; })()}

  <div class="stack dive">

          with the month on screen — dropped rather than mislabelled. */''}
    ${(k === 'month' && MONTHOFF) ? '' : `<div class="card chart-card full">
      <div class="card-title">${esc(DIVE_SERIES_LABEL[k])}<span class="feed-tag cc">live · cc</span></div>
      <div class="card-sub">Signed value, so this window sits in its own recent history.</div>
      <div class="chart-wrap"><canvas id="cDive"></canvas></div>
    </div>`}

    ${(W.brands.find(b=>String(b.id)==='1560')?.rev) ? '' : oasisNote(k)}

    ${oasisDetail(k)}

    <div class="card">
      <div class="card-title">Who signed it<span class="feed-tag cc">live · cc</span></div>
      <div class="card-sub">${reps.length?'Ranked by signed value — tap a name for their one-pager.':'No rep activity in this window.'}</div>
      ${k === 'week' ? weekResetNote() : ''}
      ${k === 'week' && !reps.length && weekReset() ? `<div class="card-sub" style="margin:0">Last week's board: ${
        (weekReset().topReps.length
          ? weekReset().topReps.map(x=>`${x.id && D.roster && D.roster[String(x.id)] ? `<span class="tapname" onclick="openRep('${esc(String(x.id))}')">${esc(x.name)}</span>` : esc(x.name)} ${short(x.rev)}`).join(' · ')
          : 'no rep activity recorded')}.</div>` : ''}
      ${reps.slice(0,12).map((r,i)=>{const pager = !r.office && D.roster && D.roster[String(r.id)];
        const tap = pager || !!(r.jobList && r.jobList.length);
        return `<div class="rep-row${tap?' acc':''}" ${r.office?'style="opacity:.8"':''}${pager?` onclick="openRep('${esc(String(r.id))}')"`:(tap?` onclick="toggleBox(this)"`:'')}>
        <div class="rep-head">
          <div class="nm"><span class="rk ${i===0?'top':''}">${i+1}</span>${esc(r.name)}${r.billdu?'<span class="tick">billdu</span>':''}${r.role&&r.role!=='sales'&&!r.office?`<span class="brand">${esc(r.role)}</span>`:''}</div>
          <div class="amt">${short(r.rev)} <span>· ${r.jobs} deal${r.jobs===1?'':'s'}</span>${tap?'<span class="acc-chev">›</span>':''}</div>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${Math.round(r.rev/mx*100)}%;background:${r.office?'#8aa094':(r.rev===mx?'#6cc28b':'#6ba8c9')}"></div></div>
        ${repCap(r)}
        ${r.office?'':closeMini(r.id)}
        ${tap && !pager?`<div class="acc-body lazy" data-src="rep:${esc(String(r.id))}"></div>`:''}
      </div>`}).join('')}
      ${reps.some(r=>r.office)?`<div class="note">Deals sent from Oasis's office account carry no seller on the Billdu record, so they are listed as unattributed rather than credited to a rep who may not have sold them. Deals a seller sent themselves are attributed from the backend's <b>rep_id</b> mapping, not by matching names.</div>`:''}
    </div>

    ${/* The flat ledger, restored. It came off the surface because it was too
          busy there, not because it should stop existing — every job in the
          window, both systems, one row each, behind one tap. */''}
    ${(W.signedList||[]).length ? `<div class="card">
      <div class="chartbox" onclick="toggleBox(this)">
        <div class="cb-row">All jobs · ${W.signedCount} in this window<span class="cb-sum">${short(W.rev)}</span><span class="acc-chev">›</span></div>
        <div class="cb-body">
          <div class="card-sub" style="margin:10px 0 4px">Every contract behind this window's number, largest first — customer, brand, rep and the system that recorded it.</div>
          <div class="acc-body lazy" data-src="flat"></div>
        </div>
      </div>
    </div>` : ''}

    ${diveAppointments(k)}
    ${diveMarketing(k)}
  </div>`;
}

/* The phone's own back gesture must close the dive, not leave the console. Each
   dive pushes one history entry; popping it returns to the snapshot. */
/* ── APPOINTMENTS, inside every drill-in ────────────────────────────────────
   Kevin: "When I click on the daily report on owner dash no apt data at all…
   Both clicks into that need deeper dive info including apts and marketing."
   The drill-in should answer his morning in one screen: money, deals,
   appointments, marketing pulse. ──────────────────────────────────────────── */
function diveAppointments(k){
  const A = D.appointments; if (!A || !A.perWindow) return '';
  const p = A.perWindow[k], W = flat(k);
  const label = { day:'today', week:'this week', month:mSpan(), ytd:'year to date' }[k];
  const dl = (a,b) => b ? Math.round((a-b)/b*100) : null;
  const dB = dl(p.booked, p.bookedPrev), dH = dl(p.held, p.heldPrev);
  const bookedRows = Object.entries(p.bookedByBrand).sort((a,b)=>b[1]-a[1]);
  const bookedTot = bookedRows.reduce((n,[,c])=>n+c,0);
  const av = apptVerdict(A);
  /* The combined close survives here as one tile for the window's shape, but
     it is built from the per-brand rates' own sums and says on its face that
     it moves with brand mix — never presented as "the" close rate. */
  const blend = (W.closeByBrand || []).reduce((o,r)=>({s:o.s+r.signed, a:o.a+r.appts}), {s:0, a:0});
  const blendClose = blend.a ? Math.round(blend.s / blend.a * 100) : null;
  return `<div class="card full">
    <div class="card-title">Appointments · ${esc(label)}<span class="feed-tag cc">live · cc</span></div>
    <div class="card-sub">What the team <b>set</b> in this window, and what sat on the calendar during it. Two different questions.</div>

    <div class="stat-grid" style="margin-bottom:12px">
      <div class="stat-tile"><div class="lbl">Booked · set date</div>
        <div class="val ${p.booked?'green':''}">${p.booked}</div>
        <div class="sub">marketing output</div>
        ${dB===null?'<div class="delta flat">no prior baseline</div>':`<div class="delta ${dB>=0?'up':'down'}">${dB>=0?'▲':'▼'} ${Math.abs(dB)}% vs ${esc(W.prevLabel)}</div>`}</div>
      <div class="stat-tile"><div class="lbl">On the calendar</div>
        <div class="val blue">${p.held}</div>
        <div class="sub">appointment date</div>
        ${dH===null?'<div class="delta flat">no prior baseline</div>':`<div class="delta ${dH>=0?'up':'down'}">${dH>=0?'▲':'▼'} ${Math.abs(dH)}% vs ${esc(W.prevLabel)}</div>`}</div>
      <div class="stat-tile" title="${ELAPSED_TIP}"><div class="lbl">Close · blended</div>
        <div class="val ${blendClose===null?'':'gold'}">${blendClose===null?'—':blendClose+'%'}</div>
        <div class="sub">${blend.s} signed of ${blend.a} appts elapsed</div>
        <div class="delta flat">mix-dependent — by brand: ${closeBrandStr(W)||'—'}</div></div>
      <div class="stat-tile"><div class="lbl">Completed in CC</div>
        <div class="val">${W.completed}</div>
        <div class="sub">job${W.completed===1?'':'s'} · ${short(W.builtRev)} contract value</div>
        <div class="delta flat">CC completed date — Built is the QB figure</div></div>
    </div>

    <div class="verdict ${av.tone}">${esc(av.line)}</div>

    ${bookedTot?`<div class="card-title" style="margin:16px 0 8px">Booked for, by brand</div>
    ${(() => {
      /* Same guard as the home card. A brand cannot be read off a booking until
         the project sync has delivered its project, and on a busy morning most
         of the day sits unresolved. Ranking brands then is not a partial answer,
         it is a wrong one — "Fencing 1 · 5%" next to "unknown 18 · 95%" reads as
         a dead morning for Fencing when Fencing had in fact booked most of it. */
      const unknown = p.bookedByBrand.unknown || 0;
      if (unknown > bookedTot / 2) return `<div class="withheld"><div class="wt">Still counting</div><div class="wx">
        <b>${unknown}</b> of ${bookedTot} booking${bookedTot===1?'':'s'} in this window are against projects the sync has not delivered yet, so the brand split would be mostly guesswork.
        The total is right; the breakdown appears once the projects land. Nothing here is missing — it is early.</div></div>`;
      return bookedRows.map(([b,n])=>{const m=brandOf(b);
        return `<div class="rep-row">
          <div class="rep-head"><div class="nm">${esc(m.n)}${b==='unknown'?'<span class="brand">awaiting project sync</span>':''}</div>
            <div class="amt">${n} <span>· ${pct(n,bookedTot)}%</span></div></div>
          <div class="meter"><div class="meter-fill" style="width:${pct(n,bookedTot)}%;background:${m.c}"></div></div>
        </div>`}).join('');
    })()}`:''}

    <div class="note"><b>Booked</b> counts when the appointment was created — what the setters produced. <b>On the calendar</b> counts when it was scheduled to happen — what the crews drove to. A busy calendar and a productive setting week are different facts, so they are never added together. Close rate is signings ÷ <b>appts elapsed</b> — scheduled appointments whose time has passed; outcomes are not logged in CC, so no-shows are included. The blended tile moves with brand mix as well as with closing (median days-to-close differs several-fold by brand), which is why the per-brand rates ride with it.</div>
  </div>`;
}

/* ── MARKETING, inside every drill-in ─────────────────────────────────────── */
function diveMarketing(k){
  const L = D.leadSources; if (!L) return '';
  const rows = (L.windows[k] || []).slice(0, 8);
  const label = { day:'today', week:'this week', month:mSpan(), ytd:'year to date' }[k];
  const tot = rows.reduce((n,r)=>n+r.rev,0);
  const mx = Math.max(1, ...rows.map(r=>r.rev));
  return `<div class="card full">
    <div class="card-title">Marketing · ${esc(label)}<span class="feed-tag cc">live · cc</span></div>
    <div class="card-sub">Which sources produced the signed work in this window, and how they convert overall.</div>

    ${rows.length ? rows.map(r=>{
      const all = L.allTime.find(a=>a.id===r.id);
      const conv = all && all.jobs ? Math.round(all.signed/all.jobs*100) : null;
      return `<div class="rep-row">
        <div class="rep-head">
          <div class="nm">${r.name?esc(r.name):(r.id==='none'?'No source on the job':'#'+esc(r.id))}${r.name?'':'<span class="brand">unmapped</span>'}</div>
          <div class="amt">${short(r.rev)} <span>· ${r.signed} signed</span></div>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${Math.round(r.rev/mx*100)}%;background:${r.name?'#f0834a':'#8aa094'}"></div></div>
        <div class="tgt-cap"><span>${pct(r.rev,tot)}% of signed value ${esc(label)}</span>
          <span class="${conv!==null&&conv>=50?'hit':''}">${conv===null?'':conv+'% close all time'}</span></div>
      </div>`}).join('')
    : `<div class="card-sub" style="margin:0">Nothing signed ${esc(label)} to attribute to a source.</div>`}

    <div class="withheld"><div class="wt">Ad spend not connected yet</div><div class="wx">
      This shows what each source <b>produced</b>, which is half of return on investment. The other half — what each campaign <b>cost</b> — needs the Google Ads feed the backend is wiring now. Until spend lands, treat these as revenue by source, not ROI: a source can look strong here and still be losing money.</div></div>
  </div>`;
}

function openWindow(k){
  DIVE = k;
  try { history.pushState({ dive:k }, '', location.pathname + '#' + k); } catch(e){}
  render(); window.scrollTo({ top:0 });
}
function closeWindow(){
  // Prefer going back, so the history entry is consumed rather than stranded.
  if (history.state && history.state.dive) { history.back(); return; }
  DIVE = null; render(); window.scrollTo({ top:0 });
}
addEventListener('popstate', () => {
  const s = history.state || {};
  DIVE = (s.dive && DIVE_TITLE[s.dive]) ? s.dive : null;
  RDIVE = (s.rep && D && D.roster && D.roster[s.rep]) ? s.rep : null;
  if (D) { render(); window.scrollTo({ top:0 }); }
});

/* ═══ THE REP ONE-PAGER ═════════════════════════════════════════════════════
   Kevin, sitting down with a rep (27 Jul): "It showed me he was at 97,000 but
   that was it… no easy way for me to just pull up a thing and see how this guy
   is doing. I'd love a quick reference button — especially meeting with a
   sales guy."

   Tap a name on the quota fleet or the rep board and this is that reference:
   one person, every window, on one screen — signed, deals, floor pace, close
   rate, effort, and the receipts behind the number. NOTHING HERE IS COMPUTED
   FRESH. Every figure is read from the same aggregates the boards already
   show (windows[k].reps, quotaBoard.wins, effort.rows), so the pager can
   never disagree with the board he tapped to get here. */
function repStats(id, k){
  const W = D.windows[k] || {};
  const r = (W.reps || []).find(x => String(x.id) === String(id));
  const who = (D.roster || {})[id] || {};
  const q = (k !== 'day' && D.quotaBoard) ? D.quotaBoard.wins[k] : null;
  const eff = (D.effort.rows || []).find(x => String(x.id) === String(id));
  const e = eff ? eff[k === 'ytd' ? 'year' : k] : null;
  return {
    name: who.name || (r && r.name) || 'Unknown',
    role: who.role || (r && r.role) || 'sales',
    sells: !!who.sells,
    rev: r ? r.rev : 0,
    deals: r ? r.jobs : 0,
    billdu: (r && r.billdu) || 0,
    billduCount: (r && r.billduCount) || 0,
    rung: (r && r.rung) || 0,
    rungCount: (r && r.rungCount) || 0,
    ccDeals: r ? r.jobs - (r.billduCount || 0) - (r.rungCount || 0) : 0,
    appts: r ? r.appts : 0,
    close: r ? r.close : null,
    jobList: (r && r.jobList) || [], jobCount: (r && r.jobCount) || 0, jobRest: (r && r.jobRest) || 0,
    pace: q ? q.pace : null, elapsed: q ? q.elapsed : null,
    touches: e ? e.t : 0,
    goal: eff ? eff.goal : null,
  };
}

function repView(id){
  const k = REPWIN, S = repStats(id, k);
  const label = diveLow(k);
  const Y = k === 'ytd' ? S : repStats(id, 'ytd');
  const avg = S.deals ? Math.round(S.rev / S.deals) : 0;

  /* Floor pace — sellers only, and never for a single day: the floor is a
     week-and-up instrument on the quota fleet, so it is the same here. */
  const floor = (S.sells && S.pace) ? (() => {
    const pct2 = Math.round(S.rev / S.pace * 100);
    const band = pct2 >= 100 ? 'ok' : pct2 >= 75 ? 'warn' : 'bad';
    const c = band==='ok' ? '#6cc28b' : band==='warn' ? '#d4b15a' : '#d96a5e';
    const mx = Math.max(S.pace, S.rev, 1);
    const delta = S.rev - S.pace;
    return `<div class="card full" style="margin-bottom:12px">
      <div class="card-title">Against the floor<span class="feed-tag cc">live · cc</span><span class="feed-tag billdu">+ billdu</span></div>
      <div class="qmeter" style="margin-top:12px">
        <div class="qfill" style="width:${Math.round(S.rev/mx*100)}%;background:${c}"></div>
        <div class="qtick" style="left:${Math.round(S.pace/mx*100)}%" title="floor pace ${short(S.pace)}"></div>
      </div>
      <div class="tgt-cap">
        <span>${pct2}% of floor pace — ${short(S.pace)} by day ${S.elapsed}</span>
        <span class="${band==='ok'?'hit':band==='bad'?'miss':''}">${delta>=0?'+':'−'}${short(Math.abs(delta))} ${band==='ok'?'making floor':band==='warn'?'closing on it':'below floor'}</span>
      </div>
      <div class="note">Same floor as the fleet board: <b>${short(D.quotaBoard.daily)}/day signed, every rep</b>, prorated to the same point in ${esc(label)}. This is the pace to keep the seat, not a goal.</div>
    </div>`;
  })() : '';

  /* Close rate keeps the scoreboard's own discipline: CC signings over CC
     appointments, and no percentage at all on a denominator too small to
     mean anything — the counts are stated instead. */
  const closeCard = `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Conversion · ${esc(label)}<span class="feed-tag cc">live · cc</span></div>
    <div class="stat-grid" style="margin:12px 0 0">
      <div class="stat-tile"${(k==='month'&&MONTHOFF)?'':` title="${ELAPSED_TIP}"`}><div class="lbl">${(k==='month'&&MONTHOFF)?'Appointments':'Appts elapsed'}</div>
        <div class="val">${S.appts}</div><div class="sub">on the CC calendar</div></div>
      <div class="stat-tile"><div class="lbl">CC contracts</div>
        <div class="val">${S.ccDeals}</div><div class="sub">signed in CC</div></div>
      <div class="stat-tile"><div class="lbl">Close</div>
        <div class="val ${S.close!==null&&S.appts>=10&&S.close>=50?'green':''}">${S.close!==null&&S.appts>=10?S.close+'%':'—'}</div>
        <div class="sub">${S.close===null?'no appointments to divide by':S.appts>=10?((k==='month'&&MONTHOFF)?'all signings ÷ CC appts':'all signings ÷ appts elapsed'):`${S.deals} of ${S.appts} — too few appts for a rate`}</div></div>
    </div>
    <div class="note">Signings count from every feed — CC contracts, Billdu acceptances${S.rungCount?`, and <b>${S.rungCount} rung sale${S.rungCount===1?'':'s'}</b> CC hasn't confirmed yet (they leave the rate if CC never books them)`:', and rung sales pending CC'} — over CC <b>appts elapsed</b>: scheduled appointments whose time has passed. Outcomes are not logged in CC, so no-shows are included. ${D.coverage.apptsWithRep.toLocaleString()} of ${D.coverage.appts.toLocaleString()} appointments carry a rep; below that coverage a rate is unknown, not assumed.</div>
  </div>`;

  /* Momentum: the same trailing windows as the front board, for THIS rep.
     Kevin: "momentum is everything with sales guys" — this is the trend the
     calendar toggle above cannot show, because a trailing 14 never resets. */
  const ct = D.closeTrend && D.closeTrend.byId[String(id)];
  const momCard = ct ? (() => {
    const m = ct.momentum;
    const verdict = m === null ? ''
      : `<div class="card-sub" style="margin:10px 0 0">${
          m >= 8  ? `<span class="mom up">▲ heating up</span> — closing ${m} points above their own 60-day baseline.`
        : m <= -8 ? `<span class="mom dn">▼ cooling off</span> — closing ${Math.abs(m)} points below their own 60-day baseline.`
        :           `<span class="mom flat">→ steady</span> — the last two weeks sit within ${Math.abs(m)} point${Math.abs(m)===1?'':'s'} of their 60-day baseline.`}</div>`;
    return `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Closing momentum<span class="feed-tag cc">live · cc</span></div>
    <div class="stat-grid" style="margin:12px 0 0">
      ${D.closeTrend.spans.map(sp => { const c = ct[sp.key];
        const band = closeBand(c);
        return `<div class="stat-tile" title="${ELAPSED_TIP}"><div class="lbl">${esc(sp.label)} close</div>
          <div class="val ${band==='hot'?'green':band==='warm'?'gold':band==='cold'?'red':''}">${c.appts?c.close+'%':'—'}</div>
          <div class="sub">${c.appts?`${c.signed} of ${c.appts} appt${c.appts===1?'':'s'} elapsed`:(c.signed?`${c.signed} signed · no appts elapsed`:'no appointments elapsed')}</div></div>`; }).join('')}
    </div>
    ${verdict}
    <div class="note">Trailing windows ending today — the 30-day column is the last 30 days, whatever the calendar says. Signings are CC contracts, unrecorded Billdu acceptances, and rung sales pending CC (a ring counts the day it happens and leaves the rate if CC never books it), over CC appointments — and the counts stay beside every rate so a hot week on two appointments reads as exactly that.</div>
  </div>`; })() : '';

  const effortCard = `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Effort · ${esc(label)}<span class="feed-tag none">app log</span></div>
    <div class="stat-grid" style="margin:12px 0 0">
      <div class="stat-tile"><div class="lbl">Touches</div>
        <div class="val ${S.touches?'blue':''}">${S.touches}</div><div class="sub">logged in the app</div></div>
      <div class="stat-tile"><div class="lbl">Goal</div>
        <div class="val">${S.goal ?? '—'}</div><div class="sub">per day${S.goal?'':' — none set'}</div></div>
    </div>
    <div class="note">Counts are binary touches, never points (Kevin's law, b31, migration 048 — the points-by-play-weight tile that used to sit here was the number that ruling rules out). Nothing is back-filled from sales: effort is what was logged, and <b>zeros are real</b>. A rep who closed work but logged nothing reads zero here because that is what the effort data says.</div>
  </div>`;

  const ytdStrip = k === 'ytd' ? '' : `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Year so far</div>
    <div class="stat-grid" style="margin:12px 0 0">
      <div class="stat-tile"><div class="lbl">Signed YTD</div>
        <div class="val gold">${short(Y.rev)}</div><div class="sub">${Y.deals} deal${Y.deals===1?'':'s'}</div></div>
      <div class="stat-tile"><div class="lbl">Avg deal</div>
        <div class="val">${Y.deals?short(Math.round(Y.rev/Y.deals)):'—'}</div><div class="sub">both systems</div></div>
      <div class="stat-tile"><div class="lbl">Close YTD</div>
        <div class="val">${Y.close!==null&&Y.appts>=10?Y.close+'%':'—'}</div>
        <div class="sub">${Y.appts>=10?`${Y.ccDeals} of ${Y.appts} appts`:'too few appts for a rate'}</div></div>
    </div>
  </div>`;

  return `
  <div class="backbar">
    <button class="backbtn" onclick="closeRep()">‹ Back</button>
    <div class="dive-h">${esc(S.name)}${S.role!=='sales'?` <span class="brand">${esc(S.role)}</span>`:''}</div>
  </div>

  <div class="seg" style="margin-bottom:12px">
    ${[['day','Day'],['week','Week'],['month','Month'],['ytd','YTD']].map(([kk,l])=>`<button class="${kk===k?'on':''}" onclick="setRepWin('${kk}')">${l}</button>`).join('')}
  </div>

  <div class="card full" style="margin-bottom:12px">
    <div class="card-title">Signed · ${esc(label)}<span class="feed-tag cc">live · cc</span>${S.billdu?'<span class="feed-tag billdu">live · billdu</span>':''}</div>
    <div class="dive-hero">
      <div class="big">${short(S.rev)}</div>
      <div class="side">${S.deals} deal${S.deals===1?'':'s'}${avg?`<br/>avg <b>${short(avg)}</b>`:''}</div>
    </div>
    ${S.billdu?`<div class="hero-incl">incl. <b>${short(S.billdu)}</b> <span class="feed-tag billdu">live · billdu</span> — ${S.billduCount} Oasis invoice${S.billduCount===1?'':'s'}; Oasis reads from Billdu</div>`:''}
    ${billduDown()?`<div class="hero-incl warn">Contractors Cloud only — the Billdu feed is unreadable, so any of this rep's Billdu-signed work is <b>missing from this figure</b>, not absent from the window.</div>`:''}
  </div>

  ${(() => {
    /* COMMISSION — the deeper look Kevin asked for (30 Jul): the same bank /
       coming / paid trio the board row carries, expanded with what stands
       behind it. Office ledger figures, never estimated; a rep with no
       imported ledger gets no card rather than a $0 that reads as "no money
       owed". Owner console only — the app's RLS walls this off from reps. */
    const b = D.bank && D.bank[String(id)];
    if (!b) return '';
    return `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Commission · the bank<span class="feed-tag none">office ledger</span></div>
    <div class="stat-grid" style="margin:12px 0 0">
      <div class="stat-tile"><div class="lbl">The bank</div>
        <div class="val ${b.banked?'green':''}">${short(b.banked)}</div>
        <div class="sub">${b.bankedDeals?`${b.bankedDeals} deal${b.bankedDeals===1?'':'s'} cleared — `:''}drawable this week</div></div>
      <div class="stat-tile"><div class="lbl">Coming</div>
        <div class="val ${b.coming?'gold':''}">${short(b.coming)}</div>
        <div class="sub">earned, awaiting collection</div></div>
      <div class="stat-tile"><div class="lbl">Paid YTD</div>
        <div class="val">${short(b.paidYtd)}</div><div class="sub">on payroll this year</div></div>

/* ═══ THE SECTION RAIL ═══════════════════════════════════════════════════════
   On a desktop the console is ONE SECTION AT A TIME, picked from a persistent
   left rail. The rail is driven from this list, never from markup — the list
   is the seam role-based tiering plugs into later: a role that sees four
   sections is a filter over this array, not a second nav.

   The sections regroup exactly what the single column already carries:
     Vitals    — the hero: master heartbeat + the 2×2
     Sales     — sales by rep, then appointments by company (the pairing is
                 deliberate: who sold it and who got the at-bats, one scroll
                 apart — the rail must not undo it)
     Marketing — the consolidated marketing room (brand → source → rep)
     People    — effort × results, then the Effort Room
     Money     — the money row: window switch, month time machine, Signed /
                 Appointments / Built / Open A/R, trending to finish
     Flags     — the Attention board

   ONLY THE SELECTED SECTION IS IN THE DOM. Leaving a section unmounts it —
   never render-and-hide, which would keep five sections of charts and
   after-paint fetches alive for surfaces nobody is reading.

   KNOWN LIMIT, taken deliberately: MONTHOFF and HEROWIN stay global, so a
   month shift made in Money still governs the month-scoped cards in Sales and
   Marketing, while the "viewing July" banner renders only where its own
   pagers do. Logged as a follow-up rather than half-fixed here. */
const RAIL_MIN = 900;   // the page's one desktop line — same as the masonry and the folds
const SECTIONS = [
  { key:'vitals',    name:'Vitals',    render: () => cardVitals() },
  { key:'sales',     name:'Sales',     render: () => '<div class="stack bands">' + cardReps() + cardApptByCompany() + '</div>' },
  /* The rooms render DIRECT here — the whole board, no preview shelf and no
     open/close state. The rail already solos a section, so the page-level
     takeover the shelves performed is redundant on the desktop; the phone
     column below RAIL_MIN keeps the shelves and their stores untouched. */
  { key:'marketing', name:'Marketing', render: () => '<div class="stack bands">' + marketingRoom(true) + '</div>' },
  { key:'people',    name:'People',    render: () => '<div class="stack bands">' + cardQuadrant() + effortRoom(true) + '</div>' },
  { key:'money',     name:'Money',     render: () => hdr() },
  /* The one counted section: the badge is the Attention board's own row list
     (attnRows), so the number on the rail and the rows behind the click are
     one computation and cannot drift apart. */
  { key:'flags',     name:'Flags',     render: () => cardAttention(), badge: () => attnRows().length },
];
const SECTION_STORE = 'lcc.section';   // its own key — lcc.room belongs to the Effort Room
let SECTION = (() => {
  /* A deep link wins, then the remembered choice, then Vitals. An UNKNOWN hash
     falls back to Vitals silently — it may be a dive hash (#month), a spent
     recovery link, or a typo, and none of those earns an error. The dive and
     recovery hash grammars are untouched and never collide with these six
     words. */
  const h = (location.hash || '').replace(/^#/, '');
  if (SECTIONS.some(s => s.key === h)) return h;
  if (h) return 'vitals';
  try { const s = localStorage.getItem(SECTION_STORE);
    if (SECTIONS.some(x => x.key === s)) return s; } catch(e){}
  return 'vitals';
})();
function setSection(k){
  if (!SECTIONS.some(s => s.key === k)) k = 'vitals';
  SECTION = k;
  try { localStorage.setItem(SECTION_STORE, k); } catch(e){}
  render();
  window.scrollTo({ top: 0 });
}
function railHtml(){
  return `<nav class="rail" aria-label="Sections">
    <div class="rail-eyebrow">TruReview</div>
    ${SECTIONS.map(s => {
      const n = s.badge ? s.badge() : 0;
      return `<button type="button" class="rail-btn${s.key === SECTION ? ' on' : ''}"
        aria-current="${s.key === SECTION ? 'true' : 'false'}" onclick="setSection('${s.key}')">${esc(s.name)}${
        n ? `<span class="rail-badge">${n}</span>` : ''}</button>`;
    }).join('')}
  </nav>`;
}

/* ── render ───────────────────────────────────────────────────────────────── */
function render(){
  if (RDIVE) {
    document.body.classList.remove('railed');
    document.getElementById('app').innerHTML = repView(RDIVE) +
      `<div class="foot">Trust the instrument, not the retelling</div>`;
    return;
  }
  if (DIVE) {
    document.body.classList.remove('railed');
    document.getElementById('app').innerHTML = diveView(DIVE) +
      `<div class="foot">Trust the instrument, not the retelling</div>`;
    drawCharts();
    return;
  }
  /* Desktop: the rail and exactly one section. The section's cards render
     byte-for-byte what the single column renders — same functions, regrouped —
     so the two layouts can never show different numbers. */
  const desktop = window.innerWidth >= RAIL_MIN;
  document.body.classList.toggle('railed', desktop);
  if (desktop) {
    const sec = SECTIONS.find(s => s.key === SECTION) || SECTIONS[0];
    /* The hash mirrors the selected section so it can be bookmarked.
       replaceState, never pushState — the back button belongs to the dives. */
    if ((location.hash || '').slice(1) !== sec.key)
      try { history.replaceState(history.state, '', location.pathname + '#' + sec.key); } catch(e){}
    document.getElementById('app').innerHTML =
      railHtml() + hdrTitle() + askBar() + sec.render() + pageFoot();
    drawCharts();
    return;
  }
  /* ── THE SIX BANDS · THE PHONE READING ─────────────────────────────────────
     Below the rail's desktop line the console stays what it has always been:
     one continuous column, top to bottom as one argument, and the order is the
     whole statement:

       1  the ask box            — the question he arrived with, always first
       1b THE VITALS HERO        — one master heartbeat and a 2×2 of micro
                                   vitals, and the whole of it fits one 390px
                                   phone screen with nothing scrolled. It sits
                                   above ATTENTION because it answers a coarser
                                   question first, and answers it as a SHAPE
                                   and a COLOUR: is anything wrong at all.
                                   ATTENTION then says what, in words. It shows
                                   symptoms and never prescribes.

                                   It replaced THE PULSE card, which asked the
                                   same question at four times the height — a
                                   composite plus five full rails, each nearly
                                   as large as the composite, so the eye had
                                   six things to rank and ranked none of them.
                                   Nothing that card measured was dropped: its
                                   rails' sub-vitals, brand cuts, aging buckets
                                   and every withheld-feed note are carried
                                   whole inside the four expanded cards here.
       2  ATTENTION              — what is off its rhythm, at headline size. It
                                   was a footnote under the money; it is the
                                   reason he opened the page, so it leads.
       3  the money row          — Signed · Appointments · Built · Open A/R,
                                   brand split on every tile, one window switch
                                   across all four
       4  Sales by rep           — who put it on the board
       4b appointments by company — MOVED UP to sit directly under sales by rep
                                   (Kevin: it is his favourite and it sat too
                                   low). "Who sold it" and "who got the at-bats"
                                   are the same question one step apart, so they
                                   now read as one pair with nothing between.
       5  marketing              — THE MARKETING ROOM, one board. It absorbed
                                   the old two-board drawer AND the deep ROI
                                   board that used to sit in its own band
                                   beneath it — three surfaces that could show
                                   disagreeing numbers on one screen. One
                                   preview shelf, one month pager, one store,
                                   and a drill-in that reads brand → source →
                                   rep; every refusal still says what it waits
                                   on, where it sits — see the block above
                                   mkWithheld().
       6  Effort × results       — where effort and money disagree, kept in the
                                   open because it is the one card that reads
                                   both halves of the page at once.

     Then THE EFFORT ROOM, directly under the quadrant: the working, behind a
     preview shelf that is always visible. Nothing was reduced to a summary and
     nothing was thrown away — the room holds each instrument whole, and the
     shelf shows a live miniature of each one so the room advertises what it is
     worth opening for. No other band moved in this pass.

     Three instruments were deleted outright in this rebuild, because a console
     that says the same thing twice teaches nobody to trust it: Touches that hit
     by channel (the channel mix already answers it), Quoted volume (Estimates
     on file carries the quoting story with the window that suits it), and Book
     coverage / going cold (the TruOdds cooling book owns that question now).
     ────────────────────────────────────────────────────────────────────────── */
  document.getElementById('app').innerHTML =
    hdrTitle() + askBar() + cardVitals() + cardAttention() + hdr() + '<div class="stack bands">' + [
      /* 4 · WHO SOLD IT */
      cardReps(),

      /* 4b · WHO GOT THE AT-BATS. Moved up out of the marketing band to sit
         directly under sales by rep — Kevin's favourite band and it was sitting
         too far down the page. It belongs here anyway: "who put it on the
         board" and "who was given the chances" are one question one step
         apart, and reading them as a pair is the whole point. */
      cardApptByCompany(),

      /* 5 · MARKETING — what produced the appointments the money came from,
         and what it cost. ONE room, one board: the preview shelf carries a
         live miniature of each level and the board opens on a tap, reading
         brand → source → rep. The old two-board drawer and the deep ROI band
         that used to follow it are absorbed here — one render path, so two
         marketing surfaces can never disagree on screen again. The old
         cardLeads() is long gone the same way. */
      marketingRoom(),

      /* 6 · WHERE EFFORT AND RESULTS DISAGREE. Stays visible even though the
         rest of the effort suite folded: this is the card that reads both
         halves of the page at once, and it is no use behind a tap. */
      cardQuadrant(),

      /* …and the room, directly under the quadrant. Its preview shelf is always
         drawn; what is open inside it is remembered per device. */
      effortRoom(),
    ].join('') + '</div>' + pageFoot();
  drawCharts();
}

/* ── charts. Kevin's Chart.js idiom: mono ticks, #1c3528 tooltips. ─────────
      If the CDN is blocked or offline, every chart says so out loud instead of
      leaving a confident-looking empty box. ─────────────────────────────────── */
function drawCharts(){
  while (charts.length) { try { charts.pop().destroy(); } catch(e){} }
  if (typeof Chart === 'undefined') {
    document.querySelectorAll('.chart-wrap, .alloc-chart').forEach(el => {
      el.innerHTML = '<div class="chartfail">Chart library did not load.<br/>The numbers on this page are unaffected — only the drawing is missing.</div>';
      el.style.height = 'auto';
    });
    return;
  }
  Chart.defaults.color = '#8aa094';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';
  const MONO = "'JetBrains Mono', monospace";
  const TIP = { backgroundColor:'#1c3528', borderColor:'rgba(255,255,255,0.1)', borderWidth:1, padding:8,
                titleFont:{family:MONO,size:10}, bodyFont:{family:MONO,size:10} };

  /* appointments: past / today / booked-ahead in one shape, so the cliff between
     what ran and what is booked is visible rather than described */
  /* A number over every bar, so the daily count is readable off the chart itself
     rather than guessed from height — Kevin: "this doesn't say the daily number."
     Today's count is drawn in the accent colour with a TODAY tag above it; a
     weekend zero is dimmed so a structural zero never reads as a bad day. */
  /* THE NUMBER LIVES ON THE BAR. Kevin: "the chart pic doesn't show it… I have
     to guess based on the graph. Visuals are what people read." So every bar
     chart on this page draws its value on top of the bar, not in a caption
     beside it. Three shapes: a plain/ grouped bar labels each bar; a stacked bar
     labels the column total; a highlighted bar (today/current) draws in accent.
     A per-bar flag series is optional and only tunes colour and the TODAY tag. */
  /* ── THE TOPS OF MOUNTAINS (Kevin, 16 Aug: "we see the top of the bar which
     is all that matters") — which numbers get to be a bar chart at all.
     Bars on a shared zero baseline are the most accurately read form there is:
     one glance gives the value AND the skyline across the period. But the form
     only tells the truth for some numbers, so:
     (a) BAR THE AMOUNT, NEVER THE RATE. If adding two bars gives a meaningful
         number (dollars, leads, appts, signings, backlog), it may be a bar.
         If adding them is nonsense (close %, ROI multiple, share, averages),
         it is a figure beside its denominator, coloured against a threshold —
         the marketing board's ROI column is the pattern.
     (b) WHERE "ENOUGH" EXISTS, DRAW IT. A bar answers how much; a reference
         line/tick (typical, goal, capacity) answers whether it cleared — the
         appointments-by-company tick is the pattern. The reference is a line,
         never a second bar.
     (c) THE LUMP RULE. If the tallest bar is ~4-5x the median bar, the chart
         is drawing one deal, not a pattern — say so on the card (lumpwarn) or
         switch that view to units. One $200K roof makes every other day a stub.
     (d) ZERO BASELINE, ALWAYS. A truncated bar axis lies with the exact
         mechanism that makes bars readable. Lines may truncate; bars never.
     (e) TWO DIMENSIONS = SMALL MULTIPLES. Source x month is not a grouped bar
         forest; it is one tiny chart per source on a SHARED y-scale (mini4),
         so the cross-source comparison happens by eye with no labels. */
  function barLabels(chart, { series, fmt = String, todayTag = false, skipZero = false, size = 9 } = {}){
    const ctx = chart.ctx; ctx.save(); ctx.textAlign = 'center';
    chart.data.datasets.forEach((ds, di) => {
      if (ds.type === 'line') return;                 // skip the norm reference line
      const meta = chart.getDatasetMeta(di);
      meta.data.forEach((bar, j) => {
        const v = ds.data[j];
        if (v == null || (skipZero && Number(v) === 0)) return;
        const f = series ? series[j] : null;
        const hot = f && (f.today || f.current);
        const cool = f && (f.weekend || f.future);
        ctx.font = `600 ${size}px 'JetBrains Mono', monospace`;
        ctx.fillStyle = hot ? '#f0834a' : cool ? 'rgba(138,160,148,0.55)' : '#e8efe9';
        ctx.fillText(fmt(v), bar.x, bar.y - 5);
        if (hot && todayTag){ ctx.font = "700 7px 'JetBrains Mono', monospace"; ctx.fillStyle = '#f0834a';
          ctx.fillText('TODAY', bar.x, bar.y - 16); }
      });
    });
    ctx.restore();
  }
  const barLabelsPlugin = (opts) => ({ id:'barLabels', afterDatasetsDraw(c){ barLabels(c, opts); } });
  const stackTotalsPlugin = (fmt = String) => ({ id:'stackTotals', afterDatasetsDraw(chart){
    const ctx = chart.ctx, n = chart.data.labels.length;
    ctx.save(); ctx.textAlign = 'center'; ctx.font = "600 9px 'JetBrains Mono', monospace"; ctx.fillStyle = '#e8efe9';
    for (let i = 0; i < n; i++){ let total = 0, topY = Infinity, x = null;
      chart.data.datasets.forEach((ds, di) => { total += Number(ds.data[i]) || 0;
        const bar = chart.getDatasetMeta(di).data[i]; if (bar){ x = bar.x; if (bar.y < topY) topY = bar.y; } });
      if (total > 0 && x != null) ctx.fillText(fmt(total), x, topY - 5);
    }
    ctx.restore();
  } });

  /* Hero mix donut — Kevin: "I love this circle graphic, squeeze it in the
     beginning." Same brands, same colors, scoped to the hero's window. */
  const hm = document.getElementById('cHeroMix');
  if (hm) {
    const HW = flat(HEROWIN);
    const hrows = allBrands(HW.brands).filter(b => b.rev > 0);
    if (hrows.length) charts.push(new Chart(hm.getContext('2d'), {
      type:'doughnut',
      data:{ labels:hrows.map(b=>brandOf(b.id).s),
        datasets:[{ data:hrows.map(b=>b.rev), backgroundColor:hrows.map(b=>brandOf(b.id).c), borderWidth:0 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'66%',
        plugins:{ legend:{display:false}, tooltip:{...TIP, callbacks:{ label:c=>' '+c.label+' '+short(c.parsed) }} } }
    }));
    else hm.parentElement.style.display = 'none';
  }

  const mkDonut = (el2, rows2) => charts.push(new Chart(el2.getContext('2d'), {
    type:'doughnut',
    data:{ labels:rows2.map(r=>brandOf(r.id).s),
      datasets:[{ data:rows2.map(r=>r.v), backgroundColor:rows2.map(r=>brandOf(r.id).c), borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'66%',
      plugins:{ legend:{display:false}, tooltip:{...TIP, callbacks:{ label:c=>' '+c.label+' '+short(c.parsed) }} } }
  }));
  const hb = document.getElementById('cHeroBuilt');
  if (hb) { const q2 = qbWinOf(HEROWIN);
    const rows2 = q2 ? BRAND_ORDER.map(id => ({ id, v:(q2.byBrand&&q2.byBrand[id])?q2.byBrand[id].invoiced:0 })).filter(r=>r.v>0) : [];
    if (rows2.length) mkDonut(hb, rows2);
  }
  const dm = document.getElementById('cDiveMix');
  if (dm && DIVE) {
    const DW = flat(DIVE);
    const drows = allBrands(DW.brands).filter(b=>b.rev>0).map(b=>({id:String(b.id), v:b.rev}));
    if (drows.length) mkDonut(dm, drows);
  }
  const ha = document.getElementById('cHeroAR');
  if (ha && D.qb && D.qb.ar) {
    const rows3 = D.qb.ar.map(a => ({ id:String(a.id), v:a.ar })).filter(r=>r.v>0);
    if (rows3.length) mkDonut(ha, rows3);
  }

  /* Market intelligence: demand + money per trade, and the intel service's
     spread + margin charts when the payload is live. */
  /* Both bars are now RHYTHM bars: the grey is the 4-month monthly average
     (the mean of the three buckets behind the newest), the coloured one is the

     rhythm — the same -12% line the flags use, so the chart and the alert can
     never disagree about which trade is cold. */
  const mw = document.getElementById('cMwDemand');
  if (mw && D.rhythm) {
    const B = D.rhythm.brands;
    charts.push(new Chart(mw.getContext('2d'), {
      type:'bar',
      data:{ labels:B.map(b=>b.s), datasets:[
        { label:'4-month rhythm · per month', data:B.map(b=>Math.round(b.set.b4)), backgroundColor:'rgba(138,160,148,0.35)', borderRadius:3 },
        { label:'last 30 days', data:B.map(b=>b.set.now), backgroundColor:B.map(b=>(!b.set.thin&&b.set.d4!==null&&b.set.d4<=-12)?'#d96a5e':b.c), borderRadius:3 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, layout:{padding:{top:18}},
        plugins:{ legend:{display:true, labels:{font:{family:MONO,size:9}, boxWidth:10}}, tooltip:TIP },
        scales:{ x:{grid:{display:false},ticks:{font:{family:MONO,size:9}}}, y:{display:false,beginAtZero:true,grace:'12%'} } },
      plugins:[barLabelsPlugin({})]
    }));
  }
  const mwm = document.getElementById('cMwMoney');
  if (mwm && D.rhythm) {
    const B = D.rhythm.brands;
    charts.push(new Chart(mwm.getContext('2d'), {
      type:'bar',

        { label:'4-month rhythm · per month', data:B.map(b=>Math.round(b.rev.b4)), backgroundColor:'rgba(138,160,148,0.35)', borderRadius:3 },
        { label:'last 30 days', data:B.map(b=>Math.round(b.rev.now)), backgroundColor:B.map(b=>(!b.rev.thin&&b.rev.d4!==null&&b.rev.d4<=-12)?'#d96a5e':b.c), borderRadius:3 },
      ]},
      options:{ responsive:true, maintainAspectRatio:false, layout:{padding:{top:18}},
        plugins:{ legend:{display:true, labels:{font:{family:MONO,size:9}, boxWidth:10}}, tooltip:{...TIP, callbacks:{label:c=>' '+short(c.parsed.y)}} },
        scales:{ x:{grid:{display:false},ticks:{font:{family:MONO,size:9}}}, y:{display:false,beginAtZero:true,grace:'12%'} } },
      plugins:[barLabelsPlugin({fmt:short})]
    }));
  }
  const sp = document.getElementById('cIntelSpread');
  if (sp && INTEL && INTEL.spread) {
    const S = INTEL.spread;

        { type:'line', label:'bookings index', data:S.map(r=>r.bookings), borderColor:'#e8efe9', borderWidth:1.75, pointRadius:2.5, fill:false, order:0 },

  const gp = document.getElementById('cIntelGP');
  if (gp && INTEL && INTEL.money && INTEL.money.gpByQuarter) {
    const G = INTEL.money.gpByQuarter;
    charts.push(new Chart(gp.getContext('2d'), {
      type:'bar',
      data:{ labels:G.map(g=>g.q), datasets:[{ label:'gross margin %', data:G.map(g=>g.pct), borderRadius:2,

/* Rotating the phone, or crossing the 900px breakpoint where .stack flips from
   one column to two, changes every card's width. Chart.js does not reliably
   catch that on its own, so redraw on resize — debounced, and only when the
   width actually changed (iOS fires resize on scroll as the URL bar hides). */
let rw = innerWidth, rt;
addEventListener('resize', () => {
  if (innerWidth === rw) return;
  rw = innerWidth;
  clearTimeout(rt);
  rt = setTimeout(() => { if (D) render(); }, 180);
});

const SB_URL = 'https://lzegjjbkfuecrhdvlvay.supabase.co';
/* The one page that can finish a password reset. Hard-coded rather than derived,
   because every derivation of it so far has been a source of bugs: a bare origin

/* How far back appointments are read. Was 13 months, which covered the deepest

   has to reach back 24 months, not 13. January 1st of the prior year is exactly

async function refresh(){
  const s = sess.get();

  const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST', headers:{ apikey: SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify({ refresh_token: s.refresh_token }),

/* ── PASSWORD RECOVERY ──────────────────────────────────────────────────────
   A recovery link can land here in either of two shapes, so both are handled:

     · implicit  — #access_token=…&refresh_token=…&type=recovery
                   (what {{ .ConfirmationURL }} produces once Supabase has
                   verified the token and redirected here)
     · token_hash — ?token_hash=…&type=recovery
                   (the newer verify-on-arrival flow)

   In both cases the token is stripped from the address bar immediately: a
   recovery token is a credential, and leaving it in the URL means it lands in
   history and in anything the user pastes. ── */
function readRecovery(){
  const hash = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  const query = new URLSearchParams(location.search || '');
  const clean = () => history.replaceState(null, '', location.pathname);
  if (hash.get('type') === 'recovery' && hash.get('access_token'))
    return { kind:'implicit', access_token:hash.get('access_token'),
             refresh_token:hash.get('refresh_token'), clean };
  if (query.get('type') === 'recovery' && query.get('token_hash'))
    return { kind:'token_hash', token_hash:query.get('token_hash'), clean };
  // An expired or already-used link comes back as an error, not a token.
  const err = hash.get('error_description') || query.get('error_description');
  if (err) return { kind:'error', message: decodeURIComponent(err.replace(/\+/g,' ')), clean };
  return null;
}

async function exchangeTokenHash(token_hash){

  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error_description || j.msg || j.message || 'recovery link is invalid or expired');
  return j;
}

/* The recovery token IS a session — a short-lived one that authorises exactly
   one thing: setting a new password. */
async function updatePassword(password){
  const s = sess.get();
  const r = await fetch(`${SB_URL}/auth/v1/user`, {
    method:'PUT', headers:{ apikey: SB_KEY, Authorization:'Bearer '+s.access_token,
                            'Content-Type':'application/json' },
    body: JSON.stringify({ password }),
  });
  const j = await r.json();
  if (!r.ok) {
    const raw = j.error_description || j.msg || j.message || '';
    // Supabase answers an expired or reused recovery link with a JWT parse
    // error. That is true and useless to the person holding the link, so it is
    // translated into the thing they can actually do about it.
    if (/jwt|token|expired|malformed|signature/i.test(raw))
      throw new Error('That reset link has expired or was already used. Request a new one below.');
    if (/weak|password/i.test(raw) && /short|least|characters/i.test(raw))
      throw new Error(raw);
    throw new Error(raw || 'could not set password');
  }
  return j;
}

async function sendReset(email){
  const r = await fetch(`${SB_URL}/auth/v1/recover`, {
    method:'POST', headers:{ apikey: SB_KEY, 'Content-Type':'application/json' },
    /* Explicit and absolute, never location.pathname. Derived from the current
       path, a reset requested from invite.html would send the user BACK to
       invite.html, which understands invite tokens and not recovery sessions —
       a dead end that looks like a broken link. This always lands on the console
       root, which is the page that knows how to finish a reset. */
    body: JSON.stringify({ email, redirect_to: CONSOLE_HOME }),
  });
  if (!r.ok) { const j = await r.json().catch(()=>({}));
    throw new Error(j.error_description || j.msg || j.message || `could not send reset (${r.status})`); }
}

/* Paged read under the user's JWT. PostgREST caps at 1000 rows and says nothing
   about it, so always page. One transparent retry after a token refresh. */
/* Paged read under the user's JWT.
   PostgREST caps a response at 1000 rows and says nothing about it, so paging is
   mandatory. It used to page SEQUENTIALLY — one round trip, wait, next — which
   cost 12 trips for jobs and 10 for appointments. Measured on a normal
   connection that was 8s and 15s respectively, so the console sat on "Reading
   live…" for the better part of half a minute with nothing moving. That reads as
   frozen, and Kevin reported it as exactly that.
   Now the first page also asks for an exact count, and every remaining page is
   requested at once. Same bytes, a fraction of the wall clock. */
/* Paged read under the user's JWT. PostgREST caps a response at 1000 rows and
   says nothing about it, so paging is mandatory.

   PAGING STAYS SEQUENTIAL, DELIBERATELY. Fetching the pages concurrently is the
   obvious speed-up and it does not work here: measured against this project,
   eight of nine simultaneous page requests came back HTTP 500. The database pool
   is ten connections and the console is not its only caller. A page that errors
   is worse than a page that is slow, so the trips stay in series and the wait is
   made visible instead — see the row counter in loadAll. */
async function q(path, { retry = true, onPage } = {}){
  const s = sess.get();
  if (!s) throw new Error('not signed in');
  const rows = []; const PAGE = 1000;
  for (let from = 0; ; from += PAGE) {
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token,
                 Range: `${from}-${from + PAGE - 1}` },
    });
    if (r.status === 401 && retry) {
      if (await refresh()) return q(path, { retry:false, onPage });
      throw new Error('session expired');
    }
    if (!r.ok) { const e = new Error(`${path.split('?')[0]} → ${r.status}`); e.status = r.status; throw e; }
    const p = await r.json();
    rows.push(...p);
    if (onPage) onPage(p.length);
    if (p.length < PAGE) return rows;
    if (from > 400000) throw new Error('runaway paging');
  }
}

/* ── aggregation. Mirrors console/build-console.mjs so the figures on the
      phone are the same figures, computed the same way, just client-side. ── */
/* ── THE PULSE ───────────────────────────────────────────────────────────────
   Five business vitals, each scored as deviation from its own normal, with the
   whole business as one trace on top. It shows SYMPTOMS: that a number is off
   its rhythm and where to look next. It never prescribes an action.

   WHY THE MATH IS WHAT IT IS — this was specified as a z-score of a single day
   against the same day-of-month across history, which is the obvious reading of
   "normal for THIS day of the month" and is wrong here twice over. Both were
   measured against 30 months of real signings before a line was drawn:

     1  DAY-OF-MONTH IS THE WEAKER RHYTHM. It explains 3.7% of the variance in
        daily signed dollars. Day-of-WEEK explains 14.6% — four times more. The
        reason is mechanical: a day-of-month bucket mixes Sundays (mean $655,
        zero on 122 of 128) with Fridays (mean $41,154), so "normal for the 6th"
        was really "normal for whichever weekday the 6th happened to land on".

     2  A RED WAS UNREACHABLE ON THE DOWNSIDE. Signed dollars are lumpy enough
        that SD exceeds the mean on every day-of-month (CV 0.87–2.67), so the
        distribution is pinned against a floor of zero. A $0 day — the worst day
        physically possible — scored z between -0.37 and -1.15 and read GREEN on
        30 of 31 days-of-month. The instrument could only go red on unusually
        GOOD days: one big roof would light it up like a fire, and a dead week
        would not move it at all. That is an alarm wired backwards.

   So the math is: a TRAILING 7-DAY WINDOW (it holds exactly one of each weekday,
   so the weekday rhythm cancels instead of being averaged into noise), compared
   against historical windows ending within ±3 days of the same day-of-month
   (month position survives, with ~190 samples behind each normal instead of 17),
   scored with MEDIAN + MAD (robust: the one $200K roof cannot define "normal")
   on log dollars (symmetric in log space, so a thin week is as reachable as a
   fat one).

   Checked against its own history, that lands 68% green / 17% amber / 15% red on
   signings — close to the textbook 68/27/5 — and a dead week now scores z −19 to
   −27 instead of green. Bands are |z|: green ≤1, amber ≤2, red beyond, the same
   arithmetic on all five so a red means one severity everywhere.

   THE WINDOW ENDS YESTERDAY. A window with a partial today inside it reads low
   for no reason but the clock, and a false red is worse than a late one. */
const PULSE_WIN = 7;        // days in a window — one of each weekday
const PULSE_DOMTOL = 3;     // ± day-of-month tolerance for the comparison pool
const PULSE_MINPOOL = 24;   // windows required before a normal may be claimed
const PULSE_TRACE = 90;     // days drawn

const pMedian = a => { if (!a.length) return null;
  const s = [...a].sort((x,y) => x-y), m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };

/* Median + MAD, scaled by 1.4826 so the result is on the same scale as an SD
   for well-behaved data — that is what lets "past 1" and "past 2" keep their
   ordinary meaning. MAD collapses to zero when over half the pool is identical
   (a metric that is usually nothing); SD is the fallback, and if that is zero
   too the honest answer is no score rather than an infinite one.

   RETURNS THE CENTRE AND THE SPREAD, not just the score. The card no longer
   prints z at rail level — it prints "22% above your normal" — and a percent
   needs the normal itself, in the metric's own units, not merely the distance
   to it. Same arithmetic as before; it now hands back what it already knew. */
function pRobustStat(pool){
  const m = pMedian(pool); if (m === null) return null;
  let s = 1.4826 * (pMedian(pool.map(v => Math.abs(v - m))) || 0);
  if (!(s > 0)){
    const mean = pool.reduce((a,b) => a+b, 0) / pool.length;
    s = Math.sqrt(pool.reduce((a,b) => a + (b-mean)*(b-mean), 0) / Math.max(1, pool.length - 1));
  }
  return s > 0 ? { m, s } : null;
}

/* Circular day-of-month distance, so the 1st pools with the 30th and 31st. A
   plain clamp left the 1st with four day-of-month buckets instead of seven and
   a visibly thinner normal at every month boundary. */
const pDomDist = (a,b) => { const d = Math.abs(a-b); return Math.min(d, 31-d); };

/* CALENDAR DAYS, NOT 86,400,000 MILLISECONDS. Every key here is a local
   midnight, and stepping a local midnight by a fixed day of milliseconds drifts
   an hour at each DST changeover — after which the walked keys stop matching the
   keys the bucketing produced, and the trace quietly grows holes twice a year.
   Two years of history crosses four of these. Step the date, not the clock. */
const pDayAdd = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return +d; };
const pDayDiff = (a, b) => Math.round((a - b) / 86400000);

function pulseScore(daily, { log = true, from, to }){
  const keys = [];
  for (let t = +from; t <= +to; t = pDayAdd(t, 1)) keys.push(t);
  const win = keys.map((_, i) => {
    if (i < PULSE_WIN - 1) return null;
    let s = 0;
    for (let j = i - PULSE_WIN + 1; j <= i; j++) s += daily.get(keys[j]) || 0;
    return s;
  });
  const x = win.map(v => v === null ? null : (log ? Math.log(1 + Math.max(0, v)) : v));
  const byDom = new Map();
  keys.forEach((k, i) => { if (x[i] === null) return;
    const d = new Date(k).getDate();
    if (!byDom.has(d)) byDom.set(d, []); byDom.get(d).push(x[i]); });
  const pools = new Map();
  const poolFor = dom => { if (pools.has(dom)) return pools.get(dom);
    const out = [];
    byDom.forEach((arr, d) => { if (pDomDist(d, dom) <= PULSE_DOMTOL) out.push(...arr); });
    pools.set(dom, out); return out; };
  /* Memoised per day-of-month, because the pool already is. The previous pass
     re-derived the median and the MAD from scratch on every one of up to 1,200
     days even though there are only 31 distinct pools behind them — and it now
     has to derive them twice, once for the score and once for the normal the
     percent read is against. Cached, that second use costs nothing. */
  const stats = new Map();
  const statFor = dom => { if (stats.has(dom)) return stats.get(dom);
    const p = poolFor(dom);
    const st = p.length < PULSE_MINPOOL ? null : pRobustStat(p);
    stats.set(dom, st); return st; };
  const z = [], norm = [];
  keys.forEach((k, i) => {
    const st = x[i] === null ? null : statFor(new Date(k).getDate());
    z.push(st ? (x[i] - st.m) / st.s : null);
    /* The normal, back in the metric's own units. Everything but the backlog
       delta is scored on log1p dollars or counts, so the centre has to come back
       through expm1 before it can be divided into a week's actual total — a
       median of logs is not the log of a median, and printing one as the other
       would put a wrong denominator under every percentage on the card. */
    norm.push(st ? (log ? Math.expm1(st.m) : st.m) : null);
  });
  return { keys, win, z, norm, log,
           pool: keys.length ? poolFor(new Date(keys[keys.length-1]).getDate()).length : 0 };
}

const pBand = z => z === null ? 'none' : Math.abs(z) <= 1 ? 'green' : Math.abs(z) <= 2 ? 'amber' : 'red';

/* A sub-vital's reading, lifted to rail level as ONE shape whichever kind it is,
   so the renderer never has to ask what it was handed. Everything the read needs
   to be said in English travels together: the week's value, the normal it is
   against, the band that colours it, and the unit line under it. */
const pulseReadOf = s => !s || !s.live ? null
  : s.speak === 'text'
    ? { speak:'text', text: s.wordText, band: s.band, readUnit: s.readUnit }
    : { speak: s.speak || 'pct', value: s.value, norm: s.norm, z: s.z,
        band: s.band, readUnit: s.readUnit };

function buildPulse(jobs, qbInv){
  const DAY = 86400000;
  const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const end = new Date(pDayAdd(+sod(new Date()), -1));   // yesterday: the last complete day
  const agg = (rows, field, val) => { const m = new Map();
    for (const r of rows){ const ts = r[field]; if (!ts) continue;
      const d = sod(new Date(ts)); if (isNaN(+d)) continue;
      m.set(+d, (m.get(+d) || 0) + val(r)); }
    return m; };

  const signed = jobs.filter(j => j.contract_signed_at);
  const done   = jobs.filter(j => j.completed_at);
  const sMap = agg(signed, 'contract_signed_at', j => Number(j.fin_sold_amount || 0));
  const sMapN = agg(signed, 'contract_signed_at', () => 1);
  const cMap = agg(done,   'completed_at',       () => 1);
  const iMap = agg((qbInv || []).filter(r => !r.reporting_excluded), 'txn_date', r => Number(r.total_amt || 0));

  const first = m => m.size ? new Date(Math.min(...m.keys())) : null;
  const from = d => new Date(Math.max(+d, pDayAdd(+end, -1200)));

  /* BACKLOG AGE, AS MOVEMENT. The level is not scoreable: 188 open jobs are over
     a year old ($581K of them), so mean age only ever drifts upward and a z-score
     on it would sit permanently red and teach the owner to ignore it. The 7-day
     CHANGE in mean age is stationary and is the honest reading of "completions vs
     signings" anyway — backlog ages exactly when signings outrun completions.
     The stale jobs stay IN the arithmetic and are named on the card; dropping
     them quietly would make the number prettier and less true. */
  const sweep = (() => {
    const ev = new Map();
    const push = (t, n, s) => { const c = ev.get(t) || [0,0]; ev.set(t, [c[0]+n, c[1]+s]); };
    for (const j of signed){
      const s = sod(new Date(j.contract_signed_at)); if (isNaN(+s)) continue;
      push(+s, 1, +s);
      if (j.completed_at){ const c = sod(new Date(j.completed_at));
        if (!isNaN(+c)) push(pDayAdd(+c, 1), -1, -(+s)); }
    }
    const start = signed.length ? sod(new Date(Math.min(...signed.map(j => +new Date(j.contract_signed_at))))) : end;
    const out = new Map(); let n = 0, sum = 0;
    for (let t = +start; t <= +end; t = pDayAdd(t, 1)){
      const e = ev.get(t); if (e){ n += e[0]; sum += e[1]; }
      out.set(t, n > 0 ? pDayDiff(t, sum / n) : 0);
    }
    return out;
  })();
  const ageDelta = new Map();
  sweep.forEach((v, t) => { const p = sweep.get(pDayAdd(t, -PULSE_WIN));
    if (p !== undefined) ageDelta.set(t, v - p); });

  const S = sMap.size ? pulseScore(sMap, { from: from(first(sMap)), to: end }) : null;
  const C = cMap.size ? pulseScore(cMap, { from: from(first(cMap)), to: end }) : null;
  const I = iMap.size ? pulseScore(iMap, { from: from(first(iMap)), to: end }) : null;
  /* A delta is already centred and takes both signs, so it is scored raw — a log
     transform of a negative number is not a number. */
  const A = ageDelta.size ? pulseScore(ageDelta, { log:false, from: from(new Date(Math.min(...ageDelta.keys()))), to: end }) : null;

  /* EVERY TAIL WALKS THE SAME CALENDAR — same end date, same length, one entry
     per day. That is not tidiness: the composite averages these series BY INDEX,
     so index i has to be the same calendar day in all four or the blend is of
     different days pretending to be one. A day with no score comes back as a
     null in place, never as a shorter array. */
  const tail = r => { if (!r) return [];
    const out = [];
    for (let t = pDayAdd(+end, -(PULSE_TRACE-1)); t <= +end; t = pDayAdd(t, 1)){
      const i = r.keys.indexOf(t);
      out.push({ k: t, z: i < 0 ? null : r.z[i], v: i < 0 ? null : r.win[i],
                 n: i < 0 ? null : r.norm[i] });
    }
    return out; };
  const lastOf = r => { if (!r) return null;
    for (let i = r.z.length - 1; i >= 0; i--)
      if (r.z[i] !== null) return { z: r.z[i], v: r.win[i], n: r.norm[i] };
    return null; };

  /* `speak` is how far-from-normal gets said in English. 'pct' for anything on a
     ratio scale — dollars and counts have a true zero, so "22% above your
     normal" is a sentence with a meaning. 'drift' for the backlog movement,
     which has neither a true zero nor a quantity a reader can hold; see
     pulseReadText for why it gets a direction instead of a figure. `readUnit` is
     the sub-line under the read, naming what was measured, because "22% above
     normal" with no unit attached is half a fact. */
  const sub = (name, r, unit, dir, note, readUnit) => { const l = lastOf(r);
    return { name, live: !!l, z: l ? l.z : null, band: pBand(l ? l.z : null),
             value: l ? l.v : null, norm: l ? l.n : null,
             speak: unit === 'd' ? 'drift' : 'pct', readUnit,
             unit, dir, note, spark: tail(r) }; };

  /* DECOMPOSITION. A red vital has to point somewhere, so each brand is scored
     by the same arithmetic as its parent rather than merely listed with a share:
     a brand holding 12% of the money can still be the whole of the problem. */
  const brandCut = (rows, field, val) => BRAND_ORDER.map(id => {
    const mine = rows.filter(r => rollup(r.cc_company_id) === id);
    const m = agg(mine, field, val);
    const r = m.size ? pulseScore(m, { from: from(first(m)), to: end }) : null;
    const l = lastOf(r);
    /* norm rides along so a brand can be read in the same English as its parent.
       Every brand cut is dollars or counts — ratio scale, true zero — so 'pct'
       is always the right way to say it here. */
    return { id, name: brandOf(id).s, colour: brandOf(id).c,
             live: !!l, z: l ? l.z : null, band: pBand(l ? l.z : null),
             value: l ? l.v : null, norm: l ? l.n : null, speak: 'pct' };
  });

  /* DAYS OUT is judged against a FIXED BAND, not against its own history, and
     that is the one deliberate break from the arithmetic everything else uses.
     Kevin set 2–3 days by hand. A z-score here would be self-defeating: a shop
     that has always booked eight days out has a "normal" of eight, and scoring
     against it would report a chronic problem as perfectly healthy. A target
     nobody can drift away from is the whole point of a target.

     THE WINDOW IS SETTLED, NOT TRAILING. A lead booked into an appointment takes
     time to acquire one, so a window ending yesterday contains leads that simply
     have not been booked YET — and dropping them keeps only the fast ones, which
     drags the median down exactly when booking is slipping. That is the failure
     direction that matters, so the window ends 7 days back instead: 92.2% of
     leads that ever get an appointment have it within 7 days, and with the median
     sitting near 3 that is far past the half-way mark the median needs. It costs
     a week of latency on a number that moves over months. */
  const DO_SETTLE = 7;
  const doBand = m => m === null ? 'none' : m < 2 ? 'amber' : m <= 3 ? 'green' : m < 5 ? 'amber' : 'red';
  const doWord = m => m === null ? '' : m < 2 ? 'capacity idle — need leads'
    : m <= 3 ? 'in band' : m < 5 ? 'slipping out' : 'booking past the line';

  const marketing = (() => {
    const leadRows = jobs.filter(j => j.lead_at);
    const lMap = agg(leadRows, 'lead_at', () => 1);
    const L = lMap.size ? pulseScore(lMap, { from: from(first(lMap)), to: end }) : null;
    const leads = sub('Leads / day', L, 'n', -1,
      'Dated by <code>cc_raw.project_created_at</code> — Contractors Cloud\'s own lead stamp, 11,558 of 11,558 populated across 609 days. Not <code>customers.created_at</code>, which is our import stamp and puts 96% of the history on one Monday in July.',
      'leads, last 7 days');

    /* Whole days, floor'd, from lead to the first appointment DATE — the same
       units the 2-3 day band is written in. A same-day booking is 0, not 0.4. */
    const doEnd = pDayAdd(+end, -DO_SETTLE), doStart = pDayAdd(doEnd, -(PULSE_WIN - 1));
    const lags = []; let backwards = 0, booked = 0;
    for (const j of leadRows){
      if (!j.lead_appt_at) continue;
      const l = sod(new Date(j.lead_at)), a = sod(new Date(j.lead_appt_at));
      if (isNaN(+l) || isNaN(+a) || +l < doStart || +l > doEnd) continue;
      booked++;
      /* Appointment dated BEFORE its own lead — 4.2% of bookings. CC lets an
         appointment be attached to a project created after the fact, so these are
         real records of a real visit with an unusable clock. Counted out loud on
         the card rather than quietly folded in as zeros, which would drag the
         median toward "instant" and flatter the number. */
      const d = pDayDiff(+a, +l);
      if (d < 0){ backwards++; continue; }
      lags.push(d);
    }
    const med = lags.length >= 5 ? pMedian(lags) : null;
    const dOut = { name:'Days out · lead to appointment', kind:'band', live: med !== null,
      band: doBand(med), valText: med === null ? '—' : med.toFixed(1) + ' d',
      wordText: doWord(med),
      /* No percent read here, and that is the point. Days out is the one vital
         with no historical normal to be a percentage of — it is measured against
         a line Kevin drew. "12% above your normal" would quietly re-baseline the
         target onto the shop's own habit, which is the exact failure the fixed
         band exists to prevent. It speaks in days and in the word. */
      speak:'text',
      readUnit: med === null ? 'lead to appointment · not enough bookable leads'
        : `median ${med.toFixed(1)} days, lead to appointment · target 2–3`,
      note: med === null
        ? `Fewer than 5 bookable leads in the settled window — no median worth printing.`
        : `Median of <b>${lags.length}</b> lead${lags.length === 1 ? '' : 's'} created in the 7 days ending ${new Date(doEnd).toLocaleDateString('en-US',{month:'short',day:'numeric'})}, each given 7 days to be booked. Target band 2–3 days: green through 3, amber at 4, red at 5 and beyond. Under 2 is not a better score — it means the calendar is not full.` +
          (backwards ? ` <b>${backwards}</b> of ${booked} (${(100*backwards/booked).toFixed(1)}%) excluded: the appointment is dated before its own lead, so the interval is unusable.` : '') };

    const est = { name:'Estimate clock · appointment to estimate', live:false,
      note:'The app\'s touch log has no estimate event. <code>app_private.touches</code> records five plays — <code>thankyou</code>, <code>forgot</code>, <code>untilyes</code>, <code>direct</code>, <code>digital</code> — and every one is follow-up cadence; delivering an estimate is not among them, folded in or otherwise. The one distinct stamp that exists is <code>geo_events.kind=\'estimate_capture\'</code>, and it holds 123 rows over 8 days from 5 reps, fires only when GPS capture succeeds, and carries a null <code>job_id</code> on every row. That is the wire to run, not a feed to draw.' };

    const cost = { name:'Cost ratio vs the 10% line', live:false,
      note:'<code>marketing_spend</code> holds typed months now (July 2026 keyed from the card statements — the ruling, migrations 170/171), but spend is typed at month CLOSE: the month in progress has no row until the office keys it, and <code>google_ads_daily</code> (Windsor) is a pacing signal demoted from all money math after undercounting July by half. A mid-month numerator built from either would read LOW and paint a green ratio over spending that is actually above the line. Held deliberately: no number beats a flattering one.' };

    const subs = [leads, dOut, est, cost];
    const rank = { none:0, green:1, amber:2, red:3 };
    const liveSubs = subs.filter(s => s.live);
    const lead = liveSubs.slice().sort((a,b) => rank[b.band] - rank[a.band])[0] || null;
    /* The rail wears the worst live sub-vital's reading. When that is days out it
       shows the word and the days, because it never had a z to show — and now
       never had a percent either. The TRACE under it stays the leads series
       regardless: days out is a settled 7-days-back median, one number, and has
       no daily line to draw. The sub-line says which of the two is being read,
       so a trace of leads under a read about booking lag cannot be mistaken for
       a picture of that read. */
    return { key:'marketing', name:'MARKETING', label:'the inflow system',
      live: liveSubs.length > 0,
      z: leads.live ? leads.z : null,
      band: lead ? lead.band : 'none',
      read: pulseReadOf(lead),
      spark: leads.live ? leads.spark : [],
      half: 'Two of the four sub-vitals are wired. The estimate clock and the cost ratio draw nothing and say why below.',
      subs,
      brands: brandCut(leadRows, 'lead_at', () => 1) };
  })();

  /* THE LUMP RULE, on a rail. Dollars alone cannot distinguish a good week from
     one $200K roof, so the unit count rides alongside the money it came from —
     the same reason the signed-by-day skyline carries both. It is a stated
     count, not a second score: two numbers scored separately would just be two
     vitals wearing one name. */
  const sales = (() => { const s = sub('Signed dollars / day', S, '$', -1, null, 'signed dollars, last 7 days');
    const u = sub('Contracts signed / day', sMapN.size ? pulseScore(sMapN, { from: from(first(sMapN)), to: end }) : null, 'n', -1,
      'The count behind the dollars. When these two disagree — money up, contracts flat — the week is one large job rather than a broad one.',
      'contracts, last 7 days');
    return { key:'sales', name:'SALES', label:'signed dollars a day', live:s.live, z:s.z, band:s.band,
             spark:s.spark, value:s.value, read: pulseReadOf(s), subs:[s, u],
             brands: brandCut(signed, 'contract_signed_at', j => Number(j.fin_sold_amount || 0)) }; })();

  const production = (() => {
    const c = sub('Completions / day', C, 'n', -1, null, 'completions, last 7 days');
    const a = sub('Backlog age · 7-day movement', A, 'd', 1,
      'Ages upward when signings outrun completions. 188 of the open jobs are over a year old ($581K of them) — almost certainly never-closed records rather than live work. They are counted in, not dropped: the level they inflate is not what is scored here, the movement is.',
      'mean backlog age, 7-day movement · scored against its own history');
    const live = c.live || a.live;
    const lead = [c, a].filter(x => x.live).sort((p,q) => Math.abs(q.z) - Math.abs(p.z))[0] || null;
    return { key:'production', name:'PRODUCTION', label:'completions against signings, and backlog age',
             live, z: lead ? lead.z : null, band: pBand(lead ? lead.z : null),
             spark: lead ? lead.spark : [], read: pulseReadOf(lead), subs:[c, a] }; })();

  const collections = (() => { const i = sub('Invoiced dollars / day', I, '$', -1, null, 'invoiced dollars, last 7 days');
    return { key:'collections', name:'COLLECTIONS', label:'cash in against invoiced',
             live:i.live, z:i.z, band:i.band, spark:i.spark, value:i.value, read: pulseReadOf(i),
             half:'Only the invoiced half is wired. Cash <em>in</em> draws nothing: no payment date exists anywhere in the schema — <code>qb_invoices.balance</code> is a snapshot with no date attached, its <code>raw</code> JSON carries no <code>LinkedTxn</code>, and <code>jobs.fin_received_amount</code> is a snapshot too. Cash collected on a given day is not computable.',
             subs:[ i, { name:'Cash in / day', live:false, note:'No payment-date feed — see above.' } ],
             brands: brandCut((qbInv || []).filter(r => !r.reporting_excluded), 'txn_date', r => Number(r.total_amt || 0)),
             /* Aged from the INVOICE date, not the due date — due_date is not among
                the columns this console fetches, and naming the clock we actually
                used beats implying one we did not read. A snapshot, not a series:
                it says where the open money is sitting right now. */
             aging: (() => { const B = [[0,30,'0–30 days'],[30,60,'30–60'],[60,90,'60–90'],[90,1e9,'over 90']];
               const open = (qbInv || []).filter(r => !r.reporting_excluded && Number(r.balance || 0) > 0);
               return B.map(([lo, hi, label]) => { const mine = open.filter(r => {
                   const age = pDayDiff(+end, +sod(new Date(r.txn_date)));
                   return age >= lo && age < hi; });
                 return { label, n: mine.length, v: mine.reduce((a,r) => a + Number(r.balance || 0), 0) }; }); })() }; })();

  const payables = { key:'payables', name:'PAYABLES', label:'A/P against cash on hand', live:false,
    z:null, band:'none', spark:[],
    why:'No A/P, vendor, bank or cash-balance table exists in the schema. There is nothing to read yet.',
    subs:[ { name:'A/P against cash on hand', live:false, note:'Nothing to wire to: neither the payables nor the cash side has a table in this database.' } ] };

  const vitals = [marketing, sales, production, collections, payables];
