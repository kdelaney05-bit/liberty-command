function cardQuiet(){
  if (!MKTWALK) return `<div class="m2-card"><div class="m2-card-title">Went quiet · sources that stopped<span class="m2-tag cc">live · cc</span></div>
    <div class="m2-card-sub" style="margin:0">Walking the last ${MKW_MONTHS} months…</div></div>`;
  if (MKTWALK.err) return mkWithheld('Went quiet · sources that stopped', 'no feed',
    'The month walk did not answer',
    `Every one of the ${MKW_MONTHS} windowed calls to <b>rpt_report_marketing_roi</b> failed (${esc(String(MKTWALK.err))}), and <b>rpt_marketing_revenue_by_source_month</b> (172, the Mar–Jun backfill) did not answer either. That RPC is migration 160 as corrected by 165.`);
  const live = MKTWALK.series.filter(m => !m.err);
  if (live.length < 3) return mkWithheld('Went quiet · sources that stopped', 'too few months',
    'Not enough months came back to call anything quiet',
    `${live.length} of ${MKW_MONTHS} windows answered. A source needs a run of months behind it before silence means anything.`);
  const names = [...new Set(live.flatMap(m => Object.keys(m.bySrc)))];
  /* Quiet = earned money in the earlier months, nothing in the last two. Two,
     not one: a source that simply has not signed yet this month is not a
     source that stopped, and the current month is partial by definition. */
  const tail = live.slice(-2), head = live.slice(0, -2);
  const quiet = names.map(n => {
    const earned = head.reduce((s, m) => s + ((m.bySrc[n] || {}).dollars || 0), 0);
    const recent = tail.reduce((s, m) => s + ((m.bySrc[n] || {}).dollars || 0), 0);
    return { n, earned, recent, series: live.map(m => (m.bySrc[n] || {}).dollars || 0) };
  }).filter(x => x.earned > 0 && x.recent === 0).sort((a, b) => b.earned - a.earned);
  if (!quiet.length) return `<div class="m2-card">
    <div class="m2-card-title">Went quiet · sources that stopped<span class="m2-tag cc">live · cc</span></div>
    <div class="m2-card-sub">Sources that earned in the earlier months and signed nothing in the last two.</div>
    <div class="withheld"><div class="wt">Nothing has gone quiet</div><div class="wx">Every source that signed money in the first ${head.length} month${head.length === 1 ? '' : 's'} of the walk has signed again since. This is a real all-clear, not an empty feed — ${live.length} windows answered.</div></div>
  </div>`;
  const peak = Math.max(1, ...quiet.flatMap(x => x.series));
  return `<div class="m2-card">
    <div class="m2-card-title">Went quiet · sources that stopped<span class="m2-tag cc">live · cc</span></div>
    <div class="m2-card-sub">Earned money ${esc(live[0].label)}–${esc(head[head.length - 1].label)}, nothing signed in ${esc(tail.map(t => t.label).join(' or '))}. Bars are ${esc(live[0].label)}→${esc(live[live.length - 1].label)}; red stubs are zero months.</div>
    ${quiet.map(x => `<div class="m2-quiet-row">
      <div class="m2-q-pulse dead"></div>
      <div class="m2-q-body"><div class="m2-q-name">${esc(x.n)}</div>
        <div class="m2-q-meta">last signed ${esc((live.filter((m, i) => x.series[i] > 0).pop() || {}).label || '—')} · ${x.series.filter(v => v > 0).length} of ${live.length} months live</div></div>
      <div class="m2-q-spark">${x.series.map(v => v > 0
        ? `<i style="height:${Math.max(3, Math.round(22 * v / peak))}px"></i>` : `<i class="z"></i>`).join('')}</div>
      <div class="m2-q-lost">${short(x.earned)}</div>
    </div>`).join('')}
    <div class="m2-note"><b>${money(quiet.reduce((n, x) => n + x.earned, 0))}</b> of proven signed revenue now producing nothing. Dollars are dated by <b>rpt_signings.signed_on</b>, correct in every window — this section does not read the leads column and is unaffected by the backfill.</div>
  </div>`;
}

    <b>Revenue:</b> <b>rpt_report_marketing_roi</b> (migration 160, corrected by 165), grouped on <b>lead_sources.rollup_name</b> (163) — never the raw Contractors Cloud name, which splits Angi three ways and Google five. Signed dollars are dated by <b>rpt_signings.signed_on</b> and are correct in every window. Signed jobs are counted <b>distinct by project</b>: migration 150 splits an amended invoice into a row per late bell, which is right for money and would push a rate past 100%.
    <b>Spend:</b> the typed book, <b>marketing_spend</b> (166; by company since <b>167</b> — a month is either one unsplit total or per-brand rows, trigger-enforced, so sums never double; Google card rows since the ruling <b>170/171</b>) — a source with no row reads <b>not entered</b>, never zero. <b>Google is the card:</b> Chase Ink 1552/1571 + Amex Gold statements keyed monthly by brand, priced all-in with Liam / Gate Digital management (flag ✓2). <b>Windsor is a pacing signal only</b> — <b>google_ads_daily</b> undercounted July by half (card $47,994 vs Windsor $25,175, the ruling that demoted it)${g ? '' : (w.state === 'stale' ? ` — and it is <b>stale</b> for this month besides, last delivery ${esc(w.last)}` : w.state === 'nofeed' ? ' — and it has <b>never delivered</b> besides' : '')}; it feeds the pacing chip and no money math. <b>⚑3 rows</b> (Next Level, CallFire, Mailchimp, Marlie, Zapier, GoDaddy, Canva — no CC source tag) are held in month totals and excluded from every per-source figure. Referral bonuses are an estimate (~5). Heymarket is company ops, not marketing.
    <b>Brand money:</b> <b>rpt_report_marketing_roi_brand</b> (169) — the identical confirmed signing rows grouped source × company on <b>rpt_signings.brand_rollup_cc_id</b>, so the brand sections cross-foot with every other dollar on this board by construction. Legacy Liberty Roofing (1537) folds into Pro-Tec upstream. The tiles' ÷ is live: brand cost is complete now that the card splits Google by company.
    <b>Not read here:</b> the approved board's own revenue basis — a one-off CC probe walk of 2,500 projects. Revenue on this page is the RPC and may differ from that snapshot; the July spend book was keyed FROM the approved board's card figures (171) and read back to the cent, so the spend side of the two instruments agrees by construction.
    <b>Appointments ran</b> is empty everywhere on this console: Contractors Cloud logs no appointment outcome.
    <span class="motto">Trust the instrument, not the retelling</span>
  </div>`;
}

/* ── THE SPEND-FRESHNESS NAG ──────────────────────────────────────────────── */
/* A nag, not a withheld feed, and deliberately not wearing that skin. It fires
   when the spend book is applied, the previous calendar month has no row in it,
   and today is past the 10th — ten days' grace to type a month before the
   board starts asking. Always the previous CALENDAR month, whatever month the
   board is browsing: freshness is a property of the book, not of the view.
   It changes no number: no average steps in, no month is carried forward, and
   every section below keeps its honest-empty state. The banner explains the
   gap; it does not paper over it. A missing book is a different state — a feed
   problem the refusal panels already name — so no nag is drawn for it: nagging
   someone to type into a table that does not exist misnames whose move it is. */
function mkNag(){
  if (!MKT || !Array.isArray(MKT.spend)) return '';
  if (new Date().getDate() <= 10) return '';
  const prevKey = mkISO(mkMonthStart(1));
  if (MKT.spend.some(s => String(s.month).slice(0, 10) === prevKey)) return '';
  return `<div class="m2-nag"><b>${esc(mkMonthLabel(1))} spend not entered</b> — return figures below are understated.</div>`;
}

/* ── 10. flags ────────────────────────────────────────────────────────────── */
/* ── NOTICE → DO, rendered ──────────────────────────────────────────────────
   One component, used by the appointments card, the flags card and every
   drill-in, so a signal reads identically wherever it surfaces. ─────────── */
const SEV = { fire:{c:'#d96a5e', k:'act today'}, watch:{c:'#d4b15a', k:'watch'}, note:{c:'#8aa094', k:'note'} };

/* ── THE OWNER'S CHECKLIST ───────────────────────────────────────────────────
   Kevin: "make this crucial items for review and the most important one or two
   visible and the rest a drop down to check them off" — a board he can clear on
   the way to his jet, not a wall to read.

   Ticking is an AUDIT TRAIL, not a delete: each cleared item records who cleared
   it and when. And the key carries a hash of the NOTICE TEXT, not just the
   signal id — so when the numbers move the sentence is materially different, the
   key no longer matches, and the item comes back rather than staying buried
   under a tick from last week. That is the "resurface only if it re-triggers
   fresh" rule, made mechanical. Entries older than 14 days are pruned, so a
   stale tick can never hide a live problem indefinitely.

   Device-local: this is localStorage, so a tick on the phone does not clear the
   desktop. Making it travel needs a small backend table — noted for that session
   rather than faked here. ─────────────────────────────────────────────────── */
const CLEAR_STORE = 'lcc.cleared', CLEAR_TTL_DAYS = 14;
let CLEARED = (() => {
  let o = {};
  try { o = JSON.parse(localStorage.getItem(CLEAR_STORE)) || {}; } catch(e) { o = {}; }
  const cut = Date.now() - CLEAR_TTL_DAYS * 86400000;
  for (const k of Object.keys(o)) if (!o[k] || !(Number(o[k].at) > cut)) delete o[k];
  return o;
})();
function saveCleared(){ try { localStorage.setItem(CLEAR_STORE, JSON.stringify(CLEARED)); } catch(e){} }
const hash32 = s => { let h = 5381; for (let i=0;i<s.length;i++) h = ((h*33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
const sigKey = s => `${s.id}::${hash32(String(s.notice||''))}`;
const isCleared = s => !!CLEARED[sigKey(s)];
function clearSig(k){
  const s = ((D.signals && D.signals.list) || []).find(x => sigKey(x) === k); if (!s) return;
  CLEARED[k] = { at: Date.now(), by: (sess.get()||{}).email || 'unknown', sev: s.sev, notice: s.notice };
  saveCleared(); keepScroll(()=>{});
}
function restoreCleared(){ CLEARED = {}; saveCleared(); keepScroll(()=>{}); }

/* a cleared item is cleared everywhere, not just on the board */
function sigFor(tag){ return (D.signals && D.signals.list || []).filter(s => s.tags.includes(tag) && !isCleared(s)); }

function signalList(sigs, { quiet } = {}){
  if (!sigs.length) return quiet ? `<div class="nofires">${esc(quiet)}</div>` : '';
  return sigs.map(s => `<div class="sig ${s.sev}">
    <div class="sig-h"><span class="sig-dot" style="background:${SEV[s.sev].c}"></span>
      <span class="sig-k">${SEV[s.sev].k}</span></div>
    <div class="sig-n">${esc(s.notice)}</div>
    <div class="sig-d"><span class="sig-arrow">→</span>${esc(s.action)}</div>
  </div>`).join('');
}

function cardFlags(){
  const W = w(), f = [];
  const X = D.exclusions;
  if (X && X.jobs) f.push(['#a98fd5', `<b>${X.jobs} jobs held out of every figure.</b> ${X.signed} of them signed, worth <b>${short(X.value)}</b> — the batch-entry anomaly Liberty's own reports already exclude${X.brands.length===1?` (all on ${esc(brandOf(X.brands[0]).n)})`:''}. Flagged, not deleted: they are real jobs, excluded from reporting so this console agrees with the reports you already trust.`]);
  if (D.sampleReps && D.sampleReps.length) f.push(['#a98fd5', `<b>${D.sampleReps.length} sample rep${D.sampleReps.length===1?'':'s'} excluded.</b> ${D.sampleReps.map(esc).join(', ')} — the app's invented demo team (reps.source = app_sample), not real people. Their demo touches are excluded the same way. Nothing they carry is counted anywhere on this page.`]);

/* The page's answer to "what needs me today". Sits at the top because that is
   the question he opens it with. When nothing crosses a threshold it says so
   plainly — a console that always finds something wrong gets ignored. */
/* One row for a signal. The top items render in full; everything behind the
   drop-down renders terse — one line, its detail one tap away — because Kevin
   wants page one to be the only screen he has to read, not the longest. */
/* ── AN INBOX ROW ────────────────────────────────────────────────────────────
   Kevin: "make it like Gmail does… Still too busy and long." So nothing shows
   its body at rest — not even the fires. Every item is one line: severity dot,
   its terse subject carrying the number that matters, ellipsis if it runs long,
   and the tick. The full notice and the DO step open on tap, per the Falcon
   rule: the tap is the door, not the trash. */
function sigRow(s){
  const k = sigKey(s);
  /* stopPropagation, or opening a row bubbles to the wrapper and collapses the
     whole list under the reader's thumb. */
  return `<div class="sigrow ${s.sev}" onclick="event.stopPropagation();this.classList.toggle('open')">
    <div class="sr-line">
      <span class="sig-dot" style="background:${SEV[s.sev].c}"></span>
      <span class="sr-subj">${esc(s.brief || s.notice)}</span>
      <span class="acc-chev sr-chev">›</span>
      <button class="sigcheck" title="Mark handled — it leaves the board and is logged with your name and the time"
        onclick="event.stopPropagation();clearSig('${esc(k)}')">✓</button>
    </div>
    <div class="sr-open">
      <div class="sig-k">${SEV[s.sev].k}</div>
      <div class="sig-n">${esc(s.notice)}</div>
      <div class="sig-d"><span class="sig-arrow">→</span>${esc(s.action)}</div>
      ${s.rec && s.rec.lines && s.rec.lines.length ? `<div class="recs">
        <div class="recs-h">Recommended</div>
        ${s.rec.lines.map(l=>`<div class="rec-line"><span class="rec-bullet">→</span>${esc(l)}</div>`).join('')}
        ${s.rec.draft ? `<div class="draftbox">
          <div class="draft-t">${esc(s.rec.draft)}</div>
          <button class="copybtn" onclick="event.stopPropagation();copyDraft('${esc(k)}',this)">Copy message</button>
        </div>` : ''}
      </div>` : ''}
    </div>
  </div>`;
}

/* Copy, never send. The console has no outbound channel and is not getting one:
   a dashboard that can message the team on its own is a dashboard that can
   message the team by mistake. Kevin taps, reads it, sends it himself. */
function copyDraft(k, btn){
  const s = ((D.signals && D.signals.list) || []).find(x => sigKey(x) === k);
  if (!s || !s.rec || !s.rec.draft) return;
  const reset = () => setTimeout(()=>{ btn.textContent='Copy message'; btn.classList.remove('ok'); }, 1900);
  const ok = () => { btn.textContent = 'Copied ✓'; btn.classList.add('ok'); reset(); };
  /* If the clipboard API is refused — an insecure context, or a browser that
     wants a closer user gesture — SELECT the draft instead of just saying the
     word "copy". A dead button that blames the user is worse than no button;
     this way a long-press or ⌘C still gets him the message. */
  const fallback = () => {
    const el = btn.parentElement && btn.parentElement.querySelector('.draft-t');
    if (el && window.getSelection) {
      const r = document.createRange(); r.selectNodeContents(el);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent = 'Selected — copy it';
    } else { btn.textContent = 'Copy failed'; }
    reset();
  };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(s.rec.draft).then(ok).catch(fallback);
    else fallback();
  } catch(e) { fallback(); }
}

/* THE DIGEST — every open item stitched into a couple of sentences, the way
   Gmail's summary card reads. Composed from the items' own brief clauses, not
   generated, so it can never say something the rows below it do not. Genuine
   model-written synthesis is the ask-bar's job; this line stays deterministic
   and therefore stays true. */
function signalDigest(live){
  const b = live.map(s => s.brief || s.notice).filter(Boolean);
  if (!b.length) return '';
  const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
  const join = a => a.length === 1 ? a[0]
              : a.slice(0,-1).join(', ') + (a.length > 2 ? ',' : '') + ' and ' + a[a.length-1];
  const first = cap(b[0]) + '.';
  return b.length === 1 ? first : `${first} ${cap(join(b.slice(1)))}.`;
}
/* ═══ THE ASK BAR ═══════════════════════════════════════════════════════════
   Plain-English question in, receipted answer out. The console's half: the bar,
   the answer card, and the refusal. The SQL is generated and executed by the
   `ask` Edge Function, which is the only thing holding the Anthropic key — a
   published console is a public artifact and a key in it is a key given away.

   The contract this expects, per ASK-BAR-SPEC.md:
     { ok:true, headline, scope?, rows[], columns?, badges[], freshness,
       sql, caveats[], cost_cents }
     { ok:false, refusal, reason? }
   Anything else is treated as unreadable and REFUSED rather than guessed at —
   the whole point of the card is that it cannot show a number it cannot source.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Resolved when called, not at module load: SB_URL is declared further down this
   file, so reading it here at eval time hits the temporal dead zone and takes the
   whole page white. Caught by the render gate before it ever shipped. */
const askEndpoint = () => SB_URL + '/functions/v1/ask';
/* Only ever advertise a question the eval set proves it can answer. */
const ASK_PLACEHOLDERS = [
  'Ask your business anything…',
  'How many appointments in Palm Coast this week vs the last 4 weeks?',
  'Who are my top 5 reps this month?',
  'Which lead sources close best for fencing?',
];
const ASK_PH = ASK_PLACEHOLDERS[0];
let ASK = { status:'idle', q:'', a:null, msg:'' };

function askIcon(){
  return `<svg viewBox="0 0 24 24" fill="none">
    <path d="M12 22s7-6.1 7-11.5A7 7 0 0 0 5 10.5C5 15.9 12 22 12 22z" stroke="#17110c" stroke-width="2" stroke-linejoin="round"/>
    <path d="M8.8 10.4l2.2 2.2 4.2-4.2" stroke="#17110c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function askBar(){
  const busy = ASK.status === 'asking';
  return `<div class="askwrap">
    <form class="askbar" onsubmit="askSubmit(event)" autocomplete="off">
      <input id="askq" class="askin" type="text" value="${esc(ASK.q)}" ${busy?'disabled':''}
        placeholder="${esc(ASK_PH)}" oninput="ASK.q=this.value" aria-label="Ask your business a question"/>
      <button class="ask-send" type="submit" ${busy?'disabled':''} aria-label="Ask">
        ${busy ? '<span class="ask-spin"></span>' : askIcon()}
      </button>
    </form>
    <div class="askhint">Live data · answered from your own numbers, never a stored answer</div>
    ${askAnswer()}
  </div>`;
}

function askSubmit(ev){
  ev.preventDefault();
  const el = document.getElementById('askq');
  const q = (el ? el.value : ASK.q || '').trim();
  if (!q || ASK.status === 'asking') return;
  askRun(q);
}

async function askRun(q){
  ASK = { status:'asking', q, a:null, msg:'' };
  render();
  const s = sess.get() || {};
  try {
    const r = await fetch(askEndpoint(), {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey: SB_KEY,
                Authorization: 'Bearer ' + (s.access_token || SB_KEY) },
      body: JSON.stringify({ question: q }),
    });
    /* Not built yet is its own state, not an error and not a refusal — saying
       "couldn't answer reliably" would blame the data for a missing service. */
    if (r.status === 404) {
      ASK = { status:'offline', q, a:null,
        msg:'The ask service is not switched on yet. The bar is live; the answering end is still being built.' };
      return render();
    }
    let j = null;
    try { j = await r.json(); } catch(e){ j = null; }
    /* 503 is the function's own "deployed but no Anthropic key yet". That is a
       plumbing state like the 404, not a verdict on the question — it must wear
       the not-switched-on wording, never "withheld". */
    if (r.status === 503) {
      ASK = { status:'offline', q, a:null,
        msg:(j && (j.error || j.message)) || 'The ask service is deployed but not configured yet.' };
      return render();
    }
    if (!r.ok) {
      ASK = { status:'refused', q, a:null,
        msg:(j && (j.refusal || j.message || j.error)) || `The ask service answered ${r.status}.` };
      return render();
    }
    if (j && j.ok === false) {
      /* The deployed function says "message"; the original contract said
         "refusal". Read both, so a real refusal never degrades to the generic
         line — the specific wording is the product ("which fact is missing"). */
      ASK = { status:'refused', q, a:null, msg: j.refusal || j.message || 'I could not answer that reliably.' };
      return render();
    }
    if (!j || (!j.headline && !Array.isArray(j.rows))) {
      ASK = { status:'refused', q, a:null,
        msg:'The answer came back in a shape this page cannot read, so it is not being shown. Nothing here is a guess.' };
      return render();
    }
    ASK = { status:'answered', q, a:j, msg:'' };
  } catch(e){
    /* A cross-origin POST to a function that does not exist fails at the
       preflight, so "not built yet" and "network dropped" arrive identically
       here. Say both rather than pick one — and do not route it to the
       out-of-scope wording, which would blame the question. */
    ASK = { status:'offline', q, a:null,
      msg:'Could not reach the ask service. It may not be switched on yet, or the connection dropped — either way nothing here is a guess.' };
  }
  render();
}

/* Receipt rows, rendered from whatever columns the answer carries. A two-column
   answer gets the mock's label-bar-number shape; anything wider is laid out as a
   plain table rather than forced into a chart it does not fit. */
function askRows(a){
  const rows = Array.isArray(a.rows) ? a.rows : [];
  if (!rows.length) return `<div class="arec-none">No rows matched. That means <b>nothing recorded</b>, not necessarily nothing happened.</div>`;
  const cols = Array.isArray(a.columns) && a.columns.length ? a.columns : Object.keys(rows[0]);
  const numeric = c => rows.every(r => r[c] === null || r[c] === undefined || !isNaN(Number(r[c])));
  const valCol = [...cols].reverse().find(numeric);
  const simple = cols.length === 2 && valCol;
  const mx = valCol ? Math.max(1, ...rows.map(r => Math.abs(Number(r[valCol]) || 0))) : 1;
  const show = rows.slice(0, 40);
  return `<div class="arec-h"><span>${esc(String(cols[0]))}</span><span>${esc(String(cols[cols.length-1]))}</span></div>
    ${show.map(r => {
      const label = String(r[cols[0]] ?? '—');
      if (simple) {
        const v = Number(r[valCol]) || 0;
        return `<div class="arec">
          <span class="arec-k">${esc(label)}</span>
          <span class="arec-bar"><i style="width:${Math.round(Math.abs(v)/mx*100)}%"></i></span>
          <span class="arec-v">${esc(String(r[valCol] ?? ''))}</span>
        </div>`;
      }
      return `<div class="arec wide">${cols.map((c,i)=>
        `<span class="${i===0?'arec-k':'arec-c'}">${esc(String(r[c] ?? '—'))}</span>`).join('')}</div>`;
    }).join('')}
    ${rows.length > show.length ? `<div class="wfoot" style="margin-top:8px">+ ${rows.length-show.length} more rows returned</div>` : ''}`;
}

/* The function returns the headline as a TEMPLATE — "Palm Coast booked {value}
   this week" — and this page substitutes the row values, so the prose cannot
   disagree with the data. {name} resolves against the first row's columns;
   {value} against its first numeric column; {count} against the row count. A
   placeholder that cannot be resolved hides the whole headline rather than
   shipping a literal "{value}" — the rows are the answer, the headline is only
   a summary of them, and a broken summary is withheld like anything else. */
function askHeadline(a){
  const h = a && a.headline;
  if (typeof h !== 'string' || !h) return '';
  if (!h.includes('{')) return h;
  const rows = Array.isArray(a.rows) ? a.rows : [];
  const r0 = rows[0] || {};
  const keys = Object.keys(r0);
  const numKey = keys.find(k => r0[k] !== null && r0[k] !== '' && !isNaN(Number(r0[k])));
  const out = h.replace(/\{([\w .%-]+)\}/g, (m, name) => {
    const n = name.trim().toLowerCase();
    if (n === 'count' || n === 'rows' || n === 'row_count') return String(a.row_count ?? rows.length);
    const k = keys.find(x => x.toLowerCase() === n);
    if (k !== undefined && r0[k] !== null && r0[k] !== undefined) return String(r0[k]);
    if ((n === 'value' || n === 'n') && numKey !== undefined) return String(r0[numKey]);
    return m;
  });
  return /\{[\w .%-]+\}/.test(out) ? '' : out;
}

/* Freshness arrives as the console_sync_status rows themselves — job, label,
   freshness, minutes_since_ok, expected_every_minutes — read per answer, never
   assumed. Collapsed here to one stamp: if any feed is stale the card warns
   ABOVE the number with the worst offender named, per the spec; otherwise the
   oldest successful sync becomes the "synced Xm ago" label. Older shapes
   (a plain string, or {label,stale,warn}) still read, so the contract can move
   without stranding either side. */
function askFreshness(a){
  const f = a && a.freshness;
  if (typeof f === 'string') return { label:f, stale:false, warn:'' };
  if (f && !Array.isArray(f) && typeof f === 'object')
    return { label:f.label || '', stale:!!f.stale, warn:f.warn || '' };
  if (Array.isArray(f) && f.length){
    const known = f.filter(x => x && x.freshness && x.freshness !== 'never_run');
    const mins = m => m == null ? '?' : (m >= 120 ? Math.round(m/60) + 'h' : m + 'm');
    const stale = known.filter(x => x.freshness === 'stale');
    if (stale.length){
      const worst = stale.reduce((w,b) => (b.minutes_since_ok||0) > (w.minutes_since_ok||0) ? b : w);
      return { label:`${stale.length} feed${stale.length === 1 ? '' : 's'} behind`, stale:true,
        warn:`The ${worst.label || worst.job} feed last succeeded ${mins(worst.minutes_since_ok)} ago (expected every ${worst.expected_every_minutes}m). This answer is as of its last sync.` };
    }
    if (known.length){
      const m = Math.max(...known.map(x => x.minutes_since_ok || 0));
      return { label:`synced ${m < 1 ? 'just now' : mins(m) + ' ago'}`, stale:false, warn:'' };
    }
  }
  return { label:'', stale:false, warn:'' };
}

function askAnswer(){
  const st = ASK.status;
  if (st === 'idle') return '';
  const asked = `<div class="ask-asked"><div class="badge">Asked</div><div class="q">${esc(ASK.q)}</div></div>`;
  if (st === 'asking') return `${asked}<div class="card ask-card"><div class="ask-working">Reading your numbers…</div></div>`;
  if (st === 'offline' || st === 'refused') {
    return `${asked}<div class="card ask-card ask-no">
      <div class="card-title">No answer<span class="feed-tag none">${st==='offline'?'not switched on':'withheld'}</span></div>
      <div class="ask-nomsg">${esc(ASK.msg)}</div>
      ${/* the where-else-to-look line belongs to a real refusal. Showing it when
            the service is merely unreachable would blame the question for a
            plumbing problem. */''}
      ${st === 'refused' ? `<div class="ask-nosub">The console only knows jobs, appointments, money and effort. For anything else, <b>ask Claude in Dispatch</b>.</div>` : ''}
    </div>`;
  }
  const a = ASK.a || {};
  const badges = (Array.isArray(a.badges) ? a.badges : []).map(b => {
    const k = String(b).toLowerCase();
    const cls = k.includes('qb') ? 'qb' : k.includes('billdu') ? 'billdu' : k.includes('app') ? '' : 'cc';
    return `<span class="feed-tag ${cls}">${esc(String(b))}</span>`;
  }).join('');
  const F = askFreshness(a);
  const head = askHeadline(a);
  /* A low-confidence answer still renders — the rows are real — but it says so
     first, in the caveat slot, so the doubt travels with the number. */
  const caveats = (Array.isArray(a.caveats) ? a.caveats : []).slice();
  if (a.confidence === 'low') caveats.unshift('The model marked this answer LOW confidence — treat it as directional and verify before acting on it.');
  return `${asked}<div class="card ask-card">
    <div class="ask-top">
      <div class="card-title" style="margin:0">${esc(a.scope || 'Answer')}${badges}</div>
      ${F.label ? `<div class="ask-fresh${F.stale?' stale':''}"><span class="dot"></span>${esc(F.label)}</div>` : ''}
    </div>
    ${F.stale ? `<div class="ask-stale">⚠ ${esc(F.warn || 'This feed is behind, so the answer is as of its last sync.')}</div>` : ''}
    ${head ? `<div class="ask-head">${esc(head)}</div>` : ''}
    ${a.subhead ? `<div class="ask-scope">${esc(a.subhead)}</div>` : ''}
    ${askRows(a)}
    ${caveats.map(c=>`<div class="ask-caveat">${esc(c)}</div>`).join('')}
    ${a.sql ? `<div class="chartbox" onclick="toggleBox(this)" style="margin-top:12px">
      <div class="cb-row">Show the math<span class="cb-sum">${a.cost_cents!=null?`${esc(String(a.cost_cents))}¢`:''}</span><span class="acc-chev">›</span></div>
      <div class="cb-body"><pre class="ask-sql">${esc(a.sql)}</pre></div>
    </div>` : ''}
    <div class="ask-ai">AI-computed — verify the big calls</div>
  </div>`;
}

/* ── ATTENTION. Kevin (28 Jul): "attention is like — hey man, leads are slow
   or up, this guy is trending down. Business stuff. Yours is housekeeping."
   Rebuilt 11 Aug on his second pass at it: "this intel board is best of best
   and worst of worst… pressing things are rev hot or cold, builds hot or
   cold, receivables if they are out of control, marketing trends for
   predicting, and then anything cool the data will reveal."

   So the board has four named registers, in that order, and nothing else:
     PRESSING   — revenue, builds, receivables, marketing, each hot/cold
                  against the 1-4 month rhythm, never against last year
     CRUSHING   — best of best, two names, earned on trend or on level
     COOLING    — worst of worst, two names, same test, no failure words
     FOUND      — what the data revealed on its own
   The owner is excluded from every rep read (Kevin, 11 Aug: "Gio is owner,
   don't include any intel on him"). The housekeeping inbox still exists —
   folded at the bottom as Review.

   ── SHAPE, third pass (Kevin, 11 Aug, on seeing it live): "Love the new
   intel it's just taking up way too much space. Shorten nuggets. Maybe small
   teaser and expand for me. Shrink it to about same size as previous version
   took up."

   So every finding is now ONE LINE at rest and opens on tap. Two rules
   learned writing it:
     · the teaser has to stand alone. It is what he actually reads, so it
       always carries the number and the direction — "Pro-Tec booking ▼32%
       vs rhythm" — never a bare label like "Pro-Tec is off" that forces a
       tap to learn anything. The tap is for the WORKING, not the verdict.
     · the section headings are gone. Four rule-topped separators cost more
       height than the rows they introduced, and the kicker on each row
       (REV / A/R / CRUSHING / FOUND) already says which register it is.
   One flat list, ordered pressing → crushing → cooling → found, capped so
   the collapsed card lands about where the old five-row board did. */
const ATTN_SEV = { fire:'fire', watch:'', good:'good', control:'control', find:'find' };
const ATTN_TAG = { fire:'ALARM', watch:'WATCH', good:'UP', control:'CONTROL', find:'FOUND' };
/* A row is a teaser and a body. `short` is required for the row to fold; a
   finding that somehow arrives without one shows its full text rather than
   being silently dropped — an absent nugget is worse than a tall one. */
function attnRow(a, i){
  const tag = a.kicker ? esc(a.kicker) : (ATTN_TAG[a.sev] || 'WATCH');
  const cls = ATTN_SEV[a.sev] || '';
  if (!a.short) return `<div class="ia ${cls} open"><div class="ia-row"><span class="tag">${tag}</span>`
    + `<span class="ia-t">${a.txt}</span></div></div>`;
  return `<div class="ia ${cls}">`
    + `<div class="ia-row" onclick="this.parentNode.classList.toggle('open')">`
    + `<span class="tag">${tag}</span><span class="ia-t">${esc(a.short)}</span>`
    + `<span class="acc-chev">›</span></div>`
    + `<div class="ia-body">${a.txt}</div></div>`;
}
/* Hot or cold in one word, from the rhythm verdict — the same vocabulary on
   every row so "cold" means one thing on this page. */
const RHY_WORD = { hot:'HOT', warm:'WARM', flat:'FLAT', cooling:'COOLING', cold:'COLD', thin:'THIN' };
const RHY_SEV  = { hot:'good', warm:'good', flat:'watch', cooling:'watch', cold:'fire', thin:'watch' };
/* The teaser's own arrow vocabulary: a direction and a number, or the word
   flat. Never a percentage dressed as a verdict when it is inside the band. */
const rhyTick = d => d === null ? 'flat'
  : d >= 8 ? `▲${d}%` : d <= -8 ? `▼${Math.abs(d)}%` : 'flat';
/* ── THE PULSE · WHAT THE VITALS HERO READS FROM IT ──────────────────────────
   The pulse CARD is gone — the vitals hero above replaced it, and the argument
   for the swap is in render(). What survives is everything that card MEASURED
   rather than everything it drew: the five rails are still built by
   buildPulse(), and their sub-vitals, brand cuts, aging buckets and every
   withheld-feed note are rendered inside the hero's expanded cards by the two
   row helpers below. Nothing was summarised on the way across.

   NO NAKED Z WHERE IT CAN BE READ AT A GLANCE. "−2.4" is a number about a
   number; "38% below your normal" is a fact about the business, and Kevin reads
   this at 390px on a phone. The z is the same arithmetic underneath and it
   survives in the tap detail, where a reader who wants the machinery can find
   it — which is now the only place it appears at all. */
const PULSE_BAND_C = { green:'var(--green)', amber:'var(--gold)', red:'var(--red)', none:'var(--text-dim)' };

function pulseWord(z, band){
  if (z === null) return '';
  const dir = z >= 0 ? 'above' : 'below';
  return band === 'green' ? 'in rhythm'
       : band === 'amber' ? `${dir} its rhythm`
       : `far ${dir} its rhythm`;
}
const pulseZ = z => z === null ? '—' : (z >= 0 ? '+' : '−') + Math.abs(z).toFixed(1);

/* THE READ, in English. Inside the band there is no number worth printing —
   "3% above normal" invites a reaction to noise — so it says "in rhythm" and
   stops. Outside it, the distance is stated in the metric's own terms.

   A percentage needs a normal that is not zero, and a week can be a multiple of
   a small normal rather than a percentage of it, so the two ends are handled
   rather than allowed to print Infinity or "1,400%". */
function pulseReadText(r){
  if (!r) return '';
  if (r.speak === 'text') return r.text || '';
  if (r.band === 'green') return 'in rhythm';
  const dir = (r.z != null ? r.z : 0) >= 0 ? 'above' : 'below';
  /* BACKLOG AGE GETS WORDS, NOT A NUMBER, and that is a correction rather than a
     shortcut. Its value is a rolling window over a series that is ITSELF a
     7-day difference, so the figure is a sum of overlapping deltas — it printed
     as "74.0 days above your normal", which a reader can only take to mean the
     backlog got 74 days older in a week. It does not mean that, and no honest
     rewording of that quantity fits on a rail. A percentage is no better: the
     normal it would divide by is a movement centred on zero. What the number
     genuinely establishes is a DIRECTION and that the direction is unusual, so
     that is exactly what it says, and the drill below carries the arithmetic. */
  if (r.speak === 'drift')
    return dir === 'above' ? 'aging faster than normal' : 'clearing faster than normal';
  const n = Number(r.norm), v = Number(r.value);
  if (!isFinite(n) || !isFinite(v) || n <= 0) return `${dir} your normal`;
  const ratio = v / n;
  if (ratio >= 5) return `${(ratio).toFixed(1)}× your normal`;
  const pct = Math.round(Math.abs(ratio - 1) * 100);
  return `${pct}% ${dir} your normal`;
}

/* Two kinds of sub-vital share this row, and they must not be made to look
   alike. A z-scored one reads "how unusual is this against our own history"; a
   threshold one reads "did this clear a line Kevin drew". Printing a z beside a
   number that was never z-scored would invent a precision the second kind does
   not have, so a threshold sub shows its measured value and its word, and no z
   at all. */
function pulseSubRow(s){
  const val = !s.live ? '' : s.unit === '$' ? short(s.value)
    : s.unit === 'd' ? (s.value >= 0 ? '+' : '−') + Math.abs(s.value).toFixed(1) + ' days'
    : Math.round(s.value);
  /* THE TAP DETAIL IS WHERE THE Z LIVES. It is banished from the rails because a
     deviation score is a number about a number, and the rail has one job: be
     read at a glance. Down here the reader has already asked for the machinery,
     so the plain read leads and the z follows it in the dim line as `z −2.4`,
     labelled, never floating on its own where it could be mistaken for the
     measurement itself. */
  const live = s.kind === 'band'
    ? `<span class="pd-sub-z" style="color:${PULSE_BAND_C[s.band]}">${esc(s.wordText)}</span>
       <span class="pd-sub-v">${esc(s.readUnit || s.valText)}</span>`
    : `<span class="pd-sub-z" style="color:${PULSE_BAND_C[s.band]}">${esc(pulseReadText(pulseReadOf(s)))}</span>
       <span class="pd-sub-v">${val} over 7 days · ${pulseWord(s.z, s.band)} · z ${pulseZ(s.z)}</span>`;
  return `<div class="pd-sub${s.live ? '' : ' off'}">
    <div class="pd-sub-h">
      <span class="pd-sub-n">${esc(s.name)}</span>
      ${s.live ? live : `<span class="pd-wire">WIRING UP</span>`}
    </div>
    ${s.note ? `<div class="pd-sub-note">${s.note}</div>` : ''}
  </div>`;
}

function pulseBrandRow(b){
  return `<div class="pd-brand${b.live ? '' : ' off'}">
    <span class="pd-dot" style="background:${b.colour}"></span>
    <span class="pd-brand-n">${esc(b.name)}</span>
    ${b.live ? `<span class="pd-brand-z" style="color:${PULSE_BAND_C[b.band]}">${esc(pulseReadText(pulseReadOf(b)))}</span>
                <span class="pd-brand-v">${short(b.value)} over 7 days · z ${pulseZ(b.z)}</span>`
             : `<span class="pd-wire">no history yet</span>`}
  </div>`;
}

/* ══ THE VITALS HERO · THE READING ═══════════════════════════════════════════
   Measurements come from buildVitals(); thresholds come from VIT at the top of
   the file. This layer does one thing: turn a measurement into a state, a
   shape and a sentence. Nothing here holds a number KD would want to retune.

   THE HEAT MAP IS ONE-SIDED. GREEN is healthy, YELLOW is watch, RED is a
   problem — a goodness scale, not the pulse card's two-sided "unusualness"
   band. A week 40% ABOVE the median does not light up beside a week 40% below
   it, because those two facts do not mean the same thing to the man reading
   this at 6am on a phone.

   A DEAD FEED IS GREY AND SAYS SO. Every vital that cannot be measured draws a
   flat grey hairline and wears a chip naming what is missing. Nothing here is
   allowed to render a calm green over a feed nobody has wired — that is the
   one failure this whole console exists to refuse. */
let VITOPEN = null;   // which vital is expanded; one at a time, remembered across renders

const vitMed = a => { const c = (a || []).filter(v => v != null && isFinite(v));
  return c.length ? pMedian(c) : null; };

/* Badness → the state, and the 0–1 distance the master blends. Badness is
   clipped at zero (better than healthy is not a degree of health) and at the
   problem line (twice as bad as a problem is still one problem — otherwise a
   single blown vital could drag a blended master through the floor on its
   own). */
function vitState(bad, cfg){
  if (bad == null || !isFinite(bad)) return { band:'dark', dist:null };
  const b = Math.max(0, bad);
  return { band: b < cfg.watch ? 'green' : b < cfg.problem ? 'yellow' : 'red',
           dist: Math.min(1, b / cfg.problem) };
}
const VIT_WORD = { green:'healthy', yellow:'watch this', red:'problem', dark:'no feed' };

/* The flat hairline. Grey means unmeasured; a coloured one means the state is
   known but there is no history to draw a shape from — two different facts
   that must not wear one mark. */
const vitFlat = (c) => `<svg class="vit-flat" viewBox="0 0 64 22" preserveAspectRatio="none" aria-hidden="true">
  <line x1="1" y1="11" x2="63" y2="11"${c ? ` style="stroke:${c};stroke-opacity:.55"` : ''}/></svg>`;

/* One trace, drawn in the EKG language every other trace on this page uses:
   the actual on top, the trailing median under it as the gold dashed
   reference, a lit dot on the latest point. `ref` may be null — see ekgSpark. */
function vitTrace(v, { id, w, h, mini }){
  const pts = (v.series || []).filter(x => x != null && isFinite(x));
  if (pts.length < 2) return vitFlat(v.band === 'dark' ? null : VIT_C[v.band]);
  return ekgSpark(pts.map(x => ({ v: x, t: v.ref })),
    { id, w, h, mini, color: VIT_C[v.band], glow: VIT_C[v.band] });
}

/* ── MARKETING ───────────────────────────────────────────────────────────────
   Blended dollars back per $1: the month's signed dollars over the month's
   WHOLE typed spend book — the same divisor the ROI board's headline uses, so
   the hero and the board cannot quote two different books.

   MEASURED ON CLOSED MONTHS, AND IT SAYS SO ON THE CARD. Spend is typed at
   month close, one grain per month; the month in progress has no row until the
   office keys it. A weekly ratio would need a weekly denominator that does not
   exist, and inventing one by spreading a monthly total across days would put
   a smooth fake under a real numerator — the flattering number this board has
   refused since the cost-ratio sub-vital was first held. Windsor's daily
   google_ads_daily is NOT used here: it is a pacing signal, demoted from all
   money math by the 170/171 ruling after undercounting July by half. */
function vitMarketing(){
  const V = D.vitals;
  const base = { key:'marketing', tag:'MKT', name:'MARKETING',
                 label:'what a marketing dollar brings back', grain:'closed months' };
  if (!MKT || !Array.isArray(MKT.spend))
    return { ...base, live:false, band:'dark', dist:null, series:[], ref:null,
      chip: MKT_LOADING || !MKT ? 'spend loading' : 'feed dark',
      read: MKT_LOADING || !MKT ? 'the spend book has not answered yet' : 'no spend book to read',
      why: 'The typed spend book (<code>marketing_spend</code>) has not answered. It is fetched after first paint so a missing migration can never block this page — while it is in flight this tile says <b>spend loading</b>, and if it settles on <b>feed dark</b> the table is unreadable rather than empty.' };

  const priced = V.months.map(m => ({ ...m, spend: mkBookTotal(m.key) }))
    .map(m => ({ ...m, roi: (m.spend && m.spend > 0) ? m.signed / m.spend : null }))
    .filter(m => m.roi != null);
  if (!priced.length)
    return { ...base, live:false, band:'dark', dist:null, series:[], ref:null, chip:'feed dark',
      read:'no closed month has been keyed yet',
      why:'Not one of the last nine closed months carries a typed spend row, so there is no denominator to divide by. This is a data-entry state, not a costless one — a source with no cost recorded is not a free source.' };

  const cur = priced[priced.length - 1];
  const prior = priced.slice(0, -1).map(m => m.roi);
  const ref = prior.length >= VIT.minMonths ? vitMed(prior) : null;
  /* Two shortfalls, and the worse one wins: against the trailing median, and
     against KD's $10 line. The floor is here for the same reason days-out has
     one — a business that has spent a year under the line has a median under
     the line, and scoring against that alone would call a chronic problem
     normal. */
  const badMed   = ref ? Math.max(0, 1 - cur.roi / ref) : null;
  const badFloor = Math.max(0, 1 - cur.roi / VIT.marketing.floor);
  const bad = badMed == null ? badFloor : Math.max(badMed, badFloor);
  const st = vitState(bad, VIT.marketing);
  const under = cur.roi < VIT.marketing.floor;
  const read = under
    ? `$${cur.roi.toFixed(2)} back per $1 — under your $${VIT.marketing.floor} line`
    : ref && cur.roi < ref
      ? `$${cur.roi.toFixed(2)} back per $1 — ${Math.round((1 - cur.roi/ref) * 100)}% under your median month`
      : `$${cur.roi.toFixed(2)} back per $1 — clear of your $${VIT.marketing.floor} line`;
  return { ...base, live:true, band:st.band, dist:st.dist,
    series: priced.map(m => m.roi), ref, read, cur, priced,
    /* MARKETING IS NOT IN THE MASTER, and the master says so: its newest
       reading is a closed month old, so blending it into a weekly line would
       mix two clocks. It colours its own tile and stops there. */
    inMaster: false,
    refNote: ref
      ? `median of the ${prior.length} closed month${prior.length === 1 ? '' : 's'} before it`
      : `no median claimed — ${prior.length} closed month${prior.length === 1 ? '' : 's'} behind it, and this hero wants ${VIT.minMonths}`,
    keys: [
      { k: `${cur.label} · back per $1`, v: `$${cur.roi.toFixed(2)}` },
      { k: 'spend book', v: short(cur.spend) },
      { k: 'signed', v: short(cur.signed) },
    ] };
}

/* ── SALES ───────────────────────────────────────────────────────────────────
   Signed dollars in the last seven complete days against the median of the
   eight complete weeks before them. The same jobs, the same amount column and
   the same signing date every money tile on this page counts. */
function vitSales(){
  const V = D.vitals, s = V.sales.series, N = VIT.weeks;
  const cur = s[N], ref = vitMed(s.slice(0, N));
  if (!ref || !(ref > 0))
    return { key:'sales', tag:'SLS', name:'SALES', label:'signed dollars a week',
      live:false, band:'dark', dist:null, series:[], ref:null, chip:'feed dark',
      read:'no trailing weeks to compare against',
      why:'Fewer than eight complete weeks of signings sit behind this window, so there is no median worth drawing a line at.' };
  const bad = Math.max(0, 1 - cur / ref);
  const st = vitState(bad, VIT.sales);
  const gap = Math.round((cur / ref - 1) * 100);
  return { key:'sales', tag:'SLS', name:'SALES', label:'signed dollars a week',
    grain:'weeks', live:true, band:st.band, dist:st.dist, series:s, ref, inMaster:true,
    read: `${short(cur)} signed, ${gap === 0 ? 'level with' : gap > 0 ? `${gap}% above` : `${Math.abs(gap)}% below`} your 8-week median`,
    refNote:'median of your last 8 complete weeks',
    keys: [
      { k:'last 7 days', v: short(cur) },
      { k:'8-week median', v: short(ref) },
      { k:'gap', v: `${gap > 0 ? '+' : gap < 0 ? '−' : ''}${Math.abs(gap)}%` },
    ] };
}

/* ── PRODUCTION ──────────────────────────────────────────────────────────────
   The share of the open backlog that has gone stale — signed, not completed,
   and older than the stall line — against the median of that same share over
   the eight weeks before. Reconstructed exactly: both dates are stamped, so
   the open set on any past day is a fact, not an inference.

   POINTS, NOT PERCENT OF THE MEDIAN. See VIT.production for why. */
function vitProduction(){
  const V = D.vitals, s = V.production.series, N = VIT.weeks, o = V.production.now;
  const cur = s[N], ref = vitMed(s.slice(0, N));
  if (cur == null || ref == null)
    return { key:'production', tag:'PRD', name:'PRODUCTION', label:'how much of the backlog has stalled',
      live:false, band:'dark', dist:null, series:[], ref:null, chip:'feed dark',
      read:'no open backlog to age',
      why:'No job is both signed and unfinished across these weeks, so there is no backlog whose age could be measured.' };
  const bad = cur - ref;                       // percentage points off its own median
  const st = vitState(bad, VIT.production);
  const d = Math.round(cur - ref);
  return { key:'production', tag:'PRD', name:'PRODUCTION', label:'how much of the backlog has stalled',
    grain:'weeks', live:true, band:st.band, dist:st.dist, series:s, ref, inMaster:true,
    read: `${Math.round(cur)}% of the open book is past ${VIT.production.stallDays} days — ${
      d === 0 ? 'level with' : d > 0 ? `${d} points above` : `${Math.abs(d)} points below`} its 8-week median`,
    refNote:'median of your last 8 complete weeks',
    keys: [
      { k:`past ${VIT.production.stallDays} days`, v:`${Math.round(cur)}%` },
      { k:`past ${VIT.production.deepDays} days`, v:`${o.n ? Math.round(100 * o.deep / o.n) : 0}%` },
      { k:'open jobs', v:String(o.n) },
    ] };
}

/* ── MONEY ───────────────────────────────────────────────────────────────────
   The dollar-weighted mean age of every open balance, against a fixed band.

   A FIXED BAND, NOT A TRAILING MEDIAN, on two counts. Receivables age in one
   direction, so a book that has always sat at 70 days would score its own
   worst habit as perfectly normal — the same argument that gave days-out a
   hand-set target. And the history is not there to build a median from anyway:
   QuickBooks hands us a balance with no date attached, so an invoice paid last
   Tuesday is simply absent from today's snapshot. Rebuilding prior weeks out
   of the invoices still open now would drop every fast payer, flatter the past
   and make creep read LOW — a false all-clear, which is worse than no line. */
function vitMoney(){
  const M = D.vitals.money;
  if (M.meanAge == null || !M.n)
    return { key:'money', tag:'MNY', name:'MONEY', label:'how old the money owed to you is',
      live:false, band:'dark', dist:null, series:[], ref:null, chip:'feed dark',
      read: qbOK() ? 'no open balance on the book' : 'QuickBooks is not readable',
      why: qbOK()
        ? 'Every invoice QuickBooks holds is settled, so there is no open balance to age.'
        : esc(String((D.qb && D.qb.reason) || 'qb_invoices did not answer.')) };
  const bad = M.meanAge - VIT.money.good;
  const st = vitState(bad, { watch: VIT.money.watch - VIT.money.good,
                             problem: VIT.money.problem - VIT.money.good });
  const old = M.aging.filter(a => a.label === '60–90' || a.label === 'over 90')
    .reduce((n, a) => n + a.v, 0);
  return { key:'money', tag:'MNY', name:'MONEY', label:'how old the money owed to you is',
    grain:'a snapshot, aged from the invoice date', live:true, band:st.band, dist:st.dist,
    /* NO LINE, A PROFILE. There is no weekly history to draw (see above), so
       the shape is the open book itself split by age — four real amounts on a
       shared floor, heavy on the right exactly when the money is old. It
       pictures the very thing that decides the colour, which a borrowed
       invoiced-dollars line would not. */
    profile: M.aging, series: [], ref: null, inMaster: false,
    read: `${Math.round(M.meanAge)} days is the average age of ${short(M.openTotal)} owed to you`,
    refNote:`your line: green to ${VIT.money.good} days, watch to ${VIT.money.watch}, problem past ${VIT.money.problem}`,
    keys: [
      { k:'mean age', v:`${Math.round(M.meanAge)}d` },
      { k:'open balance', v: short(M.openTotal) },
      { k:'past 60 days', v: M.openTotal > 0 ? `${Math.round(100 * old / M.openTotal)}%` : '0%' },
    ] };
}

/* ── THE MASTER ──────────────────────────────────────────────────────────────
   THE BUSINESS as one heartbeat, on a 0–100 health scale: 100 is every
   blended vital sitting at or better than healthy, 0 is every one of them at
   or past its problem line.

   IT BLENDS DISTANCES, NOT DEVIATIONS, and that is the fix this rebuild
   carries. The composite it replaces averaged signed z-scores, so signings far
   down and backlog far up cancelled to something that looked perfectly calm —
   it once read "in rhythm" in green with red rails directly beneath it, and
   the card had to grow a sentence apologising for its own arithmetic. A mean
   of distances cannot cancel: two vitals in trouble in opposite directions are
   two vitals in trouble.

   ONE ROSTER, STATED. Only vitals with a value in EVERY weekly slot are in the
   line, so the line never quietly changes what it is a mean of partway along.
   Marketing (closed months) and money (a snapshot) are not in it today, they
   are named under it, and they join automatically the day their feeds carry a
   week-by-week history. */
function vitMaster(list){
  const N = VIT.weeks;
  /* Each roster vital's badness is re-measured per week by the rule its own
     tile uses, so the line and the number are one arithmetic. A vital with no
     entry here cannot be blended however live it is — a new vital joins this
     line by being given a rule, never by being given a flag. */
  const cfgOf = { sales: VIT.sales, production: VIT.production };
  const badAt = (v, i) => v.key === 'production' ? v.series[i] - v.ref
    : Math.max(0, 1 - v.series[i] / v.ref);
  const roster = list.filter(v => v.inMaster && v.live && cfgOf[v.key] && v.ref && v.series
    && v.series.length === N + 1 && v.series.every(x => x != null && isFinite(x)));
  const out = { key:'master', name:'THE BUSINESS', roster, series: [], ref: null };
  if (roster.length < 2)
    return { ...out, live:false, band:'dark', chip:'feed dark',
      read:'not enough weekly vitals to blend',
      note:`A blended line wants at least two vitals with a full week-by-week history. ${
        roster.length ? 'Only one has one' : 'None has one'} right now, so nothing is drawn — a line over one vital would just be that vital wearing a bigger name.` };

  /* Measured against the SAME reference the tile uses, so the dashed median
     under this line means exactly what the tiles mean. */
  const series = [];
  for (let i = 0; i <= N; i++){
    const d = roster.map(v => vitState(badAt(v, i), cfgOf[v.key]).dist).filter(x => x != null);
    series.push(d.length === roster.length ? 100 * (1 - d.reduce((a,b) => a+b, 0) / d.length) : null);
  }
  const health = series[N], ref = vitMed(series.slice(0, N));
  const band = health >= VIT.master.watch ? 'green'
             : health >= VIT.master.problem ? 'yellow' : 'red';
  const off = roster.filter(v => v.band !== 'green');
  return { ...out, live:true, band, series, ref, health,
    read: band === 'green' ? 'in rhythm'
      : off.length ? `${off.map(v => v.name.toLowerCase()).join(' and ')} off rhythm`
      : 'off its rhythm',
    note: (() => {
      const out = list.filter(v => !v.inMaster);
      const why = v => v.key === 'marketing'
        ? 'a closed-month reading — spend is typed at month close'
        : 'a snapshot with no payment feed behind it';
      const cap = a => a.map(v => v.name.charAt(0) + v.name.slice(1).toLowerCase());
      return `Blended from <b>${cap(roster).join(' and ')}</b> — the ${
        roster.length === 2 ? 'two vitals' : roster.length === 1 ? 'one vital' : `${roster.length} vitals`
        } with a week-by-week history.${out.length ? ` ${
        out.map(v => `${cap([v])[0]} is ${why(v)}`).join(', and ')}, so ${
        out.length === 1 ? 'it carries its own tile and is' : 'they carry their own tiles and are'
        } not in this line.` : ''}`;
    })() };
}

/* ── DRAWN ───────────────────────────────────────────────────────────────── */
function vitMicroHtml(v){

/* The expanded card. Same shape as the console's heartbeat cards: the full
   trace with its median reference, the key strip, then the flags — which are

function vitPanelHtml(v){
  const c = VIT_C[v.band];

  const src = P.filter(p => (v.key === 'money' ? ['collections','payables'] : [v.key]).includes(p.key));
  /* THE MASTER DRAWS NO TRACE DOWN HERE. Its heartbeat is already the largest
     thing on the screen two inches above, and a second copy of the same line

     padding. What the drawer owes them is the roster and the keys. */
  const big = v.noTrace ? ''
    : v.profile
      ? rhythmBars(v.profile.map(a => ({ label: a.label.replace(' days',''),
          v: Math.round(a.v), num: short(a.v) })), { w:280, h:62, refDash:false, color: c })
      : vitTrace(v, { id:`vit-${v.key}-big`, w:280, h:48 });
  const flags = src.map(p => [

    (p.subs || []).map(pulseSubRow).join(''),
    p.brands && p.brands.length
      ? `<div class="pd-h">Which brand</div>${p.brands.map(pulseBrandRow).join('')}` : '',
    p.aging && p.aging.length
      ? `<div class="pd-h">Which aging bucket · open balance, aged from the invoice date</div>
         ${p.aging.map(a => `<div class="pd-brand"><span class="pd-brand-n">${esc(a.label)}</span>
           <span class="pd-brand-z">${short(a.v)}</span>
           <span class="pd-brand-v">${a.n} invoice${a.n === 1 ? '' : 's'}</span></div>`).join('')}` : '',
  ].join('')).join('');
  return `<div class="vit-panel${VITOPEN === v.key ? ' open' : ''}" id="vitp-${v.key}">
    <div class="vit-panel-in"><div class="vit-body">
      <div class="vit-b-head">
        <span class="vit-b-name" style="color:${c}">${esc(v.name)}</span>
        <span class="vit-b-read" style="color:${c}">${esc(VIT_WORD[v.band])}</span>
      </div>
      <div class="vit-b-label">${esc(v.label)}</div>
      ${v.read ? `<div class="vit-b-say" style="color:${v.live ? c : 'var(--text-dim)'}">${esc(v.read)}</div>` : ''}
      ${big ? `<div class="ekg-wrap">${big}<div class="ekg-cap">${esc(v.grain || '')}${
        v.refNote ? `<span class="ekg-cap-ref">${v.profile ? '' : '╌╌ '}${esc(v.refNote)}</span>` : ''}</div></div>` : ''}
      ${v.live && v.keys && v.keys.length ? `<div class="vit-keys">${v.keys.map(k =>
        `<div class="vit-key"><div class="k">${esc(k.k)}</div><div class="v">${esc(k.v)}</div></div>`).join('')}</div>` : ''}
      ${v.why ? `<div class="pd-why">${v.why}</div>` : ''}
      ${flags}
    </div></div>
  </div>`;
}

/* One open at a time, and no re-render: the panels are already in the DOM, so
   a tap is a class toggle. VITOPEN survives a full redraw of the page. */
function vitOpen(k){
  const was = VITOPEN === k;
  VITOPEN = was ? null : k;
  document.querySelectorAll('.vit-panel').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('[data-vit]').forEach(el => {
    el.classList.remove('on'); el.setAttribute('aria-expanded', 'false'); });
  if (was) return;
  const p = document.getElementById('vitp-' + k); if (p) p.classList.add('open');
  const t = document.getElementById('vitm-' + k);
  if (t){ t.classList.add('on'); t.setAttribute('aria-expanded', 'true'); }
}

/* The board's row selection, separated from its drawing: the section rail's
   Flags badge counts these same rows, and a badge computed by a second walk of
   the registers would eventually disagree with the board it advertises. */
function attnRows(){
  const R = D.rhythm, BW = D.bestWorst, DISC = D.discoveries || [];
  const pressing = [], found = [];

  if (R) {
    const C = R.company;
    /* Kevin's phrase, verbatim in shape: "marketing is up compared to this
       time last month / flat vs last 2 etc." All three reads live in the
       BODY now — the useful fact is usually which of them disagree, and that
       is exactly the kind of thing worth a tap rather than a glance. */
    const line = (r, unit) => r.thin ? 'no rhythm behind it yet'
      : [ r.d1 !== null ? `${r.d1 >= 8 ? 'up ' + r.d1 + '%' : r.d1 <= -8 ? 'down ' + Math.abs(r.d1) + '%' : 'flat'} vs last month` : null,
          r.d2 !== null ? `${r.d2 >= 8 ? 'up ' + r.d2 + '%' : r.d2 <= -8 ? 'down ' + Math.abs(r.d2) + '%' : 'flat'} vs the last 2` : null,
          r.d4 !== null ? `<b>${r.d4 >= 8 ? 'up ' + r.d4 + '%' : r.d4 <= -8 ? 'down ' + Math.abs(r.d4) + '%' : 'flat'} vs the 4-month rhythm</b>` : null,
        ].filter(Boolean).join(' · ');

    // 1. REVENUE, hot or cold.
    if (!C.rev.thin) pressing.push({ ord: 0, sev: RHY_SEV[C.rev.verdict], kicker: 'REV ' + RHY_WORD[C.rev.verdict],
      short: `${short(C.rev.now)} signed in 30 days · ${rhyTick(C.rev.d4)} vs rhythm`,
      txt: `<b>${short(C.rev.now)} signed in the last 30 days</b> against ${short(Math.round(C.rev.b4))} a month across the rhythm — ${line(C.rev)}${C.rev.shape === 'climbing' ? ' · up in every one of the four months' : C.rev.shape === 'sliding' ? ' · down in every one of the four months' : ''}.` });

    // 2. BUILDS, hot or cold — production first, billing alongside it.
    if (!C.built.thin) pressing.push({ ord: 1, sev: RHY_SEV[C.built.verdict], kicker: 'BUILDS ' + RHY_WORD[C.built.verdict],
      short: `${short(C.built.now)} built in 30 days · ${rhyTick(C.built.d4)} vs rhythm`,
      txt: `<b>${short(C.built.now)} of work completed in the last 30 days</b> against ${short(Math.round(C.built.b4))} a month — ${line(C.built)}.${C.inv && !C.inv.thin ? ` QuickBooks billed ${short(C.inv.now)} over the same 30 (${line(C.inv)}).` : ''}` });

    // 3. RECEIVABLES — only when there is something to say about control.
    if (R.ar && R.ar.months !== null && R.ar.verdict !== 'clean') {
      const m = R.ar.months, out = R.ar.verdict === 'out-of-control';
      pressing.push({ ord: 2, sev: out ? 'fire' : 'watch', kicker: out ? 'A/R LOOSE' : 'A/R',
        short: `${short(R.ar.total)} open · ${m.toFixed(1)} months of billing out`,
        txt: `<b>${short(R.ar.total)} open across ${R.ar.open} invoice${R.ar.open === 1 ? '' : 's'}</b> — ${m.toFixed(1)} months of billing outstanding against a ${short(Math.round(R.ar.monthly))} average month. ${out ? 'That is out of control by this business’s own rhythm: a collections pass, oldest and largest first, is the highest-return hour this week.' : 'Worth a pass before it becomes the story.'}` });
    }

    /* 4. MARKETING — the predicting register, per trade, plus the control.
       Sorted WORST FIRST and capped, because the trade that is cold is the
       reason he opened the page and two trades running hot must never push it
       off the bottom of a short board. (It did, on the first cut of this.) */
    const SEV_RANK = { fire:0, watch:1, control:2, good:3 };
    const mkt = [];
    for (const p of R.predict) mkt.push({ sev: p.sev, kicker: 'MARKETING', short: p.short, txt: p.txt });
    for (const b of R.brands) for (const f of b.flags)
      if (!R.predict.some(p => p.brand === b.s))
        mkt.push({ sev: f.sev, kicker: 'MARKETING', short: f.short, txt: `<b>${esc(b.s)}:</b> ${f.txt}` });
    if (R.control) mkt.push({ sev:'control', kicker:'CONTROL', short: R.controlShort, txt: R.control });
    /* When no trade earns a flag the marketing register still reports, because
       "demand is steady" is an answer he came here for, not an empty slot. */
    if (!mkt.length && !C.set.thin)
      mkt.push({ sev: RHY_SEV[C.set.verdict], kicker: 'MARKETING ' + RHY_WORD[C.set.verdict],
        short: `${C.set.now} appointments set in 30 days · ${rhyTick(C.set.d4)} vs rhythm`,
        txt: `<b>${C.set.now} appointments set in the last 30 days</b> against ${Math.round(C.set.b4)} a month — ${line(C.set)}. No trade is off its own rhythm far enough to call.` });
    mkt.sort((a, b) => (SEV_RANK[a.sev] ?? 9) - (SEV_RANK[b.sev] ?? 9));
    pressing.push(...mkt.slice(0, 2).map((m, i) => ({ ...m, ord: 3 + i * 0.1 })));
  }

  const repRow = (r, up) => {
    const lvl = r.why === 'level';
    const mo = r.momentum === null ? null : Math.abs(r.momentum);
    return { sev: up ? 'good' : 'watch', kicker: up ? 'CRUSHING' : 'COOLING',
      short: `${r.name} · ${lvl ? `${r.d30.close}% close, 30 days` : `${up ? '▲' : '▼'}${mo} pts on their own baseline`}${r.money ? ` · ${short(r.money)}` : ''}`,
      txt: `<b>${esc(r.name)}</b> ${up
        ? (lvl ? `is closing <b>${r.d30.close}%</b> flat out over 30 days (${r.d30.signed}/${r.d30.appts})`
               : `is <b>${mo} points above their own 60-day baseline</b> — 2-wk close ${r.w2.close}% vs ${r.d60.close}% (${r.w2.signed}/${r.w2.appts} in the fortnight)`)
        : (lvl ? `is closing ${r.d30.close}% over 30 days (${r.d30.signed}/${r.d30.appts}) — the lowest on the floor with a real sample`
               : `has cooled <b>${mo} points off their own 60-day baseline</b> — 2-wk close ${r.w2.close}% vs ${r.d60.close}% (${r.w2.signed}/${r.w2.appts} in the fortnight)`)}${r.money ? ` · ${short(r.money)} signed in 30 days` : ''}. <span class="tapname" onclick="event.stopPropagation();openRep('${esc(String(r.id))}')">One-pager ›</span>` };
  };
  const best = BW ? BW.best.map(r => ({ ...repRow(r, true), ord: 4 })) : [];
  const worst = BW ? BW.worst.map(r => ({ ...repRow(r, false), ord: 5 })) : [];
  for (const d of DISC.slice(0, 2)) found.push({ ord: 6, sev:'find', kicker:'FOUND', short: d.short, txt: d.txt });

  /* ── THE ROW BUDGET. Nine folded rows at ~27px is ~243px, which is the
     ~245px the old five-row board occupied — that is the whole size ruling
     and it is a HARD cap, not a target.

     Filling it first-come would spend the budget on whatever happened to be
     computed first and starve the registers at the end of the list; the first
     cut of this did exactly that and pushed FOUND off the board entirely. So
     every register gets a GUARANTEED slot before any register gets a second:
     revenue, builds, A/R and the single worst marketing read, then up to two
     crushing and two cooling, then one finding. That is 9 exactly. Only if a
     register had nothing to say (A/R clean, say) does the leftover go to a
     runner-up — the second marketing read first, then a second finding.
     Display order is Kevin's order, restored by `ord` after selection. */
  const CAP = 9;
  const mktRows = pressing.filter(r => r.ord >= 3).sort((a, b) => a.ord - b.ord);
  const core = pressing.filter(r => r.ord < 3);
  const chosen = [];
  const take1 = r => { if (r && chosen.length < CAP) chosen.push(r); };
  core.forEach(take1);
  take1(mktRows[0]);
  best.forEach(take1);
  worst.forEach(take1);
  take1(found[0]);
  take1(mktRows[1]);
  take1(found[1]);
  return chosen.sort((a, b) => (a.ord ?? 9) - (b.ord ?? 9));
}

function cardAttention(){
  const rows = attnRows();
  /* `lead` is the headline scale. The board sits second on the page now — under
     the ask box, above the money — so it is set to be read, not scanned past. */
  return `<div class="card attn lead">
    <div class="card-title">Attention<span class="feed-tag cc">tap any line for the working</span></div>
    ${rows.length ? rows.map(attnRow).join('')
      : '<div class="nofires" style="margin-top:10px">Nothing off its rhythm — revenue, builds, receivables and bookings are all inside the range of the last four months.</div>'}
  </div>`;
}

  return `<div class="card">

function cardActions(){
  const S = D.signals; if (!S) return '';
  const RANK = { fire:0, watch:1, note:2 };
  const live = (S.list||[]).filter(s => !isCleared(s))
                           .sort((a,b) => (RANK[a.sev]??9) - (RANK[b.sev]??9));
  const fires = live.filter(s=>s.sev==='fire').length;
  const watches = live.filter(s=>s.sev==='watch').length;
  const clearedN = Object.keys(CLEARED).length;
  const headline = fires ? `${fires} to act on` : watches ? `${watches} to watch`
                 : live.length ? `${live.length} to review` : 'all clear';
  /* Gmail's shape: the summary card first, then the inbox. Nothing is expanded
     at rest — the digest carries the meaning, the rows carry the list, and the
     bodies wait behind a tap. */
  return `<div class="card full acts ${fires?'hasfire':watches?'haswatch':'clear'}">
    <div class="card-title">What needs you<span class="feed-tag ${fires?'':'none'}">${esc(headline)}</span></div>

    ${live.length ? `<div class="digest">${esc(signalDigest(live))}</div>` : ''}

    ${/* one flat inbox, but the chores still label themselves — that grouping
          told him which of these are concerns and which are housekeeping, and
          it costs one small line to keep */''}
    ${live.length ? live.filter(s=>s.sev!=='note').map(s=>sigRow(s)).join('')
        + (live.some(s=>s.sev==='note')
            ? `<div class="sig-sep">Worth doing when there's time</div>`
              + live.filter(s=>s.sev==='note').map(s=>sigRow(s)).join('')
            : '')
      : `<div class="nofires">${clearedN
          ? 'Board clear — everything raised has been ticked off.'
          : 'Nothing is off today. Bookings, pipeline and money are all inside their normal range.'}</div>`}

    ${clearedN ? `<div class="clearedrow" title="${esc(Object.values(CLEARED).map(c=>`${c.by} · ${new Date(c.at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}`).join(' | '))}">
      <span class="cl-tick">✓</span> ${clearedN} cleared · logged with who and when
      <button class="undo" onclick="restoreCleared()">bring back</button></div>` : ''}
  </div>`;
}
/* ═══ PER-WINDOW DEEP DIVE ══════════════════════════════════════════════════
   One window, examined properly: its total and pace, its own trend at its own
   resolution, the brand split, the like-for-like comparison, and who signed it.
   ═════════════════════════════════════════════════════════════════════════ */
const DIVE_TITLE = { day:'Today', week:'This week', month:'This month', ytd:'Year to date' };
/* Time-machine-aware dive titles: the month dive is titled by the month it
   actually shows. diveLow is the mid-sentence form — a month NAME stays
   capitalised ("Signed · July"), the relative labels lowercase as before. */
const diveTitle = k => (k === 'month' && MONTHOFF) ? D.windows.month.label : DIVE_TITLE[k];
const diveLow = k => (k === 'month' && MONTHOFF) ? D.windows.month.label : DIVE_TITLE[k].toLowerCase();
const DIVE_SERIES = { day:'daily', week:'daily', month:'weeks', ytd:'monthly' };
const DIVE_SERIES_LABEL = { day:'Last 14 days', week:'Last 14 days', month:'Last 3 weeks', ytd:'Last 13 months' };

/* A brand chip in each job's own colour — the console's brand palette, so Eric's
   fence row and his Oasis row read as two different colours at a glance. A job
   whose company has not resolved to a known brand gets the neutral "awaiting
   sync" chip rather than being coloured as a guess. */
function brandChip(brandId, resolved){
  if (resolved === false) return `<span class="bchip await"><span class="bdot" style="background:#8aa094"></span>awaiting sync</span>`;
  const m = brandOf(brandId);
  return `<span class="bchip" style="color:${m.c};border-color:${m.c}55"><span class="bdot" style="background:${m.c}"></span>${esc(m.s)}</span>`;
}

/* The job rows that live UNDER a rep or a brand, revealed when its row is tapped.
   Under a rep, each row shows its own brand chip (the whole point — Eric's fence
   and his Oasis job read as two colours); under a brand, it shows the rep who
   sold it instead. Everything else — customer, amount, source tag, the +N cap —
   is identical either way, so the two accordions stay honest in the same terms. */
/* Rows only, no wrapper — the caller owns the container, because these are now
   built ON OPEN rather than pre-rendered hidden. Pre-rendering every rep's
   hundred jobs put 10,655 nodes and 1.7 seconds into the year-to-date drill-in;
   the depth is the same, it just arrives when the door is opened. */
/* "2026-08-13" -> "Wed Aug 13". The day a deal closed, small enough for the
   meta line, unambiguous enough to answer "what closed on the thirteenth?"
   (Kevin, 14 Aug — the Traci Hackman hunt). */
function dayLbl(at){
  if (!at) return '';
  const [y,m,d] = at.split('-').map(Number);
  if (!y || !m || !d) return '';
  const dt = new Date(y, m-1, d);
  return `${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]} ${MNAMES[m-1].slice(0,3)} ${d}`;
}

function jobRowsHtml(list, count, rest, { showBrand = true, showRep = false, byDate = false } = {}){
  if (!list || !list.length) return `<div class="acc-empty">No itemised jobs in this window.</div>`;
  /* byDate: newest first, the day dividing the list the way a ledger would —
     Kevin, 14 Aug: "the jobs sold should be in date sequential order… you
     should be able to see the day that it closed." Everywhere else keeps the
     largest-first order Kevin chose for the money drawers. */
  const rows = byDate
    ? [...list].sort((a,b) => String(b.at||'').localeCompare(String(a.at||'')) || b.amount - a.amount)
    : list;
  let lastDay = null;
  return `${rows.map(r => {
    const divider = byDate && r.at && r.at !== lastDay
      ? `<div class="jobl-day">${dayLbl(r.at)}</div>` : '';
    if (byDate) lastDay = r.at || lastDay;
    return `${divider}<div class="joblrow sub">
      <div class="jobl-top">
        <div class="jobl-cust">${r.cust ? esc(r.cust) : '<span style="color:var(--text-dim)">name not on the record</span>'}</div>
        <div class="jobl-amt">${r.amount ? short(r.amount) : '$0'}</div>
      </div>
      <div class="jobl-meta">
        ${!byDate && r.at ? `<span class="jobl-when">${dayLbl(r.at)}</span>` : ''}
        ${showBrand ? brandChip(r.brand, r.resolved) : ''}
        ${showRep ? `<span class="jobl-rep${r.repId?' tapname':''}"${r.repId?` onclick="event.stopPropagation();openRep('${esc(String(r.repId))}')"`:''}>${r.rep ? esc(r.rep) : (r.office ? 'office · unattributed' : 'no rep recorded')}</span>` : ''}
        <span class="feed-tag ${r.src==='cc'?'cc':'billdu'}">${r.src==='bell'?'rung · pending cc':'live · '+r.src}</span>
      </div>
    </div>`; }).join('')}
    ${count > list.length ? `<div class="wfoot" style="margin-top:8px">+ ${count-list.length} more${rest?` totaling ${short(rest)}`:''} — the ${list.length} largest are listed.</div>` : ''}`;
}

/* Resolve a lazy container to its list and fill it once. The data was always
   there — this only decides when the HTML for it is built. */
function fillJobs(el){
  if (!el || el.dataset.filled) return;
  const W = flat(DIVE), src = el.dataset.src || '';
  let list = [], count = 0, rest = 0, opts = { showBrand:true, showRep:false };
  if (src.startsWith('rep:')) {
    const r = (W.reps||[]).find(x => String(x.id) === src.slice(4));
    if (r) { list = r.jobList; count = r.jobCount; rest = r.jobRest; }
  } else if (src.startsWith('brand:')) {
    const b = (W.brands||[]).find(x => String(x.id) === src.slice(6));
    if (b) { list = b.jobList; count = b.jobCount; rest = b.jobRest; }
    opts = { showBrand:false, showRep:true };
  } else if (src === 'flat') {
    list = W.signedList; count = W.signedCount; rest = W.signedRestValue;
    opts = { showBrand:true, showRep:true };
  } else if (src === 'unowned') {
    list = (W.unowned||[]).slice(10); count = list.length; rest = 0;
    opts = { showBrand:true, showRep:true };
  }
  el.innerHTML = jobRowsHtml(list, count, rest, opts);
  el.dataset.filled = '1';
}

/* A drawer that holds a chart or a long ledger. Opening it redraws, because a
   canvas measured while its box was closed has no size to draw into. Kevin's
   rule: the tap is the door, not the trash — so nothing lives only on the
   surface, and nothing that left the surface left the console. */
function toggleBox(el){
  const open = !el.classList.contains('open');
  el.classList.toggle('open', open);
  if (!open) return;
  fillJobs(el.querySelector('.lazy'));
  if (el.querySelector('canvas')) drawCharts();
}

/* ── BUILT, inside every drill-in ───────────────────────────────────────────
   Kevin's redesign ruling (27 Jul): the drill-ins were "just sales revenue and
   marketing" — built has to be REPRESENTED EQUALLY, because built is the thing
   that pays the bills. So every window carries a built deep-dive at the same
   rank as Signed: headline, sold-vs-built, built by brand vs the same prior
   span. The depth honestly ends at the brand — a QuickBooks invoice carries no
   salesperson, so there is no built-by-rep board, and the card says so instead
   of faking one. */
function diveBuilt(k){
  const W = flat(k);
  const label = diveLow(k);
  if (!qbOK()) return `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Built · ${esc(label)}<span class="feed-tag none">not readable</span></div>
    <div class="card-sub">What was billed — a job is billed when it is built, so the invoice is the built record.</div>
    <div class="withheld"><div class="wt">Withheld, not zero</div><div class="wx">${esc(D.qb.reason)} The signed figures on this page are unaffected.</div></div>
  </div>`;
  const q = qbWinOf(k), pq = q.prev || { invoiced:0, count:0, byBrand:{} };
  const dq = pq.invoiced ? Math.round((q.invoiced-pq.invoiced)/pq.invoiced*100) : null;
  const ratio = W.rev > 0 ? Math.round(q.invoiced / W.rev * 100) : null;
  const cur = q.byBrand || {}, prv = pq.byBrand || {};
  const ids = [...new Set([...BRAND_ORDER, ...Object.keys(cur), ...Object.keys(prv)])]
    .sort((a,b)=>((cur[b]?.invoiced)||0)-((cur[a]?.invoiced)||0));
  return `<div class="card full" style="margin-bottom:12px">
    <div class="card-title">Built · ${esc(label)}<span class="feed-tag qb">live · qb</span></div>
    <div class="card-sub">What was billed in this window — a job is billed when it is built, so the invoice is the built record.</div>
    <div class="dive-hero">
      <div class="big">${short(q.invoiced)}</div>
      <div class="side">${q.count} invoice${q.count===1?'':'s'}
        ${dq===null?'':`<br/>${dq>=0?'▲':'▼'} ${Math.abs(dq)}% vs ${esc(W.prevLabel)}`}</div>
    </div>

    <div class="card-title" style="margin:14px 0 6px">Sold vs built</div>
    <div class="wow-hero">
      <div class="wow-col"><div class="k">Signed · cc</div><div class="v">${short(W.rev)}</div></div>
      <div class="wow-arrow"><div class="d">${ratio===null?'—':ratio+'%'}</div><div class="c">built ÷ sold</div></div>
      <div class="wow-col now"><div class="k">Built · qb</div><div class="v">${short(q.invoiced)}</div></div>
    </div>
    <div class="note" style="margin-top:8px">A pace gauge, not a conversion rate: the work built in this window was mostly <b>sold in earlier windows</b>, and the two figures come from different systems counting different events. Read it as "is production keeping up with sales" — never as one number owed to the other, and never summed.</div>

    <div class="card-title" style="margin:14px 0 6px">Built by brand · vs ${esc(W.prevLabel)}</div>
    ${ids.map(id=>{ const un = id==='unclassified';
      const m = un ? { s:'No brand on the invoice' } : brandOf(id);
      const a=(prv[id]?.invoiced)||0, b=(cur[id]?.invoiced)||0;
      const ch=a?Math.round((b-a)/a*100):(b?null:0);
      return `<div class="wow-row" ${(a||b)?'':'style="opacity:.6"'}>
        <div class="nm">${esc(m.s)}${un?'<span class="tick">unmapped</span>':''}</div>
        <div class="nums">${short(a)} → ${short(b)}</div>
        <div class="chg ${ch===null?'':ch>=0?'up':'down'}">${ch===null?'new':(ch>=0?'+':'')+ch+'%'}</div></div>`}).join('')}
    <div class="money-totals"><div class="nm">Open A/R · all work, as of now</div>
      <div class="col ar">${short(D.qb.arTotal)}</div></div>

    <div class="note">QuickBooks face value by invoice date, like-for-like against the same span of ${esc(W.prevLabel)}. <b>There is no built-by-rep board</b>: a QuickBooks invoice carries no salesperson, so built work cannot be credited to a rep without guessing — the depth ends at the brand, said out loud rather than faked. A/R is every open balance as of now and is deliberately not window-sliced.</div>
  </div>`;
}

function diveView(k){

        <div class="val">${b.rev?`${short(b.rev)} · ${pct(b.rev, W.rev)}%`:'$0'}</div></div>`; }).join('')}</div>
    <div class="card-sub" style="margin:0">${complete ? `${W.deals} deal${W.deals===1?'':'s'}` : `pace <b>${short(pace)}</b> · day ${el} of ${full}`}${dTot===null?'':` · <b class="${dTot>=0?'up':'dn'}">${dTot>=0?'▲':'▼'}${Math.abs(dTot)}%</b> vs ${esc(W.prevLabel)}`}</div>
    ${/* The components sit ON the headline, not below the fold of the card.
          Kevin read "$5K · live·cc" as the day's sales and reported the Billdu
