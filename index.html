/* ── 4. trending to finish ──────────────────────────────────────────────────
   Kevin: "Make proj bigger more obvious." The projection is what this card is
   FOR — where the month lands if today's rate holds — so it is the headline of
   each brand tile, coloured by whether it clears the goal, with the booked-so-far
   figure demoted to its subtitle.

   And his wording ruling: "short of goal/quota (not seed)". The surface now says
   GOAL everywhere. The honesty is not dropped, only moved: a chip states the
   goal was auto-set from each brand's own recent average, so nobody reads it as
   a number the team committed to. ─────────────────────────────────────────── */
function cardTrending(){
  const W = w();
  /* Time machine: a closed month gets a RESULT, not a forecast. Same tiles,
     same goal chips, but the headline is what the month actually closed at —
     projecting a finished month would be the exact "faked actual" the data
     honesty law bans. */
  if (MONTHOFF) {
    const rows0 = allBrands(W.brands).sort((a,b) => b.rev - a.rev);
    return `<div class="card">
      <div class="card-title">Against goal · ${esc(W.label)}<span class="feed-tag cc">live · cc</span><span class="feed-tag seed">goal · auto-set</span></div>
      <div class="card-sub">${esc(W.label)} is closed — what each brand finished at, against its auto-set goal. History, not a forecast.</div>
      ${rows0.length ? rows0.map(b => {
        const m = brandOf(b.id);
        const tgt = D.targets.monthly[b.id] || 0;
        const hit = tgt && b.rev >= tgt;
        const mx = Math.max(b.rev, tgt, 1);
        return `<div class="brand-tile">
          <div class="brand-top"><div class="nm">${esc(m.n)}<span class="tag">${b.jobs} signed${m.unmapped?' · unmapped id':''}</span></div></div>
          <div class="proj-head">
            <div class="proj-v" style="color:${tgt ? (hit?'var(--green-soft)':'var(--gold)') : 'var(--text)'}">${short(b.rev)}</div>
            <div class="proj-u">closed at<br/><span>${tgt?`goal was ${short(tgt)}`:'no goal set'}</span></div>
          </div>
          <div class="pace-bar">
            <div class="pace-proj" style="width:${Math.round(tgt/mx*100)}%;background:${m.c};opacity:.25"></div>
            <div class="pace-solid" style="width:${Math.round(b.rev/mx*100)}%;background:${m.c}"></div>
          </div>
          <div class="tgt-cap">${tgt
            ? `<span class="${hit?'hit':'miss'}">${hit?'cleared':'missed'} goal <b>${short(tgt)}</b> · ${pct(b.rev,tgt)}%</span>`
            : '<span>no goal set</span>'}</div>
        </div>`; }).join('') : `<div class="card-sub" style="margin:0">Nothing signed in ${esc(W.label)}.</div>`}
      <div class="note">Goals are auto-set from each brand's recent average, not committed to — and they are today's goals applied backwards, not what the goal was at the time. ${esc(D.targets.note || '')}</div>
    </div>`;
  }
  const SH = D.monthShape || {};
  const elapsed = SH.elapsedDOM || W.prevSpanDays;
  const days = SH.dim || new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
  const rows = allBrands(W.brands).sort((a,b) => b.rev - a.rev);
  return `<div class="card">
    <div class="card-title">Trending to finish<span class="feed-tag cc">live · cc</span><span class="feed-tag seed">goal · auto-set</span></div>
    <div class="card-sub">Where each brand lands this month, projected from <b>how its own months usually fill</b> — not a flat daily rate. Day ${elapsed} of ${days}. Solid bar is booked; the faded run-on is the projection.</div>
    ${rows.length ? rows.map(b => {
      const m = brandOf(b.id);
      const linear = elapsed ? b.rev / elapsed * days : b.rev;
      const sh = SH[b.id];
      const shaped = (sh && sh.frac > 0 && sh.n >= 3) ? Math.round(b.rev / sh.frac) : null;
      // the headline is the shaped number where the history supports it; linear
      // is kept beside it so the method is visible, not hidden
      const proj = shaped != null ? shaped : linear;
      const tgt = D.targets.monthly[b.id] || 0;
      const mx = Math.max(proj, linear, tgt, b.rev, 1);
      const hit = tgt && proj >= tgt;
      // lumpiness: is the projection resting on one big deal rather than a base?
      const big = b.jobList && b.jobList[0];
      const bigShare = (big && b.rev) ? big.amount / b.rev : 0;
      return `<div class="brand-tile">
        <div class="brand-top">
          <div class="nm">${esc(m.n)}<span class="tag">${b.jobs} signed${m.unmapped?' · unmapped id':''}</span></div>
        </div>
        <div class="proj-head">
          <div class="proj-v" style="color:${tgt ? (hit?'var(--green-soft)':'var(--gold)') : 'var(--text)'}">${short(proj)}</div>
          <div class="proj-u">projected finish<br/><span>${short(b.rev)} booked · ${shaped!=null?`shape from ${sh.n} mo`:'flat rate'}</span></div>
        </div>
        <div class="pace-bar">
          <div class="pace-proj" style="width:${Math.round(proj/mx*100)}%;background:${m.c}"></div>
          <div class="pace-solid" style="width:${Math.round(b.rev/mx*100)}%;background:${m.c}"></div>
        </div>
        <div class="tgt-cap">
          ${tgt ? `<span class="${hit?'hit':'miss'}">${hit?'clears':'short of'} goal <b>${short(tgt)}</b></span>` : `<span>no goal set</span>`}
          ${shaped!=null ? `<span class="goalchip">vs flat rate ${short(linear)}</span>` : `<span class="goalchip">too little history to shape</span>`}
        </div>
        ${bigShare >= 0.25 ? `<div class="lumpwarn">⚠ one ${short(big.amount)} deal is ${Math.round(bigShare*100)}% of ${esc(m.s)}'s month — the projection leans on it, so treat it as soft.</div>` : ''}
      </div>`}).join('') : '<div class="card-sub" style="margin:0">Nothing signed in this window.</div>'}
    <div class="note"><b>Projection is shape-aware.</b> Each brand's finish is its booked value divided by the share of the month it has typically signed by day ${elapsed} — measured on its own Contractors Cloud history, median of up to six prior months. Oasis front-loads, so a flat daily rate overstated it; Fencing tails late, so the flat rate understated it. Where fewer than three months exist to learn from, it falls back to the flat rate and says so. <b>Goals are auto-set, not committed to.</b> ${esc(D.targets.note)}</div>
  </div>`;
}

/* ── 5. signed mix donut ──────────────────────────────────────────────────── */
/* A brand at zero is a fact. A brand missing from the list is a bug the owner
   has to diagnose from the outside, so every brand is listed either way. */
function oasisNote(k){
  const lag = D.oasisLag; if (!lag) return '';
  const wv = lag.windows[k] || {};
  const f = lag.freshness || {};
  if (!wv.docs && !f.not_in_cc_yet) return '';
  return `<div class="withheld"><div class="wt">Oasis may lag</div><div class="wx">
    Oasis sells through <b>Billdu</b> and Contractors Cloud imports it late, so an Oasis zero here means
    "nothing has reached CC yet", not "nothing was sold".
    ${wv.docs ? `Billdu shows <b>${wv.docs}</b> document${wv.docs===1?'':'s'} worth <b>${short(wv.value)}</b> in this window${wv.accepted?`, <b>${wv.accepted}</b> accepted (${short(wv.acceptedValue)})`:', none accepted yet'}.` : ''}
    ${f.not_in_cc_yet ? ` Across the whole feed <b>${Number(f.not_in_cc_yet).toLocaleString()}</b> Billdu documents still have no Contractors Cloud counterpart${f.minutes_since_newest!=null?`; the newest is ${Math.round(f.minutes_since_newest)} minutes old`:''}.` : ''}
  </div></div>`;
}

/* ── OASIS DETAIL, inside the window drill-in ────────────────────────────────
   Kevin: "It's under the main don't need it there anymore if it's in the total."
   Right — once every Oasis figure already includes Billdu, a separate card at
   the top is a second version of a number he has. What is still useful is WHICH
   deals make up the Billdu portion of a window, and that belongs behind the tap
   as detail rather than above the fold as a rival headline.

   Then, on the calm pass: "seems out of place... no purpose I can think of."
   The purpose is real — it is the import-leak chase list, and the receipts for
   the Billdu money sitting inside the Oasis totals — but twenty-two open rows
   put that purpose behind a wall of detail. So it folds like everything else in
   the quiet strip, and its folded line carries the three things worth knowing
   without opening it: how much, how many, and how old the oldest one is. Age is
   the actionable part; a deal Contractors Cloud has not imported in three weeks
   is the leak this card exists to catch.

   The summary is built here rather than at the call site on purpose. Building
   one at the call site is exactly how a folded row ended up quoting the month's
   figure on a card that reads the week. Next to the data, they cannot drift. ── */
function oasisDetail(k){
  const L = D.oasisLag; if (!L || !L.leak) return '';
  const R = (D.windowRange || {})[k]; if (!R) return '';
  /* Windowed on ISSUE DATE, which is the leak view's own basis and the one the
     backend reconciles against. Every other figure in this drill-in windows on
     signed date, so the two axes are not interchangeable and the card says which
     it is using. Choosing the other basis shifts this window by a few deals —
     small, but not nothing, and not something to leave unlabelled. */
  const inWin = r => r.issued >= R[0] && r.issued < R[1];
  const chase = L.leak.filter(r => r.category === 'never_imported' && inWin(r))
                      .sort((x,y) => (y.age || 0) - (x.age || 0));
  const held  = L.leak.filter(r => r.category === 'match_limited' && inWin(r));
  if (!chase.length && !held.length) return '';

  const value = chase.reduce((n,r) => n + r.value, 0);
  const heldValue = held.reduce((n,r) => n + r.value, 0);
  const oldest = chase.length ? (chase[0].age ?? null) : null;
  /* Age is the actionable part, so it leads even when the money is small. */
  const agePart = oldest == null ? '' : oldest <= 0 ? ' · all issued today' : ` · oldest ${oldest}d`;
  const summary = chase.length
    ? `${short(value)} in ${chase.length} deal${chase.length===1?'':'s'} awaiting CC import${agePart}`
    : `nothing awaiting import · ${held.length} held by our matcher`;

  return minor('oasis', summary,
  `<div class="card">
    <div class="card-title">Oasis · awaiting CC import<span class="feed-tag billdu">live · billdu</span></div>
    <div class="card-sub">Deals Billdu accepted that Contractors Cloud has <b>no record of</b>, oldest first. Windowed on the date the estimate was issued — the rest of this drill-in windows on signed date, so this one card is on a different axis and is not additive with the figures above it.</div>
    ${chase.length ? chase.slice(0,12).map(r => `<div class="rep-row">
      <div class="rep-head">

     flag, or a sales role that outlived it. Gio keeps his standing

  const all = W.reps || [];

  /* The no-rep pseudo-row stays on the first screen with the sellers — "pull

  const core0 = all.filter(r => sellerish(r) || r.norep);

      const tot2 = all.reduce((n,r)=>n+r.rev,0), deals2 = all.reduce((n,r)=>n+r.jobs,0);
      const pAll = ((W.prev||{}).reps)||[], pTot = pAll.reduce((n,r)=>n+r.rev,0);

      /* The board total counts rung 🛎️ claims (a rep's credit the moment they

      const rung2 = all.reduce((n,r)=>n+(r.rung||0),0);
      /* The closing % rides at the total's own baseline, right of the up/down —

      const hc = heroClose(W, k === 'month' && MONTHOFF);
      return `<div style="margin:6px 0 10px">

        <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">

          ${dp!==null?`<span class="${dp>=0?'up':'dn'}" style="font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700">${dp>=0?'▲':'▼'} ${Math.abs(dp)}%</span>`:''}

        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:2px">${deals2} deal${deals2===1?'':'s'}${dp!==null?` · vs <b style="color:var(--text)">${short(pTot)}</b> ${esc(W.prevLabel||'')}`:''}</div>

        ${rung2?`<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);margin-top:4px">= <b style="color:var(--text)">${short(tot2-rung2)}</b> confirmed · cc + billdu + <b style="color:var(--text)">${short(rung2)}</b> rung 🛎️ awaiting the book — same union as the Signed figure up top, which carries the same bell line</div>`:''}
      </div>`; })()}
    ${reps.map((r,i)=>`<div class="rep-row${r.office?'':' acc'}"${i>=CORE?' data-extra="1" style="display:none"':''} ${r.office?'style="opacity:.8"':`onclick="openRep('${esc(String(r.id))}')"`}>
      <div class="rep-head">

        <div class="amt">${short(r.rev)} <span>· ${r.jobs} deal${r.jobs===1?'':'s'}</span>${r.office?'':'<span class="acc-chev">›</span>'}</div>

/* ── 6b. CLOSING MOMENTUM — Kevin (28 Jul): "momentum is everything with sales
      guys. If they don't believe in themselves, they're gonna suck." The
      salespeople's own category: every seller's close rate over trailing 1-wk /
      2-wk / 30-day / 60-day windows ending today, so a streak or a slump shows
      while it is still happening. Tap a row for the one-pager. ─────────────── */
const momBadge = m => m === null ? ''
  : m >= 8  ? `<span class="mom up">▲ +${m}</span>`
  : m <= -8 ? `<span class="mom dn">▼ −${Math.abs(m)}</span>`
  :           `<span class="mom flat">→ steady</span>`;

/* Kevin's hot/cold bands, in one place so every close on the page bands the
   same way: 35%+ hot (green), 30–35 warm (yellow), under 30 cold (red).
   No appointments = no band — a missing denominator is not a cold streak. */
const closeBand = c => !c || !c.appts ? 'none' : c.close >= 35 ? 'hot' : c.close >= 30 ? 'warm' : 'cold';

/* ── THE BOARD'S OWN CLOSING % ─────────────────────────────────────────────
   Kevin (18 Aug): "add a closing % immediately to the right of the total for
   each of the options... closing % is my fav especially if we're already
   showing the reps closing %."

   The rep rows have carried close rates since the momentum fold; the total
   above them carried none, so the one number he reads first was the only one
   on the card that could not answer "and did we close it?". This asks the
   SAME question of the window on screen — day, week, month or YTD, it moves
   with the toggle like everything else — and states it against the trailing
   eight weeks so a rate is never read alone.

   Union signings over CC appointments elapsed, blended from the window's own
   per-brand rows. A blended rate moves with brand mix as well as with
   closing (the standing caveat on this page), so the mix warning travels in
   the tooltip and the fine print rather than being quietly dropped — and the
   per-brand breakdown is one card away, unchanged.

   No appointments elapsed = a dash, never a zero: a missing denominator is
   not a cold streak, and today before 9am has no close rate to give. */
function heroClose(W, stale){
  const rows = W.closeByBrand || [];
  if (!rows.length) return { chip:'', line:'' };
  const b = rows.reduce((o,r)=>({ s:o.s+r.signed, a:o.a+r.appts }), { s:0, a:0 });
  const close = b.a ? Math.round(b.s / b.a * 100) : null;
  const base = D.close8w || null;
  /* The baseline trails TODAY. A browsed past month (the time machine) is not
     eight weeks away from it in any honest sense, so that comparison is
     withheld rather than computed — the rate still shows. */
  const d = (!stale && close !== null && base && base.close !== null && base.appts >= 20)
    ? close - base.close : null;
  const band = closeBand({ appts: b.a, close });
  const tip = close === null
    ? 'No appointments have elapsed in this window, so there is no close rate to divide.'
    : `${b.s} signings over ${b.a} appointments elapsed. Signings are the union — CC contracts, Billdu acceptances for Oasis, rung sales pending CC, never both for one deal. Blended across brands, so it moves with brand mix as well as with closing; the per-brand rates are on the close-rate card.`;
  /* A ±2 point wobble is not a direction. Inside the dead band the glyph goes
     flat and keeps the signed number, so the chip never sells a rounding
     difference as a move the way an arrow would. */
  const arrow = d === null ? '' : d >= 3 ? '▲ +' : d <= -3 ? '▼ −' : d > 0 ? '▬ +' : d < 0 ? '▬ −' : '▬ ';
  const chip = `<span class="hero-close ${band}" title="${esc(tip)}"><b>${close===null?'—':close+'%'}</b><i>close</i>${
    d===null?'':`<em class="${d>=3?'up':d<=-3?'dn':'flat'}">${arrow}${Math.abs(d)}</em>`}</span>`;
  const verdict = d === null ? ''
    : d >= 3 ? ` — <b style="color:var(--green)">${d} pts ahead of it</b>`
    : d <= -3 ? ` — <b style="color:var(--red)">${Math.abs(d)} pts under it</b>`
    : d === 0 ? ' — level with it' : ` — ${Math.abs(d)} pt${Math.abs(d)===1?'':'s'} ${d>0?'over':'under'}, inside the noise`;
  const line = close === null
    ? `no appointments have elapsed in this window — a close rate needs a denominator`
    : `<b style="color:var(--text)">${close}%</b> closed · ${b.s} of ${b.a} appts elapsed${
        base && base.close !== null
          ? ` · ${base.weeks}-wk avg <b style="color:var(--text)">${base.close}%</b> (${base.signed}/${base.appts})${
              stale ? ' — trailing today, so this browsed month is not judged against it'
                    : d === null ? ' — baseline too thin to judge against' : verdict}`
          : ''}`;
  return { chip, line };
}

/* The trailing-close boxes riding under a rep's revenue bar: four banded
   windows plus the trend. Dash = no appointments to divide by, never a zero. */
/* The seam caption under a rep's bar, all three systems named. A figure that
   quietly includes unconfirmed money is the bug class every badge on this page
   exists to kill: CC is booked truth, Billdu is invoice truth, a bell ring is
   the rep's own claim with the 7-business-day clock on it. */
function repCap(r){
  if (r.office) return r.billdu?`<div class="tgt-cap"><span>sent from the office account — seller not recorded</span></div>`:'';
  if (!r.billdu && !r.rung) return '';
  const parts = [`${short(r.rev-(r.billdu||0)-(r.rung||0))} CC`];
  if (r.billdu) parts.push(`${short(r.billdu)} Billdu`);
  if (r.rung) parts.push(`${short(r.rung)} rung 🛎️ pending CC`);
  return `<div class="tgt-cap"><span>${parts.join(' + ')}</span></div>`;
}

/* Commission intel under the close chips — Kevin (30 Jul): "that's not a
   competition thing. I just want to know everything about my sales guys."

    m===null?'<span class="none">·</span>':`<span class="${m>=8?'hot':m<=-8?'cold':'none'}">${m>=8?'▲+'+m:m<=-8?'▼−'+Math.abs(m):'→'}</span>`}</div>`;
}

let INTEL = null, INTEL_STATE = 'idle';
function cardIntel(){

  const C = R.company;
  const flags = R.brands.flatMap(b => b.flags.map(f => ({ ...f, brand: b.s })));

  return `<div class="card full intel-band">

    ${R.control ? `<div class="intel-alert control"><span class="tag">CONTROL</span><span>${R.control}</span></div>` : ''}
    ${C.set.thin ? '' : `<div class="intel-alert ${ATTN_SEV[RHY_SEV[C.set.verdict]]||''}"><span class="tag">${esc('SET ' + RHY_WORD[C.set.verdict])}</span><span>Company-wide, <b>${C.set.now} appointments were set in the last 30 days</b> against ${Math.round(C.set.b4)} a month over the rhythm${C.set.d1!==null?` · ${C.set.d1>=8?'up '+C.set.d1+'%':C.set.d1<=-8?'down '+Math.abs(C.set.d1)+'%':'flat'} on last month`:''}${C.set.d2!==null?` · ${C.set.d2>=8?'up '+C.set.d2+'%':C.set.d2<=-8?'down '+Math.abs(C.set.d2)+'%':'flat'} on the last 2`:''}.</span></div>`}
    <div class="intel-grid">
      <div>

  const pcts = (a,b) => b ? Math.round((a-b)/Math.abs(b)*100) : null;
  const money$ = n => (n<0?'−$':'$') + Math.abs(Math.round(n)).toLocaleString();
  const dInc = pcts(I.money.incomeCurrent, I.money.incomePrior);
  const gpDrop = (I.money.gpPctPrior!=null&&I.money.gpPctCurrent!=null) ? +(I.money.gpPctPrior-I.money.gpPctCurrent).toFixed(1) : null;
  const alerts = [];
  const mtd = I.demand[I.demand.length-1];
  if (mtd && mtd.prior && pcts(mtd.current, mtd.prior) <= -20)
    alerts.push({sev:'fire', txt:`Fencing bookings ${pcts(mtd.current,mtd.prior)}% like-for-like this month (${mtd.current} vs ${mtd.prior}). Bookings lead revenue — next month is exposed.`});

    alerts.push({sev:'fire', txt:`Gross margin down ${gpDrop} points H1 YoY (${I.money.gpPctPrior}% → ${I.money.gpPctCurrent}%). Margin is moving faster than volume.`});

    alerts.push({sev:'watch', txt:`${esc(f.label)} is not reporting — ${esc(f.note)}. Excluded from every figure above.`});
  const maxC = Math.max(1, ...I.control.flatMap(r=>[r.prior,r.current]));
  return `

      <div>
        <div class="card-title" style="font-size:11px;margin:10px 0 4px">Lead / lag spread — bookings vs revenue, indexed</div>

async function loadIntel(){

  INTEL_STATE = 'loading';
  const paint = () => { const el2 = document.querySelector('.intel-band'); if (el2) { el2.outerHTML = cardIntel(); drawCharts(); } };

function cardEffort(){
  const E = D.effort;
  const K = EFFWIN, span = E.spans[K] || 1;
  /* Month label is always 'this month': touch history does not ride the month
     time machine (D.effort is live-month only), and a July label over August
     data would be a lie. The hero tile states the same limit out loud. */
  const label = { day:'today', week:'this week', month:'this month', year:'this year' }[K];
  const live = E.rows.some(r => r[K].t > 0);
  /* Ranked by touches in the window, all-time touches breaking ties. Points
     are gone from every surface — counts only, never points (Kevin's law,
     b31, migration 048). Reps who logged nothing still appear — a scoreboard
     that hides its zeros is not a scoreboard. */
  const ranked = [...E.rows].sort((a,b) => b[K].t - a[K].t || b.all - a.all || a.name.localeCompare(b.name));
  const logged = ranked.filter(r => r[K].t > 0);
  const silent = ranked.length - logged.length;
  const teamT = ranked.reduce((n,r) => n + r[K].t, 0);
  const onStd = ranked.filter(r => (r.goal ?? E.defaultGoal) * span > 0 && r[K].t >= (r.goal ?? E.defaultGoal) * span).length;
  const streaks = (EFF_INTEL && EFF_INTEL.streaks) || null;
  const streakOf = id => { const s = streaks && streaks.find(x => String(x.rep_id) === String(id)); return s ? +s.streak : 0; };
  const bestStreak = streaks ? [...streaks].sort((a,b) => +b.streak - +a.streak)[0] : null;
  const goalEach = (E.defaultGoal||0) * span;
  return `<div class="card full" id="effort-anchor">
    <div class="card-title">The Effort Board · touches<span class="feed-tag ${live?'':'none'}">${live?'live · app':'awaiting logging'}</span></div>

    <div class="seg">
      ${[['day','Day'],['week','Week'],['month','Month'],['year','Year']]
        .map(([k,l])=>`<button class="${k===K?'on':''}" onclick="setEff('${k}')">${l}</button>`).join('')}
    </div>
    ${K === 'week' ? weekResetNote() : ''}

    <div class="stat-grid" style="margin-bottom:14px">
      <div class="stat-tile"><div class="lbl">Touches ${esc(label)}</div>
        <div class="val ${teamT?'green':''}">${teamT}</div>
        <div class="sub">team goal ${goalEach*E.activeReps}</div></div>
      <div class="stat-tile"><div class="lbl">On standard</div>
        <div class="val ${onStd?'gold':''}">${onStd}<span style="font-size:14px;color:var(--text-dim)"> / ${E.activeReps}</span></div>
        <div class="sub">hit their goal ${esc(label)}</div></div>
      <div class="stat-tile"><div class="lbl">Reps on the board</div>
        <div class="val ${logged.length?'blue':''}">${logged.length}<span style="font-size:14px;color:var(--text-dim)"> / ${E.activeReps}</span></div>
        <div class="sub">logged ${esc(label)}</div></div>
      <div class="stat-tile"><div class="lbl">${bestStreak && +bestStreak.streak > 0 ? 'Streak leader' : 'Team goal hit'}</div>
        ${bestStreak && +bestStreak.streak > 0
          ? `<div class="val gold">${+bestStreak.streak}d 🔥</div><div class="sub">${esc(String(bestStreak.name||'').split(' ')[0])} · days on standard</div>`
          : `<div class="val ${goalEach&&teamT>=goalEach*E.activeReps?'green':''}">${goalEach?Math.round(teamT/(goalEach*E.activeReps)*100):0}%</div><div class="sub">of ${goalEach*E.activeReps} expected</div>`}</div>
    </div>

    ${logged.map((r,i) => {
      const goal = (r.goal||0) * span;
      const p = goal ? Math.min(100, Math.round(r[K].t / goal * 100)) : 0;
      const pager = D.roster && D.roster[String(r.id)];
      const st = streakOf(r.id);
      return `<div class="rep-row${pager?' acc':''}"${pager?` onclick="openRep('${esc(String(r.id))}')"`:''}>
        <div class="rep-head">
          <div class="nm"><span class="rk ${i===0?'top':''}">${i+1}</span>${esc(r.name)}${r.role&&r.role!=='sales'?`<span class="brand">${esc(r.role)}</span>`:''}${st>=2?` <span style="font-size:10px;color:var(--accent-soft)">🔥${st}d</span>`:''}</div>
          <div class="amt">${r[K].t} <span>· touches</span>${pager?'<span class="acc-chev">›</span>':''}</div>
        </div>
        <div class="meter"><div class="meter-fill" style="width:${p}%;background:${p>=100?'#6cc28b':'#6ba8c9'}"></div></div>
        <div class="tgt-cap"><span>${r[K].t} of ${goal} goal</span>

      </div>`}).join('')}

    ${silent ? `<div class="withheld"><div class="wt">${logged.length?'Not on the board':'Honest zero'}</div><div class="wx">
      ${silent} of ${E.activeReps} active rep${silent===1?' has':'s have'} logged nothing ${esc(label)}${logged.length?'':' — and nobody has'}. Touch logging begins when reps go live: <b>zeros are real</b>, not a broken feed. Nothing is back-filled from sales activity, so a rep who closed work but logged no touches ranks at zero, because that is what the effort data says.</div></div>` : ''}

    <div class="note">LIVE · logged in-app · <b>counts are binary touches, never points</b> (Kevin's law, b31, migration 048). Goal is <b>rep_targets.daily_touch_goal</b>, a real row per rep — all ${E.activeReps} currently sit at the company default of <b>${E.defaultGoal}/day</b>${E.goalsAllDefault?', none set their own yet':''}. Until Yes repeats, so its repeats count again. Goals are scaled by working days, not calendar days, or a Monday would read as a whole week missed. Streaks are counted by the server (migration 119) so the whole team sees them, not just each rep's own phone.</div>

/* ── THE MARKETING DRAWER · FEEDS ────────────────────────────────────────────
   Kevin rejected the old "Leads by source" card in one line: a source with a
   dollar amount next to it and no cost beside it is revenue wearing a marketing
   label. Two boards replace it, and both hang off ONE basis so they can never
   tell him different stories about the same source.

   THE BASIS: a signing is a row in `rpt_signings` with confirmed = true,
   resolved to its source through `jobs.cc_lead_source_id` →
   `lead_sources.rollup_name`. Never the raw `ls.name` — CC fragments one
   channel across many ids (Google is five of them, Angi three), and grouping by
   the raw name splits Angi into 1,451 / 199 / 18 instead of reading it as one
   source at 1,668. Migration 163 established the rollup and 165 taught the RPC
   to use it; this board is the third surface on that same key.

   WHY rpt_signings AND NOT jobs.contract_signed_at, which is already in memory
   and would have cost nothing: Oasis sells through Billdu, not Contractors
   Cloud. Measured against live, 227 of Google's confirmed signings are
   `billdu_accepted` and 32 of those sit on jobs with NO contract_signed_at at
   all — so a jobs-only grid silently marks Oasis reps down for deals they
   actually closed. The whole point of board 2 is deciding who gets which
   appointments; a denominator that penalises a brand for its paperwork route
   would aim that decision backwards.

   The signings set is DISTINCT BY PROJECT. Migration 150 splits an amended
   invoice into one signing row per late bell, so a repeat sale is legitimately
   two rows of money — but it is still ONE closed job, and counting rows would
   push a rep's closing rate above 100%. Money counts rows; a rate counts jobs.

   Loaded after first paint like the effort suite, so a missing migration or a
   dead feed can never block the page. */
let MKT = null;                 // { roi, spend, ads, signed, month, err }
let MKT_LOADING = false;
/* Default to the LAST COMPLETE MONTH, not this one. Spend is typed at month
   close by definition, so opening on a month nobody could have entered yet
   would show a board of "not entered" and teach the owner the feature is
   broken. 1 = last month; the stepper goes back 12, which is also as far as the
   appointment feed reaches (see APPT_SINCE). */
let MKTOFF = 1;

/* PostgREST returns a scalar-jsonb RPC as the body itself, not as a row array,
   so q() — which pages and spreads each page into a list — cannot read one.
   One request, no paging, the parsed body back. */
async function qOne(path){
  const s = sess.get();
  if (!s) throw new Error('not signed in');
  const go = async tok => fetch(`${SB_URL}/rest/v1/${path}`, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + tok } });
  let r = await go(s.access_token);
  if (r.status === 401 && await refresh()) r = await go(sess.get().access_token);
  if (!r.ok) { const e = new Error(`${path.split('?')[0]} → ${r.status}`); e.status = r.status; throw e; }
  return r.json();
}

const mkMonthStart = off => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() - off, 1); };
const mkISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mkMonthLabel = off => { const d = mkMonthStart(off); return `${MNAMES[d.getMonth()]} ${d.getFullYear()}`; };

async function loadMarketing(){
  MKT_LOADING = true;
  const start = mkMonthStart(MKTOFF), end = new Date(start.getFullYear(), start.getMonth() + 1, 0);
  const monthKey = mkISO(start);
  /* Each feed fails on its own. A board where one dead feed blanks another
     section would hide a live number behind an unrelated outage. */
  const [roi, roiBrand, spend, ads, signed] = await Promise.all([
    qOne(`rpc/rpt_report_marketing_roi?win_start=${mkISO(start)}&win_end=${mkISO(end)}`).catch(e => ({ __err: e.status || 'x' })),
    /* The same signing rows grouped one dimension finer (source × brand, 169).
       Its own failure state: a missing 169 refuses the two brand-money
       sections, never the whole board. */
    qOne(`rpc/rpt_report_marketing_roi_brand?win_start=${mkISO(start)}&win_end=${mkISO(end)}`).catch(e => ({ __err: e.status || 'x' })),
    /* 404/PGRST205 until migration 166 is applied — that is a real state, not an
       error to swallow: every spend cell then reads "not entered", which is
       exactly what an unapplied spend book means. */
    q('marketing_spend?select=source_name,month,amount,note,brand').catch(() => null),
    q('google_ads_daily?select=date,spend').catch(() => null),
    /* Board 2 is all-time (see cardRepGrid) so this is fetched once and reused
       across month steps. */
    (MKT && MKT.signed) ? Promise.resolve(MKT.signed)
      : q('rpt_signings?select=cc_project_id&confirmed=is.true').catch(() => null),
  ]);
  /* ── THE BACKFILLED MONTHS READ THE BACKFILL ──────────────────────────────
     rpt_report_marketing_roi's by_source joins signed dollars onto a leads CTE
     keyed on jobs.created_at, and the warehouse was loaded in one shot on
     20 Jul 2026 — so a pre-July window's by_source comes back [] even though
     the signed dollars are real (verified live: June answers 0 rows, July 25).
     The month matrix has read migration 172's rpt_marketing_revenue_by_source_month
     for those months since it shipped, which left the board able to show June's
     per-source dollars in one section while the ledger above it said "no lead
     carried a source" — two answers to one question on one screen. Now the
     ledger (and the headline that sums it) reads the same substitution: the
     RPC drives every month it can group, the 172 table drives the rest, and
     the card says which instrument answered. */
  let srcBackfill = null;
  const roiOk = roi && !roi.__err;
  if (roiOk && !(((roi.sections || {}).by_source || []).length) && monthKey.slice(0, 7) < MK_SRC_RPC_FROM) {
    const bf = await q(`rpt_marketing_revenue_by_source_month?select=source_name,signed_jobs,signed_dollars&month=eq.${monthKey}`)
      .catch(() => null);
    if (bf && bf.length) {
      /* Company rows fold together — the ledger reads company-blind, same as
         the RPC's own by_source and the month walk's read of this table. */
      const bySrc = Object.create(null);
      for (const row of bf) {
        const cur = bySrc[row.source_name] || (bySrc[row.source_name] = { d: 0, j: 0 });
        cur.d += Number(row.signed_dollars || 0);
        cur.j += Number(row.signed_jobs || 0);
      }
      srcBackfill = { month: monthKey,
        rows: Object.entries(bySrc).map(([source_name, v]) =>
          ({ source_name, signed_dollars: v.d, signed_jobs: v.j })) };
    }
  }
  MKT = { roi: roiOk ? roi : null, roiErr: (roi && roi.__err) || null,
          roiBrand: (roiBrand && roiBrand.__err) ? null : roiBrand,
          roiBrandErr: (roiBrand && roiBrand.__err) || null,
          spend, ads, signed, srcBackfill, month: monthKey };
  MKT_LOADING = false;
  render();
}

function setMktOff(n){
  if (n < 0 || n > 12) return;
  MKTOFF = n; MKT = MKT ? { ...MKT, roi: null, roiErr: null, roiBrand: null, roiBrandErr: null } : null;

/* ── THE ROI BOARD · THE FIVE-MONTH WALK ─────────────────────────────────────
   The ROI board's two history sections — the Apr–Aug trend matrix and Went
   Quiet — need signed dollars per source per month across a run of months.
   rpt_report_marketing_roi is windowed, so that is one call per month.

   THIS IS SAFE WHERE A LEADS SERIES WOULD NOT BE. Closed dollars are dated by
   `rpt_signings.signed_on`, which is correct in every window — the same reason
   the board's ROI column renders for months whose LEADS column is refused
   (see MK_LEADS_FROM). A cost-per-lead series over these same months is the
   thing that cannot be drawn, and the board says so where it would have sat
   rather than borrowing this series to stand in for it.

   BUT THE RPC'S by_source SECTION IS NOT SAFE FOR EVERY WINDOW — it is a
   different bug from the leads column's. `by_source` is built by joining
   signed dollars onto a `led` (leads) CTE that is itself keyed on
   jobs.created_at, and every job's created_at was stamped in one shot on
   20 Jul 2026 (the warehouse backfill). So a pre-July window's `led` is
   empty and `by_source` comes back `[]` even though the signed dollars are
   real. Migration 172 backfilled Mar–Jun into
   rpt_marketing_revenue_by_source_month straight from jobs.contract_signed_at
   / cc_lead_source_id (neither touched by the created_at backfill — verified
   against a live Contractors Cloud pull, see docs/roi-board/handoff-source-backfill.md),
   applying signedUnion() money rules. Those four months are read from that
   table below; the RPC still drives whatever month is still open.

   Six windows, not five: the board's matrix runs Apr→Aug and the sixth slot
   carries the current month so "went quiet" can tell a source that stopped
   from a source that simply has not signed yet this month. Loaded after the
   board's source level, lazily, and only once — stepping the month does not
   re-walk it. */
let MKTWALK = null;            // { series: [{key,label,bySrc:{}}], err }
let MKTWALK_LOADING = false;
const MKW_MONTHS = 6;

async function loadMktWalk(){
  if (MKTWALK || MKTWALK_LOADING) return;
  MKTWALK_LOADING = true;
  /* One cheap pull covers every backfilled month at once — no point walking
     rpt_marketing_revenue_by_source_month window by window like the RPC. */
  const backfill = await q('rpt_marketing_revenue_by_source_month?select=month,source_name,signed_jobs,signed_dollars')
    .catch(() => null);
  const backfillByMonth = Object.create(null);
  for (const row of (backfill || [])) {
    const key = String(row.month).slice(0, 7);
    const bySrc = backfillByMonth[key] || (backfillByMonth[key] = Object.create(null));
    /* Company rows fold together here — the matrix reads company-blind,
       same as the RPC's own by_source (never filtered by company). */
    const cur = bySrc[row.source_name] || { dollars: 0, jobs: 0 };
    cur.dollars += Number(row.signed_dollars || 0);
    cur.jobs += Number(row.signed_jobs || 0);
    bySrc[row.source_name] = cur;
  }
  /* Oldest first, so the matrix and the sparklines read left-to-right in time
     without the caller having to reverse them. */
  const offs = [];
  for (let i = MKW_MONTHS - 1; i >= 0; i--) offs.push(i);
  const got = await Promise.all(offs.map(async off => {
    const s = mkMonthStart(off), e = new Date(s.getFullYear(), s.getMonth() + 1, 0);
    const key = mkISO(s).slice(0, 7);
    if (backfillByMonth[key]) {
      return { key, label: MNAMES[s.getMonth()], off, bySrc: backfillByMonth[key], backfilled: true };
    }
    try {
      const r = await qOne(`rpc/rpt_report_marketing_roi?win_start=${mkISO(s)}&win_end=${mkISO(e)}`);
      const bySrc = Object.create(null);
      for (const row of ((r.sections || {}).by_source || [])) {
        bySrc[row.source_name] = { dollars: Number(row.signed_dollars || 0),
                                   jobs: Number(row.signed_jobs || 0) };
      }
      return { key, label: MNAMES[s.getMonth()], off, bySrc };
    } catch (err) { return { key, label: MNAMES[s.getMonth()], off, err: err.status || 'x' }; }
  }));
  /* One dead window does not kill the section — it renders as a gap in the
     row with the month named, which is a different fact from a zero. */
  MKTWALK = { series: got, err: got.every(g => g.err) ? (got[0] || {}).err || 'x' : null };
  MKTWALK_LOADING = false;
  mktRedraw();
}

/* ESTIMATES ON FILE — Kevin, 6 Aug: "I need to make sure all estimate numbers

   them do it better?" This card IS the daily answer. Before migration 131 it
   could not exist: the blink-red capture (build 57) saved the amount to each

   (offline-queued, backfilled from device storage), and this board reads it:
   appointments that RAN in the window, who captured, for how much, and —
   the enforcement number — which appointments still have no estimate on the
   customer's file. Missing should read zero by evening; a red count here is
   the list Kevin works the phones with. */
function cardEstimates(){
  if (!EFF_INTEL) return '';
  const est = EFF_INTEL.est;
  const label = EFF_INTEL.win === 'day' ? 'today' : EFF_INTEL.win === 'month' ? 'this month' : 'this week';
  if (!est) return effAwait('Estimates on file · the numbers in the customer files',
    'The estimate feed (migration 131, <b>estimate_board</b>) did not answer. Until 131 is applied and the field is on the build that posts amounts, estimate numbers exist only on each rep’s own phone — nothing is estimated in their place.');
  /* A rep who has not started shows as NOT STARTED rather than vanishing.
     Before 143 they were filtered out for having no appointments; that reads
     as a clean board when it is actually an absent one, and "nobody has
     captured anything yet" is a louder fact than any miss count. */
  const rows = est.filter(r => +r.appts > 0 || +r.quoted > 0 || r.started === false);
  /* IS 143 ACTUALLY APPLIED? The card must not claim a rule that is not in
     force. Migration 143 widens estimate_board with `counting_since` and
     `started`; until it is run the function returns 131's eight columns and
     those keys are simply absent from every row. Everything else here degrades
     correctly on its own — an undefined `started` is never === false, an
     undefined `counting_since` renders nothing — but the NOTE would have gone
     on describing a 60-day horizon and per-rep start dates that the numbers
     above it were not yet obeying. That is the actuals law applied to prose:
     never label a figure with a rule it is not following. */
  const owedApplied = est.some(r => 'started' in r);
  const tQ = rows.reduce((n,r)=>n+ +r.quoted,0), tA = rows.reduce((n,r)=>n+ +r.appts,0);
  const tM = rows.reduce((n,r)=>n+ +r.missing,0), t$ = rows.reduce((n,r)=>n+ +r.dollars,0);
  /* PIPELINE DOLLAR VALUE (Kevin, 6 Aug: "After they give the estimate — we
     need a pipeline dollar value."). A STOCK, deliberately not windowed like
     the columns above it: every open customer's latest on-file amount, 120-day
     book, sold work out — and lost files out too once 133 is applied (Kevin,
     7 Aug: "sent to lost file and out of the pipeline viewable"; until then
     132's fn still counts them). From pipeline_value(); absent honestly if
     the fn hasn't answered. */
  const pipe = EFF_INTEL.pipe;
  const pipeBy = {}; if (pipe) for (const p of pipe) pipeBy[String(p.rep_id)] = p;
  const pT = pipe ? pipe.reduce((n,p)=>n+ +p.dollars,0) : null;
  const pN = pipe ? pipe.reduce((n,p)=>n+ +p.quoted_open,0) : 0;
  const pU = pipe ? pipe.reduce((n,p)=>n+ +p.unquoted,0) : 0;
  if (!rows.length) return `<div class="card full">
    <div class="card-title">Estimates on file · the numbers in the customer files<span class="feed-tag none">quiet ${esc(label)}</span></div>
    <div class="withheld"><div class="wt">Honest zero</div><div class="wx">No appointments ran and no estimates were captured ${esc(label)}. The moment a rep saves an amount it lands here — server-counted, never from a phone summary.</div></div></div>`;
  return `<div class="card full">
    <div class="card-title">Estimates on file · the numbers in the customer files<span class="feed-tag">live · db</span></div>
    <div class="card-sub">The mandatory number (4 Aug ruling: "after each estimate they have to publish the estimate amount — must be done on every job"), now on the server file, not just the rep’s phone. Quoted can exceed appointments — backfilled paper estimates count, by ruling.</div>
    <div class="stat-grid" style="margin-bottom:14px">
      ${pT != null ? `<div class="stat-tile"><div class="lbl">Open pipeline · quoted</div>
        <div class="val">${money(pT)}</div>
        <div class="sub">${pN} open customer${pN===1?'':'s'} priced${pU?` · <b style="color:var(--red)">${pU} with no $ on file</b>`:''}</div></div>` : ''}
      <div class="stat-tile"><div class="lbl">Quoted ${esc(label)}</div>
        <div class="val">${money(t$)}</div>
        <div class="sub">${tQ} customer${tQ===1?'':'s'} · latest amount per file</div></div>
      <div class="stat-tile"><div class="lbl">Missing an estimate</div>
        <div class="val ${tM?'red':'green'}">${tM}</div>
        <div class="sub">of ${tA} appt${tA===1?'':'s'} that ran ${esc(label)} · owed window only</div></div>
    </div>
    ${rows.map(r => {
      const pager = D.roster && D.roster[String(r.rep_id)];
      const miss = +r.missing;
      const p = pipeBy[String(r.rep_id)];
      /* Every rep carries the date their clock started (143), because the
         rollout was staggered and a miss count without its start date invites
         exactly the comparison that is not fair to make. */
      const since = r.counting_since ? new Date(r.counting_since).toLocaleDateString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric'}) : null;
      if (r.started === false) return `<div class="rep-row" style="opacity:.75">
        <div class="rep-head"><div class="nm">${esc(r.name)}</div>
          <div class="amt"><span style="color:var(--text-dim)">not started</span></div></div>
        <div class="tgt-cap"><span>No estimate has ever been captured on this login — nothing is counted for or against them yet.</span><span></span></div>
      </div>`;
      return `<div class="rep-row${pager?' acc':''}"${pager?` onclick="openRep('${esc(String(r.rep_id))}')"`:''}>
        <div class="rep-head"><div class="nm">${esc(r.name)}</div>
          <div class="amt">${money(+r.dollars)} <span>· ${r.quoted} quoted of ${r.appts} ran</span>${pager?'<span class="acc-chev">›</span>':''}</div></div>
        <div class="tgt-cap"><span>${miss?`<b style="color:var(--red)">${miss} appt${miss===1?'':'s'} with no estimate on file</b>`:'every run appointment has its number'}</span><span>${since?`counting since ${esc(since)}`:''}${p&&+p.dollars>0?`${since?' · ':''}pipeline ${money(+p.dollars)}${+p.unquoted?` · ${p.unquoted} unpriced`:''}`:r.last_at?`${since?' · ':''}last capture ${new Date(r.last_at).toLocaleString('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit',month:'short',day:'numeric'})}`:''}${/* The inherited count stands OUTSIDE the dollars guard on purpose. A book
     that has just changed hands is unpriced BY DEFINITION — that is the work
     — so gating this on `dollars > 0` hid the number in the exact case it
     exists for. Travis picked up 119 files with $0 on them and the row said
     nothing at all. Reads as remaining-to-price, not as a miss count: those
     files carry appointments the new rep never ran, so 143's owed window
     correctly never counts them against him, and this is the only place the
     work shows up.
     No "N still to price" split, though it was written and pulled: quoted_open
     counts a rep's WHOLE priced open book, his own included, so
     inherited - quoted_open understates the remaining work the moment he has
     any files of his own. It reads right today only because the estimates
     table is empty. A number that is correct by accident is not correct. */''}${p&&+p.inherited?`${since||(p&&+p.dollars>0)||r.last_at?' · ':''}<b>${p.inherited} inherited to work</b>`:''}</span></div>
      </div>`; }).join('')}
    ${owedApplied
      ? `<div class="note"><b>What is counted (migration 143, Kevin 11 Aug).</b> An appointment is owed an estimate for <b>60 days</b> and no longer — the customer-history import put years of old jobs in the book, and past two months a job is a closed chapter rather than a missing number. And each rep is counted only from <b>their own first capture</b>, because the field adopted over a week and nobody should be graded on days they did not have the app; that date rides on every row above. <b>Nothing was deleted to achieve either</b> — every amount ever captured is still on file and still in the pipeline figure. Note the pipeline dollars deliberately keep their <b>120-day</b> horizon: the 60-day rule bounds what is OWED, not what the pipeline is worth.</div>`
      : `<div class="note" style="border-left:2px solid var(--gold);padding-left:10px"><b>Migration 143 is not applied yet.</b> These counts are still the old ones — every appointment in a 120-day book, including the years of history the customer import brought in, and no allowance for the fact that the field only adopted the app about two weeks ago. The 60-day owed window and the per-rep &#34;counting since&#34; date arrive the moment <code>143_estimate_owed_window.sql</code> is run; this page needs no redeploy for it. Said here rather than left to be inferred, because a number labelled with a rule it is not following is worse than an unlabelled one.</div>`}
    ${pipe && pipe.some(p => +p.inherited > 0) ? `<div class="note"><b>Someone is carrying a handed-over book (migration 147).</b> When a rep leaves, their open unsold files pass to whoever picks them up, and the row above says how many. Both the customer <b>and</b> the estimate already on that file move together — otherwise a deal the previous rep had already priced would land on the new one as a missing number they never owed. What does <b>not</b> move is history: the quote stays credited to whoever wrote it, and the appointment stays credited to whoever ran it in the counts above. Sold work does not transfer at all — it rolls to the <b>GIO · HOUSE</b> bucket, per the standing catch-all ruling.</div>` : ''}
    <div class="note">From <b>estimate_board()</b> (131/143) and <b>pipeline_value()</b> (132/143): appointments from the CC feed, amounts from the app’s capture — an appointment is covered by an estimate dated its day or later, so a next-morning backfill clears yesterday honestly. The pipeline figure is a stock, not a window: every open customer’s latest on-file amount, 120-day book, sold work out and lost files out (7 Aug ruling, migration 133 — a lost deal lives in the app’s LOST file, never in pipeline money). Counts and totals only, sources never blended; a missing number reads missing, never guessed.</div>
  </div>`;
}

/* CONSISTENCY · STREAKS & STANDARD — server-side streaks so the whole team
   sees them, not just each rep's own phone. Standard = each rep's own goal. */
function cardConsistency(){
  if (!EFF_INTEL) return '';
  const st = EFF_INTEL.streaks;
  if (!st) return effAwait('Consistency · streaks & standard',
    'The streak feed (migration 119, <b>touch_streaks</b>) did not answer.');
  const rows = [...st].sort((a,b)=>+b.streak-+a.streak || +b.week_hits-+a.week_hits || String(a.name).localeCompare(String(b.name)));
  const any = rows.some(r => +r.streak > 0 || +r.week_hits > 0);
  return `<div class="card full">
    <div class="card-title">Consistency · streaks &amp; standard<span class="feed-tag ${any?'':'none'}">${any?'live · db':'awaiting logging'}</span></div>
    <div class="card-sub">Days on standard, counted by the server — working days only, ET buckets, each rep against their own goal. An unfinished today never breaks a streak; it just doesn't count yet.</div>
    ${rows.map(r => {
      const wd = Math.max(1, +r.week_days);
      const p = Math.min(100, Math.round(100*+r.week_hits/wd));
      const pager = D.roster && D.roster[String(r.rep_id)];
      return `<div class="rep-row${pager?' acc':''}"${pager?` onclick="openRep('${esc(String(r.rep_id))}')"`:''}>
        <div class="rep-head"><div class="nm">${esc(r.name)}${+r.streak>=2?` <span style="font-size:10px;color:var(--accent-soft)">🔥${r.streak}d streak</span>`:''}</div>
          <div class="amt">${r.week_hits} of ${r.week_days} <span>· days on standard this week</span>${pager?'<span class="acc-chev">›</span>':''}</div></div>
        <div class="meter"><div class="meter-fill" style="width:${p}%;background:${p>=80?'#6cc28b':p>=40?'#d4b15a':'#8aa094'}"></div></div>
        <div class="tgt-cap"><span>goal ${r.goal}/day</span><span class="${p>=80?'hit':'miss'}">${p}%</span></div>
      </div>`; }).join('')}
    <div class="note">From <b>touch_streaks()</b> (119). The app's streak ring lives on each rep's own device; this is the official team-visible count, same rules — hit your own goal, working days only.</div>
  </div>`;
}

/* SPEED TO FIRST TOUCH — the cadence's front door. The Thank-You gate says
   same day; this is the only surface that will ever say whether the field
   honors it. */
function cardSpeed(){
  if (!EFF_INTEL) return '';
  const sp = EFF_INTEL.speed;
  if (!sp) return effAwait('Speed to first touch',
    'The first-touch feed (migration 119, <b>first_touch_speed</b>) did not answer.');
  const rows = sp.filter(r => +r.appts > 0);
  if (!rows.length) return `<div class="card full">
    <div class="card-title">Speed to first touch<span class="feed-tag none">no new appointments</span></div>
    <div class="withheld"><div class="wt">Honest zero</div><div class="wx">No first-appointments in the last 30 days.</div></div></div>`;
  const touched = rows.filter(r => r.avg_hours != null);
  const tN = touched.reduce((n,r)=>n+ +r.touched,0);
  const team = tN ? touched.reduce((n,r)=>n+ +r.avg_hours*+r.touched,0)/tN : null;
  const mx = Math.max(1, ...touched.map(r=>+r.avg_hours));
  return `<div class="card full">
    <div class="card-title">Speed to first touch<span class="feed-tag">live · db</span></div>
    <div class="card-sub">Hours from a customer's first appointment to the rep's first logged touch, last 30 days. The Thank-You gate says same day — this shows who actually does it. Shorter bar = faster.</div>
    ${team != null ? `<div class="stat-grid" style="margin-bottom:14px;grid-template-columns:1fr">
      <div class="stat-tile"><div class="lbl">Team average</div>
        <div class="val ${team<=24?'green':'gold'}" style="font-size:28px">${team.toFixed(1)}h</div>
        <div class="sub">appointment → first touch · ${tN} customer${tN===1?'':'s'} touched</div></div>
    </div>` : `<div class="withheld"><div class="wt">Honestly absent</div><div class="wx">First-appointments exist, but none have a logged touch yet — there is no speed to average. The untouched counts below are the story.</div></div>`}
    ${rows.sort((a,b)=>(+a.avg_hours||1e9)-(+b.avg_hours||1e9)).map(r => {
      const pager = D.roster && D.roster[String(r.rep_id)];
      const has = r.avg_hours != null;
      return `<div class="rep-row${pager?' acc':''}"${pager?` onclick="openRep('${esc(String(r.rep_id))}')"`:''}>
        <div class="rep-head"><div class="nm">${esc(r.name)}</div>
          <div class="amt">${has?(+r.avg_hours).toFixed(1)+'h':'—'} <span>· ${r.touched} of ${r.appts} touched${+r.untouched_48h?` · <b style="color:var(--gold)">${r.untouched_48h} untouched 48h+</b>`:''}</span>${pager?'<span class="acc-chev">›</span>':''}</div></div>
        ${has?`<div class="meter"><div class="meter-fill" style="width:${Math.max(4,Math.round(100*+r.avg_hours/mx))}%;background:${+r.avg_hours<=24?'#6cc28b':+r.avg_hours<=72?'#6ba8c9':'#d4b15a'}"></div></div>`:''}
      </div>`; }).join('')}
    <div class="note">From <b>first_touch_speed()</b> (119): CC appointment times joined to app touches. "—" means no touch ever followed — honestly absent, and the untouched count says how often. 48h grace before an appointment counts as untouched, so this morning's appointment is not an accusation.</div>
  </div>`;
}

/* EFFORT × RESULTS · THE QUADRANT — touches against signed dollars, one dot
   per seller, this month. Presentation only: both feeds already live. */
function cardQuadrant(){
  const E = D.effort;
  const reps = (D.windows.month && D.windows.month.reps) || [];
  const rows = E.rows
    .filter(r => D.roster && D.roster[String(r.id)] && D.roster[String(r.id)].sells)
    .map(r => { const w = reps.find(x => String(x.id) === String(r.id));
      return { id:r.id, name:r.name, initials:r.initials||r.name.slice(0,2).toUpperCase(),
        t:r.month.t, rev:w?w.rev:0 }; });
  if (!rows.length || !rows.some(r => r.t > 0)) return `<div class="card full">
    <div class="card-title">Effort × results · the quadrant<span class="feed-tag none">awaiting logging</span></div>
    <div class="withheld"><div class="wt">Withheld</div><div class="wx">The quadrant needs touch volume to mean anything. It lights up as the field logs — signed dollars are already flowing on the vertical.</div></div></div>`;
  const mxT = Math.max(1, ...rows.map(r=>r.t)) * 1.15;
  const mxR = Math.max(1, ...rows.map(r=>r.rev)) * 1.15;
  const med = a => { const s=[...a].sort((x,y)=>x-y); return s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2; };
  const medT = med(rows.map(r=>r.t)), medR = med(rows.map(r=>r.rev));
  const X = v => 6 + 88 * v / mxT, Y = v => 94 - 88 * v / mxR;
  const colorOf = r => r.t>=medT && r.rev>=medR ? 'var(--green)'
    : r.t<medT && r.rev>=medR ? 'var(--gold)'
    : r.t>=medT ? 'var(--blue)' : '#8aa094';
  return `<div class="card full">
    <div class="card-title">Effort × results · the quadrant<span class="feed-tag cc">live · cc</span><span class="feed-tag">live · app</span></div>
    <div class="card-sub">This month. Right = more touches, up = more signed. Axes sit at the team median. Tap a dot for the rep's one-pager.</div>
    <div class="quad">
      <div class="qx" style="top:${Y(medR)}%"></div>
      <div class="qy" style="left:${X(medT)}%"></div>
      <div class="qtag" style="top:8px;right:10px">model — clone it</div>
      <div class="qtag" style="top:8px;left:10px">luck? — will it repeat</div>
      <div class="qtag" style="bottom:8px;right:10px">coach — effort's there</div>
      <div class="qtag" style="bottom:8px;left:10px">the talk</div>
      ${rows.map(r => {
        const pager = D.roster && D.roster[String(r.id)];
        return `<div class="qdot" style="left:${X(r.t)}%;top:${Y(r.rev)}%;background:${colorOf(r)}"
          title="${esc(r.name)} — ${r.t} touches, ${short(r.rev)}"${pager?` onclick="openRep('${esc(String(r.id))}')"`:''}>${esc(String(r.initials).slice(0,3))}</div>`; }).join('')}
    </div>
    <div class="quad-cap"><span>← fewer touches</span><span>more touches →</span></div>
    <div class="note">${rows.sort((a,b)=>b.rev-a.rev).map(r=>`<b>${esc(r.name.split(' ')[0])}</b> ${r.t} · ${short(r.rev)}`).join(' &nbsp; ')}<br/>Money from CC + Billdu (the month's signed board), touches from the app — provenance named, sources never blended. Position is the shape; these numbers are the fact.</div>
  </div>`;
}

/* ── THE EFFORT ROOM ─────────────────────────────────────────────────────────
   Seven instruments behind a PREVIEW SHELF that is always drawn.

   None of this stopped being true and none of it is deleted — it stopped being
   the first thing. The console's reading order is what needs him, the money,
   who sold it, what marketing produced, and where effort and results disagree.
   The working — who dialled, who finished the play, who captured the number, how
   fast the first touch went out — is what he opens when one of those six bands
   raises a question, so it lives behind one tap instead of under six scrolls.

   What changed: the fold used to be a bare header carrying one summary line, and
   that is a name with nothing behind it. To know the room was worth opening you
   had to already know what was inside — which is exactly what a console cannot
   assume, and it is the most valuable data on the page. So the fold now opens
   onto a shelf of miniatures, one per instrument, each drawn from the same feed
   its full card reads. The room still folds; it no longer hides.

   Two doors, mutually exclusive by construction — see ROOM_VIEW. A tile opens
   its own instrument alone; the shelf control opens all seven in order. Both
   reverse. The body is built from exactly one branch, so opening one and then
   expanding all cannot render an instrument twice.

   Each card inside is exactly the card its own function builds — same numbers,
   same source badges, same notes — it loses only its box, because bordered cards
   inside a bordered card read as clutter. What is open is remembered per device,
   like the other folds; the shelf itself is never folded away. ─────────────── */
const ROOM_STORE = 'lcc.room';
/* ONE value, never two flags. The room is in exactly one of three states —
   nothing open, one instrument open (solo), or every instrument open (all) —
   and the body is built from exactly one branch of it. That is what makes
   "open a tile, then expand all" incapable of rendering an instrument twice:
   there is no second place for an open card to come from. */
let ROOM_VIEW = (() => {
  try {
    const raw = localStorage.getItem(ROOM_STORE);
    if (raw === '1') return { mode:'all' };   // the pre-shelf drawer's stored format
    const j = JSON.parse(raw || 'null');
    if (j && j.mode === 'all') return { mode:'all' };
    if (j && j.mode === 'solo' && j.key) return { mode:'solo', key:j.key };
  } catch (e) {}
  return { mode:'none' };
})();
function roomSave(){ try { localStorage.setItem(ROOM_STORE, JSON.stringify(ROOM_VIEW)); } catch (e) {} }

/* The room sits mid-page, so it redraws its own subtree rather than calling
   render() — a full redraw would throw the reader back up the page. */
function roomRedraw(){
  const el = document.getElementById('effort-room');
  if (!el) { render(); return; }
  const y = window.scrollY;
  /* The railed body class says which form of the room is on screen, so an
     in-place redraw can never swap the section form for the shelf one. */
  el.outerHTML = effortRoom(document.body.classList.contains('railed'));
  window.scrollTo({ top: y });
  /* No instrument in the room draws to a canvas today. The guard stays because
     one that grows a chart later must be measured after it is visible: a canvas
     sized while its container was hidden has no dimensions to draw into. */
  if (document.querySelector('#effort-room canvas')) drawCharts();
}
function roomSolo(key){
  ROOM_VIEW = (ROOM_VIEW.mode === 'solo' && ROOM_VIEW.key === key) ? { mode:'none' } : { mode:'solo', key };
  roomSave(); roomRedraw();
}
function roomAll(){
  ROOM_VIEW = ROOM_VIEW.mode === 'all' ? { mode:'none' } : { mode:'all' };
  roomSave(); roomRedraw();
}
function roomClose(){ ROOM_VIEW = { mode:'none' }; roomSave(); roomRedraw(); }

/* ── THE PREVIEW TILES ───────────────────────────────────────────────────────
   Each tile is a MINIATURE of its instrument, not an icon and not a label: the
   same feed the full card reads, drawn in that instrument's own shape at small
   scale — a segmented bar for the channel mix, a red/yellow/green book for the
   Light, stub meters for the boards that rank reps, a single headline figure
   for the two instruments that ARE a single figure.

   Three states, and the third is the one that matters. Reading (the RPC has
   not answered yet — these load after first paint, so the shelf must say so
   rather than imply a zero). No feed, or an honest zero: said in words. Live:
   the shape. A tile with nothing behind it never draws a flat bar, because a
   shape with no data in it reads as a working instrument reporting nothing —
   a different claim, and a false one. Same law the cards keep. */
const ptEmptyBox = s => `<div class="pt-empty">${s}</div>`;
const ptNum = (v, cls) => `<div class="pt-num${cls ? ' ' + cls : ''}">${v}</div>`;
const ptCap = s => `<div class="pt-cap">${s}</div>`;
const ptFirst = n => esc(String(n || '').split(' ')[0]);
/* A stub meter set — the shape every rep-ranking board in this room has. */
const ptMeters = rows => `<div class="pt-meters">${rows.map(r =>
  `<div class="pt-mrow"><div class="pt-mnm">${r.nm}</div>
    <div class="pt-mbar"><i style="width:${r.p}%;background:${r.c}"></i></div></div>`).join('')}</div>`;

function ptChannelMix(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const mix = EFF_INTEL.mix;
  if (!mix) return ptEmptyBox('No feed yet');
  const rows = mix.filter(r => +r.touches > 0);
  const win = { day:'today', week:'this week', month:'this month' }[EFF_INTEL.win] || EFF_INTEL.win;
  if (!rows.length) return ptEmptyBox(`No touches logged ${esc(win)} — a real zero`);
  const C = { call:'#6cc28b', text:'#6ba8c9', email:'#d9b96a' };
  const n = k => rows.reduce((a, r) => a + (+r[k] || 0), 0);
  const calls = n('calls'), texts = n('texts'), emails = n('emails'), tot = Math.max(1, calls + texts + emails);
  return ptNum(calls + texts + emails) +
    `<div class="pt-seg">${[['call',calls],['text',texts],['email',emails]].filter(x => x[1] > 0)
      .map(([k,v]) => `<i style="width:${100*v/tot}%;background:${C[k]}"></i>`).join('')}</div>` +
    ptCap(`${calls} call · ${texts} text · ${emails} email`);
}

function ptTouchLight(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const light = EFF_INTEL.light;
  if (!light) return ptEmptyBox('No feed yet');
  const rows = light.filter(r => +r.book > 0);
  if (!rows.length) return ptEmptyBox('No seller carries a live book yet');
  const g = rows.reduce((a,r) => a + +r.green, 0), y = rows.reduce((a,r) => a + +r.yellow, 0),
        rd = rows.reduce((a,r) => a + +r.red, 0), b = Math.max(1, g + y + rd);
  const pct = Math.round(100 * g / b);
  return ptNum(pct + '%', pct >= 50 ? 'green' : pct >= 30 ? 'gold' : 'red') +
    `<div class="pt-seg">
      ${g ? `<i style="width:${100*g/b}%;background:var(--green)"></i>` : ''}
      ${y ? `<i style="width:${100*y/b}%;background:var(--gold)"></i>` : ''}
      ${rd ? `<i style="width:${100*rd/b}%;background:var(--red)"></i>` : ''}
    </div>` +
    ptCap(`of ${g + y + rd} live at green · ${rd} red`);
}

/* The effort board reads D.effort, which is already in memory at first paint —
   so this is the one tile that carries a real number before the RPCs land. */
function ptEffort(){
  const E = D.effort;
  if (!E || !E.rows.length) return ptEmptyBox('No roster yet');
  const K = EFFWIN, span = E.spans ? (E.spans[K] || 1) : 1;
  const label = { day:'today', week:'this week', month:'this month', year:'this year' }[K] || '';
  const t = E.rows.reduce((n, r) => n + r[K].t, 0);
  if (!t) return ptEmptyBox(`Nothing logged ${esc(label)} — zeros are real, not a broken feed`);
  const goalOf = r => (r.goal ?? E.defaultGoal) * span;
  const onStd = E.rows.filter(r => goalOf(r) > 0 && r[K].t >= goalOf(r)).length;
  const top = [...E.rows].sort((a,b) => b[K].t - a[K].t).filter(r => r[K].t > 0).slice(0, 3);
  return ptNum(t) + ptMeters(top.map(r => {
    const goal = goalOf(r), p = goal ? Math.min(100, Math.round(r[K].t / goal * 100)) : 0;
    return { nm: ptFirst(r.name), p, c: p >= 100 ? 'var(--green)' : 'var(--blue)' };
  })) + ptCap(`touches ${esc(label)} · ${onStd} of ${E.activeReps} on standard`);
}

/* This instrument IS one big number, so its miniature is that number. */
function ptTouchProof(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const close = EFF_INTEL.close;
  if (!close) return ptEmptyBox('No feed yet');
  const rows = close.filter(r => r.avg_touches_to_close != null);
  const totC = rows.reduce((n,r) => n + (+r.closes_with_touches || 0), 0);
  if (!totC) return ptEmptyBox('No close in 90 days carries touch history yet');
  const team = rows.reduce((n,r) => n + (+r.avg_touches_to_close) * (+r.closes_with_touches || 0), 0) / totC;
  return ptNum(team.toFixed(1), 'accent') +
    ptCap(`avg touches to a signed deal · ${totC} close${totC === 1 ? '' : 's'} with history`);
}

/* The enforcement number leads, because that is the one Kevin works the phones
   with — the quoted dollars ride under it. */
function ptEstimates(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const est = EFF_INTEL.est;
  if (!est) return ptEmptyBox('No feed yet');
  const label = EFF_INTEL.win === 'day' ? 'today' : EFF_INTEL.win === 'month' ? 'this month' : 'this week';
  const rows = est.filter(r => +r.appts > 0 || +r.quoted > 0 || r.started === false);
  if (!rows.length) return ptEmptyBox(`No appointment ran ${esc(label)}`);
  const tM = rows.reduce((n,r) => n + +r.missing, 0), tA = rows.reduce((n,r) => n + +r.appts, 0);
  const t$ = rows.reduce((n,r) => n + +r.dollars, 0);
  return ptNum(tM, tM ? 'red' : 'green') +
    ptCap(`missing of ${tA} appt${tA === 1 ? '' : 's'} ${esc(label)}<br/>${money(t$)} quoted`);
}

function ptSpeed(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const sp = EFF_INTEL.speed;
  if (!sp) return ptEmptyBox('No feed yet');
  const rows = sp.filter(r => +r.appts > 0);
  if (!rows.length) return ptEmptyBox('No first appointments in the last 30 days');
  const touched = rows.filter(r => r.avg_hours != null);
  const tN = touched.reduce((n,r) => n + +r.touched, 0);
  if (!tN) return ptEmptyBox('First appointments exist, none has a logged touch yet');
  const team = touched.reduce((n,r) => n + +r.avg_hours * +r.touched, 0) / tN;
  const mx = Math.max(1, ...touched.map(r => +r.avg_hours));
  const top = [...touched].sort((a,b) => +a.avg_hours - +b.avg_hours).slice(0, 3);
  return ptNum(team.toFixed(1) + 'h', team <= 24 ? 'green' : 'gold') +
    ptMeters(top.map(r => ({ nm: ptFirst(r.name), p: Math.max(6, Math.round(100 * +r.avg_hours / mx)),
      c: +r.avg_hours <= 24 ? 'var(--green)' : +r.avg_hours <= 72 ? 'var(--blue)' : 'var(--gold)' }))) +
    ptCap('appointment → first touch · shorter is faster');
}

function ptConsistency(){
  if (!EFF_INTEL) return ptEmptyBox('Reading…');
  const st = EFF_INTEL.streaks;
  if (!st) return ptEmptyBox('No feed yet');
  if (!st.some(r => +r.streak > 0 || +r.week_hits > 0)) return ptEmptyBox('No day on standard logged yet');
  const best = [...st].sort((a,b) => +b.streak - +a.streak)[0];
  const bs = +best.streak || 0;
  const top = [...st].sort((a,b) => +b.week_hits - +a.week_hits || +b.streak - +a.streak).slice(0, 3);
  const hits = st.reduce((n,r) => n + +r.week_hits, 0), days = st.reduce((n,r) => n + +r.week_days, 0);
  /* A zero streak is not a headline — when nobody has one running, the honest
     lead figure is how much of the week the team held its standard. */
  return (bs ? ptNum(bs + 'd', 'gold') : ptNum(Math.round(100 * hits / Math.max(1, days)) + '%', 'blue')) +
    ptMeters(top.map(r => {
      const p = Math.min(100, Math.round(100 * +r.week_hits / Math.max(1, +r.week_days)));
      return { nm: ptFirst(r.name), p, c: p >= 80 ? 'var(--green)' : p >= 40 ? 'var(--gold)' : 'var(--text-dim)' };
    })) +
    ptCap(bs ? `${ptFirst(best.name)}'s streak · days on standard this week`
             : 'of days on standard this week · no streak running');
}

/* ── THE ROOM ────────────────────────────────────────────────────────────────
   One registry drives both halves. The shelf renders `tile` and the body
   renders `card` off the same rows in the same order, so a tile and the
   instrument it opens can never drift apart or fall out of sequence.

   prodBand() is deliberately NOT in here: it is the room's branded band, not
   an instrument — it has no feed and no number, so there is nothing to draw a
   miniature of. It rides at the top of the fully-expanded room, where it
   always has. Seven instruments, seven tiles. */
const ROOM_KIT = [
  { key:'mix',     name:'Channel mix · who dials',       card: cardChannelMix,  tile: ptChannelMix },
  { key:'light',   name:'The 4-Touch Light',             card: cardTouchLight,  tile: ptTouchLight },
  { key:'board',   name:'The Effort Board',              card: cardEffort,      tile: ptEffort },
  { key:'proof',   name:'Touches per close',             card: cardTouchProof,  tile: ptTouchProof },
  { key:'est',     name:'Estimates on file',             card: cardEstimates,   tile: ptEstimates },
  { key:'speed',   name:'Speed to first touch',          card: cardSpeed,       tile: ptSpeed },
  { key:'streaks', name:'Consistency · streaks',         card: cardConsistency, tile: ptConsistency },
];

function effortRoom(direct){
  /* THE SECTION FORM. On the railed desktop this room IS the People section:
     the rail already solos it, so a second door in front of it is a door
     inside a door — the seven instruments render open, no tiles, no solo/all
     state, nothing to close. The phone keeps the shelf below: there the room
     still sits mid-column, and seven full instruments in a row is the wall
     the shelf was built to prevent. lcc.room keeps governing the phone. */
  if (direct) return `<div class="room" id="effort-room">
    <div class="shelf-head">
      <div class="shelf-titles">
        <div class="card-title">Why a rep's numbers look like that</div>
        <div class="card-sub">Seven instruments — who dials, who finishes the plays, who captures the number, how fast the first touch goes out. This is where a rep gets diagnosed rather than ranked.</div>
      </div>
    </div>
    <div class="room-body">${prodBand()}${ROOM_KIT.map(i => i.card()).join('')}</div>
  </div>`;
  const all = ROOM_VIEW.mode === 'all';
  const solo = ROOM_VIEW.mode === 'solo' ? ROOM_KIT.find(i => i.key === ROOM_VIEW.key) : null;

  const tiles = ROOM_KIT.map(i => {
    const on = !!solo && solo.key === i.key;
    return `<button type="button" class="ptile${on ? ' on' : ''}" onclick="roomSolo('${i.key}')"
      aria-expanded="${on ? 'true' : 'false'}">
      <div class="pt-h">${esc(i.name)}</div>
      <div class="pt-b">${i.tile()}</div>
    </button>`;
  }).join('');

  /* Exactly one branch builds the body. There is no state in which an
     instrument can be emitted by both. */
  let body = '';
  if (all) {
    body = `<div class="room-body">
      <div class="room-open-head"><div class="ttl">All seven, full size</div>
        <button type="button" class="shelf-all" onclick="roomClose()">Close</button></div>
      ${prodBand()}${ROOM_KIT.map(i => i.card()).join('')}
    </div>`;
  } else if (solo) {
    body = `<div class="room-body">
      <div class="room-open-head"><div class="ttl">${esc(solo.name)}</div>
        <button type="button" class="shelf-all" onclick="roomClose()">Close</button></div>
      ${solo.card()}
    </div>`;
  }

  return `<div class="room" id="effort-room">
    <div class="shelf-head">
      <div class="shelf-titles">
        <div class="card-title">Why a rep's numbers look like that</div>
        <div class="card-sub">Seven instruments behind the bands above — who dials, who finishes the plays, who captures the number, how fast the first touch goes out. This is where a rep gets diagnosed rather than ranked. Tap one to open it full size, or open them all.</div>
      </div>
      <button type="button" class="shelf-all" onclick="roomAll()">${all ? 'Close all' : 'Open all seven'}</button>
    </div>
    <div class="shelf-grid">${tiles}</div>
    ${body}
  </div>`;
}

/* ════ THE MARKETING BOARD · FEEDS AND LAWS ══════════════════════════════════
   ONE board behind the same preview-shelf pattern the Effort Room uses,
   drilling brand → source → rep. It absorbed the three surfaces marketing
   used to render on — the two-board drawer and the deep ROI band beneath it —
   because those three could show disagreeing numbers on one screen, and the
   doctrine is one number, one source, one place.

   THE SOURCE LEDGER — what each source cost and what it returned, priced.
   THE REP × SOURCE GRID — who closes what, so appointments can be
             jockeyed to the right people.

   TEN IS THE LINE. The owner decides spend by whether a source returns ten
   times what it cost, so every source is judged against ten on sight rather
   than against each other: at or above reads green, below reads red, and within
   ±1 of the line reads neutral because at 9.6x versus 10.4x the difference is a
   single deal, not a decision. ─────────────────────────────────────────────── */

/* Kevin's ruling, and it is a RULING, not a lookup: Referral and Previous
   Customer are free revenue. They have no spend and therefore no ROI, and their
   cells read an em-dash — never 0, never "not entered", and never excluded from
   the board, because their VOLUME beside the paid sources is the comparison he
   wants. Adding a name to this set changes what the owner is told a channel
   costs, so it needs his word, not a code change. Note what is deliberately NOT
   here: "Referral- Self Generated", "Yard Sign" and "BNI" are plausibly free
   too and are left as paid-until-typed, because guessing free would make a
   channel look costless — the error that runs in the direction of overspending. */
const MK_FREE = new Set(['Referral', 'Previous Customer']);
const MK_LINE = 10;   // the kill threshold
const MK_NEAR = 1;    // ±this around the line reads neutral
/* THE THIN FLOOR — 10 leads behind a cell before it may be coloured.
   Chosen off the shape of the live grid, not picked round: at n=10 one extra
   close moves a cell 10 points, which is wider than the whole ±8 neutral band
   below it. So under 10 the cell literally cannot tell "strong" from "median",
   and colouring it would be reading noise as a verdict — the same failure as
   the "closes better on lighter weeks" finding that shipped off 17
   appointments. 53 of the 106 live cells clear this; the rest keep their raw
   counts and stay grey. */
const MK_THIN = 10;
const MK_BAND = 8;    // points either side of the grid median before a cell earns a colour

/* ⚠️ THE LEADS COLUMN IS BLIND BEFORE THIS MONTH, AND IT SAYS SO.
   rpt_report_marketing_roi windows leads on `jobs.created_at` — the timestamp
   OUR ROW was inserted, not when the lead arrived at CC. The warehouse was
   loaded in one shot on 20 Jul 2026 (11,119 of 11,558 rows carry a created_at
   before 21 Jul), so every lead in company history is stamped July 2026:
     · a JULY window returns the whole backfill — Google reads 4,282 leads
       against a true 253, seventeen times over;
     · any month BEFORE July 2026 returns zero leads, not "no data";
     · August 2026 onward is correct — measured 112 true vs 113 reported.
   The true date is `cc_raw->>'project_created_at'`, populated on all 11,558
   rows back to Jun 2024, but it is inside a jsonb the console deliberately
   does not download (cc_raw is the biggest column in the table and this page
   already reads ~5.8MB).
   So the board REFUSES the figure for contaminated months rather than printing
   it or quietly swapping in a different source. ROI is unaffected — it is
   closed dollars ÷ spend, and closed dollars are dated by rpt_signings.signed_on,
   which is correct in every window. Fixing this properly is a new RPC that
   windows on project_created_at; it is written up in the PR, not bodged here. */
const MK_LEADS_FROM = '2026-08';   // first month whose lead counts are real
/* And the same RPC's by_source section is blind one month further back — its
   leads CTE keys on the same backfilled jobs.created_at, so a pre-July window
   returns [] by_source rows while the signed dollars are real. Months before
   this read from rpt_marketing_revenue_by_source_month (migration 172)
   instead; see loadMarketing. */
const MK_SRC_RPC_FROM = '2026-07'; // first month the RPC can group by source

/* Eastern, matching the window the RPC buckets leads in (`at time zone
   'America/New_York'`). A UTC month key would drift the boundary by 4-5 hours
   and move deals between months at the seam. en-CA renders YYYY-MM-DD. */
const mkET = ts => { try { return new Date(ts).toLocaleDateString('en-CA', { timeZone:'America/New_York' }); }
                     catch (e) { return String(ts).slice(0, 10); } };

const mkRoiClass = roi => Math.abs(roi - MK_LINE) <= MK_NEAR ? 'near' : (roi >= MK_LINE ? 'hit' : 'miss');

/* Typed spend for one source in one month. null means NO ROW — which renders
   "not entered", never zero. A zero-spend month is a thing the office can
   actually type, and it is a different claim from never having typed.
   Since 167 a month is either ONE 'all' row or per-brand rows (the trigger
   forbids both at once), so summing the rows is the total either way.
   THIS IS THE PRICING READ: rows whose note carries ⚑3 are unattributable
   vendor spend (no CC source tag — Next Level, CallFire, Mailchimp, Marlie,
   Zapier, GoDaddy, Canva) and are excluded here so they can never feed a
   per-source ROI, CPL or CPU. They stay in mkSpendSplit (the ledger read)
   and in mkBookTotal (every month total): held in totals, priced nowhere. */
function mkSpendOf(src, monthKey){
  if (!MKT || !Array.isArray(MKT.spend)) return null;
  const rows = MKT.spend.filter(s => s.source_name === src && String(s.month).slice(0, 10) === monthKey
    && !String(s.note || '').includes('⚑3'));
  return rows.length ? rows.reduce((n, r) => n + Number(r.amount), 0) : null;
}

/* ── IS THIS SOURCE PAID AT ALL? ──────────────────────────────────────────────
   The board has always insisted that "nobody typed a cost" and "there is no
   cost" are different claims. Until now only MK_FREE — a two-name ruling —
   could say the second, so every other costless channel read "not entered"
   forever: Website, Facebook, Ref-Self-Gen and Slug A Bug have signed money
   month after month and have never had a dollar against them, and the board
   nagged about all four as though the office were behind on data entry.
   THE EVIDENCE IS THE BOOK ITSELF, not another ruling to keep in sync: a
   source is PAID if the office has ever keyed a real cost for it in any month
   — that is what proves a cost exists to be typed. One that never has is
   EARNED, and reads $0 rather than an accusation. ⚑3 rows do not count: they
   are unattributable vendor tooling that prices no source anywhere, so a
   Marlie AI tooling line does not make "Marlie AI" a paid channel.
