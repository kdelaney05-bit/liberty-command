       SPENT. See cardBrandReturn. */
    /* `d` / `v` — signed date and contract value, for the month rep board.
       `t` — cc_raw->>project_created_at, THE LEAD CLOCK (see the jobs query
       above for why it and nothing else): the rep board's leads column dates
       on it, which is what lets a monthly rep board exist at all while the
       RPC's own leads column is still backfill-dated (MK_LEADS_FROM). These
       three fields ride on rows already downloaded — no extra network, only
       the slim projection getting three columns wider. */
    mktJobs: allJobs
      .filter(j => !j.reporting_excluded && j.cc_lead_source_id && j.cc_project_id)
      .map(j => ({ p: String(j.cc_project_id), r: j.rep_id ? String(j.rep_id) : null,
                   l: String(j.cc_lead_source_id), b: rollup(j.cc_company_id),
                   d: j.contract_signed_at || null, v: Number(j.fin_sold_amount || 0),
                   t: j.lead_at || null })),
    /* Booked, not run: "appointments set" is what the setters produced off a
       source, so it dates by cc_created_at. The console keeps these two facts
       apart everywhere else (see cardApptByCompany) and this board does too.
       `s` / `r` — appointment START and the rep who held it, which is a
       different question from who owns the file today and the only way to see
       a book that has changed hands. mkInherited() reads exactly these. */
    mktAppts: appts.filter(a => a.cc_project_id && a.cc_created_at && !a.is_internal)
      .map(a => ({ p: String(a.cc_project_id), c: a.cc_created_at,
                   s: a.starts_at || null, r: a.rep_id ? String(a.rep_id) : null })),
    /* ── THE ROSTER LAW, CORRECTED ────────────────────────────────────────
       WAS: `r.active && r.sells`. That filter asked "who sells here NOW" of
       boards whose entire subject is what already happened, and the answer
       silently deleted people. Jared Heideman closed 26 jobs for $137,116 in
       July, left, and went with it — his Google column, the strongest on the
       grid, gone from the one board built to decide who gets the next Google
       lead. A roster filtered to current employees cannot describe a past
       period.
       NOW: every Contractors Cloud seller the roster has ever carried, live
       or departed, tagged with which they are. `sells || role === 'sales'`
       keeps migration 098's actual law — a non-selling manager still has no
       closing rate to read and still lands no row — because `sells` is
       flipped off at departure alongside `active`, so the flag alone can no
       longer recognise a seller who has left. Presence in the PERIOD'S data
       is what puts a row on a board; the roster only supplies the name and
       the departed tag.
       `reps`, not `allReps`: migration 011's four invented demo sellers are
       already dropped upstream and have no business re-entering here. */
    mktSellers: reps.filter(r => r.sells || r.role === 'sales')
      .map(r => ({ id: String(r.id), name: r.name || '—', gone: !r.active })),
    /* cc_lead_id → rollup_name, migration 163's canonical grouping. Falls back
       to `name` only if a row somehow has no rollup; never the other way. */
    mktRollup: Object.fromEntries(leadNames.map(e =>
      [String(e.cc_lead_id), e.rollup_name || e.name || null])),
    weeks, daily, monthly, cadence, targets, monthShape, quotaBoard, effort, leadSources, qb, appointments,
    // window bounds as plain YYYY-MM-DD, so the Billdu feed (whose dates are
    // already resolved to Eastern) can be filtered without re-parsing timezones
    windowRange: Object.fromEntries(Object.entries(WINS).map(([k,wv]) =>
      [k, [ymdOf(wv.from), ymdOf(wv.to)]])),
    windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => [k, {
      label: wv.label, prevLabel: wv.pLabel, prevSpanDays: elapsedDays(wv),
      ...slice(wv.from, wv.to),
      // reps on prev too: when a week has just reset, "who closed last week" is
      // the context that stops an empty board reading as a broken one
      prev: (p => ({ ...p.company, brands:p.brands, reps:p.reps, closeByBrand:p.closeByBrand }))(slice(...prevRange(wv))),
      // and the FULL prior period, not just the like-for-like slice — on a Monday
      // the like-for-like comparison is one day against one day, which is not the
      // number he means when he says "last week"
      prevFull: (p => ({ ...p.company, brands:p.brands, reps:p.reps }))(slice(wv.pFrom, wv.pTo)),
    }])),
  };
}

/* ── ROLE GATE ──────────────────────────────────────────────────────────────
   Kevin's order, 2026-07-24: a SALES login must never land on the owner console.
   Reps are getting invite links that finish on this domain ("setting a new
   password signs you in on this device"), so without this a rep who completes a
   reset lands straight in the owner console.

   The check sits at the TOP of loadAll() on purpose: sign-in, recovery-link and
   restored-session all funnel through here, so one gate covers every door, and it
   returns BEFORE a single row is requested — no owner-flavoured shell, no partial
   render, no data fetched and then hidden.

   ⚠️ This is the UI half only. Several console_* views are SECURITY DEFINER and
   answer a sales JWT directly over the REST API — see the note to Kevin. This
   stops the screen; it does not stop curl. */
async function consoleRoleGate(){
  try {
    const s = sess.get(); if (!s || !s.access_token) return false;
    const sub = JSON.parse(atob(s.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;
    const r = await fetch(`${SB_URL}/rest/v1/reps?id=eq.${sub}&select=role,name`,
      { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + s.access_token } });
    const rows = r.ok ? await r.json() : [];
    const role = rows[0]?.role ?? 'sales';
    if (['manager','owner','admin'].includes(role)) return true;

    gate.style.display = 'flex'; appEl.style.display = 'none';
    document.getElementById('loginform').style.display = 'none';
    const rf = document.getElementById('resetform'); if (rf) rf.style.display = 'none';
    const err = document.getElementById('gateerr'); if (err) err.textContent = '';
    if (!document.getElementById('repnotice')) {
      document.querySelector('.gatebox')?.insertAdjacentHTML('beforeend',
        `<div id="repnotice" class="gatefoot" style="line-height:1.7">
           <b>You're all set — but this isn't your screen.</b><br/>
           This is the owner console. Your password is saved, so open the
           <b>TruReview app</b> and sign in there with the same email and password.
           <br/><button type="button" class="linkbtn" style="margin-top:10px"
             onclick="signOut()">Sign out</button>
         </div>`);
    }
    return false;
  } catch (e) {
    // Fail CLOSED: if the role cannot be established, do not render the console.
    gate.style.display = 'flex'; appEl.style.display = 'none';
    return false;
  }
}

async function loadAll(){
  if (!(await consoleRoleGate())) return;
  /* A visible counter, because a silent wait is indistinguishable from a hang.
     This console reads about 5.8MB across four large tables; even fast that is a
     few seconds, and Kevin reported the silent version as "stuck". */
  let loaded = 0;
  const tick = n => {
    loaded += n;
    const el2 = document.getElementById('loadcount');
    if (el2) el2.textContent = loaded.toLocaleString() + ' rows';
  };
  appEl.innerHTML = `<div class="loading">Reading live<br/>Contractors Cloud · QuickBooks
    <div id="loadcount" style="margin-top:10px;color:var(--accent-soft)">starting…</div></div>`;
  showApp();
  const qp = p => q(p, { onPage: tick });
  // Only the columns something on the page actually renders. Every extra field
  // here is weight a phone carries on every open.
  const [jobs, appts, reps, touches, repTargets, playComponents, leadNames] = await Promise.all([
    // reporting_excluded comes down WITH the rows rather than being filtered in
    // the query, so the console can say how much it left out instead of silently
    // showing a smaller number than last time.
    /* lead_at / lead_appt_at are lifted OUT of cc_raw by PostgREST rather than
       pulling the blob: cc_raw is the whole CC project payload and fetching it
       for 11.5K rows would roughly double what a phone downloads on every open.
       Two scalar fields cost about 50 bytes a row.

       THESE ARE THE ONLY HONEST LEAD CLOCK IN THE DATABASE. Not
       `customers.created_at` and not `jobs.created_at` — both are our row-insert
       time, and the warehouse was backfilled in one shot on 20 Jul 2026 (10,914
       of 11,322 customers on that single day), so either one dates 96% of the
       history to a Monday in July. `cc_raw->>project_created_at` is CC's own
       stamp and survives the import: 11,558 of 11,558 populated across 609
       distinct days, no spike on the backfill date (30 leads, against 29 the
       following Monday), and a real business week behind it — Mon 25.9%, Sat
       1.2%, Sun 0.8%, with 1,512 distinct clock times across 1,561 Monday rows.
       A batch stamp cannot look like that. */
    qp('jobs?select=cc_company_id,cc_project_id,rep_id,contract_signed_at,completed_at,cc_lead_source_id,fin_sold_amount,reporting_excluded,reporting_exclusion_reason,title,lead_at:cc_raw->>project_created_at,lead_appt_at:cc_raw->>project_first_appointment_at&source=eq.cc'),
    // cc_created_at is what makes a like-for-like booking comparison possible:
    // "what was on the books last Monday" has to count only what was booked BY
    // last Monday, not what the week eventually filled with.
    /* Appointments only as far back as anything on the page displays. That used
       to be the 12-month calendar-load chart, and a 13-month window covered it
       with a month to spare. The YTD rhythm comparison now reaches further — it
       needs last year's same months — so the floor is January 1st of the prior
       year (see APPT_SINCE), which is the deepest surface plus nothing. Kept on
       EITHER date, since the booked series is creation-dated and the calendar
       series is appointment-dated, and a row can be recent by one and not the
       other. */
    qp(`cc_appointments?select=rep_id,starts_at,cc_project_id,cc_created_at,synced_at,is_internal&or=(starts_at.gte.${APPT_SINCE},cc_created_at.gte.${APPT_SINCE})`),
    // source is the sample/real tag from migration 011; sells is Kevin's build-36
    // ruling on who belongs on a seller board (077). Both come down so the
    // roster can be filtered the same way the jobs already are.
    qp('reps?select=id,name,initials,role,active,sells,source,cc_default_company_id'),
    // Seeded demo touches carry source_kind=app_sample (009); real ones are cc
    // or app_live. Filtered in the query — a demo touch has no business in an
    // effort total even as a number to subtract later.
    qp('touches?select=rep_id,play,occurred_at&source_kind=neq.app_sample'),
    qp('rep_targets?select=rep_id,daily_touch_goal,goal_source'),
    qp('score_components?select=key,title,weight&kind=eq.touch&order=ordinal'),
    // The real lead-source name map: name + category + whether the category came
    // from Kevin or was inferred, and — since migration 163 — `rollup_name`, the
    // canonical grouping the marketing drawer and report 10 both key off. CC
    // fragments one channel across many ids (Google is five, Angi three), so a
    // board grouped by `name` splits the two biggest paid sources apart.
    qp('lead_sources?select=cc_lead_id,name,category,category_from,rollup_name'),
  ]);
  // Oasis sells through Billdu and Contractors Cloud imports it late, so a CC
  // zero for Oasis is not the same claim as "Oasis sold nothing". Optional:
  // if the feed is not readable the console simply does not make the claim.
  let billdu = null, leakError = null;
  try {
    const [fresh, invoices, docs, signings, feed] = await Promise.all([
      qp('console_billdu_freshness?select=*'),
      /* Migration 096: Oasis money reads from Billdu INVOICES, attributed
         CC-evidence-first. This is Kevin's 2026-07-30 ruling — "we're gonna go
         off of Billdu until we migrate everything over" — after his export
         proved the CC+acceptances blend ran ~$95K over what was actually sold.
         `*` rather than a column list on purpose: 148 appends sold_on to this
         view and naming it here would 400 the entire Billdu feed on any
         database where 148 has not been applied yet — Oasis money would read
         as MISSING, which is a worse lie than reading on the invoice date. */
      qp('billdu_invoice_attributed?select=*'),
      // rep_id is the backend's OWN mapping of a Billdu author to a rep. It is
      // set for sellers who send their own estimates and deliberately NULL for
      // the office accounts, so an office-sent deal is never credited to a
      // seller who did not sell it.
      qp('billdu_documents?select=billdu_id,doc_type,is_accepted,total_price,issue_date,job_id,rep_id,author'),
      // Oasis's real signings: an accepted Billdu estimate IS the signature.
      qp('console_oasis_signings_live?select=*'),
      // the whole feed, not a page of it — the union needs every acceptance,
      // and 769 rows is nothing next to the jobs table
      qp('console_oasis_signings_feed?select=billdu_id,client_name,client_city,rep,accepted_value,accepted_at,signed_date_et,match_status,job_id&order=accepted_at.desc'),
      /* Migration 059's leak view. It splits what used to be one undifferentiated
         pile of "not in CC" into two very different things:

           never_imported — Contractors Cloud genuinely has no record. A real
                            chase item, and somebody's to fix.
           match_limited  — OUR matcher declined to link it, because the customer
                            has several jobs and it could not tell which. Backend
                            proved six of these were already in CC to the cent.
                            Nobody's data entry is at fault, so it must never be
                            presented as though it were.

         The console cannot derive that split itself — it is the matcher's own
         verdict on its own confidence — which is exactly why this is read rather
         than recomputed here. */
    ]);
    // Whether the CC side has actually recorded a signing for a linked job.
    // Every Billdu link is an Oasis job, so this stays a small fetch.
    const oasisJobs = await qp('jobs?select=id,contract_signed_at&source=eq.cc&cc_company_id=eq.1560');
    /* THE LEAK VIEW GETS ITS OWN try, AND THIS IS THE WHOLE POINT OF IT.
       It first shipped inside the Promise.all above. Backend then rebuilt the
       view and renamed age_days, the query started returning 400, and because
       one rejected promise rejects the whole batch, the catch below set
       billdu = null — which silently took out freshness, documents, signings and
       the feed as well. The visible result was every Oasis figure dropping back
       to $0: the exact bug Kevin reported months ago, reintroduced by a column
       rename in a view that only feeds one card.

       A supporting view is allowed to fail. It is not allowed to take the money
       with it. The leak is a chase list; if it is unreadable the console shows
       one card less and every figure stays correct. */
    let leak = [];
    try {
      leak = await qp('console_billdu_import_leak?select=billdu_id,client_name,client_city,accepted_value,billdu_author,sent_by_display,sent_by_is_selling_rep,issue_date,accepted_at,days_since_accepted,days_since_issued,category,in_current_process,actionable');
    } catch(e) { leak = []; leakError = e.status ? `${e.status}` : (e.message || 'unreadable'); }
    billdu = { fresh: fresh[0] || null, docs, signings, feed, invoices, leak, leakError,
               ccSigned: Object.fromEntries(oasisJobs.map(j => [j.id, !!j.contract_signed_at])) };
  } catch(e){ billdu = null; }
  let qbInv = [], qbError = null;
  try { qbInv = await qp('qb_invoices?select=cc_company_id,txn_date,total_amt,balance,reporting_excluded'); }
  catch(e){ qbError = e.status === 403
    ? 'qb_invoices is not readable by your login. The table has row-level security policies but no SELECT grant to the authenticated role, so it returns 403 rather than rows. This is a one-line backend grant, not missing money.'
    : e.message; }
  /* BELL CLAIMS + THE BANK (086/088). The owner login passes is_manager(), so
     both reads return every rep — this console is the one sanctioned cross-rep
     pay surface. Optional on the same rule as the leak view: unreadable claims
     cost the board its pending layer and the rows their bank line, never the
     money underneath. 45 days covers every window that can still hold an open
     claim (the clock pulls at 5 business days since 136, Kevin 10 Aug —
     was 7; confirmed ones are excluded by the fold, not the fetch).
     ⚠️ This block was silently LOST once already (30 Jul): a concurrent
     session's sync overwrote loadAll between edits, and the deploy shipped
     bankMini with no data behind it — chips defined, nothing rendered. If the
     bank line ever vanishes again, look HERE first. */
  let claims = [], bank = [];
  try {
    const since = (d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`)(new Date(Date.now() - 45*86400000));
    [claims, bank] = await Promise.all([
      qp(`rep_sale_claim_status?select=rep_id,customer_name,claimed_amount,signed_on,status,cc_state,cc_already_counted,cc_company_id&voided_at=is.null&signed_on=gte.${since}`),
      qp('my_commission_summary?select=rep_id,banked,banked_deals,earned_awaiting_collection,jobs_not_built_value,paid_ytd'),
    ]);
  } catch(e){ claims = []; bank = []; }
  /* RAW is kept so the month time machine can rebuild every window client-side
     — a shift is a re-slice of rows already in memory, never a refetch. */
  RAW = { jobs, appts, reps, touches, repTargets, playComponents,
    leadNames, qbInv, qbError, billdu, claims, bank };
  D = buildData(RAW);
  render();
  loadEffortIntel();   // after first paint — a missing 108/119 can never block the page
  loadMarketing();     // likewise: an unapplied 166 leaves the board honest, never blank
}

/* Reload once if the server has a newer build than the one running. Guarded by a
   sessionStorage flag so a version.json that never matches cannot loop. */
async function checkBuild(){
  try {
    const r = await fetch('version.json?cb=' + Date.now(), { cache:'no-store' });
    if (!r.ok) return;
    const j = await r.json();
    /* Compare the guard against the BUILD it was set for, not merely whether it
       exists. The old test — "have we ever reloaded" — meant a tab left open
       across two deploys would never pick up the second one. Storing the build
       keeps that working and still cannot loop: after reloading for build X the
       page either runs X, so the first test fails, or the CDN is still serving
       something older, and then the guard already equals X. One reload per
       distinct build, never two for the same one. */
    if (j.build && j.build !== BUILD && sessionStorage.getItem('lcc.reloaded') !== j.build) {
      sessionStorage.setItem('lcc.reloaded', j.build);
      /* NOT location.reload(): iOS Safari happily re-serves the CACHED old
         index.html on a plain reload, which is how Kevin sat on a stale build
         for two hours while version.json said otherwise (30 Jul). A query
         string the cache has never seen forces a real fetch. */
      location.replace(location.pathname + '?v=' + encodeURIComponent(j.build));
    }
  } catch(e){}
}

/* A home-screen app is usually resumed, not loaded — Kevin's stale screenshot
   was taken twelve minutes after a good build went live, with the app already
   open. Checking only on load never reaches that case, so re-check whenever the
   page comes back to the foreground. */
addEventListener('visibilitychange', () => { if (!document.hidden) checkBuild(); });

/* ── boot ─────────────────────────────────────────────────────────────────── */
checkBuild();
document.getElementById('loginform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = document.getElementById('gobtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  document.getElementById('gateerr').textContent = '';
  try {
    await signIn(document.getElementById('em').value.trim(), document.getElementById('pw').value);
    await loadAll();
  } catch(e){
    showGate(e.message);
  } finally { btn.disabled = false; btn.textContent = 'Sign in'; }
});

/* forgot password */
document.getElementById('forgot').addEventListener('click', async () => {
  const el = document.getElementById('gateerr');
  const email = document.getElementById('em').value.trim();
  if (!email) { el.className = 'gateerr'; el.textContent = 'Enter your email above first, then tap Forgot password.'; return; }
  el.className = 'gateerr'; el.textContent = 'Sending…';
  try {
    await sendReset(email);
    el.className = 'gateerr ok';
    // Deliberately not "we sent it to that address" — that would confirm which
    // addresses have accounts to anyone who can reach this page.
    el.textContent = 'If that address has an account, a reset link is on its way. The link opens this page.';
  } catch(e){ el.className = 'gateerr'; el.textContent = e.message; }
});

/* leaving the reset form drops the recovery session — it authorises a password
   change, so it should not outlive the attempt to use it */
document.getElementById('backtologin').addEventListener('click', () => {
  sess.clear();
  document.getElementById('resetform').style.display = 'none';
  document.getElementById('loginform').style.display = '';
  document.getElementById('gatefoot').textContent =
    'Every figure is read live from the database under your own login. Nothing is stored in this page.';
  document.getElementById('reseterr').textContent = '';
});

/* set-new-password */
document.getElementById('resetform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const err = document.getElementById('reseterr'), btn = document.getElementById('setbtn');
  // Read the LIVE input values at submit time and TRIM both. iOS Strong-Password
  // autofill and the keyboard's double-space-to-period leave a trailing space
  // that makes two visually identical passwords compare unequal — the exact
  // "those do not match while they match" Gio hit. Trimming both, and storing the
  // trimmed value, means what he types to sign in later also matches.
  const a = document.getElementById('np').value.trim(), b = document.getElementById('np2').value.trim();
  // Clear any error from a PREVIOUS attempt first, so a stale "do not match" can
  // never linger on screen beside a fresh "Setting…".
  err.textContent = ''; err.className = 'gateerr';
  if (a.length < 8) { err.textContent = 'Use at least 8 characters.'; return; }
  if (a !== b) { err.textContent = 'Those two do not match. Tap “Show” to compare them.'; return; }
  btn.disabled = true; btn.textContent = 'Setting…';
  try {
    await updatePassword(a);
    document.getElementById('resetform').style.display = 'none';
    await loadAll();                       // recovery session is a real session
  } catch(e){
    // Any failure returns the button to its normal label — "Setting…" must never
    // stick, alone or beside an error.
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'Set password & sign in';
  }
});

// Editing either field clears a stale match/length error, so the message always
// reflects the CURRENT input rather than a prior keystroke.
['np','np2'].forEach(id => document.getElementById(id).addEventListener('input', () => {
  const err = document.getElementById('reseterr');
  if (err.textContent) { err.textContent = ''; }
}));

// Show/hide toggle on both fields (Kevin's ask) — lets a rep visually confirm the
// two passwords are identical, which is the real cure for the autofill mismatch.
document.querySelectorAll('.pweye').forEach(eye => eye.addEventListener('click', () => {
  const inp = document.getElementById(eye.getAttribute('data-for'));
  const reveal = inp.type === 'password';
  inp.type = reveal ? 'text' : 'password';
  eye.textContent = reveal ? 'Hide' : 'Show';
  eye.setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
}));

(async () => {
  // Recovery is checked BEFORE any stored session, or arriving on a reset link
  // while already signed in would silently skip the reset.
  const rec = readRecovery();
  if (rec) {
    rec.clean();
    if (rec.kind === 'error') { showGate(rec.message + ' — request a new link below.'); return; }
    try {
      let email = null;
      if (rec.kind === 'implicit') {
        sess.set({ access_token: rec.access_token, refresh_token: rec.refresh_token, email: null });
      } else {
        const j = await exchangeTokenHash(rec.token_hash);
        sess.set({ access_token: j.access_token, refresh_token: j.refresh_token, email: j.user?.email || null });
        email = j.user?.email || null;
      }
      if (!email) {
        // Read the address back so the form can say whose account this is.
        try {
          const u = await (await fetch(`${SB_URL}/auth/v1/user`, { headers:{ apikey: SB_KEY,
            Authorization:'Bearer '+sess.get().access_token } })).json();
          email = u.email || null;
          if (email) sess.set({ ...sess.get(), email });
        } catch(e){}
      }
      showReset(email);
    } catch(e){ sess.clear(); showGate(e.message + ' — request a new link below.'); }
    return;
  }
  if (!sess.get()) { showGate(); return; }
  try { await loadAll(); }
  catch(e){
    if (/expired|not signed in|401/i.test(e.message)) { sess.clear(); showGate('Session expired — sign in again.'); }
    else {
      appEl.innerHTML = `<div class="hdr"><div class="eyebrow">TruReview · owner access</div>
        <h1>TruReview <em>Autopilot</em></h1></div>
        <div class="card"><div class="card-title">Could not load</div>
        <div class="card-sub">${esc(e.message)}</div>
        <div class="note">Nothing is shown rather than something stale.
        <button class="signout" style="margin-top:10px" onclick="signOut()">Sign out</button></div></div>`;
      showApp();
    }
  }
})();
</script>
