     Kevin, on Trending to Finish: "Is Oasis really on pace to sell that much
     this month? No way."

     He was right, and it is the projection method, not the input — the $379K
     Oasis has booked is verified correct. The old projection was linear: booked
     ÷ days-elapsed × days-in-month, i.e. "if today's daily rate holds all month".
     But months are not flat. Measured on Contractors Cloud signing history,
     Oasis lands ~85% of its month by the 23rd — it front-loads and tails off —
     so projecting a fifth week it does not historically have overshoots by tens
     of thousands. Fencing is the opposite, a touch back-loaded, so the same fix
     nudges it up. The shape is per brand because the brands genuinely differ.

     Measured on CC reportable value, which is the clean, computable signing
     cadence; the projection then scales the union (CC + Billdu) booked by it, on
     the assumption Billdu signs to the same monthly rhythm. Needs at least three
     prior full months or it declines to shape and says so. */
  const monthShape = (() => {
    const elapsedDOM = NOW.getDate();
    const dim = new Date(NOW.getFullYear(), NOW.getMonth()+1, 0).getDate();
    const curKey = ymdOf(som(NOW)).slice(0,7);
    const med = a => { const v=[...a].sort((x,y)=>x-y), n=v.length;
      return n ? (n%2 ? v[(n-1)/2] : (v[n/2-1]+v[n/2])/2) : 0; };
    const out = { elapsedDOM, dim };
    for (const bid of BRAND_ORDER) {
      const months = {};
      for (const j of jobs) {
        if (rollup(j.cc_company_id) !== bid || !j.contract_signed_at) continue;
        const d = String(j.contract_signed_at).slice(0,10), m = d.slice(0,7), amt = Number(j.fin_sold_amount||0);
        (months[m] ??= { full:0, e:0 }).full += amt;
        if (Number(d.slice(8,10)) <= elapsedDOM) months[m].e += amt;
      }
      const priors = Object.keys(months).filter(m => m < curKey && months[m].e>0 && months[m].full>0).sort().slice(-6);
      const fracs = priors.map(m => months[m].e / months[m].full);
      const frac = med(fracs);
      out[bid] = { frac, n: fracs.length };
    }
    return out;
  })();

  /* ── THE QUOTA FLEET BOARD ────────────────────────────────────────────────
     Kevin's parity law: whatever a rep sees personally, the owner sees the fleet
     version of. The app is gaining a $100K-income quota per rep — $1.82M/yr
     signed at 5.5% commission — as the EMPLOYMENT FLOOR, not a goal. This is the
     owner's fleet counterpart: every carrier against that floor, prorated to the
     same point in the window.

     The floor is uniform and firm: one annual number, one daily rate, every rep
     measured against the same prorated pace. Signed value is the same union the
     rep board shows — CC contract value plus each rep's own Billdu invoices
     (Oasis money reads entirely from Billdu, migration 096), attributed
     CC-evidence-first with the Oasis office-default, same as the rep board. Managers who sell (Oasis runs that way) carry it; managers who do
     not are only shown if they signed. A rep at zero is not hidden — the whole
     point of a floor board is that it shows who is under it. */
  const quotaBoard = (() => {
    const ANNUAL = 1818182, DAILY = ANNUAL / 365, sodT = sod(NOW);
    const elapsedCal = from => Math.max(1, Math.round((sodT - sod(from)) / 86400000) + 1);
    const wins = {};
    for (const [k, wv] of Object.entries(WINS)) {
      if (k === 'day') continue;
      /* The fleet reads slice().reps — the SAME rows the rep board renders,
         one function, per the one-signed-rule. Its old private walk added
         each rep's CC contracts and then their Billdu invoices on top, and
         Oasis CC entries have carried a rep since the import matured — so an
         Oasis seller's floor number counted every deal from both books
         (~$183K across August). slice() has held the union guards (Oasis CC
         out of money, bells deduped) since they were written; the fleet just
         never read it. Office/no-rep pseudo-rows carry no seat and stay out. */
      const sig = {};
      for (const r of slice(wv.from, wv.to).reps)
        if (!r.office) sig[r.id] = r.rev;
      /* capped at the window's own span: under the time machine a closed month's
         "elapsed" would otherwise keep counting into today and inflate the floor */
      const el = Math.min(elapsedCal(wv.from),
                          Math.max(1, Math.round((wv.to - wv.from) / 86400000)));
      wins[k] = { elapsed: el, pace: Math.round(DAILY * el), sig };
    }
    const producers = new Set();
    for (const k of Object.keys(wins)) for (const rid of Object.keys(wins[k].sig)) producers.add(rid);
    /* Who carries the floor: reps.sells, not role. Kevin's build-36 ruling
       (077) — role is wrong in both directions: it drops managers who
       genuinely sell and keeps stale sales accounts that do not. Sellers are
       always on the board, zeros included; anyone else rides along only if
       they actually signed, and cardQuota narrows that to the window shown.
       ACTIVE gates only the standing roster — who must carry the floor — never
       the producers: a departed rep who signed inside the window keeps their
       row (the period-roster law, PR #49). Their dollars were already in every
       total; hiding the name while counting the money was the one remaining
       active-filter on a money surface. */
    const carriers = reps.filter(r => (r.active && r.sells) || producers.has(r.id))
                         .map(r => ({ id: r.id, name: r.name, role: r.role, sells: !!r.sells,
                                      gone: !r.active }));
    return { annual: ANNUAL, monthly: Math.round(ANNUAL/12), daily: Math.round(DAILY),
             incomeAt: 100000, rate: 5.5, wins, carriers };
  })();

  const effort = (() => {
    const wt = Object.fromEntries(playComponents.map(p=>[p.key,p.weight]));
    const goals = Object.fromEntries(repTargets.map(t=>[t.rep_id,t]));
    const todayA = sod(NOW), todayB = addD(todayA,1);
    const weekA = sow(NOW), weekB = addD(weekA,7);
    const monthA = som(NOW), monthB = addM(monthA,1);
    const yearA = soy(NOW), yearB = addD(sod(NOW),1);
    const blank = () => ({ day:{t:0,p:0}, week:{t:0,p:0}, month:{t:0,p:0}, year:{t:0,p:0}, all:0, plays:{} });
    const byRep = {};
    for (const t of touches){
      const k = t.rep_id || 'unknown';
      const r = (byRep[k] ??= blank()); const pts = wt[t.play]||0;
      r.all++; r.plays[t.play] = (r.plays[t.play]||0)+1;
      const bump = b2 => { b2.t++; b2.p += pts; };
      if (inR(t.occurred_at,yearA,yearB)) bump(r.year);
      if (inR(t.occurred_at,monthA,monthB)) bump(r.month);
      if (inR(t.occurred_at,weekA,weekB)) bump(r.week);
      if (inR(t.occurred_at,todayA,todayB)) bump(r.day);
    }
    const active = reps.filter(r=>r.active);
    const rows = active.map(r => { const v = byRep[r.id]||blank(); const g = goals[r.id];
      return { id:r.id, name:r.name, initials:r.initials, role:r.role,
        goal: g?.daily_touch_goal ?? null, goalSource: g?.goal_source ?? null,
        today:v.day.t, week:v.week.t, month:v.month.t, points:v.month.p, ...v }; })
      .sort((a,b2)=>b2.month.t-a.month.t || b2.all-a.all || a.name.localeCompare(b2.name));
    const bizDays = (a,b2) => { let n=0;
      for (let d=new Date(a); d<b2 && d<=NOW; d=addD(d,1)) if (d.getDay()>=1&&d.getDay()<=5) n++;
      return Math.max(1,n); };
    return { total:touches.length, activeReps:active.length,
      repsEverLogged: rows.filter(r=>r.all>0).length,
      goalsAllDefault: repTargets.length>0 && repTargets.every(t=>!t.goal_source),
      defaultGoal: repTargets[0]?.daily_touch_goal ?? 10,
      plays: playComponents.map(p=>({key:p.key,title:p.title,weight:p.weight})),
      spans: { day: NOW.getDay()>=1&&NOW.getDay()<=5 ? 1 : 0,
               week: bizDays(weekA,weekB), month: bizDays(monthA,monthB), year: bizDays(yearA,yearB) },
      rows };
  })();

  /* Lead sources, now with real names. The map covers most jobs but not all, and
     the gap is money rather than a rounding error — unmapped ids keep their row
     and are labelled as unmapped instead of being folded into "other". */
  const leadSources = (() => {
    const map = Object.fromEntries(leadNames.map(e => [String(e.cc_lead_id), e]));
    const agg = (pred) => { const a = {};
      for (const j of jobs){ const k = String(j.cc_lead_source_id || 'none');
        (a[k] ??= { id:k, jobs:0, signed:0, rev:0,
                    name: map[k]?.name || null,
                    category: map[k]?.category || null,
                    inferred: map[k]?.category_from === 'inferred' });
        a[k].jobs++;
        if (pred(j)) { a[k].signed++; a[k].rev += Number(j.fin_sold_amount||0); } }
      return Object.values(a); };
    const allTime = agg(j=>!!j.contract_signed_at).sort((x,y)=>y.rev-x.rev);
    const namedRev = allTime.filter(r=>r.name).reduce((n,r)=>n+r.rev,0);
    const totalRev = allTime.reduce((n,r)=>n+r.rev,0);
    // by category, all-time — the question "which channel earns" as opposed to
    // "which individual source"
    const byCat = {};
    for (const r of allTime) {
      const c = r.category || 'Unmapped';
      (byCat[c] ??= { category:c, jobs:0, signed:0, rev:0, sources:0 });
      byCat[c].jobs += r.jobs; byCat[c].signed += r.signed; byCat[c].rev += r.rev; byCat[c].sources++;
    }
    return {
      total: jobs.length,
      distinct: new Set(jobs.map(j=>j.cc_lead_source_id).filter(Boolean)).size,
      mapped: allTime.filter(r=>r.name).length,
      mapSize: leadNames.length,
      jobsNamed: jobs.filter(j=>map[String(j.cc_lead_source_id)]).length,
      namedRevShare: totalRev ? Math.round(namedRev/totalRev*100) : 0,
      inferredCount: leadNames.filter(e=>e.category_from==='inferred').length,
      categories: Object.values(byCat).sort((a,b)=>b.rev-a.rev),
      allTime,
      windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) =>
        [k, agg(j=>inR(j.contract_signed_at,wv.from,wv.to)).filter(r=>r.signed>0).sort((x,y)=>y.rev-x.rev)])),
      /* Per trade. Fencing and roofing buy leads in different markets at
         different prices, so a blended company-wide list averages away the only
         comparison that matters. Keyed by the ROLLED-UP brand, so Pro-Tec and
         Liberty Roofing are one trade here as everywhere else. */
      byTrade: Object.fromEntries(BRAND_ORDER.map(bid => {
        const mine = jobs.filter(j => rollup(j.cc_company_id) === bid);
        const aggT = (pred) => { const a = {};
          for (const j of mine){ const k = String(j.cc_lead_source_id || 'none');
            (a[k] ??= { id:k, jobs:0, signed:0, rev:0,
                        name: map[k]?.name || null, category: map[k]?.category || null,
                        inferred: map[k]?.category_from === 'inferred' });
            a[k].jobs++;
            if (pred(j)) { a[k].signed++; a[k].rev += Number(j.fin_sold_amount||0); } }
          return Object.values(a); };
        const allT = aggT(j=>!!j.contract_signed_at).sort((x,y)=>y.rev-x.rev);
        const revT = allT.reduce((n,r)=>n+r.rev,0);
        return [bid, {
          jobs: mine.length,
          distinct: new Set(mine.map(j=>j.cc_lead_source_id).filter(Boolean)).size,
          namedIds: allT.filter(r=>r.name).length,
          namedRevShare: revT ? Math.round(allT.filter(r=>r.name).reduce((n,r)=>n+r.rev,0)/revT*100) : 0,
          allTime: allT,
          windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) =>
            [k, aggT(j=>inR(j.contract_signed_at,wv.from,wv.to)).filter(r=>r.signed>0).sort((x,y)=>y.rev-x.rev)])),
        }];
      })) };
  })();

  /* QuickBooks. qb_invoices currently has RLS policies but no GRANT to the
     authenticated role, so this 403s for every logged-in user. Reported as
     unreadable rather than drawn as zero — a missing grant and no money are
     very different facts. */
  const qb = qbError ? { unavailable:true, reason:qbError } : (() => {
    const live = qbInv.filter(i=>!i.reporting_excluded);
    const qbWin = (a,b2) => { const rows = live.filter(i=>inRDate(i.txn_date,a,b2));
      const byBrand = {};
      for (const i of rows){ const k = i.cc_company_id ? rollup(i.cc_company_id) : 'unclassified';
        (byBrand[k] ??= {invoiced:0,count:0}); byBrand[k].invoiced += Number(i.total_amt||0); byBrand[k].count++; }
      return { invoiced: rows.reduce((n,i)=>n+Number(i.total_amt||0),0), count:rows.length, byBrand }; };
    const arByBrand = {};
    for (const i of live){ const bal = Number(i.balance||0); if (bal<=0) continue;
      const k = i.cc_company_id ? rollup(i.cc_company_id) : 'unclassified';
      (arByBrand[k] ??= {ar:0,count:0}); arByBrand[k].ar += bal; arByBrand[k].count++; }
    return { unavailable:false, dropped: qbInv.length-live.length, total: qbInv.length,
      brandsWithInvoices: [...new Set(live.map(i=>i.cc_company_id).filter(Boolean).map(rollup))],
      ar: Object.entries(arByBrand).map(([id,v])=>({id,...v})),
      arTotal: Object.values(arByBrand).reduce((n,v)=>n+v.ar,0),
      windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) =>
        [k, { ...qbWin(wv.from,wv.to), prev: qbWin(...prevRange(wv)) }])) };
  })();

  /* Billdu is Oasis's real point of sale. Contractors Cloud imports it late, so
     "Oasis signed nothing" in CC can be true and still be the wrong picture.
     This carries what Billdu itself saw in each window so the zero can be
     qualified rather than presented as the whole story. */
  const oasisLag = (() => {
    if (!billdu || !billdu.docs) return null;
    /* Resolved through bRepOf, not the feed's own rep column — so an office-sent
       deal reads unattributed here exactly as it does on the sales board. */
    const repByBillduId = Object.fromEntries(
      (billdu.feed || []).map(r => [String(r.billdu_id), sellerOf(r.billdu_id)]).filter(([,v]) => v));
    const live = billdu.docs.filter(x => Number(x.total_price) > 0);
    const win = (a,b) => {
      const rows = live.filter(x => inR(x.issue_date, a, b));
      const acc = rows.filter(x => x.is_accepted);
      return { docs: rows.length,
               accepted: acc.length,
               acceptedValue: acc.reduce((n,x)=>n+Number(x.total_price||0),0),
               value: rows.reduce((n,x)=>n+Number(x.total_price||0),0),
               notInCc: rows.filter(x=>!x.job_id).length };
    };
    /* Oasis signings as Billdu itself records them. An accepted estimate is the
       signature — that is the moment the customer said yes, whatever CC has
       imported. Dates come from the view already resolved to Eastern, so they
       are compared as plain date strings rather than re-parsed into a timezone. */
    const sign = (billdu.signings || []).map(r => ({
      date: String(r.signed_date_et).slice(0,10),
      acceptances: Number(r.acceptances||0),
      value: Number(r.accepted_value||0),
      linked: Number(r.linked_to_cc||0),
      notInCc: Number(r.not_in_cc_yet||0),
    }));
    const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const sumBetween = (fromD, toD) => {
      const a = ymd(fromD), b = ymd(toD);
      const rows = sign.filter(r => r.date >= a && r.date < b);
      return { acceptances: rows.reduce((n,r)=>n+r.acceptances,0),
               value: rows.reduce((n,r)=>n+r.value,0),
               notInCc: rows.reduce((n,r)=>n+r.notInCc,0),
               days: rows.length };
    };
    return {
      freshness: billdu.fresh || null,
      windows: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => [k, win(wv.from, wv.to)])),
      // signings, by the same windows the rest of the console uses
      signings: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => [k, sumBetween(wv.from, wv.to)])),
      signingsPrev: Object.fromEntries(Object.entries(WINS).map(([k,wv]) => [k, sumBetween(...prevRange(wv))])),
      daily: sign.sort((a,b)=>a.date<b.date?1:-1).slice(0,14),
      feed: (billdu.feed || []).map(r => ({
        name: r.client_name, city: r.client_city, rep: sellerOf(r.billdu_id),
        value: Number(r.accepted_value||0), at: r.accepted_at,
        date: String(r.signed_date_et).slice(0,10),
        matched: r.match_status === 'linked', inCc: !!r.job_id,
        // the same predicate the totals use: matched to a CC project is not the
        // same as signed in CC, and only the unsigned ones were added
        additive: !r.job_id || ccSignedMap[r.job_id] !== true,
      })),
      /* THE CHASE LIST, kept deliberately separate from `feed` above.
         `additive` answers "is this money already counted on the CC side?" —
         a money-attribution question. It is NOT "has CC imported this?", and
         using it as one is what put 124 deals / $603K on a card that should
         have said 45 / $204K. It swept in every acceptance linked to a CC job
         that simply had no signing date yet: already imported, plainly not a
         leak. One predicate cannot answer both questions, so now it doesn't. */
      leak: (billdu.leak || []).map(r => ({
        id: r.billdu_id,
        name: r.client_name, city: r.client_city,
        /* The rebuilt view supplies sent_by_display — "office (kdelaney05)" or a
           seller's name — which is what the email-stripping here was reaching
           for. Prefer it, then the mapped rep, and still refuse a bare login:
           billdu_author is an address and the feed's rep is one too for anything
           sent from the office account. An unattributable deal shows nothing
           rather than an email, the same way the rep leaderboard declines to
           credit an office-sent deal to a seller who did not sell it. */
        rep: [r.sent_by_display, repByBillduId[String(r.billdu_id)], r.billdu_author]
               .map(v => String(v || '').trim())
               .find(v => v && !v.includes('@')) || '',
        sellingRep: r.sent_by_is_selling_rep === true,
        value: Number(r.accepted_value||0),
        issued: String(r.issue_date||'').slice(0,10),
        /* age_days was split into two by the view rebuild. The card windows on
           issue date, so it ages on the same basis — mixing "issued in this
           window" with "accepted N days ago" would put two clocks on one row. */
        age: r.days_since_issued == null ? null : Number(r.days_since_issued),
        category: r.category, actionable: r.actionable === true,
        inProcess: r.in_current_process === true,
      })),
    };
  })();

  /* ═══ SIGNALS · NOTICE → DO ═════════════════════════════════════════════
     Kevin, as standing house law: "We need to build in as much proactive
     forward thinking intelligence as possible. Don't rely on me to think of what
     to do it clearly tells me what to not only notice but do."

     So every signal carries both halves: what is off, and the thing to do about
     it. Three rules keep it honest rather than noisy:

     · THRESHOLD-GATED, NO INVENTED CONCERNS. Every trigger below is measured
       against this business's own recent distribution, not a number that felt
       about right. Where the data cannot support a judgement the signal does not
       fire at all.
     · A QUIET DAY IS A REAL ANSWER. If nothing crosses a threshold the verdict
       is "no fires", not a scraped-together worry. A console that always finds
       something wrong teaches him to stop reading it.
     · IT MUST NOT SCOLD BEFORE THE DAY HAS HAPPENED. Daily setting alerts hold
       until the afternoon; a slow 9am is a morning, not a problem.
     ═════════════════════════════════════════════════════════════════════════ */
  const signals = (() => {
    const S = [];
    /* brief = the terse clause the digest stitches into prose and the inbox row
       shows on its single line. rec = the recommended actions behind the tap.
       Each signal writes its own, because only the signal knows which of its
       numbers is the one worth carrying. */
    const add = (sev, id, tags, notice, action, brief, rec) => S.push({ sev, id, tags, notice, action, brief, rec });

    /* ── WHO TO GO TO ─────────────────────────────────────────────────────────
       Kevin: "text this person, call this person… You should know what I need
       to do."

       Every name here is resolved AT RUNTIME from the reps table's own role and
       company columns — never hard-coded. Two reasons, and both matter. The
       deployed bundle is a public repo, so an employee name written into the
       source would be a leak the pre-publish gate rightly blocks. And a name
       typed into code is a claim nobody checked; a name read from `reps` is a
       fact the database is willing to stand behind.

       Where a role resolves to exactly one active person, the recommendation
       names them. Where several people hold it, it names them as the team
       rather than guessing which one Kevin meant. It never invents a person to
       make a sentence read better. */
    const activeReps = (reps || []).filter(r => r.active);
    const byRole = (role, co) => activeReps.filter(r =>
      r.role === role && (co == null || String(r.cc_default_company_id) === String(co)));
    /* NAME ONLY WHEN THE DATA IS SURE. If exactly one active person holds a
       role, the recommendation names them. If several do, it says the role and
       lets Kevin pick — because reading three names off a roster is not "text
       this person", and one of them being wrong is worse than none being named.
       Tested against the live table this matters: the Fencing office role holds
       four active people, one of whom is plainly a junk record, and a
       recommendation that told Kevin to text them would have burned the whole
       feature's credibility on its first morning. */
    const nameList = (a, fallback) => (a && a.length === 1) ? a[0].name : fallback;
    const ORG = {
      office:     byRole('office', '1461'),
      mgrFencing: byRole('manager', '1461'),
      mgrOasis:   byRole('manager', '1560'),
      mgrRoofing: byRole('manager', '1563'),
    };
    ORG.officeWho  = nameList(ORG.office, 'the office team');
    ORG.setterWho  = nameList(ORG.office, 'the setters');
    ORG.oasisWho   = nameList(ORG.mgrOasis, 'the Oasis manager');
    ORG.salesWho   = nameList(ORG.mgrFencing, 'the sales managers');
    const mgrForBrand = b => b === '1560' ? nameList(ORG.mgrOasis, 'the Oasis manager')
                          : b === '1563' ? nameList(ORG.mgrRoofing, 'the roofing manager')
                          : nameList(ORG.mgrFencing, 'the sales managers');
    const A = appointments, hour = NOW.getHours();
    const isWeekday = ![0,6].includes(NOW.getDay());
    const afternoon = hour >= 13;

    // ── data trust comes first: if the feed is stale, say so before anything
    //    derived from it is used to make a decision
    if (A && A.staleHours != null && A.staleHours >= 6) {
      add('watch', 'sync-stale', ['appointments','flags'],
        `The appointment feed last synced ${A.staleHours < 24 ? Math.round(A.staleHours)+' hours' : Math.round(A.staleHours/24)+' days'} ago.`,
        `Today's booking count can only read low. Treat it as provisional until the sync catches up rather than acting on it.`,
        `the appointment feed is ${A.staleHours < 24 ? Math.round(A.staleHours)+'h' : Math.round(A.staleHours/24)+'d'} stale`,
        { lines: ['Nobody to call on this one — it is the Contractors Cloud feed, not the team.',
                  'Hold off acting on today’s booking count until it catches up; it can only read low.'] });
    }

    // ── setting output today (afternoon only, weekdays only)
    /* Weekday-shaped: today against what THIS weekday normally has on the board
       by THIS hour. A flat 23/day gate fired on ordinary Thursdays and stayed
       quiet on genuinely poor Mondays. */
    if (A && isWeekday && afternoon && A.bookedNormHour >= 5) {
      const dayName = A.todayDowName, byWhen = `by ${hourLabel(A.nowHour)}`;
      const r = A.bookedToday / A.bookedNormHour;
      if (r < 0.5) add('fire', 'booking-day-low', ['appointments','flags','dive:day'],
        `Only ${A.bookedToday} appointments booked today against ${A.bookedNormHour} typical for a ${dayName} ${byWhen}.`,
        `Get the setters on the phone this afternoon — a day this far behind does not recover on its own.`,
        `bookings well down for a ${dayName} (${A.bookedToday} vs ${A.bookedNormHour})`,
        { lines: [`Text ${ORG.setterWho} before the shift ends — ask what is still in tonight's pipeline.`,
                  `If the gap is real, pull one person onto outbound for the last hour.`],
          draft: `Hey — we're at ${A.bookedToday} booked today and a ${dayName} normally has ${A.bookedNormHour} by ${hourLabel(A.nowHour)}. What's still in the pipeline for tonight? Anything I can unblock?` });
      else if (r < 0.75) add('watch', 'booking-day-soft', ['appointments','flags','dive:day'],
        `${A.bookedToday} booked today, below the ${A.bookedNormHour} typical for a ${dayName} ${byWhen}.`,
        `Worth a check-in with the setters before the day closes.`,
        `bookings soft for a ${dayName} (${A.bookedToday} vs ${A.bookedNormHour})`,
        { lines: [`Quick check-in with ${ORG.setterWho} before the day closes — no alarm, just a number check.`],
          draft: `Quick one — we're at ${A.bookedToday} booked and a ${dayName} usually sits around ${A.bookedNormHour} by now. Anything slowing the calls down today?` });
    }

    // ── the week ahead
    if (A && A.priorAvg >= 8 && A.vsPrior !== null) {
      if (A.vsPrior <= -35) add('fire', 'booking-week-thin', ['appointments','flags','dive:week'],
        `Only ${A.next7} appointments on the books for the next 7 days, against ${A.priorAvg} typical.`,
        `Push setting for next week today — the calendar is filled 3 days out on average, so a thin week ahead is still fixable this afternoon.`,
        `next week is thin (${A.next7} vs ${A.priorAvg} typical)`,
        { lines: [`Get ${ORG.setterWho} pushing next week TODAY — appointments are set a median of ${3} days out, so today's calls are next week's calendar.`,
                  `Ask ${ORG.salesWho} which brand has the capacity to absorb them.`],
          draft: `Next 7 days is showing ${A.next7} on the books against ${A.priorAvg} typical. Can we put the push on next week today? Today's calls are what fills it.` });
      else if (A.vsPrior <= -20) add('watch', 'booking-week-soft', ['appointments','flags','dive:week'],
        `${A.next7} on the books for next 7 days against ${A.priorAvg} typical.`,
        `Keep an eye on it — one more setting push today closes the gap.`,
        `next week light (${A.next7} vs ${A.priorAvg} typical)`,
        { lines: [`One more setting push today closes it — worth a word with ${ORG.setterWho}.`],
          draft: `Next week is at ${A.next7} vs ${A.priorAvg} typical. One good push today should close the gap — can we lean on it?` });
    }

    // ── per-brand setting, only where the brand has enough baseline to judge
    if (A && isWeekday && afternoon) {
      /* ── DO NOT CRY WOLF WHEN THE SYNC IS SIMPLY BEHIND ──────────────────
         A booking is resolved to a brand through its project, and projects
         arrive on their own sync. Book an appointment this morning against a
         project created this morning and, for a while, the appointment is here
         and the project is not — so the brand cannot be resolved and the
         booking lands in `unknown`.

         That is not a quiet morning. It reads as one, and it read as one to
         Kevin: the card told him Fencing had booked 1 against 14 typical and to
         go and push the setters. Fencing had in fact booked 14. Eighteen of the
         day's nineteen bookings were sitting in `unknown`, waiting on the
         project sync.

         The gate below needs no invented threshold, because the numbers already
         in play answer the question. The shortfall being alleged is
         (median - n). If `unknown` alone is big enough to cover that shortfall,
         then the bookings we cannot yet attribute could account for the whole
         gap, and the signal cannot know it is real. So it says nothing, and the
         card says it is still counting instead. A signal that fires while the
         evidence is still arriving teaches its reader to ignore it. */
      const unknownToday = A.bookedByBrand.unknown || 0;
      for (const b of BRAND_ORDER) {
        const norm = (A.brandNorm && A.brandNorm[b]) || { median: 0, full: 0 };
        if ((norm.full || 0) < 4) continue;   // a brand whose normal is ~1 cannot signal daily
        const n = A.bookedByBrand[b] || 0;
        if (n >= norm.median * 0.4) continue;
        if (unknownToday >= norm.median - n) continue;   // could be sync lag, not a slow day
        const m = BRANDS[b] || { n: b };
        add('watch', 'brand-booking-' + b, ['appointments','flags','dive:day'],
          `${m.n} booked ${n} appointment${n===1?'':'s'} today against ${norm.median} typical for a ${A.todayDowName} by ${hourLabel(A.nowHour)}.`,
          `Point the setters at ${m.n} for the rest of the day — the other brands are carrying the count.`,
          `${m.s} quiet for a ${A.todayDowName} (${n} vs ${norm.median})`,
          { lines: [`Point ${ORG.setterWho} at ${m.n} for the rest of the day — the other brands are carrying the count.`,
                    `Worth telling ${mgrForBrand(b)} so they know the week may land light.`],
            draft: `${m.n} is at ${n} booked today and normally has ${norm.median} by now on a ${A.todayDowName}. Can we weight the next block of calls to ${m.s}?` });
      }
    }

    /* ── Oasis work that has not reached Contractors Cloud ────────────────────
       This used to count freshness.not_in_cc_yet — 922 documents — and tell
       Kevin to go and chase all of them. That number is not a chase list. It
       swept in deals our own matcher declined to link (already in CC, provably,
       to the cent) and a two-year backlog nobody is going to reconcile. Sending
       him after 922 items when 37 are real is how a console teaches its owner to
       ignore it.

       Now it counts what the backend's leak view itself marks as worth chasing,
       and it is a NOTE rather than a WATCH: a standing backlog is a thing to
       work through when there is time, not a fire that reappears every morning
       having not changed since yesterday. */
    if (oasisLag && oasisLag.leak) {
      const chase = oasisLag.leak.filter(r => r.category === 'never_imported' && r.actionable);
      if (chase.length) {
        const val = chase.reduce((n,r) => n + r.value, 0);
        const oldest = Math.max(...chase.map(r => r.age || 0));
        /* Who actually sent them, from the leak view's own sender column — not
           from a guess about who handles Oasis. When one person sent all of
           them, that is worth saying; when several did, the recommendation
           stays with the office team rather than picking a name. */
        const senders = {};
        for (const r of chase) if (r.rep) senders[r.rep] = (senders[r.rep] || 0) + 1;
        const topSender = Object.entries(senders).sort((a,b) => b[1] - a[1])[0];
        const oneSender = topSender && topSender[1] === chase.length ? topSender[0] : null;
        add('note', 'oasis-import', ['flags','dive:month'],
          `${chase.length} Oasis deal${chase.length===1?'':'s'} worth ${short(val)} never reached Contractors Cloud — oldest ${oldest} days.`,
          `Chase the CC import for these. Until CC has them, anything downstream — scheduling, production, commissions — has not seen the work. Deals our matcher merely could not link are excluded: those are ours to fix, not Oasis's.`,
          `${short(val)} of Oasis imports still aging`,
          { lines: [`Send ${ORG.officeWho} the ${chase.length}-deal list — it is itemised in this month's drill-in under "Oasis · awaiting CC import".`,
                    `Ask for CC entry by Friday; the oldest has been sitting ${oldest} days and nothing downstream — scheduling, production, commissions — can see it until it lands.`,
                    ...(oneSender ? [`All ${chase.length} were sent by ${oneSender} — he can confirm which are genuinely missing before anyone re-keys them.`] : [])],
            draft: `Can you get the ${chase.length} Oasis deals that never made it into Contractors Cloud entered by Friday? It's ${short(val)} of signed work and the oldest is ${oldest} days old — nothing downstream sees it until it's in CC. The list is on the owner console under this month > Oasis awaiting CC import.` });
      }
    }

    // ── money owed, measured against what a month actually bills
    if (qb && !qb.unavailable) {
      const invMonth = qb.windows.month ? qb.windows.month.invoiced : 0;
      if (invMonth > 0 && qb.arTotal > invMonth * 1.25) {
        add('watch', 'ar-heavy', ['flags','dive:month'],
          `Open A/R is ${short(qb.arTotal)} against ${short(invMonth)} invoiced this month — more than a month of billing outstanding.`,
          `Put someone on collections this week; the oldest balances are the ones that stop being collectable.`,
          `${short(qb.arTotal)} sitting in open A/R`,
          { lines: [`Put someone on collections this week — whoever runs your billing; the oldest balances are the ones that stop being collectable.`,
                    `Start with the largest open balances: the drill-in's aging list is sorted by size.`],
            draft: `We're carrying ${short(qb.arTotal)} in open A/R against ${short(invMonth)} invoiced this month — more than a month of billing outstanding. Can we put a pass on collections this week, oldest and largest first?` });
      }
    }

    // ── the effort board cannot fill itself
    // Kevin (28 Jul): touches aren't being tracked yet — signal off until the
    // habit is real, or it nags every morning about a board nobody uses.
    const TOUCHES_LIVE = false;
    if (TOUCHES_LIVE && effort && effort.total < 50) {
      add('note', 'effort-unlogged', ['flags'],
        `Only ${effort.total} touches logged by ${effort.repsEverLogged} of ${effort.activeReps} reps.`,
        `The effort scoreboard stays at zero until reps log in the app. Either the habit needs pushing or the app is not in their hands yet — worth finding out which.`,
        `only ${effort.repsEverLogged} of ${effort.activeReps} reps logging touches`,
        { lines: [`Ask ${ORG.salesWho} to find out which it is: the habit, or the app not being on their phones yet.`,
                  `The effort board stays at zero either way — it is not broken, it is empty.`],
          draft: `The touch log is showing ${effort.total} touches from ${effort.repsEverLogged} of ${effort.activeReps} reps. Can you find out whether that's a habit problem or an app-install problem? The scoreboard can't do anything until they're logging.` });
    }

    // ── marketing money attributed to a bare id
    if (leadSources && leadSources.byTrade) {
      for (const b of BRAND_ORDER) {
        const T2 = leadSources.byTrade[b]; if (!T2) continue;
        const unnamedRev = T2.allTime.filter(r=>!r.name).reduce((n,r)=>n+r.rev,0);
        if (T2.namedRevShare < 60 && unnamedRev > 250000) {
          const m = BRANDS[b] || { n: b };
          add('note', 'sources-unnamed-' + b, ['flags','dive:ytd'],
            `${short(unnamedRev)} of ${m.n}'s signed value sits on lead-source ids with no name.`,
            `Name its top ids in cc_enum_map — until then you can see which sources earn but not which ones to buy more of.`,
            `${short(unnamedRev)} of ${m.s} leads unattributed`,
            { lines: [`Have ${ORG.officeWho} name ${m.n}'s top source ids in cc_enum_map — a 15-minute job that unlocks source-level ROI.`,
                      `Until then you can see which sources earn but not which ones to buy more of.`],
              draft: `Can someone put names to ${m.n}'s top lead-source ids in cc_enum_map? ${short(unnamedRev)} of signed work is sitting on bare ids, so we can't tell which sources to spend more on. Should be a 15-minute job.` });
        }
      }
    }

    // ── close rate falling against the like-for-like prior window — PER
    //    BRAND (Kevin, 10 Aug). The blended flag this replaces could fire on
    //    a shift in brand mix with nobody actually closing worse, and stay
    //    silent while one brand fell inside a steady blend. Each brand is
    //    held against its own prior month; small denominators claim no rate
    //    (the one-pager's own ≥10-appointment discipline).
    const wmB = slice(WINS.month.from, WINS.month.to).closeByBrand || [];
    const wpB = slice(...prevRange(WINS.month)).closeByBrand || [];
    for (const bc of wmB) {
      const bp = wpB.find(x => x.id === bc.id);
      if (!bp || bc.close === null || bp.close === null) continue;
      if (bc.appts < 10 || bp.appts < 10) continue;
      if (bp.close >= 20 && bc.close < bp.close * 0.7) {
        const bn = brandOf(bc.id).n;
        add('watch', 'close-drop-' + bc.id, ['flags','dive:month'],
          `${bn} close rate is ${bc.close}% so far this month against ${bp.close}% through the same point last month.`,
          `Same appointments, fewer contracts — look at what changed in the pitch or the lead mix before it costs another month.`,
          `${bn} close rate down to ${bc.close}% from ${bp.close}%`,
          { lines: [`Sit down with ${ORG.salesWho} on what changed — same appointments, fewer contracts.`,
                    `Check the lead mix first: a shift in source mix moves close rate before the pitch does.`],
            draft: `${bn} close rate is ${bc.close}% so far this month against ${bp.close}% through the same point last month. Same appointment volume, fewer contracts. Can we look at whether it's the pitch or the lead mix before it costs another month?` });
      }
    }

    const order = { fire: 0, watch: 1, note: 2 };
    S.sort((a,b) => order[a.sev] - order[b.sev]);
    return { list: S,
             fires: S.filter(s=>s.sev==='fire').length,
             watches: S.filter(s=>s.sev==='watch').length,
             forTag: tag => S.filter(s => s.tags.includes(tag)) };
  })();

  /* ── CLOSING MOMENTUM. Kevin (28 Jul): "momentum is everything with sales
     guys" — close rate over TRAILING windows ending today, so a hot streak or a
     slump is visible while it is happening. A trailing 14 always holds 14 days,
     so it never suffers the Monday reset the calendar windows do. Close stays
     CC-over-CC — the same discipline as every close on this page — and the
     counts always travel with the rate, so a thin denominator is seen rather
     than trusted. */
  const closeTrend = (() => {
    const SPANS = [ ['w1','1 wk',7], ['w2','2 wk',14], ['d30','30 day',30], ['d60','60 day',60] ];
    const end = addD(sod(NOW), 1);
    const seller = Object.fromEntries(reps.filter(r => r.active).map(r => [r.id, r]));
    const blank = () => Object.fromEntries(SPANS.map(([k]) => [k, { appts:0, signed:0 }]));
    const by = {};
    const bump = (rid, iso, field) => {
      if (!rid || !seller[rid] || !iso) return;
      const t = new Date(iso).getTime();
      // appointments count once ELAPSED — a 5pm appointment is not in the
      // denominator at 9am. Signings and rings keep the whole day: a ring
      // counts the day it happens (30 Jul ruling), whatever the clock says.
      if (field === 'appts' && t > NOW.getTime()) return;
      for (const [k,, days] of SPANS)
        if (t >= addD(end, -days).getTime() && t < end.getTime()) (by[rid] ??= blank())[k][field]++;
    };
    for (const x of appts) bump(x.rep_id, x.starts_at, 'appts');
    for (const j of jobs) bump(j.rep_id, j.contract_signed_at, 'signed');
    /* Kevin (29 Jul): "only sold jobs go in Billdu — cross-reference appts in
       CC." He's right: Oasis closes AS a Billdu acceptance, and counting only
       CC signings starved Oasis numerators while their CC appointments filled
       the denominator. Same union law as the money: an acceptance counts as a
       signing ONLY where CC has not already recorded one — never both. */
    if (billdu && billdu.feed) for (const r of billdu.feed) {
      const rid = bRepOf[String(r.billdu_id)];
      if (!rid || rid === OFFICE) continue;
      if (r.job_id && ccSignedMap && ccSignedMap[r.job_id] === true) continue;
      bump(rid, r.accepted_at, 'signed');
    }
    /* Kevin (30 Jul, ratified): a bell ring counts toward close rate the day
       it happens — "Jared closed five today, I would think his % would climb."
       Before this, a big selling day READ AS A SLUMP: today's appointments
       landed in the denominator immediately while the signings waited 1-2 days
       for CC. Same union law as Billdu, third feed: a ring counts ONLY while
       CC has not booked it — the counted/linked guards flip it to the CC feed
       the moment the office books it, so the ring and the job never count
       together. (The old business-day pull is gone — 145, Kevin 12 Aug.) */
    for (const c of (claims || [])) {
      if (c.status !== 'pending') continue;
      if (c.cc_already_counted || c.cc_state === 'job_linked') continue;
      // signed_on is a bare DATE; pin midday so UTC parsing cannot slip it a day
      bump(c.rep_id, String(c.signed_on || '').slice(0,10) + 'T12:00:00', 'signed');
    }
    const team = blank();
    for (const v of Object.values(by)) for (const [k] of SPANS) { team[k].appts += v[k].appts; team[k].signed += v[k].signed; }
    const rate = c => c.appts ? Math.round(c.signed / c.appts * 100) : null;
    const finish = v => Object.fromEntries(SPANS.map(([k]) => [k, { ...v[k], close: rate(v[k]) }]));
    const rows = Object.entries(by).map(([id, v]) => {
      const f = finish(v);
      /* momentum = the recent fortnight against the 60-day baseline. Only
         claimed when the baseline has enough appointments to BE a baseline —
         below that the arrow would be noise wearing a verdict's clothes. */
      const mom = (f.w2.close !== null && f.d60.close !== null && f.d60.appts >= 5)
        ? f.w2.close - f.d60.close : null;
      return { id, name: seller[id].name, role: seller[id].role, sells: !!seller[id].sells, ...f, momentum: mom };
    }).sort((a,b) => (b.d30.close ?? -1) - (a.d30.close ?? -1) || b.d30.signed - a.d30.signed);
    return { spans: SPANS.map(([key,label,days]) => ({ key, label, days })), rows,
             byId: Object.fromEntries(rows.map(r => [r.id, r])), team: finish(team) };
  })();

  /* ── THE EIGHT-WEEK CLOSE BASELINE. Kevin (18 Aug): "closing % is my fav
     especially if we're already showing the reps closing %" — so the board
     total finally carries the same number the rep rows carry, and it is asked
     of whichever window is on screen. A rate with nothing behind it is a
     number, not a verdict: today's close on four appointments swings twenty
     points on one signature. So the headline rate is stated against a
     TRAILING EIGHT WEEKS ending today — long enough to be a baseline, short
     enough to still be this business (the same reason the rhythm dropped the
     year-ago ghost).

     It is built by asking slice() for the 56 days and blending its per-brand
     rows, so the baseline is the SAME arithmetic as the window it is compared
     against — union signings (CC contracts + Billdu acceptances for Oasis +
     rung claims pending CC, never both for one deal) over CC appointments
     elapsed. A baseline computed a second way would drift from the figure it
     judges and the delta would be measuring the two methods, not the team. */
  const close8w = (() => {
    const DAYS = 56, end = addD(sod(NOW), 1);
    const b = (slice(addD(end, -DAYS), end).closeByBrand || [])
      .reduce((o, r) => ({ s: o.s + r.signed, a: o.a + r.appts }), { s: 0, a: 0 });
    return { days: DAYS, weeks: DAYS / 7, signed: b.s, appts: b.a,
             close: b.a ? Math.round(b.s / b.a * 100) : null };
  })();

  /* ── THE RHYTHM. Kevin (11 Aug), on the intel board: "instead of last years
     marketing historical data it needs to be based on the last 1-4 months
     rhythm. A year ago after a big storm is not relevant data comparison for
     marketing. It's the past few months that matter. We've adjusted our rev to
     where we are so it will be more relevant. It's too long an adjustment
     period."

     So the year-ago ghost is GONE from this page's intelligence. Every intel
     comparison now reads against four trailing 30-day buckets ending today —
       M0 last 30 · M1 the 30 before · M2 61-90 back · M3 91-120 back
     and each metric states the three reads he asked for out loud:
       vs last month  = M0 against M1
       vs last 2      = M0 against the mean of M1-M2
       vs the rhythm  = M0 against the mean of M1-M3 — and THAT is the verdict
     Buckets are 30 days wide, always: no partial month, no Monday reset, and
     no storm-year baseline standing behind a number that has to be argued
     with. The year-over-year series is not "hidden" — it is gone, because the
     business it described is not the business being run. */
  const RHY_DAYS = 30, RHY_N = 4;
  const RHY_LABELS = ['last 30 days', 'the 30 before', '61–90 days back', '91–120 days back'];
  const rhyEnd = addD(sod(NOW), 1);
  const RHY_WINS = Array.from({ length: RHY_N },
    (_, i) => [addD(rhyEnd, -RHY_DAYS * (i + 1)), addD(rhyEnd, -RHY_DAYS * i)]);
  const mean_ = a => a.length ? a.reduce((n, x) => n + x, 0) / a.length : 0;
  /* One reading, one vocabulary, used by every metric on the board. `min` is a
     floor under the BASELINE, not under today: below it there is no rhythm to
     be off, and the metric says THIN rather than screaming a percentage off a
     number of three. */
  const readRhythm = (m, min) => {
    const pctd = (c, p) => (p > 0 ? Math.round((c - p) / p * 100) : null);
    const b1 = m[1], b2 = mean_(m.slice(1, 3)), b4 = mean_(m.slice(1));
    const thin = !(b4 >= (min || 0) && b4 > 0);
    const d1 = pctd(m[0], b1), d2 = pctd(m[0], b2), d4 = pctd(m[0], b4);
    const verdict = (thin || d4 === null) ? 'thin'
      : d4 >= 25 ? 'hot' : d4 >= 8 ? 'warm' : d4 > -8 ? 'flat' : d4 > -25 ? 'cooling' : 'cold';
    /* Shape reads oldest → newest, so three straight steps up is "climbing"
       and not just "the last 30 happened to be big". A 3% dead band keeps a
       rounding wobble from being promoted to a direction. */
    const seq = [m[3], m[2], m[1], m[0]];
    let up = 0, dn = 0;
    for (let i = 1; i < seq.length; i++) {
      if (seq[i] > seq[i - 1] * 1.03) up++; else if (seq[i] < seq[i - 1] * 0.97) dn++;
    }
    const shape = thin ? null : up === 3 ? 'climbing' : dn === 3 ? 'sliding'
      : up > dn ? 'firming' : dn > up ? 'easing' : 'steady';
    return { m, now: m[0], b1, b2, b4, d1, d2, d4, verdict, shape, thin };
  };
  const rhythm = (() => {
    const zeros = () => Array(RHY_N).fill(0);
    const inW = (iso, i) => inR(iso, RHY_WINS[i][0], RHY_WINS[i][1]);
    /* DEMAND. Appointments SET (cc_created_at) is the marketing signal — what
       the phone and the ad spend actually produced. Appointments RUN
       (starts_at) is the calendar load that follows it a few days later. Both
       are carried; the marketing verdict reads SET, because SET is the one
       that leads and the whole point of this board is predicting. */
    const set = zeros(), ran = zeros();
    const bySet = {}, byRan = {}, byRev = {};
    for (const id of BRAND_ORDER) { bySet[id] = zeros(); byRan[id] = zeros(); byRev[id] = zeros(); }
    for (const x of appts) {
      const b = apptBrand[String(x.cc_project_id)];
      for (let i = 0; i < RHY_N; i++) {
        if (inW(x.cc_created_at, i)) { set[i]++; if (bySet[b]) bySet[b][i]++; }
        if (inW(x.starts_at, i)) { ran[i]++; if (byRan[b]) byRan[b][i]++; }
      }
    }
    /* MONEY. The same union every board on this page uses — CC contract value
       for the other brands, Billdu invoices for the whole of Oasis, never
       both. BOOKED money only, and this is deliberate: an open 🔔 ring exists
       in M0 and can exist nowhere else (the 5-day clock either books it or
       pulls it), so folding the rung layer into a trend would tilt every
       comparison in M0's favour and manufacture a rise. The rung layer stays
       counted and labelled on the money cards, per the 10 Aug ruling, and
       stays OUT of the rhythm — said out loud in the card's own note. */
    const rev = zeros();
    for (const j of jobs) {
      if (!j.contract_signed_at || String(j.cc_company_id) === OASIS) continue;
      const b = rollup(j.cc_company_id), v = Number(j.fin_sold_amount || 0);
      for (let i = 0; i < RHY_N; i++) if (inW(j.contract_signed_at, i)) {
        rev[i] += v; if (byRev[b]) byRev[b][i] += v;
      }
    }
    for (let i = 0; i < RHY_N; i++) {
      const bd = billduAdd(RHY_WINS[i][0], RHY_WINS[i][1]);
      if (bd) { rev[i] += bd.value; if (byRev[OASIS]) byRev[OASIS][i] += bd.value; }
    }
    /* BUILDS. Production, dated by CC completed_at and valued at what the work
       was sold for — the same figure the month card calls built. QuickBooks
       invoicing rides alongside it when the login can read QB, because the two
       answer different questions: what got finished, and what got billed. */
    const built = zeros();
    for (const j of jobs) {
      const v = Number(j.fin_sold_amount || 0);
      for (let i = 0; i < RHY_N; i++) if (inW(j.completed_at, i)) built[i] += v;
    }
    let inv = null;
    if (qb && !qb.unavailable) {
      inv = zeros();
      for (const x of qbInv) {
        if (x.reporting_excluded) continue;
        for (let i = 0; i < RHY_N; i++)
          if (inRDate(x.txn_date, RHY_WINS[i][0], RHY_WINS[i][1])) inv[i] += Number(x.total_amt || 0);
      }
    }
    const company = {
      set: readRhythm(set, 10), ran: readRhythm(ran, 10),
      rev: readRhythm(rev, 20000), built: readRhythm(built, 20000),
      inv: inv ? readRhythm(inv, 20000) : null,
    };
    /* RECEIVABLES. QuickBooks carries a balance but no due date, so an ageing
       bucket is not available here and is not invented. What IS available is
       the pressure read Kevin asked for — "receivables if they are out of
       control": open A/R measured against the average month of invoicing
       standing behind it. Under a month of billing outstanding is normal for
       this trade; past two and a half is out of control. */
    let ar = null;
    if (qb && !qb.unavailable && inv) {
      const monthly = mean_(inv);
      const months = monthly > 0 ? qb.arTotal / monthly : null;
      ar = { total: qb.arTotal, monthly, months,
             open: qb.ar.reduce((n, a) => n + a.count, 0),
             verdict: months === null ? 'thin' : months >= 2.5 ? 'out-of-control'
                    : months >= 1.6 ? 'heavy' : months >= 1 ? 'watch' : 'clean' };
    }
    /* Per trade, the same three reads. A brand's floor is lower than the
       company's because a brand legitimately runs smaller — but it is a floor,
       so a trade with eight appointments a month never earns an ALARM. */
    const brands = BRAND_ORDER.map(id => {
      const b = { id, name: brandOf(id).n, s: brandOf(id).s, c: brandOf(id).c,
                  set: readRhythm(bySet[id], 8), ran: readRhythm(byRan[id], 8),
                  rev: readRhythm(byRev[id], 10000) };
      const f = [];
      /* Every finding carries BOTH a one-line teaser and the full sentence
         (Kevin, 11 Aug: "shorten nuggets… small teaser and expand"). The
         teaser must stand alone — it is what he reads at a glance — so it
         always holds the number and the direction, never just a label. */
      if (!b.set.thin && b.set.d4 !== null && b.set.d4 <= -25)
        f.push({ sev:'fire', short:`${b.s} bookings ▼${Math.abs(b.set.d4)}% vs rhythm`,
          txt:`Bookings are <b>${Math.abs(b.set.d4)}% under their own 4-month rhythm</b> — ${b.set.now} set in the last 30 days against ${Math.round(b.set.b4)} a month${b.set.d1 !== null ? `, ${b.set.d1 >= 0 ? 'up' : 'down'} ${Math.abs(b.set.d1)}% on last month alone` : ''}.` });
      else if (!b.set.thin && b.set.d4 !== null && b.set.d4 <= -12)
        f.push({ sev:'watch', short:`${b.s} bookings ▼${Math.abs(b.set.d4)}% vs rhythm`,
          txt:`Bookings are ${Math.abs(b.set.d4)}% under the 4-month rhythm (${b.set.now} vs ${Math.round(b.set.b4)} a month)${b.set.shape === 'sliding' ? ' — and have stepped down in every one of those months' : ''}.` });
      else if (!b.set.thin && b.set.d4 !== null && b.set.d4 >= 25)
        f.push({ sev:'good', short:`${b.s} bookings ▲${b.set.d4}% vs rhythm`,
          txt:`Bookings are <b>${b.set.d4}% above the 4-month rhythm</b> — ${b.set.now} set in the last 30 days against ${Math.round(b.set.b4)} a month.` });
      b.flags = f;
      b.sev = f.some(x => x.sev === 'fire') ? 'fire' : f.some(x => x.sev === 'watch') ? 'watch' : 'ok';
      return b;
    });
    /* THE PREDICTION. Bookings lead revenue, so where demand has already moved
       and the money has not, the money is the thing that moves next. The
       horizon is MEASURED, not a round number: closeLag holds each brand's own
       median days from appointment to signature, so this says "at this brand's
       own speed" and can be checked. */
    const lagAll = Object.values(closeLag.byBrand).map(x => x.median);
    const lagDays = lagAll.length ? Math.round(mean_(lagAll)) : null;
    const predict = [];
    for (const b of brands) {
      if (b.set.thin || b.set.d4 === null) continue;
      const lag = (closeLag.byBrand[b.id] || {}).median ?? lagDays;
      if (b.set.d4 <= -15 && (b.rev.d4 === null || b.rev.d4 > b.set.d4 + 10))
        predict.push({ sev:'watch', brand:b.s, short:`${b.s} booking ▼${Math.abs(b.set.d4)}% vs rhythm — the money follows`, txt:`<b>${esc(b.s)}</b> is booking ${Math.abs(b.set.d4)}% under its 4-month rhythm (${b.set.now} set in the last 30 vs ${Math.round(b.set.b4)} a month) while the signed money is ${b.rev.thin || b.rev.d4 === null ? 'not readable at this size' : b.rev.d4 >= 0 ? `still up ${b.rev.d4}%` : `only down ${Math.abs(b.rev.d4)}%`}. Bookings lead the money${lag ? ` by about ${lag} day${lag === 1 ? '' : 's'} in this trade` : ''} — that gap is next month's revenue, not this month's.` });
      else if (b.set.d4 >= 20)
        predict.push({ sev:'good', brand:b.s, short:`${b.s} booking ▲${b.set.d4}% vs rhythm — staff for it`, txt:`<b>${esc(b.s)}</b> is booking ${b.set.d4}% above its 4-month rhythm (${b.set.now} set in the last 30 vs ${Math.round(b.set.b4)} a month)${lag ? ` — at this trade's ${lag}-day close lag, that lands inside the next 30` : ''}. Crew and material are the constraint, not leads.` });
    }
    /* The control, rebased off the rhythm: is a slump one trade's problem or
       the market's? Stated only when it is unambiguous. */
    const live = brands.filter(b => !b.set.thin && b.set.d4 !== null);
    const down = live.filter(b => b.set.d4 <= -15), up = live.filter(b => b.set.d4 >= 15);
    let control = null, controlShort = null;
    if (down.length && up.length) {
      control = `${down.map(b => b.s).join(' and ')} booking under rhythm while ${up.map(b => `${b.s} runs ${b.set.d4}% above it`).join(' and ')} over the same four months — that reads <b>trade-specific, not a local-economy story</b>.`;
      controlShort = `Trade-specific · ${down.map(b => b.s).join(' + ')} under, ${up.length} above`;
    } else if (down.length >= 2 && !up.length) {
      control = `${down.map(b => b.s).join(' and ')} are both booking under their own 4-month rhythm — that reads <b>market-wide, not one trade's problem</b>.`;
      controlShort = `Market-wide · ${down.length} trades under their own rhythm`;
    } else if (up.length >= 2 && !down.length) {
      control = `${up.map(b => b.s).join(' and ')} are both booking above their own 4-month rhythm — the demand is broad, not one trade's spike.`;
      controlShort = `Demand is broad · ${up.length} trades above their own rhythm`;
    }
    return { days: RHY_DAYS, n: RHY_N, labels: RHY_LABELS, company, brands, ar,
             control, controlShort, predict, lagDays,
             wins: RHY_WINS.map(([a, b]) => ({ from: +a, to: +b })) };
  })();

  /* Kevin (11 Aug): "Gio is owner — don't include any intel on him." The intel
     board reads the SALES FLOOR, and the owner is not on it: no best-of, no
     worst-of, no momentum verdict, no discovery written about him. This does
     NOT take him off the money — his deals are the company's deals and the
     boards keep counting them exactly as before. Resolved from the roster's
     own role first, with the name as the second arm, the same way cardReps has
     always found him (a role column that drifts must not silently put the
     owner back on a coaching board). */
  const isOwnerRep = r => !!r && (String(r.role || '').toLowerCase() === 'owner'
                                  || /\bgio\b/i.test(r.name || ''));

  /* ── BEST OF BEST, WORST OF WORST. Kevin (11 Aug): "this intel board is best
     of best and worst of worst. These guys are trending crushing. These guys
     are struggling."

     Not a leaderboard — a shortlist, two names a side at most, and only where
     the sample is thick enough to carry a verdict. Ranked on momentum first
     (the fortnight against the rep's own 60-day baseline, which is the measure
     of TRENDING) with the absolute close rate as the tiebreak, and an
     absolute arm underneath it so a rep closing 60% flat still reads as best
     of best. Bottom copy stays inside the 7 Aug language law: COOLING, never
     failing — the read is "where the air cover goes", not a grade. */
  const bestWorst = (() => {
    const [a30, b30] = RHY_WINS[0];
    const money30 = {};
    for (const j of jobs) {
      if (!j.rep_id || String(j.cc_company_id) === OASIS) continue;
      if (inR(j.contract_signed_at, a30, b30))
        money30[j.rep_id] = (money30[j.rep_id] || 0) + Number(j.fin_sold_amount || 0);
    }
    const bd = billduAdd(a30, b30);
    if (bd) for (const [rid, v] of Object.entries(bd.byRep))
      if (rid !== OFFICE) money30[rid] = (money30[rid] || 0) + v.value;
    /* d60 >= 5 is closeTrend's own guard on the BASELINE. It says nothing
       about the fortnight on top, and a 46-point "cooled" verdict came off
       1/4 in two weeks on the live board — four appointments cannot move a
       rate, they can only look like they did. A trend verdict now needs six
       elapsed appointments in the fortnight as well; a rep below that can
       still make the board on their 30-day LEVEL, where the denominator is
       real. */
    const pool = closeTrend.rows
      .filter(r => r.sells && !isOwnerRep(repById[r.id]) && r.d30.appts >= 6)
      .map(r => ({ ...r, money: Math.round(money30[r.id] || 0),
                   trendOK: r.momentum !== null && r.w2.appts >= 6 }));
    const seen = new Set();
    const take = (list, n) => { const out = [];
      for (const r of list) { if (seen.has(r.id) || out.length >= n) continue; seen.add(r.id); out.push(r); }
      return out; };
    /* Trending first — that is the word he used — then the flat-out closers. */
    const hot = take(pool.filter(r => r.trendOK && r.momentum >= 10)
      .sort((a, b) => b.momentum - a.momentum || b.money - a.money), 2);
    const hotAbs = hot.length >= 2 ? [] : take(pool
      .filter(r => r.d30.close !== null && r.d30.close >= 45 && r.d30.appts >= 10)
      .sort((a, b) => b.d30.close - a.d30.close || b.money - a.money), 2 - hot.length);
    const cold = take(pool.filter(r => r.trendOK && r.momentum <= -10)
      .sort((a, b) => a.momentum - b.momentum || a.money - b.money), 2);
    const coldAbs = cold.length >= 2 ? [] : take(pool
      .filter(r => r.d30.close !== null && r.d30.close < 20 && r.d30.appts >= 10)
      .sort((a, b) => a.d30.close - b.d30.close || a.money - b.money), 2 - cold.length);
    const mark = (r, why) => ({ ...r, why });
    return { pool: pool.length,
             best: [...hot.map(r => mark(r, 'trend')), ...hotAbs.map(r => mark(r, 'level'))],
             worst: [...cold.map(r => mark(r, 'trend')), ...coldAbs.map(r => mark(r, 'level'))] };
  })();

  /* ── WHAT THE DATA REVEALS. Kevin (11 Aug): "and then anything cool the data
     will reveal. Ex Eric is closing 67% when he runs 25+ apts week based on
     that we can predict he should close this and same with struggling. Lots of
     insights in data."

     Three generators. Each either finds a real split or says nothing at all —
     none of them will promote a thin week to a pattern. Every one carries its
     own sample floor and every claim ships with the counts that produced it,
     so a finding can be argued with rather than believed. The owner is out of
     all three. */
  const discoveries = (() => {
    const out = [];
    const sellers = reps.filter(r => r.active && r.sells && !isOwnerRep(r));
    if (!sellers.length) return out;
    const byId = Object.fromEntries(sellers.map(r => [r.id, r]));
    const WEEKS = 12;

    /* ⚠️ THE COHORT RULE — read this before touching the weekly buckets.
       ────────────────────────────────────────────────────────────────────
       The first cut of this counted a week's APPOINTMENTS by when they ran
       and that week's SIGNINGS by when they were signed, then divided one by
       the other. That is not a close rate. It is a ratio of two different
       groups of deals, and because signing trails the appointment by days,
       it is MECHANICALLY anti-correlated with volume: a quiet week inherits
       the previous busy week's signatures and reads as a monster close rate
       off a tiny denominator.

       It shipped, and the result was unmistakable — all three findings on
       the live board said the same thing, that the rep "closes better on
       lighter weeks", one of them at 88% (15/17). That is not three
       discoveries, it is one artefact three times, and the advice it
       generated ("loading more appointments on is not the move") was the
       exact opposite of the truth.

       So a signing is now bucketed into the week ITS OWN APPOINTMENT ran,
       matched through the project the same way closeLag matches. Numerator
       and denominator describe the same cohort of deals, and the ratio is a
       close rate again. Do not go back to signing-date buckets. */
    const byProj = {};
    for (const x of appts) if (x.cc_project_id && x.starts_at)
      (byProj[String(x.cc_project_id)] ??= []).push(new Date(x.starts_at).getTime());

    /* And the cohort has to be RIPE. A week's appointments need time to turn
       into signatures, so the most recent weeks are structurally short of
       numerator and would read as a slump every time. The wait is measured,
       not guessed: closeLag holds each brand's own median days to signature,
       and the window ends one and a half of the slowest of those behind
       today (floor a week, ceiling three). */
    const lagMax = Math.max(0, ...Object.values(closeLag.byBrand).map(x => x.median));
    const MATURE = Math.min(21, Math.max(7, Math.ceil(lagMax * 1.5)));
    const w0 = sow(addD(sod(NOW), -MATURE));
    const weeks = Array.from({ length: WEEKS }, (_, i) => [addD(w0, -7 * (i + 1)), addD(w0, -7 * i)]);
    const wkIdxT = t => {
      for (let i = 0; i < WEEKS; i++)
        if (t >= weeks[i][0].getTime() && t < weeks[i][1].getTime()) return i;
      return -1;
    };
    const wkIdx = iso => iso ? wkIdxT(new Date(iso).getTime()) : -1;
    const per = {};
    for (const r of sellers) per[r.id] = weeks.map(() => ({ appts: 0, signed: 0 }));
    for (const x of appts) { const i = wkIdx(x.starts_at); if (i >= 0 && per[x.rep_id]) per[x.rep_id][i].appts++; }
    /* Signings, attributed to their originating appointment's week. A day of
       slack on the match because signing timestamps and appointment times
       straddle midnight in different zones — the same slack closeLag uses. */
    const claimed = {}, total = {};
    for (const j of jobs) {
      if (!j.rep_id || !per[j.rep_id] || !j.contract_signed_at) continue;
      total[j.rep_id] = (total[j.rep_id] || 0) + 1;
      const t = new Date(j.contract_signed_at).getTime();
      const list = j.cc_project_id ? byProj[String(j.cc_project_id)] : null;
      if (!list) continue;
      let bestT = null;
      for (const at of list) if (at <= t + 86400000 && (bestT === null || at > bestT)) bestT = at;
      if (bestT === null) continue;
      const i = wkIdxT(bestT);
      if (i >= 0) { per[j.rep_id][i].signed++; claimed[j.rep_id] = (claimed[j.rep_id] || 0) + 1; }
    }
    /* Billdu acceptances carry no CC appointment, so they cannot be placed in
       an appointment's week at all. Rather than drop them silently and make
       an Oasis-heavy rep look cold, they are COUNTED as unmatchable: a rep
       whose signings this generator cannot see most of is skipped entirely
       below. Honest silence beats a confident wrong number. */
    if (billdu && billdu.feed) for (const r of billdu.feed) {
      const rid = bRepOf[String(r.billdu_id)];
      if (!rid || rid === OFFICE || !per[rid]) continue;
      if (r.job_id && ccSignedMap && ccSignedMap[r.job_id] === true) continue;
      if (wkIdx(r.accepted_at) >= 0) total[rid] = (total[rid] || 0) + 1;
    }

    /* (1) THE VOLUME THRESHOLD — the Eric read, generalised. For each rep,
       search their own weekly history for the appointment count where their
       close rate steps, and state BOTH sides of it with the counts. A
       threshold only survives if each side holds 3+ weeks and 12+ appointments
       and the step is 12 points or more; anything looser is a coincidence
       wearing a number. The step can run either way and both are said
       honestly — some reps close better light, and that is a routing fact,
       not a compliment or a complaint. */
    const sum2 = arr => arr.reduce((a, x) => ({ appts: a.appts + x.appts, signed: a.signed + x.signed }), { appts: 0, signed: 0 });
    for (const r of sellers) {
      const w = per[r.id]; if (!w) continue;
      const tot = w.reduce((n, x) => n + x.appts, 0); if (tot < 40) continue;
      /* If most of this rep's signings cannot be traced back to a CC
         appointment — an Oasis seller closing in Billdu, or a book of work
         that never got an appointment row — then this generator is not
         looking at their business and must not narrate it. Two thirds
         matched is the bar; below it the rep is skipped, silently. */
      const cov = total[r.id] ? (claimed[r.id] || 0) / total[r.id] : 0;
      if (cov < 0.66) continue;
      let best = null;
      for (let th = 6; th <= 45; th++) {
        const hi = w.filter(x => x.appts >= th), lo = w.filter(x => x.appts < th);
        if (hi.length < 3 || lo.length < 3) continue;
        const H = sum2(hi), L = sum2(lo);
        if (H.appts < 12 || L.appts < 12) continue;
        const hc = Math.round(H.signed / H.appts * 100), lc = Math.round(L.signed / L.appts * 100);
        const gap = hc - lc;
        if (best === null || Math.abs(gap) > Math.abs(best.gap))
          best = { th, hc, lc, gap, H, L, hiN: hi.length, loN: lo.length };
      }
      if (!best || Math.abs(best.gap) < 12) continue;
      /* w[0] is the newest RIPE week, not literally last week — the window
         ends MATURE days back so the cohort has had time to convert. The
         copy says "their last full week" only when that is what it is. */
      const lastWk = w[0].appts;
      const wkAgo = Math.round((sod(NOW) - weeks[0][1]) / 86400000 / 7);
      const side = lastWk >= best.th;
      const expect = side ? best.hc : best.lc;
      const other = side ? best.lc : best.hc;
      out.push({ kind:'volume', rep:r.id, weight: Math.abs(best.gap) * (best.H.appts + best.L.appts),
        short: best.gap > 0 ? `${r.name} closes ${best.hc}% on ${best.th}+ appointment weeks`
                            : `${r.name} closes ${best.lc}% under ${best.th} appointments a week, ${best.hc}% over`,
        txt: `<b>${esc(r.name)}</b> closes <b>${best.hc}%</b> in weeks they run <b>${best.th}+ appointments</b> (${best.H.signed}/${best.H.appts} across ${best.hiN} weeks) and ${best.lc}% in weeks under that (${best.L.signed}/${best.L.appts} across ${best.loN}). Their most recent settled week${wkAgo > 1 ? ` — ${wkAgo} weeks back, the newest one whose deals have had time to close` : ''} they ran <b>${lastWk}</b>, which reads at about <b>${expect}%</b>, roughly ${Math.max(0, Math.round(lastWk * expect / 100))} signing${Math.round(lastWk * expect / 100) === 1 ? '' : 's'}. ${best.gap > 0 ? `Volume is the lever: getting them over ${best.th} is worth about ${Math.abs(best.gap)} points of close.` : `They close ${Math.abs(best.gap)} points better under ${best.th} — worth asking whether the heavy weeks are being filled with softer appointments, rather than assuming the volume itself is the problem.`}<br/><span style="opacity:.7">Each signing is counted in the week its own appointment ran, so both sides of the rate describe the same deals.</span>` });
    }

    /* (2) THE ONE-CALL CLOSE. Who signs it on the appointment itself and who
       needs the second trip — matched from the project's own appointment
       record, so it is the business's record and never a self-report. A rep
       needs 8 matched signings before this says anything about them. */
    const cut2 = addD(sod(NOW), -120).getTime();
    const oc = {};
    let ocTeam = { same: 0, n: 0 };
    for (const j of jobs) {
      if (!j.rep_id || !byId[j.rep_id] || !j.contract_signed_at || !j.cc_project_id) continue;
      const t = new Date(j.contract_signed_at).getTime();
      if (t < cut2 || t > NOW.getTime()) continue;
      const list = byProj[String(j.cc_project_id)]; if (!list) continue;
      let bestT = null;
      for (const at of list) if (at <= t + 86400000 && (bestT === null || at > bestT)) bestT = at;
      if (bestT === null) continue;
      const days = Math.max(0, Math.round((t - bestT) / 86400000));
      const s = (oc[j.rep_id] ??= { same: 0, n: 0 });
      s.n++; ocTeam.n++;
      if (days <= 1) { s.same++; ocTeam.same++; }
    }
    const teamOC = ocTeam.n >= 20 ? Math.round(ocTeam.same / ocTeam.n * 100) : null;
    if (teamOC !== null) for (const [rid, s] of Object.entries(oc)) {
      if (s.n < 8) continue;
      const p = Math.round(s.same / s.n * 100), gap = p - teamOC;
      if (Math.abs(gap) < 18) continue;
      out.push({ kind:'onecall', rep:rid, weight: Math.abs(gap) * s.n,
        short: `${byId[rid].name} closes ${p}% at the table — team runs ${teamOC}%`,
        txt: gap > 0
          ? `<b>${esc(byId[rid].name)}</b> closes <b>${p}%</b> of their deals on the appointment itself (${s.same}/${s.n} in 120 days) against a team ${teamOC}%. Whatever they are doing at the table is the thing worth copying onto everyone else.`
          : `<b>${esc(byId[rid].name)}</b> closes ${p}% at the table (${s.same}/${s.n} in 120 days) where the team runs ${teamOC}% — ${Math.abs(gap)} points more of their business needs a second trip. Their follow-up discipline, not their pitch, is where the money is.` });
    }

    /* (3) TRADE AFFINITY. A rep who closes one trade far better than another
       is a ROUTING instruction — where the next appointment should go — and
       never a verdict on the rep. 10 appointments a side, 15 points of gap. */
    const bb = {};
    const [a90, b90] = [addD(rhyEnd, -90), rhyEnd];
    for (const x of appts) {
      if (!x.rep_id || !byId[x.rep_id] || !inR(x.starts_at, a90, b90)) continue;
      const b = apptBrand[String(x.cc_project_id)]; if (!b || !BRANDS[b]) continue;
      ((bb[x.rep_id] ??= {})[b] ??= { appts: 0, signed: 0 }).appts++;
    }
    for (const j of jobs) {
      if (!j.rep_id || !byId[j.rep_id] || !inR(j.contract_signed_at, a90, b90)) continue;
      const b = rollup(j.cc_company_id); if (!BRANDS[b]) continue;
      ((bb[j.rep_id] ??= {})[b] ??= { appts: 0, signed: 0 }).signed++;
    }
    for (const [rid, m] of Object.entries(bb)) {
      const rows = Object.entries(m).filter(([, v]) => v.appts >= 10)
        .map(([b, v]) => ({ b, ...v, close: Math.round(v.signed / v.appts * 100) }))
        .sort((x, y) => y.close - x.close);
      if (rows.length < 2) continue;
      const hi = rows[0], lo = rows[rows.length - 1];
      if (hi.close - lo.close < 15) continue;
      out.push({ kind:'trade', rep:rid, weight: (hi.close - lo.close) * (hi.appts + lo.appts),
        short: `${byId[rid].name}: ${hi.close}% on ${brandOf(hi.b).s} vs ${lo.close}% on ${brandOf(lo.b).s}`,
        txt: `<b>${esc(byId[rid].name)}</b> closes <b>${hi.close}%</b> of ${esc(brandOf(hi.b).s)} appointments (${hi.signed}/${hi.appts}, 90 days) and ${lo.close}% of ${esc(brandOf(lo.b).s)} (${lo.signed}/${lo.appts}). Same rep, ${hi.close - lo.close} points apart — that is a routing decision sitting on the table.` });
    }

    /* One finding per rep at most, strongest first: five variations on the
       same person is a wall, not intelligence. */
    const used = new Set();
    return out.sort((a, b) => b.weight - a.weight).filter(x => {
      if (used.has(x.rep)) return false; used.add(x.rep); return true;
    });
  })();

  /* Week-to-date appointment pulse, like-for-like: this week through now vs
     last week through the same point. Set = cc_created_at (what the setters
     produced); ran = starts_at (what the calendar carried). */
  const apptWtd = (() => {
    const a = sow(NOW), b = addD(sod(NOW), 1);
    const pa = addD(a, -7), pb = addD(b, -7);
    const cnt = (field, x, y) => appts.filter(r => inR(r[field], x, y)).length;
    const setNow = cnt('cc_created_at', a, b), setPrev = cnt('cc_created_at', pa, pb);
    const ranNow = cnt('starts_at', a, b), ranPrev = cnt('starts_at', pa, pb);
    const d = (c, p) => p ? Math.round((c - p) / p * 100) : null;
    // month to date, vs the same days of last month — like-for-like, never a
    // finished month against a partial one
    const ma = som(NOW), mpa = addM(ma, -1), mpb = addM(b, -1);
    const setM = cnt('cc_created_at', ma, b), setMP = cnt('cc_created_at', mpa, mpb);
    const ranM = cnt('starts_at', ma, b), ranMP = cnt('starts_at', mpa, mpb);
    return { setNow, setPrev, setD: d(setNow, setPrev), ranNow, ranPrev, ranD: d(ranNow, ranPrev),
             setMtd: setM, setMtdPrev: setMP, setMtdD: d(setM, setMP),
             ranMtd: ranM, ranMtdPrev: ranMP, ranMtdD: d(ranM, ranMP) };
  })();

  /* ── PIPELINE, stage 1. Kevin (28 Jul): "we will at some point have closed
     pipeline — that also needs to be in there." What the data can carry today:
     work already booked but not yet won — upcoming CC appointments (next 14
     days) and open Billdu estimates (sent, not accepted, ≤60 days old), per
     rep. The CC quote stage isn't synced yet; when it lands this grows. */
  const pipeline = (() => {
    const a = new Date(), b = addD(sod(NOW), 15);
    const by = {};
    const seller = Object.fromEntries(reps.filter(r => r.active).map(r => [r.id, r]));
    for (const x of appts) {
      if (!x.rep_id || !seller[x.rep_id]) continue;
      const t = new Date(x.starts_at);
      if (t >= a && t < b) (by[x.rep_id] ??= { appts:0, estN:0, estVal:0 }).appts++;
    }
    const cut = addD(sod(NOW), -60);
    for (const d2 of (billdu && billdu.docs) || []) {
      if (!d2.rep_id || !seller[d2.rep_id] || d2.is_accepted) continue;
      if (!/estimate/i.test(d2.doc_type || '')) continue;
      if (d2.issue_date && new Date(d2.issue_date) < cut) continue;
      const r = (by[d2.rep_id] ??= { appts:0, estN:0, estVal:0 });
      r.estN++; r.estVal += Number(d2.total_price || 0);
    }
    const rows = Object.entries(by).map(([id, v]) => ({ id, name: seller[id].name, ...v }))
      .sort((x,y) => (y.estVal + y.appts*1) - (x.estVal + x.appts*1));
    return { rows,
      appts: rows.reduce((n,r)=>n+r.appts,0),
      estN: rows.reduce((n,r)=>n+r.estN,0),
      estVal: rows.reduce((n,r)=>n+r.estVal,0),
      billduUp: !!(billdu && billdu.docs) };
  })();

  return {
    generatedAt: new Date().toISOString(),
    oasisLag, exclusions, sampleReps, signals, closeTrend, close8w, rhythm, bestWorst, discoveries, apptWtd, pipeline, closeLag,
    /* THE PULSE reads the whole history in `jobs` and `qb_invoices`, so it is
       deliberately NOT scoped to the month window — a normal built from the
       month the owner happens to be looking at is not a normal. It is the one
       band on this page the month time machine leaves alone. */
    pulse: buildPulse(jobs, qbInv),
    /* THE LOGIN HERO reads the same two feeds on the same rule — whole history,
       never the browsed month. Its thresholds live in VIT at the top of the
       file; the colours are decided at render time because MARKETING's spend
       half arrives after first paint. */
    // The SLS trace reads the same union as every money tile (one-signed-rule).
    vitals: buildVitals(jobs, qbInv, (a, b) => signedUnion(a, b).rev),
    // the filtered roster by id, for the rep one-pager — name, role and the
    // sells flag travel together so the pager never re-derives who someone is
    roster: Object.fromEntries(reps.map(r =>
      [r.id, { name:r.name, initials:r.initials, role:r.role, sells:!!r.sells, active:!!r.active }])),
    /* Per-rep money position for the bank line, straight off my_commission_summary
       (086/088). Absent rows stay absent — a rep with no imported ledger gets no
       line, never a $0 that reads as "no money owed". */
    bank: Object.fromEntries((bank || []).map(b => {
      const mine = (claims || []).filter(c => c.rep_id === b.rep_id
        && c.status === 'pending'
        && !c.cc_already_counted && c.cc_state !== 'job_linked');
      return [String(b.rep_id), {
        banked: Number(b.banked || 0), bankedDeals: Number(b.banked_deals || 0),
        coming: Number(b.earned_awaiting_collection || 0),
        jobsNotBuilt: Number(b.jobs_not_built_value || 0),
        paidYtd: Number(b.paid_ytd || 0),
        rungOpen: mine.length,
        rungValue: mine.reduce((n, c) => n + Number(c.claimed_amount || 0), 0) }]; })),
    coverage: { jobs: jobs.length, appts: appts.length,
      apptsWithRep: appts.filter(a=>a.rep_id).length, touches: touches.length,
      // Coverage of the field every dollar on this page is actually built from.
      jobsWithSold: jobs.filter(j=>Number(j.fin_sold_amount)>0).length },
    /* ── FEEDS FOR THE MARKETING DRAWER ──────────────────────────────────────
       Slim projections, not the raw rows. The drawer needs a project→source
       join and a project→rep join that nothing else on the page computes, and
       holding the full 11.5k job objects alive after buildData returns to get
       four fields off each one is weight a phone carries for the whole session.
       Each row here is exactly what the two boards read and nothing else.

       reporting_excluded is held out at the source, matching what
       rpt_report_marketing_roi's `led` CTE does — the 012 batch-entry anomalies
       are 12 jobs, all Google, and leaving them in would make board 1's own
       leads column disagree with the RPC feeding the row beside it. */
    /* `b` — the rolled-up brand, added for the ROI board's Source × Company
       matrix. It is the same rollup() every other band on this page uses, so
       Pro-Tec's 1537 folds into 1563 here exactly as it does in the money row;
       a brand split that disagreed with the one above it would be worse than
       no brand split at all. Revenue only: there is no brand dimension on
       marketing_spend (166 is keyed source_name + month), so the board can
       show what each brand EARNED per source and must refuse what each brand
